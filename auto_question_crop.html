<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks — Auto Question Cropper</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script><style>body{margin:0;background:#070b12;color:#f8fafc;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:16px}.box{background:#0d1422;border:1px solid #263449;border-radius:12px;padding:14px;margin-bottom:14px}button,label{background:#172235;color:#fff;border:1px solid #3a4b63;border-radius:7px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{background:#0284c7;border-color:#38bdf8}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;color:#111;border-radius:10px;padding:10px}.card img{width:100%;display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}@media(max-width:750px){.grid{grid-template-columns:1fr}}input[type=file]{display:none}</style></head><body><div class="wrap"><div class="box"><h2 style="margin-top:0">✂️ Auto Question Cropper</h2><div class="muted">PDF डालो — यह question numbers को अपने-आप पहचानकर हर question का अलग crop बनाएगा. Gemini की जरूरत नहीं.</div><p><label class="primary">📂 Choose PDF<input id="file" type="file" accept="application/pdf"></label> <button id="stop" disabled>⛔ Stop</button></p><div id="status" class="muted"></div></div><div id="list"></div></div><script>const $=id=>document.getElementById(id);let stopped=false,pages=[];function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}async function pageImage(p){const v=p.getViewport({scale:1.55}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c.toDataURL('image/jpeg',.72)}function detect(text){const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);let hits=[];for(let i=0;i<lines.length;i++){const m=lines[i].match(/^(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.)\-:]/i);if(m)hits.push({n:+m[1],i})}return hits.filter((x,i,a)=>i===0||x.n!==a[i-1].n)}function crop(src,y1,y2){return new Promise(res=>{const im=new Image();im.onload=()=>{const a=Math.max(0,Math.floor(y1*im.height)),b=Math.min(im.height,Math.ceil(y2*im.height)),h=Math.max(20,b-a),c=document.createElement('canvas');c.width=im.width;c.height=h;c.getContext('2d').drawImage(im,0,a,im.width,h,0,0,im.width,h);res(c.toDataURL('image/jpeg',.78))};im.src=src})}async function process(f){stopped=false;$('stop').disabled=false;$('list').innerHTML='';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out=[];for(let n=1;n<=pdf.numPages;n++){if(stopped)break;$('status').textContent=`Reading page ${n}/${pdf.numPages}…`;const p=await pdf.getPage(n),tc=await p.getTextContent(),items=tc.items||[],src=await pageImage(p);pages.push({p,src,items});const hits=[];items.forEach((it,i)=>{const t=(it.str||'').trim(),m=t.match(/^(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.)\-:]/i);if(m)hits.push({n:+m[1],i,y:it.transform?it.transform[5]:0})});for(let j=0;j<hits.length;j++){const h=hits[j],next=hits[j+1];const pageH=p.getViewport({scale:1.55}).height;let top=pageH-(h.y+Math.abs(items[h.i].transform?.[3]||12))*1.55-18;let bottom=next?pageH-(next.y)*1.55-8:pageH-10;top=Math.max(0,top);bottom=Math.max(top+60,Math.min(pageH,bottom));const img=await crop(src,top/pageH,bottom/pageH);out.push({n:h.n,page:n,img})}}render(out);$('status').textContent=`✔ ${out.length} questions detected`;$('stop').disabled=true}function render(a){$('list').innerHTML=a.map((x,i)=>`<div class="box"><div class="grid"><div><b>Question ${esc(x.n)}</b><div class="muted">PDF page ${x.page}</div><div class="actions"><button class="primary" onclick="this.closest('.box').querySelector('.verify').style.display='block'">👁 View & Verify</button><button onclick="downloadCrop(${i})">⬇️ Save Image</button></div></div><div class="card"><img src="${x.img}"></div></div><div class="verify" style="display:none;margin-top:10px"><div class="card"><img src="${x.img}"></div><div class="actions"><button class="primary" onclick="alert('YES — crop accepted')">✅ YES — Correct</button><button onclick="alert('NO — use next detection pass')">❌ NO — Wrong</button></div></div></div>`).join('')}function downloadCrop(i){const a=document.createElement('a');a.href=window._crops[i].img;a.download=`question-${window._crops[i].n}.jpg`;a.click()}window._crops=[];$('file').onchange=e=>{window._crops=[];process(e.target.files[0]).then(()=>window._crops=[...document.querySelectorAll('#list .card img')].map((im,i)=>({n:i+1,img:im.src}))).catch(err=>{$('status').textContent='❌ '+err.message})};$('stop').onclick=()=>stopped=true;</script></body></html>
