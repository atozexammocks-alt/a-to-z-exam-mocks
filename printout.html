<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A to Z Exam Mocks — Printout</title>
<script>
window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["[","]"],["$$","$$"]]},svg:{fontCache:"global"}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{
  --paper-width: 210mm;
  --paper-height: 297mm;
  --paper-padding: 10mm; /* Default Narrow Margin */
  --print-page-size: A4;
  --wm-opacity: 0.16;
}
*{box-sizing:border-box}
html,body{margin:0;background:#cbd5e1;color:#111;font-family:Arial,sans-serif}
body{min-height:100vh;padding-bottom:30px}

/* Toolbar Styling */
.toolbar{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:8px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px #0004}
.toolbar label{font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.toolbar input,.toolbar select{padding:5px;border:1px solid #64748b;border-radius:5px;background:#fff;color:#111}
.toolbar input[type=number]{width:55px}
.toolbar input[type=range]{width:95px}
.toolbar button{padding:6px 9px;border:1px solid #64748b;border-radius:5px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
.toolbar button.gray{background:#374151}
.toolbar button.green{background:#059669}
.toolbar .spacer{flex:1}
.hint{font-size:10px;color:#cbd5e1}

/* Screen Paper Preview with Visual Page-Break Lines */
.paper{
  position:relative;
  width:var(--paper-width,210mm);
  min-height:var(--paper-height,297mm);
  margin:20px auto;
  padding:var(--paper-padding,10mm);
  background-color:#fff;
  /* Visual dashed line on screen at every page height so it doesn't look like an endless strip */
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(var(--paper-height, 297mm) - 2px),
    #94a3b8 calc(var(--paper-height, 297mm) - 2px),
    #94a3b8 var(--paper-height, 297mm)
  );
  box-shadow:0 6px 24px rgba(0,0,0,0.18);
  overflow:hidden;
}

/* Header & Meta */
.header{position:relative;z-index:2;text-align:center;border-bottom:2px solid #111;padding:4px 6px 8px;margin-bottom:12px;min-height:76px}
.logo{position:absolute;left:0;top:2px;width:58px;height:58px;object-fit:contain}
.header-main{padding:0 5px 0 66px}
.school{font-size:18px;font-weight:800;letter-spacing:0.3px}
.title{font-size:16px;font-weight:800;margin-top:2px;min-height:1.2em}
.editable,.editableText{user-select:text;-webkit-user-select:text;cursor:text;outline:none}
.editable:focus,.editableText:focus{outline:1px dashed #2563eb;outline-offset:2px}
.school,.title,.meta,.meta b{user-select:text;-webkit-user-select:text;cursor:text}
.meta{font-size:12px;margin-top:5px;display:flex;justify-content:space-between;text-align:left}
.meta .right{text-align:right}

/* Questions & Two-Column Layout */
.content{position:relative;z-index:2}
.content.two-col{column-count:2;column-gap:10mm;column-rule:1px solid #999;column-fill:balance}
.content.two-col .section{column-span:all}
.question{
  break-inside:avoid;
  page-break-inside:avoid;
  margin:0 0 9px;
  padding:3px 0;
  line-height:1.45;
}
.question.flow-column{break-before:column;column-break-before:always}
.question.flow-page{break-before:page;page-break-before:always}
.question.flow-none{break-before:auto;page-break-before:auto}
.question.selected{outline:2px solid #2563eb;outline-offset:2px}
.qbox{border:1px solid #888;padding:6px;border-radius:4px}
.qbottom{border-bottom:1px solid #888;padding-bottom:5px}
.qleft{border-left:3px solid #888;padding-left:7px}
.qline{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px;align-items:start}
.qmarks{font-size:.82em;font-weight:700;white-space:nowrap;text-align:right;padding-left:6px}
.qnum{font-weight:700}
.qtext{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.options{margin:4px 0 0 28px;display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
.options.row-wise{grid-template-columns:1fr}
.option{display:grid;grid-template-columns:22px minmax(0,1fr);gap:3px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.qimage{margin:6px auto;text-align:center}
.qimage img{max-width:96%;max-height:175px;object-fit:contain}

/* Section & Footer */
.section{position:relative;z-index:2;text-align:center;font-weight:800;font-size:14px;margin:12px 0 8px;padding:5px 8px;border-bottom:1.5px solid #333;break-inside:avoid;page-break-inside:avoid;break-after:avoid;page-break-after:avoid}
.section.box{border:1.5px solid #333}
.section.none{border:0}
.section.selected{outline:2px solid #2563eb;outline-offset:2px}
.footer{position:relative;z-index:2;text-align:center;border-top:1px solid #777;margin-top:16px;padding-top:5px;font-size:10px;break-inside:avoid;page-break-inside:avoid}

/* Full-Page Diagonal Watermark */
.watermark-layer{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.watermark{
  position:absolute;
  left:50%;
  width:150%;
  text-align:center;
  color:#1e293b;
  font-size:clamp(46px, 6.2vw, 86px);
  font-weight:900;
  letter-spacing:6px;
  text-transform:uppercase;
  opacity:var(--wm-opacity,.16);
  transform:translate(-50%, -50%) rotate(-38deg);
  white-space:nowrap;
  user-select:none;
}
/* Evenly spaced vertical positions depending on count */
.w-single{top:50%}
.w0{top:18%}
.w1{top:50%}
.w2{top:82%}
.w3{top:34%}
.w4{top:66%}
.w5{top:92%}

.empty{padding:80px 20px;text-align:center;color:#64748b;font-size:16px}

@media(max-width:900px){
  .paper{width:100%;margin:8px auto;padding:8mm}
  .meta{font-size:10px}
}

/* PROFESSIONAL PRINT LAYOUT — Fixed Narrow Margin on EVERY Page */
@media print{
  @page{
    size: var(--print-page-size, A4);
    /* THIS guarantees top, bottom, left, and right margin on Page 1, Page 2, Page 3... */
    margin: var(--paper-padding, 10mm);
  }
  html,body{
    background:#fff !important;
    margin:0 !important;
    padding:0 !important;
  }
  .toolbar{display:none !important}
  .paper{
    width:100% !important;
    min-height:0 !important;
    margin:0 !important;
    /* Set padding to 0 in print because @page margin handles all 4 sides on every single page */
    padding:0 !important;
    box-shadow:none !important;
    background-image:none !important;
    overflow:visible !important;
  }
  /* Fixed watermark layer repeats on every printed sheet edge-to-edge */
  .paper .watermark-layer{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
  }
  .paper .watermark{
    left:50%;
    width:150vw;
    font-size:68pt;
    letter-spacing:6px;
    transform:translate(-50%, -50%) rotate(-38deg);
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
  .paper .header,.paper .content,.paper .footer{
    position:relative;
    z-index:2;
  }
  .question.selected,.section.selected{outline:none !important}
  .content.two-col{column-fill:auto;height:auto;min-height:0}
  .question{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="toolbar" onmousedown="saveCurrentSelection(event)">
  <label>Watermark <input id="watermarkOpacity" type="range" min="0" max="100" value="16" oninput="setWatermarkOpacity(this.value)" style="width:95px"> <span id="watermarkOpacityValue">16%</span></label>
  <label>WM Count <input id="watermarkCount" type="number" min="1" max="6" value="1" style="width:46px" onchange="setWatermarkCount(this.value)"></label>
  <b>🖨 Print Preview</b>
  <label>Size <input id="fontSize" type="number" min="8" max="72" value="13" oninput="liveFontSize(this.value)" onmousedown="saveCurrentSelection(event)"></label>
  <button type="button" onmousedown="saveCurrentSelection(event)" onclick="changeSelectedFontSize(-1)">A−</button>
  <button type="button" onmousedown="saveCurrentSelection(event)" onclick="changeSelectedFontSize(1)">A+</button>
  <button type="button" onmousedown="saveCurrentSelection(event)" onclick="fmt('bold')"><b>B</b></button>
  <button type="button" onmousedown="saveCurrentSelection(event)" onclick="fmt('italic')"><i>I</i></button>
  <button type="button" onmousedown="saveCurrentSelection(event)" onclick="fmt('underline')"><u>U</u></button>
  <label>Columns <select id="colLayout" onchange="setColLayout(this.value)"><option value="one">1 Column</option><option value="two">2 Columns</option></select></label>
  <label>Q Border <select id="qBorder" onchange="build()"><option value="none">None</option><option value="box">Box</option><option value="bottom">Bottom</option><option value="left">Left</option></select></label>
  <label>Section <select id="sectionBorder" onchange="build()"><option value="bottom">Bottom</option><option value="box">Box</option><option value="none">None</option></select></label>
  <button class="gray" onclick="selectAllQuestions()">Select All Qs</button>
  <button class="gray" onclick="moveSelected(-1)">↑ Up</button>
  <button class="gray" onclick="moveSelected(1)">↓ Down</button>
  <button class="gray" onclick="mode('questions')">Select Qs</button>
  <button class="gray" onclick="mode('sections')">Select Sec</button>
  <button class="gray" onclick="clearSel()">Clear</button>
  <button class="green" onclick="apply()">Apply</button>
  <button onclick="window.print()">Print</button>
  <button class="gray" onclick="window.close()">Close</button>
  <label>Paper <select id="paperSize" onchange="setPaperSize(this.value)"><option value="A4">A4</option><option value="Letter">Letter</option><option value="Legal">Legal</option><option value="A3">A3</option><option value="A5">A5</option></select></label>
  <label>Margins <select id="paperMargin" onchange="setPaperMargin(this.value)"><option value="narrow" selected>Narrow (10mm)</option><option value="compact">Compact (7mm)</option><option value="normal">Normal (14mm)</option><option value="wide">Wide (18mm)</option></select></label>
  <button class="gray" onclick="startNewColumn()">↪ New Col</button>
  <button class="gray" onclick="startNewPage()">↳ New Page</button>
  <button class="gray" onclick="clearQuestionBreak()">Clear Break</button>
  <span class="spacer"></span>
  <span class="hint">Fixed margins apply to all printed pages automatically.</span>
</div>

<div id="paper" class="paper"><div class="empty">Loading paper…</div></div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function questionText(q){
  const candidates=[q.text,q.qText,q.questionText,q.question_text,q.content];
  for(const v of candidates){
    if(typeof v==='string' && v.trim()) return v.trim();
  }
  const fallback=q.question;
  if(typeof fallback==='string' && fallback.trim() && !/^(data:image\/|https?:\/\/|blob:)/i.test(fallback.trim())) return fallback.trim();
  return '';
}
const escapeHtml=esc;
function cleanQ(v){return String(v??'').trim();}
function cleanOpt(v){
  let x=String(v??'').trim();
  for(let i=0;i<3;i++){
    const before=x;
    x=x.replace(/^\s*(?:\(?[A-Ea-e]\)?[.)]|[[A-Ea-e]]|[A-Ea-e]\s*[-:])\s*/,'');
    if(x===before)break;
  }
  return x.trim();
}
function imageOf(q){
  const isImg=v=>typeof v==="string"&&/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim());
  const seen=new Set();
  function walk(v,depth=0){
    if(v==null||depth>5)return "";
    if(typeof v==="string"){
      const x=v.trim();
      if(isImg(x))return x;
      const m=x.match(/<img[^>]+src=["']([^"']+)["']/i);
      if(m&&isImg(m[1]))return m[1].trim();
      return "";
    }
    if(typeof v!=="object"||seen.has(v))return "";
    seen.add(v);
    const keys=["dataUrl","dataURL","downloadURL","downloadUrl","url","src","image","data","base64",
      "croppedImage","croppedImageData","questionImage","questionImageData","imageData","imageUrl","imageURL",
      "figure","figureImage","figureData","crop","cropData","cropped","content","html"];
    for(const k of keys){
      if(Object.prototype.hasOwnProperty.call(v,k)){
        const found=walk(v[k],depth+1);
        if(found)return found;
      }
    }
    for(const k of Object.keys(v)){
      const found=walk(v[k],depth+1);
      if(found)return found;
    }
    return "";
  }
  return walk(q);
}
function libraryMathMarkup(v){
  var x=String(v||"");
  if(!x)return "";
  if(/\\\(|\\\[/.test(x)) return x; if(/\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\b/.test(x) || /(?:[A-Za-z0-9\}])\^\{[^}]+\}|(?:[A-Za-z0-9\}])_\{[^}]+\}/.test(x)){ return "\\("+x+"\\)"; } return x; } function renderLibraryText(v){ var x=libraryMathMarkup(v); return escapeHtml(x).replace(/&lt;/g,"<").replace(/&gt;/g,">"); } function questionOptions(q){ let opts=q.options||q.choices||q.answerOptions; if(!opts && typeof q.optText==='string' && q.optText.trim()) opts=q.optText.split(/\s*\|\s*/).map(cleanOpt).filter(Boolean); if(typeof opts==='string'){ try{ opts=JSON.parse(opts); }catch(e){ opts=null; } } if(Array.isArray(opts)) return opts.map(x=>cleanOpt(typeof x==='object' ? (x.text||x.value||x.label||'') : String(x))).filter(Boolean); const out=[]; ['A','B','C','D','E'].forEach(k=>{ const v=q['option'+k]??q['option_'+k]??q['choice'+k]; if(v!==undefined && String(v).trim()) out.push(cleanOpt(String(v))); }); return out; }  let data={questions:[],sections:[],branding:{},title:'Question Paper',school:'',logo:'',layout:'one',watermarkCount:1}; let qSel=new Set(),sSel=new Set(),modeName='questions',qStyle={},sStyle={},qFlow={}; const PAPER_SIZES={ A4:{w:"210mm",h:"297mm",css:"A4"}, Letter:{w:"215.9mm",h:"279.4mm",css:"Letter"}, Legal:{w:"215.9mm",h:"355.6mm",css:"Legal"}, A3:{w:"297mm",h:"420mm",css:"A3"}, A5:{w:"148mm",h:"210mm",css:"A5"} }; const PAPER_MARGINS={compact:"7mm",narrow:"10mm",normal:"14mm",wide:"18mm"}; let savedRange=null,savedFormatTarget=null;  document.addEventListener('selectionchange',()=>{ const sel=window.getSelection(); if(!sel||!sel.rangeCount||sel.isCollapsed)return; const a=sel.anchorNode?.parentElement?.closest?.('.paper'); if(a){ savedRange=sel.getRangeAt(0).cloneRange(); savedFormatTarget=sel.anchorNode.parentElement.closest('.title,.school,.meta')||null; } });  function saveCurrentSelection(){ const sel=window.getSelection(); if(sel&&sel.rangeCount&&!sel.isCollapsed){ const range=sel.getRangeAt(0); const root=range.commonAncestorContainer?.parentElement?.closest?.('.paper'); if(root){ savedRange=range.cloneRange(); const target=range.commonAncestorContainer?.nodeType===3?range.commonAncestorContainer.parentElement:range.commonAncestorContainer; savedFormatTarget=target?.closest?.('.editableText,.editable,.sectionName,.qtext,.option,.title,.school,.meta')||null; } } }  document.addEventListener('pointerdown',e=>{ if(e.target.closest?.('.toolbar')) saveCurrentSelection(e); },true);  document.addEventListener('input',e=>{ const el=e.target.closest?.('[data-field]'); if(!el)return; data.branding=data.branding||{}; data.branding[el.dataset.field]=el.innerText.replace(/\n/g,' ').trim(); if(el.dataset.field==='paperTitle')data.title=data.branding[el.dataset.field]; if(el.dataset.field==='schoolName')data.school=data.branding[el.dataset.field]; try{localStorage.setItem('AZ_PAPER_BRANDING',JSON.stringify(data.branding))}catch(_){} });  function restoreSavedRange(){ if(!savedRange)return false; const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(savedRange.cloneRange()); return true; }  function wrapSelectionStyle(styles){ if(!restoreSavedRange())return false; const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed)return false; const range=sel.getRangeAt(0); const span=document.createElement('span'); Object.assign(span.style,styles); span.appendChild(range.extractContents()); range.insertNode(span); sel.removeAllRanges(); const nr=document.createRange(); nr.selectNodeContents(span); sel.addRange(nr); savedRange=nr.cloneRange(); return true; }  function liveFontSize(value){ if(!savedRange)return false; const size=Math.max(8,Math.min(72,Number(value)||13)); return wrapSelectionStyle({fontSize:size+'px'}); }  function changeSelectedFontSize(delta){ const current=Number(document.getElementById('fontSize').value)||13; const next=Math.max(8,Math.min(72,current+Number(delta||0))); document.getElementById('fontSize').value=next; return liveFontSize(next); }  function receive(p){ if(!p||!Array.isArray(p.questions))return; data=Object.assign(data,p); data.questions=p.questions||[]; data.sections=Array.isArray(p.sections)?p.sections:[]; data.branding=p.branding||{}; data.title=data.branding.paperTitle||p.title||'Question Paper'; data.school=data.branding.schoolName||p.school||''; data.logo=data.branding.logoUrl||p.logo||''; const colSel=document.getElementById('colLayout'); if(colSel && (data.branding.layout || data.layout)){ colSel.value = (data.branding.layout || data.layout) === 'two' ? 'two' : 'one'; } build(); }  function markLabel(m){ const x=Number(m); if(!isFinite(x)||x<=0)return ''; return x+' Mark'+(x===1?'':'s'); } function sectionMarkLabel(s){ const x=Number(s?.marks); if(!isFinite(x)||x<=0)return ''; return x===1?'1 Mark Each':x+' Marks Each'; } function setWatermarkOpacity(v){ const n=Math.max(0,Math.min(100,Number(v)||0)); document.documentElement.style.setProperty('--wm-opacity',String(n/100)); const out=document.getElementById('watermarkOpacityValue'); if(out)out.textContent=n+'\%'; } function setWatermarkCount(v){ const n=Math.max(1,Math.min(6,Number(v)||1)); data.watermarkCount=n; build(); } function setColLayout(v){ data.layout = v === 'two' ? 'two' : 'one'; if(data.branding) data.branding.layout = data.layout; build(); }  function questionHTML(q,n){ const id=String(q.id||n); const e=data.textEdits?.[id]||{}; const text=cleanQ(e.text!==undefined?e.text:questionText(q)); const opts=(Array.isArray(e.options)?e.options:questionOptions(q)).map(cleanOpt).filter(Boolean); const img=imageOf(q); const st=qStyle[id]||{}; const font=st.font||e.fontFamily||data.branding?.fontFamily||'Times New Roman'; const size=st.size||e.fontSize||13; const weight=st.weight||e.weight||400; const italic=st.italic?'italic':'normal'; const under=st.underline?'underline':'none'; const border=document.getElementById('qBorder').value; const sectionForQ=data.sections.find(s=>Array.isArray(s.questionIds)&&s.questionIds.map(String).includes(id)); const qMark=sectionForQ?.marks??q.marks??q.mark??q.marksPerQuestion; const flow=qFlow[id]||"none"; const cls='question '+(qSel.has(id)?'selected ':'')+(flow==="column"?"flow-column ":flow==="page"?"flow-page ":"flow-none ")+(border==='box'?'qbox':border==='bottom'?'qbottom':border==='left'?'qleft':''); const style='font-family:'+esc(font)+';font-size:'+Number(size)+'px;font-weight:'+Number(weight)+';font-style:'+italic+';text-decoration:'+under+';';    function imgTag(src){return '<div class="qimage"><img src="'+esc(src)+'"></div>';} function visualSrc(v){ if(!v)return ''; if(typeof v==='string')return /^(https?:\/\/|data:image\/|blob:)/i.test(v.trim())?v.trim():''; return imageOf(v); } function renderTextWithVisual(){ const blocks=Array.isArray(q.content_blocks)?q.content_blocks:[]; if(blocks.length){ let remaining=text, html=''; for(const b of blocks){ const anchor=String(b?.anchor||b?.figure_reference||'').trim(); const src=visualSrc(b?.image||b?.src||b?.url||b?.data||b?.cropImage||b?.figureImage||b?.visual||b?.crop||''); if(!anchor||!src)continue; const idx=remaining.toLowerCase().indexOf(anchor.toLowerCase()); if(idx>=0){ const end=idx+anchor.length; html+=renderLibraryText(remaining.slice(0,end))+imgTag(src); remaining=remaining.slice(end); } } if(html)return html+renderLibraryText(remaining); } const anchor=String(q.figure_reference||q.figureReference||'').trim(); if(img&&anchor){ const idx=text.toLowerCase().indexOf(anchor.toLowerCase()); if(idx>=0){ const end=idx+anchor.length; return renderLibraryText(text.slice(0,end))+imgTag(img)+renderLibraryText(text.slice(end)); } } if(img){ const re=/(\[\s*(?:figure|image|diagram)[^\]]*\]|<img[^>]*>|\{\{\s*(?:figure|image|diagram)[^}]*\}\})/i;
      if(re.test(text)){
        return renderLibraryText(text).replace(re, imgTag(img));
      }
      return renderLibraryText(text) + imgTag(img);
    }
    return renderLibraryText(text);
  }

  const bodyHTML = renderTextWithVisual();
  const optColsClass = (data.branding?.optionLayout === 'row' || opts.some(o => o.length > 42)) ? 'options row-wise' : 'options';
  const optsHTML = opts.length
    ? `<div class="${optColsClass} library-q-options">` +
      opts.map((o, i) => `<div class="option"><b>(${String.fromCharCode(97 + i)})</b><div class="editableText" contenteditable="true" data-qid="${esc(id)}" data-opt="${i}">${renderLibraryText(o)}</div></div>`).join('') +
      `</div>`
    : '';

  const mLabel = markLabel(qMark);
  return `<div class="${cls}" data-qid="${esc(id)}" style="${style}" onclick="toggleQuestionSelect(event,'${esc(id)}')">
    <div class="qline">
      <div class="qnum">Q${n}.</div>
      <div class="qtext library-q-text editableText" contenteditable="true" data-qid="${esc(id)}">${bodyHTML}</div>
      ${mLabel ? `<div class="qmarks">[${esc(mLabel)}]</div>` : `<div></div>`}
    </div>
    ${optsHTML}
  </div>`;
}

function sectionHTML(s, idx){
  const sid = String(s.id ?? idx);
  const st = sStyle[sid] || {};
  const border = st.border || document.getElementById('sectionBorder')?.value || 'bottom';
  const cls = `section ${border === 'box' ? 'box' : border === 'none' ? 'none' : ''} ${sSel.has(sid) ? 'selected' : ''}`;
  const font = st.font || data.branding?.fontFamily || 'Arial';
  const size = st.size || 14;
  const weight = st.weight || 800;
  const italic = st.italic ? 'italic' : 'normal';
  const under = st.underline ? 'underline' : 'none';
  const style = `font-family:${esc(font)};font-size:${Number(size)}px;font-weight:${Number(weight)};font-style:${italic};text-decoration:${under};`;
  const mLabel = sectionMarkLabel(s);
  const title = s.title || s.name || `Section ${idx + 1}`;
  return `<div class="${cls}" data-sid="${esc(sid)}" style="${style}" onclick="toggleSectionSelect(event,'${esc(sid)}')">
    <span class="sectionName editableText" contenteditable="true">${esc(title)}</span>
    ${mLabel ? ` <span style="font-weight:600;font-size:0.88em">(${esc(mLabel)})</span>` : ''}
  </div>`;
}

function build(){
  const paper = document.getElementById('paper');
  if(!paper) return;
  if(!Array.isArray(data.questions) || !data.questions.length){
    paper.innerHTML = `<div class="empty">No questions found to display.</div>`;
    return;
  }

  const b = data.branding || {};
  const school = b.schoolName || data.school || 'A TO Z EXAM MOCKS';
  const title = b.paperTitle || data.title || 'Question Paper';
  const subject = b.subject || '';
  const timeAllowed = b.timeAllowed || b.duration || '3 Hours';
  const maxMarks = b.maxMarks || b.totalMarks || '';
  const wmText = b.watermarkText || b.watermark || b.schoolName || data.school || '';
  const wmCount = Math.max(1, Math.min(6, Number(data.watermarkCount) || 1));

  let wmHTML = '';
  if(wmText){
    if(wmCount === 1){
      wmHTML = `<div class="watermark-layer"><div class="watermark w-single">${esc(wmText)}</div></div>`;
    } else {
      wmHTML = `<div class="watermark-layer">` +
        Array.from({length: wmCount}, (_, i) => `<div class="watermark w${i}">${esc(wmText)}</div>`).join('') +
        `</div>`;
    }
  }

  const qMap = new Map(data.questions.map((q, idx) => [String(q.id || idx), q]));
  const usedIds = new Set();
  let bodyParts = [];
  let qCounter = 1;

  if(Array.isArray(data.sections) && data.sections.length){
    data.sections.forEach((s, idx) => {
      bodyParts.push(sectionHTML(s, idx));
      const ids = Array.isArray(s.questionIds) ? s.questionIds.map(String) : [];
      ids.forEach(id => {
        const q = qMap.get(id);
        if(q && !usedIds.has(id)){
          usedIds.add(id);
          bodyParts.push(questionHTML(q, qCounter++));
        }
      });
    });
  }

  data.questions.forEach((q, idx) => {
    const id = String(q.id || idx);
    if(!q.id) q.id = id;
    if(!usedIds.has(id)){
      usedIds.add(id);
      bodyParts.push(questionHTML(q, qCounter++));
    }
  });

  const twoCol = (b.layout || data.layout) === 'two' ? 'two-col' : '';
  paper.innerHTML = `
    ${wmHTML}
    <div class="header">
      ${data.logo ? `<img class="logo" src="${esc(data.logo)}" alt="Logo">` : ''}
      <div class="header-main">
        <div class="school editable" contenteditable="true" data-field="schoolName">${esc(school)}</div>
        <div class="title editable" contenteditable="true" data-field="paperTitle">${esc(title)}</div>
        <div class="meta">
          <div>
            ${subject ? `<div><b>Subject:</b> <span class="editable" contenteditable="true" data-field="subject">${esc(subject)}</span></div>` : ''}
            <div><b>Time:</b> <span class="editable" contenteditable="true" data-field="timeAllowed">${esc(timeAllowed)}</span></div>
          </div>
          <div class="right">
            ${maxMarks ? `<div><b>Max. Marks:</b> <span class="editable" contenteditable="true" data-field="maxMarks">${esc(maxMarks)}</span></div>` : ''}
            <div><b>Date:</b> <span class="editable" contenteditable="true" data-field="examDate">${esc(b.examDate || new Date().toLocaleDateString())}</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="content ${twoCol}">${bodyParts.join('')}</div>
    <div class="footer editable" contenteditable="true" data-field="footerText">${esc(b.footerText || '— End of Question Paper —')}</div>
  `;

  if(window.MathJax && typeof MathJax.typesetPromise === 'function'){
    MathJax.typesetPromise([paper]).catch(()=>{});
  }
}

function mode(m){ modeName = m; }

function toggleQuestionSelect(ev, id){
  if(ev.target.isContentEditable && document.activeElement === ev.target) return;
  if(modeName !== 'questions') return;
  if(qSel.has(id)) qSel.delete(id); else qSel.add(id);
  document.querySelectorAll(`.question[data-qid="${CSS.escape(id)}"]`).forEach(el => el.classList.toggle('selected', qSel.has(id)));
}

function toggleSectionSelect(ev, sid){
  if(ev.target.isContentEditable && document.activeElement === ev.target) return;
  if(modeName !== 'sections') return;
  if(sSel.has(sid)) sSel.delete(sid); else sSel.add(sid);
  document.querySelectorAll(`.section[data-sid="${CSS.escape(sid)}"]`).forEach(el => el.classList.toggle('selected', sSel.has(sid)));
}

function selectAllQuestions(){
  modeName = 'questions';
  data.questions.forEach((q, i) => qSel.add(String(q.id || i)));
  build();
}

function clearSel(){
  qSel.clear();
  sSel.clear();
  build();
}

function moveSelected(dir){
  if(!qSel.size) return;
  const arr = data.questions;
  if(dir < 0){
    for(let i = 1; i < arr.length; i++){
      const id = String(arr[i].id), prevId = String(arr[i - 1].id);
      if(qSel.has(id) && !qSel.has(prevId)){
        [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
      }
    }
  } else {
    for(let i = arr.length - 2; i >= 0; i--){
      const id = String(arr[i].id), nextId = String(arr[i + 1].id);
      if(qSel.has(id) && !qSel.has(nextId)){
        [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
      }
    }
  }
  build();
}

function fmt(cmd){
  if(restoreSavedRange()){
    document.execCommand(cmd, false, null);
    return;
  }
  const targetSet = modeName === 'sections' ? sSel : qSel;
  const styleMap = modeName === 'sections' ? sStyle : qStyle;
  targetSet.forEach(id => {
    styleMap[id] = styleMap[id] || {};
    if(cmd === 'bold') styleMap[id].weight = (styleMap[id].weight === 700) ? 400 : 700;
    if(cmd === 'italic') styleMap[id].italic = !styleMap[id].italic;
    if(cmd === 'underline') styleMap[id].underline = !styleMap[id].underline;
  });
  build();
}

function apply(){
  const size = Number(document.getElementById('fontSize').value) || 13;
  const sBorder = document.getElementById('sectionBorder').value;
  if(modeName === 'sections' && sSel.size){
    sSel.forEach(sid => {
      sStyle[sid] = Object.assign(sStyle[sid] || {}, { size, border: sBorder });
    });
  } else if(qSel.size){
    qSel.forEach(qid => {
      qStyle[qid] = Object.assign(qStyle[qid] || {}, { size });
    });
  }
  build();
}

function setPaperSize(val){
  const cfg = PAPER_SIZES[val] || PAPER_SIZES.A4;
  document.documentElement.style.setProperty('--paper-width', cfg.w);
  document.documentElement.style.setProperty('--paper-height', cfg.h);
  document.documentElement.style.setProperty('--print-page-size', cfg.css);
}

function setPaperMargin(val){
  const pad = PAPER_MARGINS[val] || PAPER_MARGINS.narrow;
  document.documentElement.style.setProperty('--paper-padding', pad);
}

function startNewColumn(){
  qSel.forEach(id => { qFlow[id] = 'column'; });
  build();
}

function startNewPage(){
  qSel.forEach(id => { qFlow[id] = 'page'; });
  build();
}

function clearQuestionBreak(){
  qSel.forEach(id => { delete qFlow[id]; });
  build();
}

window.addEventListener('message', e => {
  if(e.data && (Array.isArray(e.data.questions) || e.data.type === 'PAPER_DATA' || e.data.type === 'AZ_PRINT_PAYLOAD')){
    receive(e.data.payload || e.data);
  }
});

function readAZPrintSession(sessionId){
  return new Promise((resolve, reject) => {
    if(!sessionId) return resolve(null);
    if(!window.indexedDB) return reject(new Error('IndexedDB is unavailable'));
    const req = indexedDB.open('AZExamPrintSessions', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', {keyPath:'id'});
    };
    req.onerror = () => reject(req.error || new Error('Could not open print-session storage'));
    req.onsuccess = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('sessions')){
        db.close();
        reject(new Error('Print-session storage is missing'));
        return;
      }
      try{
        const tx = db.transaction('sessions', 'readonly');
        const get = tx.objectStore('sessions').get(sessionId);
        get.onsuccess = () => { const value = get.result || null; db.close(); resolve(value); };
        get.onerror = () => { const err = get.error || new Error('Could not read print session'); db.close(); reject(err); };
      }catch(err){ db.close(); reject(err); }
    };
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  setPaperMargin('narrow');
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session');
  if(sessionId){
    try{
      const session = await readAZPrintSession(sessionId);
      if(session && Array.isArray(session.questions) && session.questions.length){
        receive(session);
        return;
      }
    }catch(err){ console.warn('Printout session load failed; trying local backup:', err); }
  }
  try {
    const keys = ['AZ_PRINT_PAYLOAD', 'PRINT_PAPER_DATA', 'AZ_PAPER_DATA'];
    for(const k of keys){
      const raw = localStorage.getItem(k);
      if(raw){
        const payload = JSON.parse(raw);
        if(payload && Array.isArray(payload.questions) && payload.questions.length){
          receive(payload);
          return;
        }
      }
    }
  } catch(err){ console.warn('Printout local backup load failed:', err); }
  const paper = document.getElementById('paper');
  if(paper) paper.innerHTML = '<div class="empty">No selected questions were received. Return to Paper Designer and choose “Printout / Export Paper” again.</div>';
});
</script>
