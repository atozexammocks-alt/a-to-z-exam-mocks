<style>
*{box-sizing:border-box}
html,body{margin:0;background:#dbe2ea;color:#111;font-family:Arial,sans-serif}
body{min-height:100vh}
.toolbar{position:sticky;top:0;z-index:50;background:#111827;color:#fff;padding:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px #0004}
.toolbar label{font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.toolbar input,.toolbar select{padding:5px;border:1px solid #64748b;border-radius:5px;background:#fff;color:#111}
.toolbar input[type=number]{width:55px}.toolbar input[type=range]{width:95px}
.toolbar button{padding:6px 9px;border:1px solid #64748b;border-radius:5px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
.toolbar button.gray{background:#374151}.toolbar button.green{background:#059669}
.toolbar .spacer{flex:1}.hint{font-size:10px;color:#cbd5e1}
.paper{position:relative;width:210mm;min-height:297mm;margin:18px auto;padding:15mm;background:#fff;box-shadow:0 3px 18px #0003;overflow:hidden}
.header{position:relative;z-index:2;text-align:center;border-bottom:2px solid #111;padding:8px 6px 10px;margin-bottom:14px;min-height:88px}
.logo{position:absolute;left:0;top:3px;width:62px;height:62px;object-fit:contain}
.header-main{padding:0 5px 0 72px}.school{font-size:18px;font-weight:800}.title{font-size:17px;font-weight:800;margin-top:2px;min-height:1.2em}.editable{user-select:text;-webkit-user-select:text;cursor:text;outline:none}.editable:focus{outline:1px dashed #2563eb;outline-offset:2px}.editableText{user-select:text;-webkit-user-select:text;cursor:text;outline:none}.editableText:focus{outline:1px dashed #2563eb;outline-offset:1px}.school,.title,.meta,.meta b{user-select:text;-webkit-user-select:text;cursor:text}
.meta{font-size:12px;margin-top:5px;display:flex;justify-content:space-between;text-align:left}.meta .right{text-align:right}
.content{position:relative;z-index:2}.content.two-col{column-count:2;column-gap:16mm;column-rule:1px solid #b8b8b8;column-rule-width:1px;column-rule-style:solid}.content.two-col .section{column-span:all}.content.two-col .question{break-inside:avoid;page-break-inside:avoid}.question{break-inside:avoid;page-break-inside:avoid;margin:0 0 10px;padding:2px 0;line-height:1.5}
.question.selected{outline:2px solid #2563eb;outline-offset:2px}.qbox{border:1px solid #888;padding:6px;border-radius:4px}.qbottom{border-bottom:1px solid #888}.qleft{border-left:3px solid #888;padding-left:7px}.qline{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:3px;align-items:start}.qmarks{font-size:.82em;font-weight:700;white-space:nowrap;text-align:right;padding-left:8px}
.qnum{font-weight:700}.qtext{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.options{margin:5px 0 0 31px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.options.row-wise{grid-template-columns:1fr}.option{display:grid;grid-template-columns:22px minmax(0,1fr);gap:3px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.qimage{margin:7px auto;text-align:center}.qimage img{max-width:96%;max-height:180px;object-fit:contain}
.section{position:relative;z-index:2;text-align:center;font-weight:800;font-size:15px;margin:14px 0 10px;padding:6px 8px;border-bottom:1px solid #555;break-inside:avoid}
.section.box{border:1px solid #555}.section.none{border:0}.section.selected{outline:2px solid #2563eb;outline-offset:2px}
.footer{position:relative;z-index:2;text-align:center;border-top:1px solid #777;margin-top:18px;padding-top:5px;font-size:10px}
.watermark-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.watermark{position:absolute;left:-20%;width:140%;text-align:center;color:#334155;font-size:64px;font-weight:900;opacity:var(--wm-opacity,.18);transform:rotate(-32deg);white-space:nowrap}
.w0{top:7%}.w1{top:27%}.w2{top:47%}.w3{top:67%}.w4{top:87%}.w5{top:107%}
.empty{padding:80px 20px;text-align:center;color:#64748b;font-size:16px}
@media(max-width:900px){.paper{width:100%;margin:8px auto;padding:10mm}.toolbar{position:sticky}.meta{font-size:10px}}
@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff}
 .toolbar{display:none!important}
 .paper{width:210mm;min-height:297mm;margin:0;padding:15mm;box-shadow:none;overflow:visible}
 .question.selected,.section.selected{outline:none}
 .watermark{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .content.two-col{column-fill:auto;height:calc(297mm - 30mm)}
 .content.two-col .question{break-inside:avoid;page-break-inside:avoid}
}

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function questionText(q){
      const candidates=[q.text,q.qText,q.questionText,q.question_text,q.content];
      for(const v of candidates){
        if(typeof v==='string' && v.trim()) return v.trim();
      }
      const fallback=q.question;
      if(typeof fallback==='string' && fallback.trim() && !/^(data:image\/|https?:\/\/|blob:)/i.test(fallback.trim())) return fallback.trim();
      return '';
    }
const escapeHtml=esc;
function cleanQ(v){return String(v??'').trim();}
function cleanOpt(v){return String(v??'').trim();}
function imageOf(q){
  for(const k of ["questionImage","image","img","imageData","croppedImage","croppedImageData","questionImageData","base64Image","imageUrl","imageURL","diagram","imageSrc","src","question"]){
    const v=q?.[k];
    if(typeof v==="string"&&/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim()))return v.trim();
    if(v&&typeof v==="object"){
      for(const kk of ["data","url","src","image","dataUrl","base64"]){
        const z=v[kk];
        if(typeof z==="string"&&/^(https?:\/\/|data:image\/|blob:)/i.test(z.trim()))return z.trim();
      }
    }
  }
  return "";
}
    function libraryMathMarkup(v){
      var x=String(v||"");
      if(!x)return "";
      if(/\\\\\(|\\\\\[/.test(x)) return x;
      if(/\\\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\\b/.test(x)
        || /(?:[A-Za-z0-9\\}])\\^\\{[^}]+\\}|(?:[A-Za-z0-9\\}])_\\{[^}]+\\}/.test(x)){
        return "\\("+x+"\\)";
      }
      return x;
    }
    function renderLibraryText(v){
      var x=libraryMathMarkup(v);
      return escapeHtml(x).replace(/&lt;/g,"<").replace(/&gt;/g,">");
    }
    function typesetLibraryMath(){
      if(!window.MathJax||typeof MathJax.typesetPromise!=="function")return;
      if(MathJax.startup&&MathJax.startup.promise){
        MathJax.startup.promise.then(function(){
          MathJax.typesetPromise(Array.from(document.querySelectorAll(".library-q-text,.library-q-options"))).catch(function(){});
        }).catch(function(){});
      }
    }

    function questionOptions(q){
      let opts=q.options||q.choices||q.answerOptions;
      if(!opts && typeof q.optText==='string' && q.optText.trim()) opts=q.optText.split(/\s*\|\s*/).map(x=>x.replace(/^\s*\([A-E]\)\s*/i,'').trim()).filter(Boolean);
      if(typeof opts==='string'){ try{ opts=JSON.parse(opts); }catch(e){ opts=null; } }
      if(Array.isArray(opts)) return opts.map((x,i)=> typeof x==='object' ? (x.text||x.value||x.label||'') : String(x)).filter(Boolean);
      const out=[];
      ['A','B','C','D','E'].forEach(k=>{
        const v=q['option'+k]??q['option_'+k]??q['choice'+k];
        if(v!==undefined && String(v).trim()) out.push(String(v));
      });
      return out;
    }
    function normalizeFolderPath(v){
      return String(v||'').trim().replace(/\\/g,'/').split('/').map(x=>x.trim()).filter(Boolean).join(' / ');
    }
    
let data={questions:[],sections:[],branding:{},title:'Question Paper',school:'',logo:'',layout:'one',watermarkCount:1};
let qSel=new Set(),sSel=new Set(),modeName='questions',qStyle={},sStyle={};
let savedRange=null,savedFormatTarget=null;
document.addEventListener('selectionchange',()=>{
 const sel=window.getSelection();
 if(!sel||!sel.rangeCount||sel.isCollapsed)return;
 const a=sel.anchorNode?.parentElement?.closest?.('.paper');
 if(a){savedRange=sel.getRangeAt(0).cloneRange();savedFormatTarget=sel.anchorNode.parentElement.closest('.title,.school,.meta')||null;}
});
function saveCurrentSelection(ev){
 const sel=window.getSelection();
 if(sel&&sel.rangeCount&&!sel.isCollapsed){
  const range=sel.getRangeAt(0);
  const root=range.commonAncestorContainer?.parentElement?.closest?.('.paper');
  if(root){
   savedRange=range.cloneRange();
   const target=range.commonAncestorContainer?.nodeType===3?range.commonAncestorContainer.parentElement:range.commonAncestorContainer;
   savedFormatTarget=target?.closest?.('.editableText,.editable,.sectionName,.qtext,.option,.title,.school,.meta')||null;
  }
 }
 // Never cancel toolbar pointer/mouse events: selects, inputs and buttons must stay fully interactive.
}
document.addEventListener('pointerdown',e=>{
 if(e.target.closest?.('.toolbar')) saveCurrentSelection(e);
},true);
document.addEventListener('input',e=>{
 const el=e.target.closest?.('[data-field]');
 if(!el)return;
 data.branding=data.branding||{};
 data.branding[el.dataset.field]=el.innerText.replace(/\n/g,' ').trim();
 if(el.dataset.field==='paperTitle')data.title=data.branding[el.dataset.field];
 if(el.dataset.field==='schoolName')data.school=data.branding[el.dataset.field];
 try{localStorage.setItem('AZ_PAPER_BRANDING',JSON.stringify(data.branding))}catch(_){}
});
function restoreSavedRange(){
 if(!savedRange)return false;
 const sel=window.getSelection();sel.removeAllRanges();sel.addRange(savedRange.cloneRange());return true;
}
function wrapSelectionStyle(styles){
 if(!restoreSavedRange())return false;
 const sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed)return false;
 const range=sel.getRangeAt(0);const span=document.createElement('span');
 Object.assign(span.style,styles);span.appendChild(range.extractContents());range.insertNode(span);
 sel.removeAllRanges();const nr=document.createRange();nr.selectNodeContents(span);sel.addRange(nr);savedRange=nr.cloneRange();return true;
}
function applyTextFormatting(){
 const size=Math.max(8,Math.min(72,Number(document.getElementById('fontSize').value)||14));
 return wrapSelectionStyle({fontFamily:family,fontSize:size+'px'});
}
function liveFontFamily(value){return false;}
function liveFontSize(value){
 if(!savedRange)return false;
 const size=Math.max(8,Math.min(72,Number(value)||14));
 return wrapSelectionStyle({fontSize:size+'px'});
}
function changeSelectedFontSize(delta){
 const current=Number(document.getElementById('fontSize').value)||14;
 const next=Math.max(8,Math.min(72,current+Number(delta||0)));
 document.getElementById('fontSize').value=next;
 return liveFontSize(next);
}

function receive(p){if(!p||!Array.isArray(p.questions))return;data=Object.assign(data,p);data.questions=p.questions||[];data.sections=Array.isArray(p.sections)?p.sections:[];data.branding=p.branding||{};data.title=data.branding.paperTitle||p.title||'Question Paper';data.school=data.branding.schoolName||p.school||'';data.logo=data.branding.logoUrl||p.logo||'';build()}
function markLabel(m){const x=Number(m);if(!isFinite(x)||x<=0)return '';return '1 × '+x+' = '+x+' Mark'+(x===1?'':'s')}
function sectionMarkLabel(s){const x=Number(s?.marks);if(!isFinite(x)||x<=0)return '';return x===1?'1 Mark Each':x+' Marks Each'}
function setWatermarkOpacity(v){const n=Math.max(0,Math.min(100,Number(v)||0));document.documentElement.style.setProperty('--watermark-opacity',String(n/100));document.documentElement.style.setProperty('--wm-opacity',String(n/100));const out=document.getElementById('watermarkOpacityValue');if(out)out.textContent=n+'%';}
function setWatermarkCount(v){const n=Math.max(1,Math.min(6,Number(v)||1));data.watermarkCount=n;build();}
function questionHTML(q,n){const id=String(q.id||'');const e=data.textEdits?.[id]||{};const text=cleanQ(e.text!==undefined?e.text:questionText(q));const opts=(Array.isArray(e.options)?e.options:questionOptions(q)).map(cleanOpt).filter(Boolean);const img=imageOf(q);const st=qStyle[id]||{};const font=st.font||e.fontFamily||data.branding.fontFamily||'Times New Roman';const size=st.size||e.fontSize||14;const weight=st.weight||e.weight||400;const italic=st.italic?'italic':'normal';const under=st.underline?'underline':'none';const border=document.getElementById('qBorder').value;const sectionForQ=data.sections.find(s=>Array.isArray(s.questionIds)&&s.questionIds.map(String).includes(id));const qMark=sectionForQ?.marks??q.marks??q.mark??q.marksPerQuestion;const cls='question '+(qSel.has(id)?'selected ':'')+(border==='box'?'qbox':border==='bottom'?'qbottom':border==='left'?'qleft':'');const style='font-family:'+esc(font)+';font-size:'+Number(size)+'px;font-weight:'+Number(weight)+';font-style:'+italic+';text-decoration:'+under+';';return '<div class="'+cls+'" data-q="'+esc(id)+'" onclick="selectQ(\''+esc(id)+'\')" style="'+style+'"><div class="qline"><span class="qnum">'+n+'.</span><span class="qtext library-q-text editableText" contenteditable="true" spellcheck="false" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">'+renderLibraryText(text)+'</span><span class="qmarks">'+markLabel(qMark)+'</span></div>'+(img?'<div class="qimage"><img src="'+esc(img)+'"></div>':'')+(opts.length&&!e.hideOptions?'<div class="options library-q-options '+((opts.length>=3&&(opts.some(o=>String(o).length>55)||opts.join(' ').length>150))?'row-wise':'')+'">'+opts.map((o,i)=>'<div class="option"><b>'+String.fromCharCode(65+i)+'.</b><span class="editableText" contenteditable="true" spellcheck="false" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">'+renderLibraryText(o)+'</span></div>').join('')+'</div>':'')+'</div>'}
function build(){const p=document.getElementById('paper');const b=data.branding||{};const logo=(b.showLogo&&b.logoUrl)||data.logo?'<img class="logo" src="'+esc((b.showLogo&&b.logoUrl)||data.logo)+'">':'';const wmText=b.watermarkText||'A to Z Exam Mocks';const wmCount=Math.max(1,Math.min(6,Number(data.watermarkCount||b.watermarkCount||1)));let h=(b.showWatermark?'<div class="watermark-layer">'+Array.from({length:wmCount},(_,i)=>'<div class="watermark w'+i+'" style="opacity:'+Math.max(.05,Math.min(.45,Number(b.watermarkOpacity??18)/100))+'">'+esc(wmText)+'</div>').join('')+'</div>':'')+'<header class="header">'+logo+'<div class="header-main" style="font-size:14px;font-weight:700;">'+(data.school?'<div class="school editable" contenteditable="true" spellcheck="false" data-field="schoolName">'+esc(data.school)+'</div>':'<div class="school editable" contenteditable="true" spellcheck="false" data-field="schoolName">School Name</div>')+'<div class="title editable" contenteditable="true" spellcheck="false" data-field="paperTitle" style="font-size:18px;font-weight:700;">'+esc(data.title)+'</div><div class="meta"><div><b>Class:</b> <span class="editable" contenteditable="true" spellcheck="false" data-field="className">'+esc(b.className||'—')+'</span><br><b>Subject:</b> <span class="editable" contenteditable="true" spellcheck="false" data-field="subjectName">'+esc(b.subjectName||'—')+'</span></div><div class="right"><b>Session:</b> <span class="editable" contenteditable="true" spellcheck="false" data-field="sessionName">'+esc(b.sessionName||'—')+'</span><br><b>Time:</b> <span class="editable" contenteditable="true" spellcheck="false" data-field="examTime">'+esc(b.examTime||'—')+'</span></div></div></div></header><main class="content">';let n=0;if(data.sections.length){const assigned=new Set();for(const s of data.sections){const ids=Array.isArray(s.questionIds)?s.questionIds.map(String):[];const qs=ids.map(id=>data.questions.find(q=>String(q.id)===id)).filter(Boolean);qs.forEach(q=>assigned.add(String(q.id)));if(!qs.length)continue;const sb=document.getElementById('sectionBorder').value;const ss=sStyle[String(s.id)]||{};const st='font-size:'+Number(ss.size||15)+'px;font-weight:'+Number(ss.weight||700)+';font-style:'+(ss.italic?'italic':'normal')+';text-decoration:'+(ss.underline?'underline':'none')+';';h+='<div class="section '+sb+' '+(sSel.has(String(s.id))?'selected':'')+'" data-s="'+esc(s.id)+'" onclick="selectS(\''+esc(s.id)+'\')" style="'+st+'">'+'<span class="editableText sectionName" contenteditable="true" spellcheck="false" onmousedown="event.stopPropagation()" onclick="event.stopPropagation()">'+esc(s.name||'Section')+'</span> <span style="font-size:11px;font-weight:400">('+qs.length+' Questions • '+sectionMarkLabel(s)+')</span></div>';qs.forEach(q=>{n++;h+=questionHTML(q,n)})}/* Only questions explicitly assigned to a section belong in the paper. Builder selection is the pool; section assignment is the print inclusion rule. */}else data.questions.forEach(q=>{n++;h+=questionHTML(q,n)});h+='</main>'+(b.showFooter!==false?'<div class="footer">'+(b.showAZBrand!==false?'A to Z Exam Mocks • ':'')+'Question Paper</div>':'');p.innerHTML=h.replace('<main class="content">','<main class="content '+(String(data.branding.layout||data.layout||'one')==='two'?'two-col':'one-col')+'">');typesetLibraryMath()}
function mode(m){modeName=m;qSel.clear();sSel.clear();build()}
function selectAllQuestions(){modeName='questions';qSel=new Set(data.questions.map(q=>String(q.id)));sSel.clear();build()}
function clearSel(){qSel.clear();sSel.clear();build()}
function selectQ(id){if(modeName!=='questions')return;id=String(id);qSel.has(id)?qSel.delete(id):qSel.add(id);sSel.clear();build()}
function moveSelected(dir){
 if(!qSel.size)return;
 const selected=new Set([...qSel].map(String));
 let moved=false;
 if(Array.isArray(data.sections)&&data.sections.length){
  for(const sec of data.sections){
   const ids=(sec.questionIds||[]).map(String);
   for(let i=0;i<ids.length;i++){
    if(!selected.has(ids[i]))continue;
    const j=i+dir;
    if(j>=0&&j<ids.length&&(!selected.has(ids[j]))){[ids[i],ids[j]]=[ids[j],ids[i]];moved=true;}
   }
   sec.questionIds=ids;
  }
  const assigned=new Set(data.sections.flatMap(sec=>(sec.questionIds||[]).map(String)));
  const un=data.questions.filter(q=>!assigned.has(String(q.id))).map(q=>String(q.id));
  for(let i=0;i<un.length;i++){
   if(!selected.has(un[i]))continue;
   const j=i+dir;
   if(j>=0&&j<un.length&&(!selected.has(un[j]))){[un[i],un[j]]=[un[j],un[i]];moved=true;}
  }
  if(moved){
   const byId=new Map(data.questions.map(q=>[String(q.id),q]));
   const ordered=[];
   for(const sec of data.sections) for(const id of sec.questionIds||[]) if(byId.has(String(id))) ordered.push(byId.get(String(id)));
   for(const id of un) if(byId.has(String(id))&&!ordered.some(q=>String(q.id)===id))ordered.push(byId.get(id));
   data.questions=ordered;
  }
 }else{
  const arr=data.questions;
  for(let i=0;i<arr.length;i++){
   if(!selected.has(String(arr[i].id)))continue;
   const j=i+dir;
   if(j>=0&&j<arr.length&&!selected.has(String(arr[j].id))){[arr[i],arr[j]]=[arr[j],arr[i]];moved=true;}
  }
 }
 if(moved){try{localStorage.setItem('AZ_PRINT_SELECTED_IDS',JSON.stringify(data.questions.map(q=>String(q.id))));}catch(e){}build();}
}
