<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A to Z Exam Mocks — Paper Print Preview</title>
<script>
window.MathJax={
  tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]'],['$$','$$']]},
  svg:{fontCache:'global'}
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#dbe2ea;color:#111;font-family:var(--paper-font,Arial,sans-serif)}
body{min-height:100vh}
.toolbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px #0004}
.toolbar b{font-size:13px;margin-right:5px}
.toolbar label{font-size:11px;font-weight:700;display:flex;gap:5px;align-items:center}
.toolbar input,.toolbar select{width:72px;padding:6px;border:1px solid #64748b;border-radius:5px;background:#fff;color:#111}
.toolbar button{padding:7px 11px;border-radius:6px;border:1px solid #64748b;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}
.toolbar button.gray{background:#374151}
.toolbar button.green{background:#059669}
.hint{font-size:10px;color:#cbd5e1;margin-left:auto}
.paper{width:210mm;min-height:297mm;margin:18px auto;padding:16mm;background:#fff;box-shadow:0 3px 18px #0003}
.header{text-align:center;border-bottom:var(--line,2px) solid #111;padding-bottom:10px;margin-bottom:14px;position:relative;padding-top:8px;min-height:92px}
.logo{position:absolute;left:0;top:6px;width:64px;height:64px;object-fit:contain;object-position:center;z-index:2}
.header-main{padding-left:78px;padding-right:6px;min-height:72px}
.watermark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden;color:#64748b;opacity:.10;font-size:72px;font-weight:900;transform:rotate(-32deg);white-space:nowrap}
.paper>.header,.paper>.content,.paper>.footer{position:relative;z-index:1}
.school{font-size:var(--school,18px);font-weight:800;line-height:1.25}
.title{font-size:var(--title,17px);font-weight:800;line-height:1.3}
.subtitle{font-size:var(--subtitle,13px);margin-top:3px}
.content{column-count:1;column-gap:24px;column-fill:balance}
.content.two{column-count:2}
.paper-q{display:block;break-inside:avoid;page-break-inside:avoid;width:100%;margin:0 0 var(--gap,10px);font-size:var(--q,14px);line-height:var(--qline,1.5);border:var(--qborder,0) solid #888;padding:var(--qpad,0);border-radius:4px}.paper-q.border-bottom{border-width:0 0 1px}.paper-q.border-left{border-width:0 0 0 3px;padding-left:7px}
.question-line{display:grid;grid-template-columns:25px minmax(0,1fr);column-gap:3px;align-items:start}
.qnum{font-weight:700}
.qtext{min-width:0;white-space:normal;overflow-wrap:anywhere}
.image-box{margin:6px auto;width:100%;height:var(--imgbox,170px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.image-box img{display:block;width:auto;max-width:96%;height:auto;max-height:var(--img,160px);object-fit:contain}
.options{margin:5px 0 0 25px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px;row-gap:5px;width:calc(100% - 25px);min-width:0}
.option-item{display:grid;grid-template-columns:22px minmax(0,1fr);column-gap:5px;align-items:start;min-width:0;width:100%;font-size:var(--opt,13px);line-height:1.4;white-space:normal;word-break:normal;overflow-wrap:break-word}
.option-item .option-text{min-width:0;width:100%;white-space:normal;word-break:normal;overflow-wrap:break-word}
.section-head{font-size:15px;font-weight:800;margin:14px 0 10px;padding:6px 8px;text-align:center;border-bottom:1px solid #555;break-inside:avoid}.section-head.box{border:1px solid #555}.section-head.box{border:1px solid #555}.section-head.none{border:0}.footer{text-align:center;border-top:1px solid #777;margin-top:18px;padding-top:5px;font-size:10px}
.empty{padding:60px;text-align:center;color:#64748b}
@media print{
 body{background:#fff}
 .toolbar{display:none!important}
 .paper{width:auto;min-height:auto;margin:0;box-shadow:none;padding:0}
 .content.two{column-count:2}
}
mjx-container{white-space:nowrap!important}.mjx-container[display="true"]{display:block!important}
</style>
</head>
<body>
<div class="toolbar">
<b>🖨 Paper Preview</b>
<label>Font <select id="fontFamily"><option>Times New Roman</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Cambria</option><option>Garamond</option><option>Verdana</option></select></label>
<label>Font Size <input id="qSize" type="number" min="8" max="30" value="14"></label>
<button type="button" onclick="toggleFormat('bold')"><b>B</b></button>
<button type="button" onclick="toggleFormat('italic')"><i>I</i></button>
<button type="button" onclick="toggleFormat('underline')"><u>U</u></button>
<label>Question Border <select id="qBorder"><option value="none">None</option><option value="box">Box</option><option value="bottom">Bottom Line</option><option value="left">Left Line</option></select></label>
<label>Section Border <select id="sectionBorder"><option value="bottom">Bottom</option><option value="box">Box</option><option value="none">None</option></select></label>
<label>Section Font <select id="sectionFont"><option>Times New Roman</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Cambria</option><option>Garamond</option><option>Verdana</option></select></label>
<label>Section Size <input id="sectionSize" type="number" min="8" max="30" value="15"></label>
<button type="button" onclick="sectionFormat('bold')"><b>Section B</b></button>
<button type="button" onclick="sectionFormat('italic')"><i>Section I</i></button>
<button type="button" onclick="sectionFormat('underline')"><u>Section U</u></button>
<button class="green" onclick="apply()">Apply</button>
<button onclick="window.print()">Print</button>
<button class="gray" onclick="window.close()">Close</button>
<span class="hint">Select a question/section in the paper, then change only its formatting.</span>
</div><div id="paper" class="paper"><div class="empty">Loading paper…</div></div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function textOf(q){
 const keys=['qText','text','questionText','question_text','content','questionTextHtml','prompt','question'];
 for(const k of keys){const v=q?.[k];if(typeof v==='string'&&v.trim()&&!/^(data:image\/|https?:\/\/|blob:)/i.test(v.trim()))return v.trim();}
 return '';
}
function imageOf(q){
 const keys=['questionImage','image','img','imageData','croppedImage','croppedImageData','questionImageData','base64Image','imageUrl','imageURL','diagram','imageSrc','src','question'];
 for(const k of keys){const v=q?.[k];if(typeof v==='string'&&/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim()))return v.trim();if(v&&typeof v==='object'){for(const kk of ['data','url','src','image','dataUrl','base64']){const z=v[kk];if(typeof z==='string'&&/^(https?:\/\/|data:image\/|blob:)/i.test(z.trim()))return z.trim();}}}
 return '';
}
function optionsOf(q){
 const v=q?.options??q?.choices??q?.answers;
 if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.text??x.value??x.label??''):x).filter(x=>String(x).trim());
 if(v&&typeof v==='object')return Object.values(v).map(x=>typeof x==='object'?(x.text??x.value??''):x).filter(x=>String(x).trim());
 return ['A','B','C','D'].map(k=>q?.['option'+k]??q?.['opt'+k]??q?.[k]).filter(x=>String(x??'').trim());
}
function cleanQ(v){
 let s=String(v??'').trim();
 s=s.replace(/^\s*(?:question|ques|q)\s*[-.:]?\s*\d+\s*[.)\-:]?\s*/i,'');
 s=s.replace(/^\s*\d+\s*[.)\-:]?\s*/,'');
 return s.trim();
}
function cleanOpt(v){return String(v??'').trim().replace(/^(?:\s*(?:\([A-Da-d]\)|[A-Da-d][.)])\s*)+/,'').trim();}
function libraryMathMarkup(v){
 var x=String(v||"");
 if(!x)return "";
 if(/\\\(|\\\[/.test(x)) return x;
 if(/\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\b/.test(x)
   || /(?:[A-Za-z0-9\}])\^\{[^}]+\}|(?:[A-Za-z0-9\}])_\{[^}]+\}/.test(x)){
   return "\\("+x+"\\)";
 }
 return x;
}
function renderMath(v){
 var x=String(v||"");
 if(!x)return "";
 if(/\\\\\(|\\\\\[/.test(x)) return x;
 if(/\\\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\\b/.test(x)
   || /(?:[A-Za-z0-9\\}])\\^\\{[^}]+\\}|(?:[A-Za-z0-9\\}])_\\{[^}]+\\}/.test(x)){
   return "\\\\("+x+"\\\\)";
 }
 return x;
}

let data={questions:[],sections:[],title:'Physics Question Paper',school:'',logo:'',textEdits:{},layout:'one',branding:{},fontFamily:'Times New Roman'};
let selectedSectionId=null;
let sectionStyles={};
function qHtml(q,n){

 const id=String(q.id||'');
 const edit=data.textEdits[id]||{};
 const txt=cleanQ(edit.text!==undefined?edit.text:textOf(q));
 const opts=(Array.isArray(edit.options)?edit.options:optionsOf(q)).map(cleanOpt).filter(Boolean);
 const img=imageOf(q);
 const hide=edit.hideOptions===true;
 const fs=Number(edit.fontSize||document.getElementById('qSize').value||14);
 const weight=Number(edit.weight||400);
 const line=Number(edit.lineHeight||1.5);
 const style='font-size:'+fs+'px;font-weight:'+weight+';line-height:'+line+';text-align:'+(edit.align||'left')+';';
 const border=document.getElementById('qBorder')?.value||'none';
 const cls='paper-q '+(border==='bottom'?'border-bottom':border==='left'?'border-left':'');
 return '<div class="'+cls+'" style="'+style+'"><div class="question-line"><span class="qnum">'+n+'.</span><span class="qtext" style="'+style+'">'+renderMath(txt)+'</span></div>'+
 (img?'<div class="image-box"><img src="'+esc(img)+'"></div>':'')+
 (opts.length&&!hide?'<div class="options">'+opts.map((o,i)=>'<div class="option-item"><b>'+String.fromCharCode(65+i)+'.</b><span class="option-text">'+renderMath(o)+'</span></div>').join('')+'</div>':'')+
 '</div>';
}
function build(){
 const paper=document.getElementById('paper');
 const b=data.branding||{};
 const showAZ=b.showAZBrand!==false;
 const showFooter=b.showFooter!==false;
 const showLogo=b.showLogo===true && !!b.logoUrl;
 const logoSrc=showLogo?b.logoUrl:'';
 document.documentElement.style.setProperty('--paper-font',b.fontFamily||data.fontFamily||'Times New Roman');
 const wm=b.showWatermark?'<div class="watermark">'+esc(b.watermarkText||'A to Z Exam Mocks')+'</div>':'';
 let html=wm+'<header class="header">'+(showLogo?'<img class="logo" src="'+esc(logoSrc)+'">':'')+'<div class="header-main">'+
 (data.school||b.schoolName?'<div class="school">'+esc(data.school||b.schoolName)+'</div>':'')+
 '<div class="title">'+esc(data.title||b.paperTitle||'Physics Question Paper')+'</div><div class="subtitle"><span style="float:left;text-align:left">Class: '+esc(b.className||'—')+'<br>Subject: '+esc(b.subjectName||'—')+'</span><span style="float:right;text-align:right">Session: '+esc(b.sessionName||'—')+'<br>Time: '+esc(b.examTime||'—')+'</span><span style="display:block;clear:both;text-align:center">'+(showAZ?'A to Z Exam Mocks':'')+'</span></div></div></header>';
 html+='<main id="content" class="content '+(data.layout==='two'?'two':'')+'">';
 if(Array.isArray(data.sections)&&data.sections.length){
 let number=0;
 data.sections.forEach(s=>{const ids=Array.isArray(s.questionIds)?s.questionIds.map(String):[];const qs=ids.map(id=>data.questions.find(q=>String(q.id)===id)).filter(Boolean);if(!qs.length)return;const sb=document.getElementById('sectionBorder')?.value||'bottom';const st=sectionStyles[String(s.id)]||{};const active=selectedSectionId===String(s.id);const sstyle='font-family:'+esc(st.font||document.getElementById('sectionFont')?.value||'Times New Roman')+';font-size:'+Number(st.size||document.getElementById('sectionSize')?.value||15)+'px;font-weight:'+Number(st.weight||700)+';font-style:'+(st.italic?'italic':'normal')+';text-decoration:'+(st.underline?'underline':'none')+';'+(active?'outline:2px solid #2563eb;outline-offset:2px;':'');html+='<div class="section-head '+sb+'" data-section-id="'+esc(s.id)+'" onclick="selectSection(''+esc(s.id)+'')" style="'+sstyle+'">'+esc(s.name||'Section')+' <span style="font-size:11px;font-weight:400">('+qs.length+' Questions • '+(Number(s.marks)||0)+' Marks/Q)</span></div>';qs.forEach(q=>{number++;html+=qHtml(q,number)})});
 const assigned=new Set(data.sections.flatMap(s=>Array.isArray(s.questionIds)?s.questionIds.map(String):[]));data.questions.filter(q=>!assigned.has(String(q.id))).forEach(q=>{number++;html+=qHtml(q,number)});
}else data.questions.forEach((q,i)=>html+=qHtml(q,i+1));
 html+='</main>'+(showFooter?'<div class="footer">'+(showAZ?'A to Z Exam Mocks • ':'')+'Question Paper</div>':'');
 paper.innerHTML=html;
 if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([paper]).catch(console.warn);
}
function selectSection(id){selectedSectionId=String(id);const st=sectionStyles[selectedSectionId]||{};const sf=document.getElementById('sectionFont');const ss=document.getElementById('sectionSize');if(sf)sf.value=st.font||'Times New Roman';if(ss)ss.value=st.size||15;build()}
function sectionFormat(kind){
 if(!selectedSectionId){alert('Click a section heading first.');return;}
 const st=sectionStyles[selectedSectionId]||{};
 if(kind==='bold')st.weight=st.weight===700?400:700;
 if(kind==='italic')st.italic=!st.italic;
 if(kind==='underline')st.underline=!st.underline;
 sectionStyles[selectedSectionId]=st;build();
}
function toggleFormat(kind){if(selectedSectionId){sectionFormat(kind);return;}const r=document.documentElement.style;if(kind==='bold')r.setProperty('--preview-weight','700');if(kind==='italic')r.setProperty('--preview-style','italic');if(kind==='underline')r.setProperty('--preview-decoration','underline');build()}
function apply(){
 const r=document.documentElement.style;
 const font=document.getElementById('fontFamily')?.value||'Times New Roman';
 const size=document.getElementById('qSize')?.value||14;
 r.setProperty('--paper-font',font);
 r.setProperty('--q',size+'px');
 r.setProperty('--opt',size+'px');
 r.setProperty('--title',size+'px');
 r.setProperty('--school',size+'px');
 r.setProperty('--subtitle',size+'px');
 r.setProperty('--line','2px');
 r.setProperty('--gap','10px');
 r.setProperty('--img','160px');
 r.setProperty('--imgbox','170px');
 data.layout='one';
 const qb=document.getElementById('qBorder')?.value||'none';
 r.setProperty('--qborder',qb==='none'?'0px':qb==='left'?'3px':'1px');
 r.setProperty('--qpad',qb==='box'?'6px':qb==='left'?'0 0 0 7px':'0');
 build();
 if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([document.getElementById('paper')]).catch(()=>{});
}
function receivePayload(payload){
 if(!payload||!Array.isArray(payload.questions))return;
 data=Object.assign(data,payload);data.branding=payload.branding||data.branding||{};data.sections=Array.isArray(payload.sections)?payload.sections:[];data.fontFamily=payload.fontFamily||data.branding.fontFamily||'Times New Roman';data.school=data.branding.schoolName||payload.school||data.school;data.title=data.branding.paperTitle||payload.title||data.title;data.logo=data.branding.logoUrl||payload.logo||data.logo;
 fontFamily.value=data.fontFamily||'Times New Roman';fontFamily.value=data.fontFamily||'Times New Roman';document.getElementById('fontFamily').value=data.fontFamily||'Times New Roman';document.getElementById('qSize').value=data.qSize||14;document.getElementById('oSize').value=data.oSize||13;document.getElementById('titleSize').value=data.titleSize||17;document.getElementById('schoolSize').value=data.schoolSize||18;document.getElementById('subSize').value=data.subSize||13;document.getElementById('lineW').value=data.lineW||2;document.getElementById('qGap').value=data.qGap||10;document.getElementById('cols').value=data.layout==='two'?'2':'1';document.getElementById('imgH').value=data.imgH||160;document.getElementById('sectionFont').value='Times New Roman';document.getElementById('sectionSize').value=15;
 build();
}
window.addEventListener('message',e=>{
 if(e.data?.type==='AZ_PRINT_PAYLOAD') receivePayload(e.data.payload);
});
qSize.value=data.qSize||14;oSize.value=data.oSize||13;titleSize.value=data.titleSize||17;schoolSize.value=data.schoolSize||18;subSize.value=data.subSize||13;lineW.value=data.lineW||2;qGap.value=data.qGap||10;cols.value=data.layout==='two'?'2':'1';imgH.value=data.imgH||160;
build();
</script>
</body>
</html>
