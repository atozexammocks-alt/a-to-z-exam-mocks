<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks - Published Tests & Management</title>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]]},svg:{fontCache:"global"}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#060911;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.top{height:58px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:10}.brand{font-weight:900;color:#38bdf8}.spacer{flex:1}.pill,.badge{font-size:11px;color:#cbd5e1;background:#0f172a;border:1px solid #334155;border-radius:999px;padding:6px 10px}.page{max-width:1250px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:200px;background:#060911;color:#fff;border:1px solid #334155;border-radius:7px;padding:9px;font-size:12px}.btn{border:1px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:7px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer}.btn.blue{background:#2563eb;border-color:#3b82f6;color:#fff}.btn.red{background:#7f1d1d;border-color:#991b1b;color:#fecaca}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.test-card{background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:13px;min-height:180px;display:flex;flex-direction:column;gap:9px}.test-card h3{margin:0;color:#38bdf8;font-size:16px}.meta{font-size:12px;color:#94a3b8;line-height:1.6}.actions{display:flex;flex-direction:column;gap:6px;margin-top:auto;border-top:1px solid #1e293b;padding-top:10px}.empty{text-align:center;padding:40px;color:#64748b;border:1px dashed #334155;border-radius:10px}.error{color:#fecaca;background:#450a0a;border:1px solid #7f1d1d;padding:12px;border-radius:8px;font-size:12px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:12px;z-index:100}.modal{width:min(1000px,96vw);max-height:94vh;background:#0b1120;border:1px solid #334155;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #1e293b}.modal-head h2{margin:0;color:#38bdf8;font-size:15px;flex:1}.modal-body{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}.preview-q{background:#060911;border:1px solid #1e293b;border-radius:9px;padding:12px}.qhead{font-size:11px;color:#38bdf8;font-weight:900;margin-bottom:8px}.library-q-text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:#f8fafc;font-weight:400;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.library-q-image{background:#fff;border:1px solid #e2e8f0;border-radius:7px;margin:8px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}.library-q-image img{display:block;max-width:100%;max-height:420px;object-fit:contain}.library-q-options{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin-top:9px;padding-top:9px;border-top:1px solid #1e293b;color:#cbd5e1;font-size:13px;line-height:1.6}.opt{display:grid;grid-template-columns:25px minmax(0,1fr);gap:2px;margin:2px 0;align-items:start}.correct{margin-top:8px;color:#10b981;font-size:11px;font-weight:800}@media(max-width:700px){.top{height:auto;min-height:58px;flex-wrap:wrap;padding:8px}.spacer{display:none}.page{padding:8px}.modal{width:100%;max-height:96vh}}
</style></head><body>
<header class="top"><button class="btn" onclick="location.href='index.html'">🏠 Dashboard</button><div class="brand">📝 Published Tests & Management</div><div class="spacer"></div><span id="userPill" class="pill">Educator</span><button class="btn" onclick="loadPublishedTests()">↻ Reload</button></header>
<main class="page"><div class="toolbar"><input id="search" class="search" placeholder="Search published tests…" oninput="renderTestCards()"><span id="status" class="badge">Connecting…</span></div><div id="published-tests-grid" class="grid"><div class="empty">Loading published tests…</div></div></main>
<div id="preview-modal-overlay" class="overlay" onclick="if(event.target===this)closePreview()"><section class="modal"><div class="modal-head"><h2 id="preview-modal-title">🔍 Preview</h2><button class="btn" onclick="closePreview()">✕ Close</button></div><div id="preview-modal-body" class="modal-body"></div><div style="padding:10px 12px;border-top:1px solid #1e293b;display:flex;justify-content:flex-end"><button type="button" id="modal-open-test" class="btn" style="background:#059669;border-color:#10b981;color:#fff">▶️ View the Mock Test</button></div></section></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAE7T5cToJKcoUQcj_-GZQFBBF7Q_KMX0",authDomain:"physicsvault-80a10.firebaseapp.com",projectId:"physicsvault-80a10",storageBucket:"physicsvault-80a10.firebasestorage.app",messagingSenderId:"1043166507399",appId:"1:1043166507399:web:634efdac6f109273d42322"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);window.allPublishedTestsMap={};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function norm(v){let s=String(v??"").replace(/\r\n?/g,"\n").replace(/&nbsp;/gi," ");s=s.replace(/&amp;/gi,"&").replace(/&lt;/gi,"<").replace(/&gt;/gi,">");return s.trim()}
function imageOf(q){for(const k of["question","questionImage","image","img","imageData","croppedImage","questionImageData","imageUrl","imageURL","diagram","imageSrc","src","base64Image"]){const v=q?.[k];if(typeof v==="string"&&/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim()))return v.trim()}return""}
function textOf(q){for(const k of["qText","text","questionText","question_text","content","questionTextHtml","prompt","question"]){const v=q?.[k];if(typeof v==="string"&&v.trim()&&!/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim()))return norm(v)}return""}
function optionsOf(q){const v=q?.options??q?.choices??q?.answers;if(Array.isArray(v))return v.map(x=>typeof x==="object"?(x.text??x.value??x.label??""):x).map(norm).filter(Boolean);if(v&&typeof v==="object")return Object.values(v).map(x=>typeof x==="object"?(x.text??x.value??x.label??""):x).map(norm).filter(Boolean);if(typeof q?.optText==="string"){const a=q.optText.split(/\s*\|\s*/).map(norm).filter(Boolean);if(a.length)return a}return["A","B","C","D"].map(k=>q?.["option"+k]??q?.["option_"+k]??q?.["choice"+k]??q?.["opt"+k]).map(norm).filter(Boolean)}
function renderMath(html){
 const x=String(html??"");
 if(!x)return "";
 if(/\\\\\(|\\\\\[/.test(x)) return x;
 if(/\\\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\\b/.test(x)
   || /(?:[A-Za-z0-9\\}])\\^\\{[^}]+\\}|(?:[A-Za-z0-9\\}])_\\{[^}]+\\}/.test(x)){
   return "\\("+x+"\\)";
 }
 return x.replace(/\\n/g,"<br>");
}
function safeRich(v){
 const x=renderMath(v),parts=[];
 const p=x.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$\n]+\$/g,m=>{parts.push(m);return "@@M"+(parts.length-1)+"@@"});
 return esc(p).replace(/\n/g,"<br>").replace(/@@M(\d+)@@/g,(_,i)=>parts[+i]);
}
function typeset(){if(!window.MathJax?.typesetPromise)return;const run=()=>window.MathJax.typesetPromise(Array.from(document.querySelectorAll(".library-q-text,.library-q-options"))).catch(()=>{});window.MathJax.startup?.promise?window.MathJax.startup.promise.then(run).catch(()=>{}):run()}
window.renderTestCards=function(){const grid=document.getElementById("published-tests-grid"),term=(document.getElementById("search")?.value||"").trim().toLowerCase(),entries=Object.entries(window.allPublishedTestsMap).filter(([_,t])=>!term||String(t.title??"").toLowerCase().includes(term));if(!entries.length){grid.innerHTML='<div class="empty">No published tests found.</div>';return}grid.innerHTML="";entries.forEach(([id,t])=>{const n=Array.isArray(t.questionIds)?t.questionIds.length:(Array.isArray(t.questions)?t.questions.length:0),c=document.createElement("div");c.className="test-card";c.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(t.title||"Mock Test")+'</h3><span class="badge" style="color:#10b981">LIVE</span></div><div class="meta">⏱ '+esc(t.time??t.duration??60)+' Mins • 🎯 '+esc(t.marks??100)+' Marks • ❓ '+n+' Questions</div><div class="actions"><button type="button" class="btn blue" data-action="questions" data-id="'+esc(id)+'">👁️ View Questions</button><button type="button" class="btn" style="background:#059669;border-color:#10b981;color:#fff" data-action="mock" data-id="'+esc(id)+'">▶️ View the Mock Test</button><button type="button" class="btn" data-action="share" data-id="'+esc(id)+'">🔗 Share Test Link</button><button type="button" class="btn red" data-action="delete" data-id="'+esc(id)+'">🗑️ Delete Test Permanently</button></div>';c.id="test-card-"+id;grid.appendChild(c)})};
window.openMockTest=id=>{const u="test_player.html?id="+encodeURIComponent(id)+"&preview=1";const w=window.open(u,"_blank");if(!w)location.href=u};
window.copyTestLink=async id=>{const path="test_player.html?id="+encodeURIComponent(id);const u=location.protocol==="file:"?path:(location.origin+"/"+path);try{await navigator.clipboard.writeText(u);alert("✔ Test Link Copied!\n\n"+u)}catch(e){prompt("Copy this test link:",u)}};
document.getElementById("published-tests-grid").addEventListener("click",function(e){const b=e.target.closest("button[data-action]");if(!b)return;e.preventDefault();e.stopPropagation();const id=b.getAttribute("data-id"),a=b.getAttribute("data-action");if(a==="questions")window.openTestPreview(id);else if(a==="mock")window.openMockTest(id);else if(a==="share")window.copyTestLink(id);else if(a==="delete")window.deletePublishedTest(id)});
function renderQuestion(q,i){const d=document.createElement("article");d.className="preview-q";const txt=textOf(q),img=imageOf(q),opts=optionsOf(q);let h='<div class="qhead">Q.'+(i+1)+' • Topic: '+esc(norm(q.topic??q.chapter??q.unit??"General")||"General")+'</div>';if(txt)h+='<div class="library-q-text">'+safeRich(txt)+'</div>';if(img)h+='<div class="library-q-image"><img src="'+esc(img)+'" alt="Question"></div>';if(opts.length){h+='<div class="library-q-options">';opts.forEach((o,j)=>h+='<div class="opt"><b>'+String.fromCharCode(65+j)+'.</b><span>'+safeRich(o)+'</span></div>');h+='</div>'}h+='<div class="correct">Correct Key: '+esc(norm(q.key??q.correctKey??q.answer??"A")||"A")+'</div>';d.innerHTML=h;return d}
window.loadPublishedTests=async function(){const grid=document.getElementById("published-tests-grid"),status=document.getElementById("status");status.textContent="Loading…";grid.innerHTML='<div class="empty">Loading published tests…</div>';try{await signInAnonymously(auth).catch(()=>null);const s=await getDocs(collection(db,"published_tests"));window.allPublishedTestsMap={};s.forEach(d=>window.allPublishedTestsMap[d.id]={id:d.id,...d.data()});status.textContent="Firebase connected • "+s.size+" published tests";renderTestCards()}catch(e){console.error(e);status.textContent="Firebase error";grid.innerHTML='<div class="error"><b>Failed to load published tests.</b><br>'+esc(e.message||e)+'</div>'}};
window.openTestPreview=async function(id){const t=window.allPublishedTestsMap[id];if(!t?.questionIds){alert("No questions found for this test!");return}document.getElementById("preview-modal-title").textContent="🔍 Preview: "+(t.title||"Mock Test");document.getElementById("modal-open-test").onclick=()=>openMockTest(id);const body=document.getElementById("preview-modal-body");body.innerHTML='<div class="empty">Fetching questions…</div>';document.getElementById("preview-modal-overlay").style.display="flex";try{let qs=Array.isArray(t.questions)?t.questions.slice():[];if(!qs.length&&Array.isArray(t.questionIds)){const s=await getDocs(collection(db,"questions")),map={};s.forEach(d=>map[d.id]={id:d.id,...d.data()});qs=t.questionIds.map(qid=>map[qid]).filter(Boolean)}body.innerHTML="";if(!qs.length){body.innerHTML='<div class="error">No matching questions found for this published test.</div>';return}qs.forEach((q,i)=>body.appendChild(renderQuestion(q,i)));requestAnimationFrame(()=>requestAnimationFrame(typeset))}catch(e){body.innerHTML='<div class="error"><b>Failed to load questions preview.</b><br>'+esc(e.message||e)+'</div>'}};
window.closePreview=()=>document.getElementById("preview-modal-overlay").style.display="none";
window.deletePublishedTest=async id=>{if(!confirm("⚠️ Delete this published test permanently? Students will no longer be able to access it."))return;try{await signInAnonymously(auth).catch(()=>null);await deleteDoc(doc(db,"published_tests",id));delete window.allPublishedTestsMap[id];renderTestCards();alert("🗑️ Test Deleted Successfully!")}catch(e){alert("Failed to delete test: "+(e.message||e))}};
document.getElementById("userPill").textContent=(localStorage.getItem("ExamVault_Teacher_Email")||"Educator").trim()||"Educator";loadPublishedTests();
</script></body></html>
