<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - Published Tests & Management</title>
  <script>
window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$","$"]]},svg:{fontCache:"global"}};
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function libraryMathMarkup(v){
      var x=String(v==null?"":v);
      if(!x)return "";
      // Normalize stored escaped LaTeX. Firebase/import data can contain \vec or \\vec.
      x=x.replace(/\\{2,}/g,"\\");
      // Normalize slash-delimited legacy notation such as /vec R/ and /curl J/.
      x=x.replace(/(^|[\s,(])\/(vec|curl|hat|bar|dot|ddot|sqrt|frac|dfrac|tfrac|int|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|mathbf|mathrm|text)\b/g,"$1\\$2");
      x=x.replace(/\/(\)|\])/g,"$1");
      if(/\\(?:frac|dfrac|tfrac|sqrt|vec|curl|hat|bar|dot|ddot|mathbf|mathrm|mathcal|text|begin|end|left|right|nabla|partial|int|iint|iiint|oint|sum|prod|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega)\b/.test(x)
        || /(?:[A-Za-z0-9}])\^\{[^}]+\}|(?:[A-Za-z0-9}])_\{[^}]+\}/.test(x)){
        return "\\("+x+"\\)";
      }
      return x;
    }
    function renderLibraryText(v){
      var x=libraryMathMarkup(v);
      return escapeHtml(x).replace(/&lt;/g,"<").replace(/&gt;/g,">");
    }
    function typesetLibraryMath(){
      if(!window.MathJax||typeof MathJax.typesetPromise!=="function")return;
      if(MathJax.startup&&MathJax.startup.promise){
        MathJax.startup.promise.then(function(){
          var body=document.getElementById("preview-modal-body");
          if(!body)return;
          MathJax.typesetClear([body]);
          return MathJax.typesetPromise([body]);
        }).catch(function(){});
      }
    }

    async function loadPublishedTests() {
      const grid = document.getElementById('published-tests-grid');
      grid.innerHTML = '';

      try {
        const snap = await window.getDocs(window.collection(window.db, "published_tests"));
        if (snap.empty) {
          grid.innerHTML = `<p style="color:#64748b; font-size:13px;">No mock tests published yet.</p>`;
          return;
        }

        allPublishedTestsMap = {};
        snap.forEach(d => {
          const tId = d.id;
          const t = d.data();
          allPublishedTestsMap[tId] = t;
          const totalQ = t.questionIds ? t.questionIds.length : 0;
          const shareUrl = `${window.location.origin}/test_player.html?id=${tId}`;

          const card = document.createElement('div');
          card.className = 'test-card';
          card.id = `test-card-${tId}`;
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <h3 style="color:#38bdf8; font-size:16px;">${t.title || 'Mock Test'}</h3>
              <span style="font-size:11px; background:rgba(16,185,129,0.2); color:#10b981; border:1px solid rgba(16,185,129,0.4); padding:2px 8px; border-radius:4px; font-weight:800;">LIVE</span>
            </div>
            <div style="font-size:12px; color:#94a3b8;">
              <span>⏱ ${t.time || 60} Mins</span> • <span>🎯 ${t.marks || 100} Marks</span> • <span>❓ ${totalQ} Questions</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; margin-top:auto; border-top:1px solid #1e293b; padding-top:10px;">
              <button class="tool-btn" style="background:#0284c7;" onclick="openTestPreview('${tId}')">👁️ View Questions</button>
              <button class="tool-btn" style="background:#2563eb;" onclick="navigator.clipboard.writeText('${shareUrl}'); showToast('✔ Test Link Copied!')">🔗 Share Test Link</button>
              <button class="tool-btn" style="background:#7f1d1d; color:#fecaca;" onclick="deletePublishedTest('${tId}')">🗑️ Delete Test Permanently</button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = `<p style="color:#ef4444; font-size:13px;">Failed to load published tests.</p>`;
      }
    }

    window.openTestPreview = async function(tId) {
      const testData = allPublishedTestsMap[tId];
      if (!testData || !testData.questionIds) return alert("No questions found for this test!");

      document.getElementById('preview-modal-title').textContent = `🔍 Preview: ${testData.title || 'Mock Test'}`;
      const modalBody = document.getElementById('preview-modal-body');
      modalBody.innerHTML = `<p style="color:#94a3b8; text-align:center;">Fetching questions...</p>`;
      document.getElementById('preview-modal-overlay').style.display = 'flex';

      try {
        const qSnap = await window.getDocs(window.collection(window.db, "questions"));
        const qMap = {};
        qSnap.forEach(d => qMap[d.id] = d.data());

        modalBody.innerHTML = '';
        testData.questionIds.forEach((qId, idx) => {
          const q = qMap[qId];
          if (q) {
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "background:#060911; border:1px solid #1e293b; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px;";
            itemDiv.innerHTML = `
              <div style="font-size:12px; color:#38bdf8; font-weight:bold;">Q.${idx + 1} [Topic: ${q.topic || 'General'}]</div>
              ${(() => { const text=q.qText||q.text||q.questionText||q.question_text||q.content; return text ? \`<div class="library-q-text" style="font-size:13px; color:#f8fafc; font-weight:bold; line-height:1.6;">${renderLibraryText(text)}</div>\` : ""; })()}
              ${q.question ? \`<img src="${q.question}" style="max-width:100%; max-height:160px; object-fit:contain; background:#fff; border-radius:4px; padding:4px;">\` : ""}
              ${(() => { let opts=q.options||q.choices||q.answerOptions; if(!opts&&typeof q.optText==="string") opts=q.optText.split(/\s*\|\s*/).map(s=>s.trim()).filter(Boolean); if(typeof opts==="string"){try{opts=JSON.parse(opts)}catch(e){opts=null}} if(!Array.isArray(opts)) opts=["A","B","C","D"].map(k=>q["option"+k]??q["option_"+k]??q["choice"+k]).filter(v=>v!=null&&String(v).trim()).map(String); return opts.length ? \`<div class="library-q-options" style="font-size:12px; color:#cbd5e1;"><strong>Options:</strong><br>${opts.map((o,i)=>String.fromCharCode(65+i)+". "+renderLibraryText(o)).join("<br>")}</div>\` : ""; })()}
              <div style="font-size:12px; color:#10b981;"><strong>Correct Key:</strong> ${q.key || 'A'}</div>
            `;
            modalBody.appendChild(itemDiv);
          } else {
            // Fallback if question ID mapping differs slightly
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "background:#060911; border:1px solid #1e293b; border-radius:8px; padding:12px; color:#ef4444; font-size:12px;";
            itemDiv.textContent = `Q.${idx + 1}: Question data unavailable or ID mismatch.`;
            modalBody.appendChild(itemDiv);
          }
        });

        // Re-render the complete preview after inserting all questions.
        // MathJax must run after the modal is visible and the DOM is fully populated.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            typesetLibraryMath();
          });
        });

        if (modalBody.innerHTML === '') {
          modalBody.innerHTML = `<p style="color:#ef4444; text-align:center;">No matching questions found in the database vault.</p>`;
        }
      } catch (e) {
        modalBody.innerHTML = `<p style="color:#ef4444; text-align:center;">Failed to load questions preview: ${e.message}</p>`;
      }
    };

    window.deletePublishedTest = async function(tId) {
      if (confirm("⚠️ Are you sure you want to delete this mock test permanently? Students will no longer be able to access it.")) {
        try {
          await window.deleteDoc(window.doc(window.db, "published_tests", tId));
          const card = document.getElementById(`test-card-${tId}`);
          if (card) card.remove();
          showToast("🗑️ Test Deleted Successfully!");
        } catch (e) {
          alert("Failed to delete test: " + e.message);
        }
      }
    };
  </script>
<script>
(function(){
  function init(){
    const email=(localStorage.getItem('ExamVault_Teacher_Email')||'').trim().toLowerCase();
    const tag=document.getElementById('current-user-tag'), head=document.getElementById('dropdown-user-email');
    if(tag) tag.textContent=email||'Educator';
    if(head) head.textContent=email||'Not Logged In';
    const admin=document.getElementById('super-admin-nav-btn');
    if(admin) admin.style.display=(email==='atozexammocks@gmail.com'||email==='vikasattri3003@gmail.com')?'inline-flex':'none';
  }
  window.toggleProfileDropdown=function(){const d=document.getElementById('profile-dropdown-menu');if(d)d.classList.toggle('show');};
  window.logoutTeacher=function(){localStorage.removeItem('ExamVault_Teacher_Email');localStorage.removeItem('ExamVault_Teacher_UID');location.replace('index.html');};
  document.addEventListener('click',e=>{if(!e.target.closest('.profile-container')){const d=document.getElementById('profile-dropdown-menu');if(d)d.classList.remove('show');}});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
  window.addEventListener('pageshow',init);
})();
</script></body>
</html>
