<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks - Live Test</title><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font-family:Arial,sans-serif}.top{height:58px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;padding:0 16px}.brand{font-weight:900;color:#38bdf8}.timer{margin-left:auto;color:#fecaca;background:#450a0a;padding:7px 12px;border-radius:20px;font-weight:900}.wrap{display:flex;min-height:calc(100vh - 58px)}.main{flex:1;padding:20px;overflow:auto}.card{max-width:850px;margin:auto;background:#0b1120;border:1px solid #1e293b;border-radius:12px;padding:20px}.meta{display:flex;justify-content:space-between;color:#94a3b8;font-size:12px;margin-bottom:15px}.qtext{font-size:16px;line-height:1.7;overflow-wrap:anywhere}.qimage{margin:14px 0;background:white;border-radius:8px;padding:10px;text-align:center}.qimage img{max-width:100%;max-height:600px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.opt,.btn{border:1px solid #334155;background:#0f172a;color:#fff;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}.opt{text-align:left}.opt.selected{background:#2563eb;border-color:#38bdf8}.nav{display:flex;gap:10px;margin-top:18px}.primary{background:#2563eb}.submit{background:#dc2626;width:100%;margin-top:18px}.palette{width:280px;background:#0b1120;border-left:1px solid #1e293b;padding:18px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.p{height:38px;display:flex;align-items:center;justify-content:center}.p.current{border-color:#38bdf8}.p.answered{background:#059669}.loading,.error{max-width:850px;margin:20px auto;padding:25px;background:#0b1120;border:1px solid #1e293b;border-radius:10px;text-align:center}.error{display:none;background:#450a0a;border-color:#7f1d1d;text-align:left}@media(max-width:760px){.wrap{display:block}.palette{width:auto;border-left:0;border-top:1px solid #1e293b}.options{grid-template-columns:1fr}.main{padding:10px}}</style></head><body><header class="top"><div id="title" class="brand">A to Z Exam Mocks - Live Test</div><div id="timer" class="timer">⏱ 00:00</div></header><div id="loading" class="loading">Loading mock test...</div><div id="error" class="error"></div><div id="app" class="wrap" style="display:none"><main class="main"><section class="card"><div class="meta"><b id="indicator"></b><span id="topic">General</span></div><div id="qimage" class="qimage" style="display:none"><img id="img"></div><div id="qtext" class="qtext"></div><div id="options" class="options"></div><div class="nav"><button id="prev" class="btn">◀ Previous</button><button id="next" class="btn primary">Save & Next ▶</button></div></section></main><aside class="palette"><b style="color:#38bdf8">Question Palette</b><div id="palette" class="grid" style="margin-top:12px"></div><button id="submit" class="btn submit">Submit Test</button></aside></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,doc,getDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0',authDomain:'physicsvault-80a10.firebaseapp.com',projectId:'physicsvault-80a10',storageBucket:'physicsvault-80a10.firebasestorage.app',messagingSenderId:'1043166507399',appId:'1:1043166507399:web:634efdac6f109273d42322'}),db=getFirestore(app);let test,idx=0,res={},secs=0,timer;
const E=id=>document.getElementById(id), norm=v=>String(v??'').replace(/\r\n?/g,'\n').trim(), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function imageOf(q){for(const k of ['questionImage','image','img','imageData','croppedImage','questionImageData','imageUrl','imageURL','diagram','imageSrc','base64Image','question']){let v=norm(q?.[k]);if(/^(https?:\/\/|data:image\/|blob:)/i.test(v))return v}return''}
function textOf(q){for(const k of ['qText','text','questionText','question_text','content','questionTextHtml','prompt','question']){let v=norm(q?.[k]);if(v&&!/^(https?:\/\/|data:image\/|blob:)/i.test(v))return v}return''}
function optionsOf(q){let v=q?.options??q?.choices??q?.answers;if(Array.isArray(v))return v.map(x=>typeof x==='object'?(x.text??x.value??x.label??''):x).map(norm).filter(Boolean);if(v&&typeof v==='object')return Object.values(v).map(x=>typeof x==='object'?(x.text??x.value??x.label??''):x).map(norm).filter(Boolean);v=norm(q?.optText);if(v)return v.split(/\s*\|\s*/).map(norm).filter(Boolean);return ['A','B','C','D'].map(k=>q?.['option'+k]??q?.['opt'+k]).map(norm).filter(Boolean)}
function math(v){let x=norm(v).replace(/\\(?=[A-Za-z()[\]{}$])/g,'\\');if(/\\\(|\\\[|\$\$|\$[^$]+\$/.test(x))return x;return /\\(?:frac|sqrt|vec|hat|bar|dot|ddot|mathrm|mathbf|left|right|sin|cos|tan|sum|prod|int|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|hbar|times|cdot|le|ge|ne|infty|begin|end|text)\b|[A-Za-z0-9)\]}]\s*[_^]\s*(?:\{[^}]+\}|[A-Za-z0-9+\-()]+)/.test(x)?'\\('+x+'\\)':x}
function rich(v){let x=math(v),m=[];x=x.replace(/\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$]+\$/g,z=>{m.push(z);return'@@'+(m.length-1)+'@@'});return esc(x).replace(/\n/g,'<br>').replace(/@@(\d+)@@/g,(_,i)=>m[i])}
function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
function render(){let q=test.questions[idx],mode=String(q.contentMode||'both').toLowerCase(),im=imageOf(q);E('indicator').textContent=`Question ${idx+1} of ${test.questions.length}`;E('topic').textContent=q.topic||q.subject||q.chapter||'General';E('qimage').style.display=im&&mode!=='text'?'block':'none';if(im)E('img').src=im;E('qtext').style.display=mode==='image'?'none':'block';E('qtext').innerHTML=rich(textOf(q));let os=optionsOf(q);E('options').innerHTML='';os.forEach((o,i)=>{let b=document.createElement('button');b.className='opt'+(res[idx]===String.fromCharCode(65+i)?' selected':'');b.innerHTML=rich(o);b.onclick=()=>{res[idx]=String.fromCharCode(65+i);render()};E('options').appendChild(b)});[...E('palette').children].forEach((b,i)=>b.className='btn p'+(i===idx?' current':'')+(res[i]?' answered':''));typeset()}
function palette(){E('palette').innerHTML='';test.questions.forEach((_,i)=>{let b=document.createElement('button');b.className='btn p';b.textContent=i+1;b.onclick=()=>{idx=i;render()};E('palette').appendChild(b)})}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(secs<=0){clearInterval(timer);submit(true);return}secs--;E('timer').textContent='⏱ '+String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000)}
async function load(){let id=new URLSearchParams(location.search).get('id');if(!id)throw Error('No test ID supplied.');let s=await getDoc(doc(db,'published_tests',id));if(!s.exists())throw Error('Published test not found.');let r=s.data(),qs=Array.isArray(r.questions)?r.questions.slice():[];if(!qs.length&&Array.isArray(r.questionIds)){let all=await getDocs(collection(db,'questions'));let map={};all.forEach(d=>map[d.id]={id:d.id,...d.data()});qs=r.questionIds.map(x=>map[x]).filter(Boolean)}if(!qs.length)throw Error('This test contains no matching questions.');test={...r,questions:qs};secs=(Number(r.time??r.duration)||60)*60;E('title').textContent=r.title||'A to Z Exam Mocks - Live Test';palette();E('loading').style.display='none';E('app').style.display='flex';render();startTimer()}
E('prev').onclick=()=>{if(idx){idx--;render()}};E('next').onclick=()=>{if(idx<test.questions.length-1){idx++;render()}};async function submit(auto){if(!test)return;if(!auto&&!confirm('Submit this mock test?'))return;clearInterval(timer);let c=0;test.questions.forEach((q,i)=>{let k=norm(q.key??q.correctKey??q.answer).toUpperCase();if(res[i]===k)c++});alert(`Test submitted.\nCorrect: ${c}/${test.questions.length}`)}E('submit').onclick=()=>submit(false);load().catch(e=>{E('loading').style.display='none';E('error').style.display='block';E('error').innerHTML='<b>Mock test could not be opened.</b><br>'+esc(e.message)})
</script></body></html>
