<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - Published Tests & Management</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z'/></svg>">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, getDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.collection = collection; window.getDocs = getDocs; window.getDoc = getDoc; window.doc = doc; window.deleteDoc = deleteDoc;

    window.onload = async () => {
      const savedEmail = localStorage.getItem('ExamVault_Teacher_Email');
      if (savedEmail) {
        document.getElementById('current-user-tag').textContent = savedEmail;
        await loadPublishedTests();
      } else {
        alert("Please login from Teacher Library first!");
        window.location.href = 'teacher.html';
      }
    };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #060911; color: #f8fafc; overflow: hidden; }

    #toast-msg {
      position: fixed; bottom: 24px; right: 24px; background: #10b981; color: #ffffff;
      padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; z-index: 100000;
    }

    #navbar { height: 56px; background: #0b1120; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; flex-shrink: 0; }
    .nav-brand { font-size: 16px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-tabs { display: flex; gap: 8px; align-items: center; }
    .nav-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-btn:hover { border-color: #38bdf8; color: white; }
    .user-pill { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    .main-screen { flex: 1; padding: 30px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    .tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .test-card { background: #0b1120; border: 1.5px solid #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .test-card:hover { border-color: #38bdf8; }
    .tool-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 11px; text-decoration: none; text-align: center; }
    .tool-btn:hover { border-color: #38bdf8; }

    #preview-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 80000; padding: 20px; }
    .preview-card { background: #0b1120; border: 2px solid #38bdf8; border-radius: 14px; width: 800px; max-height: 85vh; padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; color: #f8fafc; }
  </style>
</head>
<body>

  <div id="toast-msg">✔ Action Successful!</div>

  <!-- VIEW QUESTIONS MODAL -->
  <div id="preview-modal-overlay">
    <div class="preview-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:8px;">
        <h3 id="preview-modal-title" style="color:#38bdf8; font-size:16px;">🔍 Test Questions Preview</h3>
        <button class="tool-btn" style="background:#7f1d1d;" onclick="document.getElementById('preview-modal-overlay').style.display='none'">✕ Close</button>
      </div>
      <div id="preview-modal-body" style="display:flex; flex-direction:column; gap:12px; overflow-y:auto; flex:1;"></div>
    </div>
  </div>

  <div id="navbar">
    <a href="teacher.html" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#38bdf8"><path d="M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      A to Z Exam Mocks - Published Tests
    </a>
    <div class="nav-tabs">
      <a href="index.html" class="nav-btn" style="background:#1e293b; color:#38bdf8; font-weight:800;">🏠 Home</a>
      <a href="teacher.html" class="nav-btn">🏠 Dashboard</a>
      <span class="user-pill" id="current-user-tag">Educator</span>
    </div>
  </div>

  <div class="main-screen">
    <div>
      <h2 style="font-size:20px; font-weight:900; color:#f8fafc;">🔗 Published Mock Tests & Management</h2>
      <p style="font-size:13px; color:#94a3b8; margin-top:4px;">View test questions, copy share links, or delete tests permanently.</p>
    </div>

    <div class="tests-grid" id="published-tests-grid">
      <p style="color:#64748b; font-size:13px;">Loading published tests from cloud...</p>
    </div>
  </div>

  <script>
    function showToast(text) {
      const el = document.getElementById('toast-msg');
      el.textContent = text; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    let allPublishedTestsMap = {};

    async function loadPublishedTests() {
      const grid = document.getElementById('published-tests-grid');
      grid.innerHTML = '';

      try {
        const snap = await window.getDocs(window.collection(window.db, "published_tests"));
        if (snap.empty) {
          grid.innerHTML = `<p style="color:#64748b; font-size:13px;">No mock tests published yet.</p>`;
          return;
        }

        allPublishedTestsMap = {};
        snap.forEach(d => {
          const tId = d.id;
          const t = d.data();
          allPublishedTestsMap[tId] = t;
          const totalQ = t.questionIds ? t.questionIds.length : 0;
          const shareUrl = `${window.location.origin}/test_player.html?id=${tId}`;

          const card = document.createElement('div');
          card.className = 'test-card';
          card.id = `test-card-${tId}`;
          card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <h3 style="color:#38bdf8; font-size:16px;">${t.title || 'Mock Test'}</h3>
              <span style="font-size:11px; background:rgba(16,185,129,0.2); color:#10b981; border:1px solid rgba(16,185,129,0.4); padding:2px 8px; border-radius:4px; font-weight:800;">LIVE</span>
            </div>
            <div style="font-size:12px; color:#94a3b8;">
              <span>⏱ ${t.time || 60} Mins</span> • <span>🎯 ${t.marks || 100} Marks</span> • <span>❓ ${totalQ} Questions</span>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px; margin-top:auto; border-top:1px solid #1e293b; padding-top:10px;">
              <button class="tool-btn" style="background:#0284c7;" onclick="openTestPreview('${tId}')">👁️ View Questions</button>
              <button class="tool-btn" style="background:#2563eb;" onclick="navigator.clipboard.writeText('${shareUrl}'); showToast('✔ Test Link Copied!')">🔗 Share Test Link</button>
              <button class="tool-btn" style="background:#7f1d1d; color:#fecaca;" onclick="deletePublishedTest('${tId}')">🗑️ Delete Test Permanently</button>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = `<p style="color:#ef4444; font-size:13px;">Failed to load published tests.</p>`;
      }
    }

    window.openTestPreview = async function(tId) {
      const testData = allPublishedTestsMap[tId];
      if (!testData || !testData.questionIds) return alert("No questions found for this test!");

      document.getElementById('preview-modal-title').textContent = `🔍 Preview: ${testData.title || 'Mock Test'}`;
      const modalBody = document.getElementById('preview-modal-body');
      modalBody.innerHTML = `<p style="color:#94a3b8; text-align:center;">Fetching questions...</p>`;
      document.getElementById('preview-modal-overlay').style.display = 'flex';

      try {
        const qSnap = await window.getDocs(window.collection(window.db, "questions"));
        const qMap = {};
        qSnap.forEach(d => qMap[d.id] = d.data());

        modalBody.innerHTML = '';
        testData.questionIds.forEach((qId, idx) => {
          const q = qMap[qId];
          if (q) {
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "background:#060911; border:1px solid #1e293b; border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:6px;";
            itemDiv.innerHTML = `
              <div style="font-size:12px; color:#38bdf8; font-weight:bold;">Q.${idx + 1} [Topic: ${q.topic || 'General'}]</div>
              ${q.qText ? `<div style="font-size:13px; color:#f8fafc; font-weight:bold;">${q.qText}</div>` : ''}
              ${q.question ? `<img src="${q.question}" style="max-width:100%; max-height:160px; object-fit:contain; background:#fff; border-radius:4px; padding:4px;">` : ''}
              ${q.optText ? `<div style="font-size:12px; color:#cbd5e1;"><strong>Options:</strong> ${q.optText}</div>` : ''}
              <div style="font-size:12px; color:#10b981;"><strong>Correct Key:</strong> ${q.key || 'A'}</div>
            `;
            modalBody.appendChild(itemDiv);
          } else {
            // Fallback if question ID mapping differs slightly
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "background:#060911; border:1px solid #1e293b; border-radius:8px; padding:12px; color:#ef4444; font-size:12px;";
            itemDiv.textContent = `Q.${idx + 1}: Question data unavailable or ID mismatch.`;
            modalBody.appendChild(itemDiv);
          }
        });

        if (modalBody.innerHTML === '') {
          modalBody.innerHTML = `<p style="color:#ef4444; text-align:center;">No matching questions found in the database vault.</p>`;
        }
      } catch (e) {
        modalBody.innerHTML = `<p style="color:#ef4444; text-align:center;">Failed to load questions preview: ${e.message}</p>`;
      }
    };

    window.deletePublishedTest = async function(tId) {
      if (confirm("⚠️ Are you sure you want to delete this mock test permanently? Students will no longer be able to access it.")) {
        try {
          await window.deleteDoc(window.doc(window.db, "published_tests", tId));
          const card = document.getElementById(`test-card-${tId}`);
          if (card) card.remove();
          showToast("🗑️ Test Deleted Successfully!");
        } catch (e) {
          alert("Failed to delete test: " + e.message);
        }
      }
    };
  </script>
</body>
</html>
