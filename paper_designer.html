<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Builder - A-to-Z Mocks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col font-sans">

    <!-- Top Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-list-check text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold">A-to-Z Test Builder</h1>
                <p class="text-xs text-slate-400">Select questions from your library to design your paper</p>
            </div>
        </div>
        <div>
            <button onclick="proceedToDesigner()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-lg flex items-center space-x-2 transition">
                <span>Proceed to Paper Designer</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-5xl mx-auto w-full overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Available Question Bank</h2>
            <span id="selectedCountBadge" class="text-xs bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 px-3 py-1 rounded-full font-medium">0 Questions Selected</span>
        </div>

        <!-- Question List Container -->
        <div id="builderQuestionList" class="space-y-3">
            <!-- Dynamically populated questions -->
        </div>
    </main>

    <script>
        // Sample Question Library available in Builder
        const availableQuestions = [
            { id: "q_1", type: "Multiple Choice Questions (MCQ)", text: "What is the primary material used in bismuth borate glass ceramics?\n(A) Bismuth oxide\n(B) Silica sand\n(C) Pure copper\n(D) Sodium chloride", marks: 1 },
            { id: "q_2", type: "Multiple Choice Questions (MCQ)", text: "Which electrochemical platform is commonly used for volatile crypto futures market orders?\n(A) Binance\n(B) CoinDCX\n(C) WazirX\n(D) CoinSwitch", marks: 1 },
            { id: "q_3", type: "Short Answer Type", text: "Explain the melt-quenching technique in glass ceramics synthesis and its role in materials science research.", marks: 3 },
            { id: "q_4", type: "Long Answer / Descriptive", text: "Analyze the market volatility and risk management protocols for trading cryptocurrency futures.", marks: 5 },
            { id: "q_5", type: "Assertion & Reason", text: "Assertion: Barium phosphate glasses exhibit high radiation shielding.\nReason: Barium has a high atomic number.", marks: 2 }
        ];

        let selectedQuestionIds = new Set();

        window.addEventListener('DOMContentLoaded', () => {
            renderBuilderList();
        });

        function renderBuilderList() {
            const container = document.getElementById('builderQuestionList');
            container.innerHTML = '';

            availableQuestions.forEach((q, idx) => {
                const isSelected = selectedQuestionIds.has(q.id);
                const card = document.createElement('div');
                card.className = `bg-slate-800/80 border rounded-xl p-4 flex items-start space-x-4 cursor-pointer transition ${isSelected ? 'border-indigo-500 bg-indigo-950/20 shadow-md' : 'border-slate-700/80 hover:border-slate-600'}`;
                card.onclick = () => toggleSelectQuestion(q.id);

                card.innerHTML = `
                    <div class="pt-1">
                        <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="event.stopPropagation(); toggleSelectQuestion('${q.id}')" class="w-4 h-4 rounded text-indigo-600 bg-slate-900 border-slate-700 focus:ring-indigo-500 cursor-pointer">
                    </div>
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs bg-slate-900 text-slate-400 px-2 py-0.5 rounded border border-slate-700">Q.${idx + 1}</span>
                            <span class="text-xs text-indigo-400 font-medium">${q.type}</span>
                            <span class="text-xs text-emerald-400 font-semibold ml-auto">[${q.marks} Mark]</span>
                        </div>
                        <p class="text-sm text-slate-200 whitespace-pre-line leading-relaxed">${q.text}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleSelectQuestion(id) {
            if (selectedQuestionIds.has(id)) {
                selectedQuestionIds.delete(id);
            } else {
                selectedQuestionIds.add(id);
            }
            document.getElementById('selectedCountBadge').innerText = `${selectedQuestionIds.size} Questions Selected`;
            renderBuilderList();
        }

        function proceedToDesigner() {
            if (selectedQuestionIds.size === 0) {
                alert("Please select at least one question before proceeding to Paper Designer!");
                return;
            }

            // Filter selected questions objects
            const selectedObjects = availableQuestions.filter(q => selectedQuestionIds.has(q.id));

            // Save precisely to localStorage with the exact key expected by paper_designer.html
            localStorage.setItem('selectedBuilderQuestions', JSON.stringify(selectedObjects));

            // Redirect to paper designer page
            window.location.href = "paper_designer.html";
        }
    </script>
</body>
</html>
