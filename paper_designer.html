<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Test & Paper Designer - A-to-Z Mocks</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
            authDomain: "physicsvault-80a10.firebaseapp.com",
            projectId: "physicsvault-80a10",
            storageBucket: "physicsvault-80a10.firebasestorage.app",
            messagingSenderId: "1043166507399",
            appId: "1:1043166507399:web:634efdac6f109273d42322"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
    </script>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col overflow-hidden font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-4">
            <button onclick="goBackToBuilder()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 border border-slate-600" title="Back to Test Builder">
                <i class="fa-solid fa-arrow-left text-indigo-400"></i>
                <span>Back to Builder</span>
            </button>
            <div class="flex items-center space-x-3 border-l border-slate-700 pl-4">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-pen-ruler text-lg"></i>
                </div>
                <div>
                    <h1 id="paperMainTitle" class="text-lg font-bold tracking-wide">A-to-Z Paper Designer</h1>
                    <p class="text-xs text-slate-400">Customized Selected Questions Paper Layout</p>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button onclick="openLibraryModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 border border-slate-600 shadow">
                <i class="fa-solid fa-book-bookmark text-indigo-400"></i>
                <span>Add More from Library</span>
            </button>
            <button onclick="previewPrintLayout()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-print"></i>
                <span>Print / Export Paper</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Layout (Right Side Removed & Expanded Full Width) -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- LEFT SIDEBAR: Sections & Unassigned Pool Management -->
        <aside class="w-80 bg-slate-800/90 border-r border-slate-700 flex flex-col z-0">
            <div class="p-4 border-b border-slate-700 bg-slate-800">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Paper Summary</h2>
                <div class="grid grid-cols-2 gap-2 text-center">
                    <div class="bg-slate-900/60 p-2 rounded border border-slate-700/50">
                        <span class="block text-xs text-slate-400">Total Qs</span>
                        <span id="totalQuestionsCount" class="text-lg font-bold text-indigo-400">0</span>
                    </div>
                    <div class="bg-slate-900/60 p-2 rounded border border-slate-700/50">
                        <span class="block text-xs text-slate-400">Total Marks</span>
                        <span id="totalMarksCount" class="text-lg font-bold text-emerald-400">0</span>
                    </div>
                </div>
            </div>

            <!-- Unassigned Pool Tab -->
            <div onclick="selectSection('UNASSIGNED')" id="unassignedTab" class="p-3 bg-amber-950/40 border-b border-slate-700 cursor-pointer hover:bg-amber-900/40 transition flex items-center justify-between">
                <span class="text-xs font-bold text-amber-300"><i class="fa-solid fa-layer-group mr-2"></i>Unassigned Pool</span>
                <span id="unassignedCountBadge" class="text-[10px] bg-amber-900 text-amber-200 px-2 py-0.5 rounded-full font-bold">0</span>
            </div>

            <div class="p-4 border-b border-slate-700 flex items-center justify-between bg-slate-800/50">
                <span class="text-sm font-bold text-slate-200"><i class="fa-solid fa-list-check mr-2 text-indigo-400"></i>Custom Sections</span>
                <button onclick="openAddSectionModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-xs font-medium transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i><span>Add Section</span>
                </button>
            </div>

            <div id="sectionsSidebarList" class="flex-1 overflow-y-auto p-3 space-y-3"></div>
        </aside>

        <!-- CENTER FULL WORKSPACE -->
        <main class="flex-1 bg-slate-950 flex flex-col overflow-hidden relative">
            <div class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between">
                <div>
                    <h2 id="activeSectionTitle" class="text-base font-bold text-slate-100">Unassigned Questions Pool</h2>
                    <p id="activeSectionMeta" class="text-xs text-slate-400">Yahan se apne hisaab se question ko section mein bhejein.</p>
                </div>
            </div>

            <!-- Questions Grid (2 columns on full screen for better view) -->
            <div id="questionsCanvasContainer" class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-4 auto-rows-max">
                <!-- Dynamic Questions -->
            </div>
        </main>

    </div>

    <!-- MODAL: Custom Section Creator (Full Access to Type & Marks) -->
    <div id="sectionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-md flex flex-col shadow-2xl p-5 space-y-4">
            <h3 class="font-bold text-base text-indigo-300">Create New Custom Section</h3>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Section Name / Title</label>
                <input type="text" id="newSecName" value="Section C" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Section Question Type</label>
                <select id="newSecType" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    <option value="MCQ">Multiple Choice Questions (MCQ)</option>
                    <option value="ASSERTION">Assertion & Reason</option>
                    <option value="SHORT">Short Answer Type</option>
                    <option value="LONG">Long Answer / Descriptive</option>
                    <option value="NUMERICAL">Numerical Value Type</option>
                    <option value="CASE">Case Study / Passage Based</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Default Marks Per Question</label>
                <input type="number" id="newSecMarks" min="1" value="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeAddSectionModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm">Cancel</button>
                <button onclick="saveNewSection()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium shadow">Create Section</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Library & Print -->
    <div id="printModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="bg-white text-slate-900 rounded-xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="bg-slate-100 p-4 border-b border-slate-300 flex items-center justify-between">
                <h3 class="font-bold text-lg text-slate-800">Print Preview Layout</h3>
                <button onclick="closePrintModal()" class="text-slate-500 hover:text-slate-800 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="printPreviewContent" class="p-8 flex-1 overflow-y-auto space-y-6 font-serif"></div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let testPaper = {
            title: "Question Paper",
            sections: [
                { id: "A", name: "Section A (MCQ)", type: "MCQ", marksPerQ: 1, questions: [] },
                { id: "B", name: "Section B (Short Answer)", type: "SHORT", marksPerQ: 2, questions: [] }
            ]
        };
        let unassignedQuestions = [];
        let activeSectionId = 'UNASSIGNED';
        let cachedQuestionsMap = {};
        let paperQuestionOverrides = {};

        window.addEventListener('DOMContentLoaded', async () => {
            await loadBuilderDataIntoDesigner();
        });

        async function loadBuilderDataIntoDesigner() {
            const savedTitle = localStorage.getItem('AZ_BUILDER_PAPER_TITLE');
            if (savedTitle) {
                testPaper.title = savedTitle;
                document.getElementById('paperMainTitle').innerText = savedTitle;
            }

            let selectedIds = JSON.parse(localStorage.getItem('AZ_BUILDER_SELECTED_IDS') || '[]');
            let cachedQuestions = await fetchQuestionsFromIndexedDB(selectedIds);
            cachedQuestions.forEach(q => cachedQuestionsMap[q.id] = q);

            let rawOverrides = localStorage.getItem('AZ_PAPER_DESIGNER_OVERRIDES');
            try { paperQuestionOverrides = JSON.parse(rawOverrides || '{}'); } catch(e){ paperQuestionOverrides = {}; }

            // Sabhi selected questions unassigned pool mein jayenge taaki teacher khud section assign kare
            unassignedQuestions = selectedIds.map(id => {
                let found = cachedQuestionsMap[id];
                let ov = paperQuestionOverrides[id] || {};
                return found ? {
                    id: found.id,
                    type: ov.paperType || found.paperType || 'SHORT',
                    text: ov.qText ?? found.qText ?? '',
                    image: ov.keepImage !== false ? (ov.image || found.question || '') : '',
                    optText: ov.optText ?? found.optText ?? '',
                    marks: ov.marks ?? 1
                } : null;
            }).filter(Boolean);

            renderSidebarSections();
            renderActiveCanvas();
            updateSummaryCounters();
        }

        function fetchQuestionsFromIndexedDB(selectedIds) {
            return new Promise((resolve) => {
                const req = indexedDB.open('AZExamMocksDesignerDB', 1);
                req.onerror = () => resolve([]);
                req.onsuccess = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('questions')) { db.close(); return resolve([]); }
                    const tx = db.transaction('questions', 'readonly');
                    const store = tx.objectStore('questions');
                    const getAllReq = store.getAll();
                    getAllReq.onsuccess = () => { db.close(); resolve(getAllReq.result || []); };
                    getAllReq.onerror = () => { db.close(); resolve([]); };
                };
            });
        }

        function goBackToBuilder() { window.location.href = "builder.html"; }

        function selectSection(secId) {
            activeSectionId = secId;
            renderSidebarSections();
            renderActiveCanvas();
        }

        function assignQuestionToSection(qId, targetSecId) {
            if (!targetSecId) return;
            let qObj = null;
            let qIdx = unassignedQuestions.findIndex(q => q.id === qId);
            if (qIdx !== -1) {
                [qObj] = unassignedQuestions.splice(qIdx, 1);
            } else {
                testPaper.sections.forEach(sec => {
                    let idx = sec.questions.findIndex(q => q.id === qId);
                    if (idx !== -1) { [qObj] = sec.questions.splice(idx, 1); }
                });
            }

            if (qObj) {
                if (targetSecId === 'UNASSIGNED') {
                    unassignedQuestions.push(qObj);
                } else {
                    let targetSec = testPaper.sections.find(s => s.id === targetSecId);
                    if (targetSec) {
                        qObj.marks = targetSec.marksPerQ;
                        targetSec.questions.push(qObj);
                    }
                }
            }
            renderSidebarSections();
            renderActiveCanvas();
            updateSummaryCounters();
        }

        function openAddSectionModal() {
            document.getElementById('sectionModal').classList.remove('hidden');
            document.getElementById('sectionModal').classList.add('flex');
        }
        function closeAddSectionModal() {
            document.getElementById('sectionModal').classList.remove('flex');
            document.getElementById('sectionModal').classList.add('hidden');
        }

        function saveNewSection() {
            const name = document.getElementById('newSecName').value.trim() || "New Section";
            const type = document.getElementById('newSecType').value;
            const marksPerQ = Number(document.getElementById('newSecMarks').value) || 1;
            const newId = String.fromCharCode(65 + testPaper.sections.length);

            testPaper.sections.push({ id: newId, name, type, marksPerQ, questions: [] });
            closeAddSectionModal();
            selectSection(newId);
        }

        function updateSectionMarks(secId, marks) {
            const sec = testPaper.sections.find(s => s.id === secId);
            if (sec) {
                sec.marksPerQ = Number(marks);
                sec.questions.forEach(q => q.marks = sec.marksPerQ);
                renderActiveCanvas();
                updateSummaryCounters();
            }
        }

        function renderSidebarSections() {
            document.getElementById('unassignedCountBadge').innerText = unassignedQuestions.length;
            const unassignedTab = document.getElementById('unassignedTab');
            if (activeSectionId === 'UNASSIGNED') {
                unassignedTab.className = "p-3 bg-amber-900/60 border-b border-amber-500 cursor-pointer transition flex items-center justify-between shadow";
            } else {
                unassignedTab.className = "p-3 bg-amber-950/40 border-b border-slate-700 cursor-pointer hover:bg-amber-900/40 transition flex items-center justify-between";
            }

            const listEl = document.getElementById('sectionsSidebarList');
            listEl.innerHTML = '';

            testPaper.sections.forEach(sec => {
                const isActive = sec.id === activeSectionId;
                const secMarks = sec.questions.reduce((acc, q) => acc + Number(q.marks || 1), 0);

                const card = document.createElement('div');
                card.className = `p-3 rounded-lg border transition cursor-pointer ${isActive ? 'bg-indigo-950/40 border-indigo-500 shadow-md' : 'bg-slate-900/60 border-slate-700/60 hover:bg-slate-900'}`;
                card.onclick = () => selectSection(sec.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-xs font-semibold text-slate-200 truncate w-32">${sec.name}</span>
                        <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">${sec.questions.length} Qs (${secMarks}m)</span>
                    </div>
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span>Type: ${sec.type}</span>
                        <span>Marks: <input type="number" min="1" value="${sec.marksPerQ}" onclick="event.stopPropagation()" onchange="updateSectionMarks('${sec.id}', this.value)" class="w-10 bg-slate-800 border border-slate-700 text-center rounded text-xs text-slate-200"></span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function renderActiveCanvas() {
            const container = document.getElementById('questionsCanvasContainer');
            const titleEl = document.getElementById('activeSectionTitle');
            const metaEl = document.getElementById('activeSectionMeta');

            let currentQuestions = [];
            if (activeSectionId === 'UNASSIGNED') {
                titleEl.innerText = "Unassigned Questions Pool";
                metaEl.innerText = `Yahan aapke sabhi select kiye hue questions hain. Inhe apne hisaab se sections mein bhejein.`;
                currentQuestions = unassignedQuestions;
            } else {
                let activeSec = testPaper.sections.find(s => s.id === activeSectionId);
                titleEl.innerText = activeSec ? activeSec.name : "Section Workspace";
                metaEl.innerText = `Type: ${activeSec?.type} | Marks per question: ${activeSec?.marksPerQ}`;
                currentQuestions = activeSec ? activeSec.questions : [];
            }

            if (currentQuestions.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-500 border border-dashed border-slate-800 rounded-xl"><p class="text-sm font-medium">Is view mein koi question nahi hai.</p></div>`;
                return;
            }

            container.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col space-y-3 shadow-lg";

                let imageHtml = q.image ? `<div class="bg-white p-2 rounded-lg max-h-36 flex items-center justify-center overflow-hidden"><img src="${q.image}" class="max-h-32 object-contain"></div>` : '';
                let optionsHtml = q.optText ? `<div class="text-xs text-slate-300 bg-slate-950 p-2 rounded border border-slate-800 whitespace-pre-line">${q.optText}</div>` : '';

                let sectionOptions = `<option value="UNASSIGNED" ${activeSectionId==='UNASSIGNED'?'selected':''}>Unassigned Pool</option>`;
                testPaper.sections.forEach(s => {
                    sectionOptions += `<option value="${s.id}" ${activeSectionId===s.id?'selected':''}>Send to ${s.name}</option>`;
                });

                card.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-indigo-600/20 text-indigo-400 font-bold px-2.5 py-0.5 rounded text-xs border border-indigo-500/30">#${idx + 1}</span>
                            <select onchange="assignQuestionToSection('${q.id}', this.value)" class="bg-slate-800 border border-slate-700 text-xs text-amber-300 font-bold rounded px-2 py-1 focus:outline-none">
                                ${sectionOptions}
                            </select>
                        </div>
                        <span class="text-emerald-400 font-bold text-xs bg-emerald-950/40 px-2 py-0.5 rounded">${q.marks} Mark</span>
                    </div>
                    <div class="text-xs text-slate-100 font-normal leading-relaxed pt-1 whitespace-pre-line bg-slate-950/50 p-3 rounded-lg border border-slate-800/60">${q.text || 'Image Question'}</div>
                    ${imageHtml}
                    ${optionsHtml}
                `;
                container.appendChild(card);
            });
        }

        function updateSummaryCounters() {
            let totalQ = unassignedQuestions.length;
            let totalM = 0;
            testPaper.sections.forEach(sec => {
                totalQ += sec.questions.length;
                sec.questions.forEach(q => totalM += Number(q.marks || 1));
            });
            document.getElementById('totalQuestionsCount').innerText = totalQ;
            document.getElementById('totalMarksCount').innerText = totalM;
        }

        function previewPrintLayout() {
            let html = `<h2 style="text-align:center;">${testPaper.title}</h2>`;
            testPaper.sections.forEach(s => {
                html += `<h3>${s.name} (${s.type})</h3>`;
                s.questions.forEach((q, i) => {
                    html += `<p><b>${i+1}.</b> ${q.text || ''} [${q.marks} Marks]</p>`;
                    if (q.image) html += `<img src="${q.image}" style="max-height:100px;"><br>`;
                });
            });
            document.getElementById('printPreviewContent').innerHTML = html;
            document.getElementById('printModal').style.display = 'flex';
        }
        function closePrintModal() { document.getElementById('printModal').style.display = 'none'; }
    </script>
</body>
</html>
