  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.doc = doc;
    window.getDoc = getDoc;
    window.getDocs = getDocs;
    window.collection = collection;
    window.addDoc = addDoc;
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #060911; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: #0b1120; border-bottom: 1px solid #1e293b; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .brand { font-size: 16px; font-weight: 900; color: #38bdf8; }
    .timer-badge { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px; }

    .test-workspace { flex: 1; display: flex; height: calc(100vh - 56px); overflow: hidden; }
    
    .q-panel { flex: 1; display: flex; flex-direction: column; background: #060911; padding: 24px; overflow-y: auto; }
    .q-container { background: #0b1120; border: 1.5px solid #1e293b; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .q-img-box { background: white; border-radius: 8px; padding: 16px; display: flex; justify-content: center; }
    .q-img-box img { max-width: 100%; height: auto; display: block; }

    .options-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .opt-btn { background: #0f172a; border: 1.5px solid #334155; color: white; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: left; transition: all 0.15s ease; }
    .opt-btn:hover { border-color: #38bdf8; }
    .opt-btn.selected { background: #2563eb; border-color: #38bdf8; color: white; box-shadow: 0 0 12px rgba(37,99,235,0.4); }

    .palette-panel { width: 300px; background: #0b1120; border-left: 1px solid #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; max-height: 300px; align-content: start; }
    .p-box { background: #0f172a; border: 1px solid #334155; color: #94a3b8; height: 38px; border-radius: 6px; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .p-box.answered { background: #10b981; border-color: #059669; color: white; }
    .p-box.current { border-color: #38bdf8; box-shadow: 0 0 8px rgba(56,189,248,0.5); }

    .btn-action { background: #2563eb; border: none; color: white; padding: 12px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; width: 100%; text-align: center; }
    
    #result-overlay { position: fixed; inset: 0; background: rgba(6, 9, 17, 0.95); display: none; align-items: center; justify-content: center; z-index: 999999; padding: 20px; }
    .result-card { background: #0b1120; border: 2px solid #38bdf8; border-radius: 20px; width: 100%; max-width: 450px; padding: 30px; text-align: center; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 25px 60px rgba(0,0,0,0.9); }
  </style>

</script>\n</head>
<body>

  <div id="result-overlay">
    <div class="result-card">
      <h2 style="color:#ffffff; font-size:24px; font-weight:900;">🏆 Test Submitted!</h2>
      <p style="color:#94a3b8; font-size:13px;">Here is your performance summary:</p>
      
      <div style="background:#0f172a; padding:16px; border-radius:12px; display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; justify-content:space-between; font-size:14px;"><span style="color:#94a3b8;">Total Questions:</span> <strong id="res-total" style="color:white;">0</strong></div>
        <div style="display:flex; justify-content:space-between; font-size:14px;"><span style="color:#94a3b8;">Correct Answers:</span> <strong id="res-correct" style="color:#10b981;">0</strong></div>
        <div style="display:flex; justify-content:space-between; font-size:14px;"><span style="color:#94a3b8;">Final Score:</span> <strong id="res-score" style="color:#38bdf8; font-size:18px;">0 Marks</strong></div>
      </div>

      <div style="display:flex; gap:10px; margin-top:10px;"><a href="leaderboard.html?id=" id="result-leaderboard-btn" class="btn-action" style="text-decoration:none; display:block; background:#f59e0b; flex:1;">🏆 View Leaderboard</a><a href="mock_tests.html" class="btn-action" style="text-decoration:none; display:block; background:#10b981; flex:1;">Return to Portal ➔</a></div>
    </div>
  </div>

  <header>
    <div class="brand" id="test-title-header">A to Z Exam Mocks - Live Test</div>
    <div class="timer-badge" id="timer-display">⏱️ 00:00</div>
  </header>

  <div class="test-workspace">
    <div class="q-panel">
      <div class="q-container">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong id="q-indicator" style="color:#38bdf8; font-size:15px;">Question 1 of 0</strong>
          <span id="q-subject-tag" style="font-size:11px; background:#1e293b; padding:3px 8px; border-radius:4px; color:#cbd5e1;">General</span>
        </div>
        
        <div class="q-img-box" id="q-img-wrapper" style="display:none;">
          <img id="current-q-img" src="" alt="Question Image">
        </div>

        <div id="q-text-note" style="font-size:14px; color:#f8fafc; font-weight:bold; line-height:1.5;"></div>
        <div id="q-opts-note" style="font-size:13px; color:#cbd5e1; background:#0f172a; padding:10px; border-radius:6px; border:1px solid #334155;"></div>

        <div class="options-row">
          <button class="opt-btn" onclick="selectOption('A')" id="btn-opt-A">(A) Option A</button>
          <button class="opt-btn" onclick="selectOption('B')" id="btn-opt-B">(B) Option B</button>
          <button class="opt-btn" onclick="selectOption('C')" id="btn-opt-C">(C) Option C</button>
          <button class="opt-btn" onclick="selectOption('D')" id="btn-opt-D">(D) Option D</button>
        </div>

        <div style="display:flex; gap:12px; margin-top:10px;">
          <button class="btn-action" style="background:#334155;" onclick="prevQuestion()">◀ Previous</button>
          <button class="btn-action" onclick="nextQuestion()">Save & Next ▶</button>
        </div>
      </div>
    </div>

    <div class="palette-panel">
      <h3 style="font-size:14px; font-weight:800; color:#38bdf8;">Question Palette</h3>
      <div class="palette-grid" id="palette-grid"></div>
      <button class="btn-action" style="background:#ef4444; margin-top:auto;" onclick="submitTest()">Submit Test</button>
    </div>
  </div>

  <script>
    let testData = null;
    let currentIdx = 0;
    let userResponses = {}; 
    let timerInterval = null;
    let timeLeftSeconds = 60 * 60; 
    let focusLossCount = 0;
    let isSubmitting = false;
    let testStartTimestamp = Date.now();

    async function initTestPlayer() {
      const studentEmail = localStorage.getItem('ExamVault_Student_Email');
      if (!studentEmail) {
        alert("Please login first from the Student Portal!");
        window.location.href = 'student.html';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const testId = urlParams.get('id');
      const isDemo = urlParams.get('demo');

      if (isDemo === 'true') {
        testData = {
          title: "General Studies - Free Demo Test",
          time: 30,
          questions: [
            { qNo: 1, subject: "Demo", qText: "Sample Question 1 text", optText: "(A) Opt1 | (B) Opt2 | (C) Opt3 | (D) Opt4", key: "A" }
          ]
        };
        startTestEngine();
        testStartTimestamp = Date.now();
        initAntiCheating();
        return;
      }

      if (!testId) {
        alert("No test specified!");
        window.location.href = 'student.html';
        return;
      }

      try {
        const docRef = window.doc(window.db, "published_tests", testId);
        const docSnap = await window.getDoc(docRef);
        
        if (docSnap.exists()) {
          const rawTestData = docSnap.data();
          testData = rawTestData;
          let assembledQuestions = [];

          // 1. Check if direct embedded questions exist
          if (rawTestData.questions && Array.isArray(rawTestData.questions) && rawTestData.questions.length > 0) {
            assembledQuestions = rawTestData.questions;
          } 
          // 2. Check if questionIds array exists (New Builder & AI Uploader format)
          else if (rawTestData.questionIds && Array.isArray(rawTestData.questionIds) && rawTestData.questionIds.length > 0) {
            const qSnap = await window.getDocs(window.collection(window.db, "questions"));
            const qMap = {};
            qSnap.forEach(d => qMap[d.id] = d.data());

            rawTestData.questionIds.forEach(qId => {
              if (qMap[qId]) {
                assembledQuestions.push(qMap[qId]);
              }
            });
          }

          testData.questions = assembledQuestions;
          const price = Number(rawTestData.price || 0);
          if (price > 0) {
            const email=(localStorage.getItem('ExamVault_Student_Email')||'').trim().toLowerCase();
            const purchaseId=encodeURIComponent(email)+'_'+encodeURIComponent(testId);
            const purchaseSnap=await window.getDoc(window.doc(window.db,'purchases',purchaseId));
            if(!email || !purchaseSnap.exists() || purchaseSnap.data().status!=='paid'){
              alert('This is a paid mock test. Please purchase it before starting.');
              window.location.href='mock_tests.html'; return;
            }
          }
          timeLeftSeconds = (parseInt(testData.time) || 60) * 60;
          startTestEngine();
          testStartTimestamp = Date.now();
          initAntiCheating();
        } else {
          alert("Test not found!");
          window.location.href = 'student.html';
        }
      } catch (err) {
        console.error("Error loading test:", err);
        alert("Error loading test from cloud: " + err.message);
        window.location.href = 'student.html';
      }
    }

    function startTestEngine() {
      if (!testData.questions || testData.questions.length === 0) {
        alert("This test has no questions available!");
        window.location.href = 'student.html';
        return;
      }
      document.getElementById('test-title-header').textContent = testData.title || "Live Test";
      startTimer();
      renderPalette();
      loadQuestion(0);
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        if (timeLeftSeconds <= 0) {
          clearInterval(timerInterval);
          if (!isSubmitting) submitTest(true);
          return;
        }
        timeLeftSeconds--;
        const mins = Math.floor(timeLeftSeconds / 60);
        const secs = timeLeftSeconds % 60;
        document.getElementById('timer-display').textContent = `⏱️ ${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
      }, 1000);
    }

    function initAntiCheating() {
      window.addEventListener('blur', () => {
        if (isSubmitting) return;
        focusLossCount++;
        if (focusLossCount === 1) {
          alert("⚠️ Warning: Do not switch tabs or minimize the browser during the exam!");
        } else if (focusLossCount >= 3) {
          alert("🚨 Security Alert: Multiple tab switches detected. Auto-submitting test.");
          submitTest(true);
        }
      });
    }

    function loadQuestion(idx) {
      currentIdx = idx;
      const q = testData.questions[idx];
      document.getElementById('q-indicator').textContent = `Question ${idx + 1} of ${testData.questions.length}`;
      document.getElementById('q-subject-tag').textContent = q.topic || q.subject || 'General';

      const imgWrapper = document.getElementById('q-img-wrapper');
      const imgEl = document.getElementById('current-q-img');
      if (q.question && q.question.trim() !== '') {
        imgEl.src = q.question;
        imgWrapper.style.display = 'flex';
      } else {
        imgWrapper.style.display = 'none';
      }

      const qTextEl = document.getElementById('q-text-note');
      qTextEl.textContent = q.qText || `Question ${idx + 1}`;

      const qOptsEl = document.getElementById('q-opts-note');
      if (q.optText) {
        qOptsEl.innerHTML = `<strong>Options:</strong><br>` + q.optText.replace(/\|/g, '<br>');
        qOptsEl.style.display = 'block';
      } else {
        qOptsEl.style.display = 'none';
      }

      ['A', 'B', 'C', 'D'].forEach(opt => {
        const btn = document.getElementById(`btn-opt-${opt}`);
        if (userResponses[idx] === opt) {
          btn.className = 'opt-btn selected';
        } else {
          btn.className = 'opt-btn';
        }
      });
      highlightPalette();
    }

    window.selectOption = (opt) => {
      userResponses[currentIdx] = opt;
      loadQuestion(currentIdx);
    };

    window.nextQuestion = () => {
      if (currentIdx < testData.questions.length - 1) loadQuestion(currentIdx + 1);
    };

    window.prevQuestion = () => {
      if (currentIdx > 0) loadQuestion(currentIdx - 1);
    };

    function renderPalette() {
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';
      testData.questions.forEach((_, idx) => {
        const box = document.createElement('div');
        box.className = 'p-box';
        box.textContent = idx + 1;
        box.onclick = () => loadQuestion(idx);
        box.id = `palette-box-${idx}`;
        grid.appendChild(box);
      });
    }

    function highlightPalette() {
      testData.questions.forEach((_, idx) => {
        const box = document.getElementById(`palette-box-${idx}`);
        if (!box) return;
        box.className = 'p-box';
        if (userResponses[idx]) box.classList.add('answered');
        if (idx === currentIdx) box.classList.add('current');
      });
    }

    window.submitTest = async (isAuto = false) => {
      if (isSubmitting) return;
      if (!isAuto && !confirm("Are you sure you want to submit the test?")) return;
      
      isSubmitting = true;
      if (timerInterval) clearInterval(timerInterval);

      let correctCount = 0;
      testData.questions.forEach((q, idx) => {
        const correctKey = (q.key || 'A').trim().toUpperCase();
        if (userResponses[idx] === correctKey) correctCount++;
      });

      const total = testData.questions.length;
      const totalMarks = parseInt(testData.marks) || (total * 4);
      const marksPerQ = totalMarks / total;
      const finalScore = Math.round(correctCount * marksPerQ);
      const scoreStr = `${finalScore} / ${totalMarks} Marks (${correctCount}/${total} Correct)`;
      const timeTaken = Math.max(0, Math.round((Date.now() - testStartTimestamp) / 1000));
      const percentage = totalMarks > 0 ? Math.round((finalScore / totalMarks) * 100) : 0;

      const studentEmail = localStorage.getItem('ExamVault_Student_Email') || 'student@gmail.com';
      const studentName = localStorage.getItem('ExamVault_Student_Name') || 'Student';
      const studentPhone = localStorage.getItem('ExamVault_Student_Phone') || '';
      const studentReferrer = localStorage.getItem('ExamVault_Student_Referrer') || 'Direct';
      const urlParams = new URLSearchParams(window.location.search);
      const testId = urlParams.get('id') || 'demo_test';

      try {
        await window.addDoc(window.collection(window.db, "student_results"), {
          testId: testId,
          testTitle: testData.title || 'Mock Test',
          studentEmail: studentEmail,
          studentName: studentName,
          studentPhone: studentPhone,
          referrer: studentReferrer,
          score: finalScore,
          totalMarks: totalMarks,
          correctAnswers: correctCount,
          totalQuestions: total,
          percentage: percentage,
          timeTaken: timeTaken,
          userResponses: userResponses,
          submittedAt: new Date().toISOString()
        });
      } catch (e) {
        console.error("Failed to save result:", e);
      }

      document.getElementById('res-total').textContent = total;
      document.getElementById('res-correct').textContent = correctCount;
      document.getElementById('res-score').textContent = scoreStr;
      const leaderboardBtn = document.getElementById('result-leaderboard-btn');
      if (leaderboardBtn) leaderboardBtn.href = 'leaderboard.html?id=' + encodeURIComponent(testId);
      document.getElementById('result-overlay').style.display = 'flex';
    };

    window.onload = initTestPlayer;
  </script>
</body>
</html>
