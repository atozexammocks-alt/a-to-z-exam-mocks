function updateAnswerState(){const s=responseStatus(testData?.questions?.[currentIdx],currentIdx);$("answer-state").textContent=s==="answered"?"✓ Answer saved":s==="skipped"?"⚠ Not attempted / skipped":"Not answered";$("answer-state").style.color=s==="answered"?"#34d399":s==="skipped"?"#facc15":"#94a3b8"}
