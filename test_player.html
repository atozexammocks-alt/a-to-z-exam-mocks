<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A to Z Exam Mocks - Live Test Portal</title>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['\\[','\\]'],['$$','$$']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{background:#060911;color:#f8fafc;height:100vh;display:flex;flex-direction:column;overflow:hidden}header{background:#0b1120;border-bottom:1px solid #1e293b;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.brand{font-size:16px;font-weight:900;color:#38bdf8}.timer-badge{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:6px 14px;border-radius:20px;font-weight:800;font-size:13px}.test-workspace{flex:1;display:flex;height:calc(100vh - 56px);overflow:hidden}.q-panel{flex:1;display:flex;flex-direction:column;background:#060911;padding:24px;overflow-y:auto}.q-container{background:#0b1120;border:1.5px solid #1e293b;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;max-width:800px;width:100%;margin:0 auto}.q-img-box{background:white;border-radius:8px;padding:16px;display:flex;justify-content:center}.q-img-box img{max-width:100%;height:auto;display:block}.q-text{font-size:14px;color:#f8fafc;font-weight:700;line-height:1.65;overflow-wrap:anywhere}.options-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.opt-btn{background:#0f172a;border:1.5px solid #334155;color:white;padding:12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;text-align:left;line-height:1.55;overflow-wrap:anywhere}.opt-btn:hover{border-color:#38bdf8}.opt-btn.selected{background:#2563eb;border-color:#38bdf8}.palette-panel{width:300px;background:#0b1120;border-left:1px solid #1e293b;padding:20px;display:flex;flex-direction:column;gap:16px;flex-shrink:0}.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;max-height:300px}.p-box{background:#0f172a;border:1px solid #334155;color:#94a3b8;height:38px;border-radius:6px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}.p-box.answered{background:#10b981;border-color:#059669;color:white}.p-box.current{border-color:#38bdf8}.btn-action{background:#2563eb;border:none;color:white;padding:12px;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;width:100%;text-align:center}.btn-action:disabled{opacity:.55;cursor:not-allowed}#result-overlay{position:fixed;inset:0;background:rgba(6,9,17,.95);display:none;align-items:center;justify-content:center;z-index:999999;padding:20px}.result-card{background:#0b1120;border:2px solid #38bdf8;border-radius:20px;width:100%;max-width:450px;padding:30px;text-align:center}#loading{position:fixed;inset:0;background:#060911;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#cbd5e1;font-weight:700}.error-card{max-width:700px;background:#0b1120;border:1px solid #7f1d1d;border-radius:14px;padding:24px}.error-card h2{color:#ef4444;margin-bottom:12px}.error-card p{color:#cbd5e1;line-height:1.6;white-space:pre-wrap;word-break:break-word}@media(max-width:760px){body{overflow:auto;height:auto;min-height:100vh}.test-workspace{height:auto;display:block;overflow:visible}.q-panel{padding:10px;overflow:visible}.q-container{padding:15px}.palette-panel{width:auto;border-left:0;border-top:1px solid #1e293b}.options-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading">Loading mock test…</div>
<div id="result-overlay"><div class="result-card"><h2>🏆 Test Submitted!</h2><p style="margin:12px 0;color:#94a3b8">Here is your performance summary:</p><div style="background:#0f172a;padding:16px;border-radius:12px;display:flex;flex-direction:column;gap:8px"><div>Total Questions: <strong id="res-total">0</strong></div><div>Correct Answers: <strong id="res-correct">0</strong></div><div>Final Score: <strong id="res-score">0 Marks</strong></div></div><div style="display:flex;gap:10px;margin-top:16px"><a href="mock_tests.html" class="btn-action" style="text-decoration:none;background:#10b981">Return to Portal ➔</a></div></div></div>
<header><div class="brand" id="test-title-header">A to Z Exam Mocks - Live Test</div><div class="timer-badge" id="timer-display">⏱️ 00:00</div></header>
<div class="test-workspace" id="test-workspace" style="display:none"><div class="q-panel"><div class="q-container"><div style="display:flex;justify-content:space-between;align-items:center"><strong id="q-indicator" style="color:#38bdf8;font-size:15px">Question 1 of 0</strong><span id="q-subject-tag" style="font-size:11px;background:#1e293b;padding:3px 8px;border-radius:4px;color:#cbd5e1">General</span></div><div class="q-img-box" id="q-img-wrapper" style="display:none"><img id="current-q-img" src="" alt="Question Image"></div><div id="q-text-note" class="q-text"></div><div class="options-row"><button class="opt-btn" id="btn-opt-A"></button><button class="opt-btn" id="btn-opt-B"></button><button class="opt-btn" id="btn-opt-C"></button><button class="opt-btn" id="btn-opt-D"></button></div><div style="display:flex;gap:12px;margin-top:10px"><button class="btn-action" id="prev-btn" style="background:#334155">◀ Previous</button><button class="btn-action" id="next-btn">Save &amp; Next ▶</button></div></div></div><div class="palette-panel"><h3 style="font-size:14px;font-weight:800;color:#38bdf8">Question Palette</h3><div class="palette-grid" id="palette-grid"></div><button class="btn-action" id="submit-btn" style="background:#ef4444;margin-top:auto">Submit Test</button></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,doc,getDoc,collection,getDocs,addDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getStorage,ref as storageRef,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// Correct Firebase configuration used by the A to Z Exam Mocks project.
const firebaseConfig={apiKey:"AIzaSyAE7T5cToJKcoUQcj_-GZQFBBF7Q_KMX0",authDomain:"physicsvault-80a10.firebaseapp.com",projectId:"physicsvault-80a10",storageBucket:"physicsvault-80a10.firebasestorage.app",messagingSenderId:"1043166507399",appId:"1:1043166507399:web:634efdac6f109273d42322"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const $=id=>document.getElementById(id),norm=v=>String(v??"").replace(/\r\n?/g,"\n").trim();
let testData=null,currentIdx=0,userResponses={},timerInterval=null,timeLeftSeconds=0,isSubmitting=false,testStartTimestamp=0;
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getTestId(){const p=new URLSearchParams(location.search);return String(p.get("id")||p.get("testId")||"").trim()}
function showError(title,details=""){clearInterval(timerInterval);$("loading").innerHTML=`<div class="error-card"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(details)}</p><button class="btn-action" style="margin-top:16px" onclick="location.href='mock_tests.html'">Return to Mock Tests</button></div>`;console.error(title,details)}
function imageCandidate(v,depth=0){
 if(depth>10||v==null)return "";
 if(typeof v==="string"){
  const s=v.trim(); if(!s)return "";
  const img=s.match(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["']/i); if(img)return img[1].trim();
  if(/^(?:https?:\/\/|data:image\/|blob:|gs:\/\/)/i.test(s))return s;
  if(/^[{\[]/.test(s)){try{return imageCandidate(JSON.parse(s),depth+1)}catch(_){}}
  return "";
 }
 if(Array.isArray(v)){for(const x of v){const r=imageCandidate(x,depth+1);if(r)return r}return ""}
 if(typeof v==="object"){
  // Prefer explicit image/crop fields first.
  const preferred=["dataUrl","dataURL","downloadURL","downloadUrl","url","src","image","imageUrl","imageURL","img","imgUrl","imgSrc","base64","base64Data","imageBase64","croppedImage","croppedImageData","croppedImageUrl","croppedImageURL","questionImage","questionImageData","imageData","figure","figureImage","figureData","figureUrl","crop","cropData","cropped","croppedData","content_blocks","contentBlocks","blocks","elements","parts","html","content","questionTextHtml","question","qText","questionText","text","prompt"];
  for(const k of preferred){if(Object.prototype.hasOwnProperty.call(v,k)){const r=imageCandidate(v[k],depth+1);if(r)return r}}
  // Last resort: inspect all nested values. Only image-looking strings are returned.
  for(const [k,val] of Object.entries(v)){if(preferred.includes(k))continue;const r=imageCandidate(val,depth+1);if(r)return r}
 }
 return "";
}
async function resolveImageURL(candidate){
 const s=String(candidate||"").trim(); if(!s)return "";
 if(/^gs:\/\//i.test(s)){try{return await getDownloadURL(storageRef(storage,s))}catch(e){console.warn("Could not resolve Firebase Storage image:",s,e);return ""}}
 return s;
}
function findImage(v,depth=0){return imageCandidate(v,depth)}
function textOf(q){for(const k of ["qText","text","questionText","question_text","content","questionTextHtml","prompt","question"]){const v=norm(q?.[k]);if(!v)continue;if(/^(?:https?:\/\/|data:image\/|blob:|gs:\/\/)/i.test(v))continue;if(/^\s*<img\b[^>]*>\s*$/i.test(v))continue;return v}return ""}
function optionsOf(q){let v=q?.options??q?.choices??q?.answers,arr=[];if(Array.isArray(v))arr=v.map(x=>typeof x==='object'?(x.text??x.value??x.label??''):x);else if(v&&typeof v==='object')arr=Object.values(v).map(x=>typeof x==='object'?(x.text??x.value??x.label??''):x);if(!arr.length)arr=["A","B","C","D"].map(k=>q?.["option"+k]??q?.["opt"+k]??null).filter(x=>x!=null&&String(x).trim()!="");return arr.map(x=>norm(x).replace(/^\s*(?:\([A-Da-d]\)|\[[A-Da-d]\]|[A-Da-d][.)]|[A-Da-d]\s*[-:])\s*/,"")).filter(Boolean).slice(0,4)}
function libraryMathMarkup(v){
 const x=String(v??"");
 if(!x)return "";
 if(/\\\(|\\\[/.test(x))return x;
 if(/\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\b/.test(x) || /(?:[A-Za-z0-9\}])\^\{[^}]+\}|(?:[A-Za-z0-9\}])_\{[^}]+\}/.test(x))return "\\("+x+"\\)";
 return x;
}
function renderLibraryText(v){const x=libraryMathMarkup(v);return escapeHtml(x).replace(/&lt;img\b/gi,"<img").replace(/&gt;/gi,">").replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/&amp;/gi,"&").replace(/\n/g,"<br>")}
function safeRich(v){return renderLibraryText(v)}
async function loadQuestionsByIds(ids){const clean=[...new Set((ids||[]).map(x=>typeof x==='object'?String(x.id??x.questionId??x.docId??''):String(x)).map(x=>x.trim()).filter(Boolean))];if(!clean.length)return[];const map=new Map();for(const cname of ["questions","library_questions","questionBank","question_bank"]){try{const snap=await getDocs(collection(db,cname));snap.forEach(d=>{if(clean.includes(d.id))map.set(d.id,{id:d.id,_sourceCollection:cname,...d.data()})})}catch(e){console.warn(cname,e)}if(map.size===clean.length)break}return clean.map(id=>map.get(id)).filter(Boolean)}
function normalizePublishedQuestions(raw){if(!Array.isArray(raw?.questions))return[];return raw.questions.map((q,i)=>q&&typeof q==='object'?{...q,id:String(q.id??q.questionId??("embedded_"+i))}:null).filter(Boolean)}
async function init(){try{
 const testId=getTestId();if(!testId)return showError("No test ID was supplied in the URL.","Expected: test_player.html?id=YOUR_PUBLISHED_TEST_ID");
 const authPromise=signInAnonymously(auth).catch(e=>{console.warn("Anonymous auth unavailable",e);return null});
 const snap=await getDoc(doc(db,"published_tests",testId));
 if(!snap.exists())return showError("Published test not found.","No document exists at published_tests/"+testId+".");
 const raw=snap.data();let questions=normalizePublishedQuestions(raw);
 if(!questions.length&&Array.isArray(raw.questionIds)&&raw.questionIds.length)questions=await loadQuestionsByIds(raw.questionIds);
 if(!questions.length)return showError("This published test has no available questions.","The published test was found, but no embedded questions or matching question IDs could be loaded.");
 const email=(localStorage.getItem("ExamVault_Student_Email")||"").trim();
 if(!email){showError("Please login first from the Student Portal.");setTimeout(()=>location.href="student.html",1000);return}
 if(Number(raw.price||0)>0){const purchaseId=encodeURIComponent(email.toLowerCase())+"_"+encodeURIComponent(testId);const ps=await getDoc(doc(db,"purchases",purchaseId));if(!ps.exists()||ps.data().status!=="paid"){alert("This is a paid mock test. Please purchase it before starting.");location.href="mock_tests.html";return}}
 testData={...raw,questions};timeLeftSeconds=(parseInt(raw.time)||parseInt(raw.duration)||60)*60;testStartTimestamp=Date.now();startTest();await authPromise;
 }catch(e){showError("Error loading test.",e?.message||String(e))}}
function startTest(){$("test-title-header").textContent=testData.title||"Live Test";$('loading').style.display="none";$('test-workspace').style.display="flex";renderPalette();loadQuestion(0);updateTimer();timerInterval=setInterval(()=>{if(timeLeftSeconds<=0){clearInterval(timerInterval);submitTest(true);return}timeLeftSeconds--;updateTimer()},1000)}
function updateTimer(){const m=Math.floor(timeLeftSeconds/60),s=timeLeftSeconds%60;$('timer-display').textContent=`⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function loadQuestion(i){const q=testData.questions[i];if(!q)return;currentIdx=i;$('q-indicator').textContent=`Question ${i+1} of ${testData.questions.length}`;$('q-subject-tag').textContent=q.topic||q.subject||q.chapter||'General';const im=imageOf(q),tw=$('q-img-wrapper'),img=$('current-q-img');if(im){tw.style.display='flex';img.onerror=()=>tw.style.display='none';img.onload=()=>tw.style.display='flex';img.src=im}else{tw.style.display='none';img.removeAttribute('src')};const txt=textOf(q);$('q-text-note').style.display=txt?'block':'none';$('q-text-note').innerHTML=txt?safeRich(txt):'';const opts=optionsOf(q);['A','B','C','D'].forEach((l,n)=>{const b=$('btn-opt-'+l),v=opts[n]||'';b.style.display=v?'block':'none';b.innerHTML=v?safeRich(v):'';b.className='opt-btn'+(userResponses[i]===l?' selected':'');b.onclick=()=>{if(v){userResponses[i]=l;loadQuestion(i)}}});$('prev-btn').disabled=i===0;$('next-btn').textContent=i===testData.questions.length-1?'Save & Stay ▶':'Save & Next ▶';highlightPalette();if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([$('q-text-note'),$('btn-opt-A'),$('btn-opt-B'),$('btn-opt-C'),$('btn-opt-D')]).catch(()=>{})}
function renderPalette(){const g=$('palette-grid');g.innerHTML='';testData.questions.forEach((_,i)=>{const b=document.createElement('div');b.className='p-box';b.textContent=i+1;b.onclick=()=>loadQuestion(i);g.appendChild(b)});highlightPalette()}function highlightPalette(){testData?.questions?.forEach((_,i)=>{const b=$('palette-box-'+i);if(!b)return;b.className='p-box'+(userResponses[i]?' answered':'')+(i===currentIdx?' current':'')})}
function goNext(){if(currentIdx<testData.questions.length-1)loadQuestion(currentIdx+1)}function goPrev(){if(currentIdx>0)loadQuestion(currentIdx-1)}
async function submitTest(auto=false){if(isSubmitting||!testData)return;if(!auto&&!confirm('Are you sure you want to submit the test?'))return;isSubmitting=true;clearInterval(timerInterval);let correct=0;testData.questions.forEach((q,i)=>{if(userResponses[i]===norm(q.key??q.correctKey??q.answer).toUpperCase())correct++});const total=testData.questions.length,totalMarks=parseInt(testData.marks)||total*4,score=Math.round(correct*(totalMarks/total));try{await addDoc(collection(db,'student_results'),{testId:getTestId(),testTitle:testData.title||'Mock Test',studentEmail:localStorage.getItem('ExamVault_Student_Email')||'',studentName:localStorage.getItem('ExamVault_Student_Name')||'Student',score,totalMarks,correctAnswers:correct,totalQuestions:total,percentage:totalMarks?Math.round(score/totalMarks*100):0,userResponses,submittedAt:new Date().toISOString()})}catch(e){console.error(e)}$('res-total').textContent=total;$('res-correct').textContent=correct;$('res-score').textContent=`${score} / ${totalMarks} Marks (${correct}/${total} Correct)`;$('result-overlay').style.display='flex'}
$('prev-btn').onclick=goPrev;$('next-btn').onclick=goNext;$('submit-btn').onclick=()=>submitTest(false);window.addEventListener('error',e=>console.error('Player error:',e.error||e.message));init();
</script></body></html>
