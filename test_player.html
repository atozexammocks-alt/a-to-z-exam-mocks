<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A to Z Exam Mocks - Live Test Portal</title><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getFirestore,doc,getDoc,collection,addDoc,getDocs}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAE7T5cToJKcoUQcj_-GZrQFBBF7Q_KMX0",authDomain:"physicsvault-80a10.firebaseapp.com",projectId:"physicsvault-80a10",storageBucket:"physicsvault-80a10.firebasestorage.app",messagingSenderId:"1043166507399",appId:"1:1043166507399:web:634efdac6f109273d42322"};const app=initializeApp(firebaseConfig);window.db=getFirestore(app);window.doc=doc;window.getDoc=getDoc;window.getDocs=getDocs;window.collection=collection;window.addDoc=addDoc;</script><style>*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font-family:system-ui;height:100vh;display:flex;flex-direction:column;overflow:hidden}header{background:#0b1120;border-bottom:1px solid #1e293b;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:16px;font-weight:900;color:#38bdf8}.timer-badge{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444;padding:6px 14px;border-radius:20px;font-weight:800}.test-workspace{flex:1;display:flex;overflow:hidden}.q-panel{flex:1;overflow-y:auto;padding:24px}.q-container{background:#0b1120;border:1px solid #1e293b;border-radius:12px;padding:20px;max-width:900px;margin:auto}.q-img-box{background:white;border-radius:8px;padding:12px;display:flex;justify-content:center;margin:12px 0}.q-img-box img{max-width:100%;height:auto;display:block}.figure-box{background:white;border:1px dashed #64748b;border-radius:8px;padding:8px;margin-top:10px}.figure-box img{max-width:100%;height:auto;display:block;margin:auto}.options-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.opt-btn{background:#0f172a;border:1px solid #334155;color:white;padding:12px;border-radius:8px;font-weight:700;text-align:left;cursor:pointer}.opt-btn.selected{background:#2563eb;border-color:#38bdf8}.palette-panel{width:300px;background:#0b1120;border-left:1px solid #1e293b;padding:20px}.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.p-box{background:#0f172a;border:1px solid #334155;color:#94a3b8;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800}.p-box.answered{background:#10b981;color:white}.p-box.current{border-color:#38bdf8}.btn-action{background:#2563eb;border:0;color:white;padding:12px;border-radius:8px;font-weight:800;cursor:pointer;width:100%;margin-top:12px}.opt-image{display:block;max-width:100%;max-height:180px;margin:6px 0;border-radius:5px;background:white;padding:4px}@media(max-width:800px){.test-workspace{display:block;overflow:auto}.palette-panel{width:auto;border-left:0;border-top:1px solid #1e293b}.options-row{grid-template-columns:1fr}}
</style></head><body><header><div class="brand" id="test-title-header">A to Z Exam Mocks - Live Test</div><div class="timer-badge" id="timer-display">⏱️ 00:00</div></header><div class="test-workspace"><div class="q-panel"><div class="q-container"><div style="display:flex;justify-content:space-between"><strong id="q-indicator" style="color:#38bdf8">Question 1 of 0</strong><span id="q-subject-tag"></span></div><div id="q-img-wrapper" class="q-img-box" style="display:none"><img id="current-q-img" alt="Question Image"></div><div id="q-text-note" style="font-size:15px;font-weight:700;line-height:1.6;margin-top:10px"></div><div id="q-opts-note" style="font-size:13px;color:#cbd5e1;background:#0f172a;padding:10px;border-radius:6px;margin-top:10px"></div><div id="q-figure-box"></div><div class="options-row"><button class="opt-btn" id="btn-opt-A" onclick="selectOption('A')">(A)</button><button class="opt-btn" id="btn-opt-B" onclick="selectOption('B')">(B)</button><button class="opt-btn" id="btn-opt-C" onclick="selectOption('C')">(C)</button><button class="opt-btn" id="btn-opt-D" onclick="selectOption('D')">(D)</button></div><div style="display:flex;gap:10px"><button class="btn-action" style="background:#334155" onclick="prevQuestion()">◀ Previous</button><button class="btn-action" onclick="nextQuestion()">Save & Next ▶</button></div><button class="btn-action" style="background:#ef4444" onclick="submitTest()">Submit Test</button></div></div><div class="palette-panel"><h3 style="font-size:14px;color:#38bdf8">Question Palette</h3><div class="palette-grid" id="palette-grid"></div></div></div><div id="result-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;z-index:99;padding:20px"><div style="background:#0b1120;border:2px solid #38bdf8;border-radius:16px;padding:30px;max-width:450px;width:100%;text-align:center"><h2>🏆 Test Submitted!</h2><p>Total: <b id="res-total">0</b></p><p>Correct: <b id="res-correct">0</b></p><p>Score: <b id="res-score">0</b></p><a href="student.html" class="btn-action" style="display:block;text-decoration:none">Return to Student Portal</a></div></div><script>let testData=null,currentIdx=0,userResponses={},timerInterval=null,timeLeftSeconds=3600,isSubmitting=false;function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]||m))}function getQuestionImage(q){return q.questionImage||q.question||q.image||q.figureImage||''}function getOption(q,k){const v=q['opt'+k];return typeof v==='object'?(v.text||''):String(v||'')}function getOptionImage(q,k){return q.optionImages?.[k]||q['opt'+k+'Image']||''}async function initTestPlayer(){if(!localStorage.getItem('ExamVault_Student_Email')){alert('Please login first from the Student Portal!');location.href='student.html';return}const id=new URLSearchParams(location.search).get('id');if(!id){alert('No test specified!');location.href='student.html';return}try{const s=await getDoc(doc(db,'published_tests',id));if(!s.exists()){alert('Test not found!');location.href='student.html';return}const raw=s.data();testData={...raw,questions:Array.isArray(raw.questions)?raw.questions:[]};if(!testData.questions.length&&Array.isArray(raw.questionIds)){const qs=await getDocs(collection(db,'questions')),map={};qs.forEach(d=>map[d.id]=d.data());testData.questions=raw.questionIds.map(id=>map[id]).filter(Boolean)}if(!testData.questions.length){alert('This test has no questions available!');return}timeLeftSeconds=(parseInt(testData.time)||60)*60;document.getElementById('test-title-header').textContent=testData.title||'Live Test';renderPalette();loadQuestion(0);startTimer()}catch(e){console.error(e);alert('Error loading test: '+e.message)}}function startTimer(){timerInterval=setInterval(()=>{if(--timeLeftSeconds<=0){clearInterval(timerInterval);submitTest(true);return}const m=Math.floor(timeLeftSeconds/60),s=timeLeftSeconds%60;document.getElementById('timer-display').textContent=`⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`},1000)}function loadQuestion(i){currentIdx=i;const q=testData.questions[i]||{},src=getQuestionImage(q),wrap=document.getElementById('q-img-wrapper');document.getElementById('q-indicator').textContent=`Question ${i+1} of ${testData.questions.length}`;document.getElementById('q-subject-tag').textContent=q.topic||q.subject||'General';if(src){document.getElementById('current-q-img').src=src;wrap.style.display='flex'}else wrap.style.display='none';document.getElementById('q-text-note').textContent=q.qText||q.text||`Question ${i+1}`;const opts=document.getElementById('q-opts-note');opts.innerHTML='';if(q.optText){opts.innerHTML='<strong>Options:</strong><br>'+esc(q.optText).replace(/\|/g,'<br>')}else{opts.style.display='none'}['A','B','C','D'].forEach(k=>{const b=document.getElementById('btn-opt-'+k),t=getOption(q,k),im=getOptionImage(q,k);b.innerHTML=`(${k}) ${esc(t)}`+(im?`<img class="opt-image" src="${im}">`: '');b.className='opt-btn'+(userResponses[i]===k?' selected':'')});const fig=document.getElementById('q-figure-box');fig.innerHTML=q.figureImage?`<div class="figure-box"><img src="${q.figureImage}">${q.figureCaption?`<div style="color:#111;text-align:center">${esc(q.figureCaption)}</div>`:''}</div>`:'';highlightPalette()}window.selectOption=k=>{userResponses[currentIdx]=k;loadQuestion(currentIdx)};window.nextQuestion=()=>{if(currentIdx<testData.questions.length-1)loadQuestion(currentIdx+1)};window.prevQuestion=()=>{if(currentIdx>0)loadQuestion(currentIdx-1)};function renderPalette(){const g=document.getElementById('palette-grid');g.innerHTML=testData.questions.map((_,i)=>`<div class="p-box" id="pb${i}" onclick="loadQuestion(${i})">${i+1}</div>`).join('')}function highlightPalette(){testData.questions.forEach((_,i)=>{const b=document.getElementById('pb'+i);if(b)b.className='p-box'+(userResponses[i]?' answered':'')+(i===currentIdx?' current':'')})}window.submitTest=async auto=>{if(isSubmitting)return;if(!auto&&!confirm('Are you sure you want to submit the test?'))return;isSubmitting=true;if(timerInterval)clearInterval(timerInterval);let correct=0;testData.questions.forEach((q,i)=>{if(userResponses[i]===(q.key||'A').trim().toUpperCase())correct++});const total=testData.questions.length,totalMarks=parseInt(testData.marks)||(total*4),score=Math.round(correct*totalMarks/total),id=new URLSearchParams(location.search).get('id')||'demo_test';try{await addDoc(collection(db,'student_results'),{testId:id,testTitle:testData.title||'Mock Test',studentEmail:localStorage.getItem('ExamVault_Student_Email')||'',studentName:localStorage.getItem('ExamVault_Student_Name')||'Student',studentPhone:localStorage.getItem('ExamVault_Student_Phone')||'',referrer:localStorage.getItem('ExamVault_Student_Referrer')||'Direct',score,totalMarks,correctAnswers:correct,totalQuestions:total,userResponses,submittedAt:new Date().toISOString()})}catch(e){console.error(e)}document.getElementById('res-total').textContent=total;document.getElementById('res-correct').textContent=correct;document.getElementById('res-score').textContent=`${score} / ${totalMarks}`;document.getElementById('result-overlay').style.display='flex'}window.onload=initTestPlayer;</script></body></html>
