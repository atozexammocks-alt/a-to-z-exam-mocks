<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A2Z Mock — Student Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e5e7eb;font:14px system-ui;height:100vh;overflow:hidden}.top{height:54px;background:#111827;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.title{font-weight:900;color:#38bdf8}.bar,.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.btn{background:#1e293b;color:#fff;border:1px solid #475569;border-radius:7px;padding:7px 9px;cursor:pointer;font-weight:800}.primary{background:#0284c7;border-color:#38bdf8}.danger{background:#7f1d1d;border-color:#ef4444}.layout{height:calc(100vh - 54px);display:grid;grid-template-columns:1fr 1fr;min-width:900px}.pane{overflow:auto;padding:12px}.left{border-right:1px solid #334155}.card{background:#f8fafc;color:#111827;border-radius:8px;padding:9px;margin-bottom:9px;border:1px solid #cbd5e1}.card h3,.img h3{font-size:12px;color:#0369a1;margin:0 0 6px}.edit{border:1px dashed #94a3b8;border-radius:6px;padding:8px;min-height:40px;white-space:pre-wrap;outline:0}.img{background:#fff;color:#111827;border-radius:8px;padding:8px;margin-bottom:9px}.img h3{color:#111827}.img img{max-width:100%;display:block;margin:auto}.hint{font-size:11px;color:#94a3b8;margin-bottom:10px}.keep{font-size:11px}.lang{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:6px;padding:6px}.optionTools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.optionTools button{width:100%}.smallnote{font-size:11px;color:#64748b;margin-top:6px}@media(max-width:900px){body{overflow:auto}.layout{min-width:0;height:auto;grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid #334155}.optionTools{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><div class="title" id="title">👁 Student Preview</div><div class="bar"><select id="lang" class="lang"><option value="both">Hindi + English</option><option value="hi">Hindi</option><option value="en">English</option></select><button class="btn primary" id="apply">💾 Apply to Uploader</button><button class="btn" onclick="window.close()">✕ Close</button></div></div>
<div class="layout"><section class="pane left"><div class="hint">LEFT: final student text. Question and A/B/C/D are separate editable boxes. Keep/remove, edit, cut, copy or delete each one.</div><div id="texts"></div></section><section class="pane"><div class="hint">RIGHT: complete original question image. Keep it as the main visual. Option images are optional and can be cropped/attached only when you need them.</div><div id="imgs"></div></section></div>
<script>
const openerWin=window.opener;const idx=Number(new URLSearchParams(location.search).get('i')||0);let x={};
try{if(openerWin&&!openerWin.closed){x=openerWin.eval('items['+idx+']')||{}}}catch(e){x={}}
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));
$('title').textContent='👁 Student Preview — Q'+(x.qNo||idx+1);$('lang').value=x.languageMode||'both';
const originalQuestionImage=x.questionImage||x.sourcePageImage||'';let originalOptionImages={...(x.optionImages||{})};
let blocks=[];
function qText(){const m=$('lang').value;return m==='hi'?(x.qTextHindi||x.qText||''):m==='en'?(x.qTextEnglish||x.qText||''):(x.qText||'')}
function opt(k){const v=x['opt'+k];return typeof v==='object'?(v.text||''):String(v||'')}
function renderText(){blocks=[{label:'Question',key:'qText',text:qText(),keep:x.keepText!==false},{label:'Option A',key:'optA',text:opt('A'),keep:x.keepText!==false},{label:'Option B',key:'optB',text:opt('B'),keep:x.keepText!==false},{label:'Option C',key:'optC',text:opt('C'),keep:x.keepText!==false},{label:'Option D',key:'optD',text:opt('D'),keep:x.keepText!==false}];$('texts').innerHTML='';blocks.forEach(b=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+esc(b.label)+'</h3><label class="keep"><input type="checkbox" '+(b.keep?'checked':'')+'> Keep text</label><div class="edit" contenteditable="true">'+esc(b.text)+'</div><div class="controls"><button class="btn">Copy</button><button class="btn">Cut</button><button class="btn danger">Delete</button></div>';const ed=c.querySelector('.edit'),ck=c.querySelector('input'),bs=c.querySelectorAll('button');ed.oninput=()=>b.text=ed.innerText;ck.onchange=()=>b.keep=ck.checked;bs[0].onclick=()=>navigator.clipboard?.writeText(ed.innerText||'');bs[1].onclick=()=>{navigator.clipboard?.writeText(ed.innerText||'');b.text='';ed.innerText=''};bs[2].onclick=()=>{b.keep=false;ck.checked=false;c.style.opacity='.45'};$('texts').append(c)})}
function renderImages(){const r=$('imgs');r.innerHTML='';imageBox('Complete Question Image',x.questionImage||originalQuestionImage,x.keepQuestionImage!==false,'question');const tools=document.createElement('div');tools.className='img';tools.innerHTML='<h3>Optional Option Image</h3><div class="smallnote">Only crop an option image when the text above is not enough. Choose A/B/C/D, then crop from the original PDF page.</div><div class="optionTools"><button class="btn primary">✂️ Option A</button><button class="btn primary">✂️ Option B</button><button class="btn primary">✂️ Option C</button><button class="btn primary">✂️ Option D</button></div><div id="optionAttached"></div>';r.append(tools);const box=tools.querySelector('#optionAttached');for(const k of ['A','B','C','D']){if(x.optionImages?.[k]){const d=document.createElement('div');d.style.marginTop='8px';d.innerHTML='<b>Option '+k+' Image</b><label class="keep" style="margin-left:8px"><input type="checkbox" checked> Keep image</label><img style="max-width:100%;display:block;margin-top:5px" src="'+x.optionImages[k]+'">';d.querySelector('input').onchange=e=>{if(!e.target.checked){x.optionImages[k]='';d.style.opacity='.45}};box.append(d)}}
const bs=tools.querySelectorAll('button');['A','B','C','D'].forEach((k,i)=>bs[i].onclick=()=>openerWin?.openCropModal(idx,'option'+k));}
function imageBox(label,src,keep,type){const c=document.createElement('div');c.className='img';c.innerHTML='<h3>'+esc(label)+'</h3>'+(src?'<img src="'+src+'">':'<div>No image available</div>')+'<div class="controls"><label class="keep"><input type="checkbox" '+(keep?'checked':'')+'> Keep image</label><button class="btn primary">✂️ Crop from PDF page</button><button class="btn">✚ Next Page</button></div>';c.querySelector('input').onchange=e=>{const on=e.target.checked;if(type==='question'){x.keepQuestionImage=on;x.questionImage=on?originalQuestionImage:''}};const bs=c.querySelectorAll('button');bs[0].onclick=()=>openerWin?.openCropModal(idx,type);bs[1].onclick=()=>openerWin?.openCropModal(idx,type);$('imgs').append(c)}
$('lang').onchange=()=>{x.languageMode=$('lang').value;renderText()};$('apply').onclick=()=>{if(!openerWin||openerWin.closed)return alert('Uploader tab is not available.');for(const b of blocks)openerWin.eval('items['+idx+']['+JSON.stringify(b.key)+']='+JSON.stringify(b.text));openerWin.eval('items['+idx+'].keepText='+JSON.stringify(blocks[0]?.keep!==false));openerWin.eval('items['+idx+'].languageMode='+JSON.stringify($('lang').value));openerWin.eval('items['+idx+'].questionImage='+JSON.stringify(x.questionImage||''));openerWin.eval('items['+idx+'].keepQuestionImage='+JSON.stringify(x.keepQuestionImage!==false));openerWin.eval('items['+idx+'].optionImages='+JSON.stringify(x.optionImages||{}));openerWin.render();alert('Applied to uploader.')};renderText();renderImages();
</script></body></html>
