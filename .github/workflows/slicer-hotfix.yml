name: Slicer hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply slicer fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('api/gemini-extract.js')
          s=p.read_text()
          s,n=re.subn(r"const clean=s=>typeof s==='string'\?.*?\.trim\(\):s;", "const clean=s=>typeof s==='string'?s.replace(/[ \\t]{2,}/g,' ').trim():s;", s, count=1)
          if n!=1: raise SystemExit('backend clean() pattern not found')
          p.write_text(s)

          p=Path('ai_uploader.html')
          s=p.read_text()
          reps=[
          ("function makeCrops(x){const cur=pageCache[x.sourcePage]?.image;if(!cur)return x;x.questionImage=await cropFromDataUrl(cur,x.questionBox,10,.72,1400);", "function makeCrops(x){const cur=pageCache[x.sourcePage]?.image;if(!cur)return x;x.sourcePageImage=cur;x.questionImage=await cropFromDataUrl(cur,x.questionBox,10,.72,1400);"),
          ("function openQuestionCrop(i){reviewIndex=i;const src=pageCache[items[i].sourcePage]?.image;if(!src)return alert('Original page image is not available.');openCropModal(i,'question',src)}", "function openQuestionCrop(i){reviewIndex=i;const src=pageCache[items[i].sourcePage]?.image;if(!src)return alert('Original page image is not available.');openCropModal(i,'question',src)}function openSolutionCrop(i){reviewIndex=i;const src=pageCache[items[i].sourcePage]?.image;if(!src)return alert('Original page image is not available.');openCropModal(i,'solution',src)}function openOptionCrop(i,k){reviewIndex=i;const src=pageCache[items[i].sourcePage]?.image;if(!src)return alert('Original page image is not available.');openCropModal(i,'option'+k,src)}"),
          ("if(type==='figure'){items[i].figureImage=out;items[i].figureCropVerified=true}else{items[i].questionImage=out;items[i].cropVerified=true}", "if(type==='figure'){items[i].figureImage=out;items[i].figureCropVerified=true}else if(type==='solution'){items[i].solutionImage=out;items[i].solutionCropVerified=true}else if(type.startsWith('option')){const k=type.slice(-1);items[i].optionImages=items[i].optionImages||{};items[i].optionImages[k]=out;items[i].optionCropVerified=items[i].optionCropVerified||{};items[i].optionCropVerified[k]=true}else{items[i].questionImage=out;items[i].cropVerified=true}"),
          ("<button class=\"miniBtn primary\" onclick=\"openQuestionCrop(${i})\">✂️ Question Crop</button><button class=\"miniBtn primary\" onclick=\"openFigureCrop(${i})\">✂️ Crop Figure / Diagram</button>", "<button class=\"miniBtn primary\" onclick=\"openQuestionCrop(${i})\">✂️ Question</button><button class=\"miniBtn primary\" onclick=\"openSolutionCrop(${i})\">✂️ Solution</button><button class=\"miniBtn primary\" onclick=\"openFigureCrop(${i})\">✂️ Figure</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'A')\">A image</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'B')\">B image</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'C')\">C image</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'D')\">D image</button>"),
          ("x.saved=false;await makeCrops(x);items.push(x);", "x.saved=false;x.sourcePageImage=pageCache[n]?.image||'';await makeCrops(x);items.push(x);")]
          for a,b in reps:
              if a not in s: raise SystemExit('frontend pattern not found: '+a[:70])
              s=s.replace(a,b,1)
          marker="<div class=\"qright\"><div class=\"preview\" style=\"font-size:${x.fontSize||16}px\" onclick=\"openReview(${i})\"><b>Q${esc(x.qNo||i+1)}.</b> <span>${mathHTML(q)}</span><div class=\"opts\">${previewOption(x,'A')}${previewOption(x,'B')}${previewOption(x,'C')}${previewOption(x,'D')}</div>"
          replacement="<div class=\"qright\"><div class=\"assign\"><div class=\"assignTitle\">🔒 ORIGINAL PDF IMAGE — untouched</div><div class=\"small\">The source page is immutable; crops are derived copies.</div></div><div class=\"preview\" style=\"font-size:${x.fontSize||16}px\"><img src=\"${pageCache[x.sourcePage]?.image||x.sourcePageImage||''}\" style=\"width:100%;height:auto;display:block\"><div class=\"actions\"><button class=\"miniBtn primary\" onclick=\"openQuestionCrop(${i})\">✂️ Q</button><button class=\"miniBtn primary\" onclick=\"openSolutionCrop(${i})\">✂️ Solution</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'A')\">A</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'B')\">B</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'C')\">C</button><button class=\"miniBtn\" onclick=\"openOptionCrop(${i},'D')\">D</button></div><div class=\"figure\"><span class=\"muted\">Question crop</span>${x.questionImage?`<img src=\"${x.questionImage}\">`:''}<span class=\"muted\">Solution crop</span>${x.solutionImage?`<img src=\"${x.solutionImage}\">`:''}</div></div></div><div style=\"display:none\">"
          if marker not in s: raise SystemExit('right panel marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check api/gemini-extract.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ai_uploader.html').read_text()
          for x in ['openOptionCrop','openSolutionCrop','sourcePageImage','ORIGINAL PDF IMAGE','Insert Equation']:
            if x not in s: raise SystemExit('Missing frontend check: '+x)
          print('Slicer validation OK')
          PY
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/slicer-hotfix.yml .slicer-hotfix-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/gemini-extract.js ai_uploader.html .github/workflows/slicer-hotfix.yml .slicer-hotfix-trigger
          git commit -m 'fix: preserve math, original PDF image and manual option crops'
          git push