name: Fix question images
on:
  push:
    paths:
      - '.github/workflows/fix-question-images.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI uploader image binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text()
          old="""for(const x of got){x.sourcePage=n;x.qNo=x.qNo||items.length+1;x.topic=x.topic||'General';x.targetPath=x.targetPath&&folders.includes(x.targetPath)?x.targetPath:folders[0];x.languageMode=x.languageMode||'both';x.contentMode=x.contentMode||'both';x.imagePosition=x.imagePosition||'above';x.fontSize=+x.fontSize||16;x.imageWidth=+x.imageWidth||100;x.margin=+x.margin||16;x.saved=false;await makeCrops(x);items.push(x);render();saveProgress()}}catch(e){"""
          new="""for(const x of got){x.sourcePage=n;x.qNo=x.qNo||items.length+1;x.topic=x.topic||'General';x.targetPath=x.targetPath&&folders.includes(x.targetPath)?x.targetPath:folders[0];x.languageMode=x.languageMode||'both';x.contentMode=x.contentMode||'both';x.imagePosition=x.imagePosition||'above';x.fontSize=+x.fontSize||16;x.imageWidth=+x.imageWidth||100;x.margin=+x.margin||16;x.saved=false;await makeCrops(x);x.sourcePage=n;x.sourcePageImage=cur.image;if(!x.questionImage)x.questionImage=cur.image;items.push(x);render();saveProgress()}}catch(e){"""
          if old not in s:
              raise SystemExit('target processPage block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'atozexammocks-alt'
          git config user.email 'atozexammocks@gmail.com'
          git add ai_uploader.html
          git commit -m 'Ensure every extracted question keeps its PDF image' || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-question-images.yml
          git config user.name 'atozexammocks-alt'
          git config user.email 'atozexammocks@gmail.com'
          git add .github/workflows/fix-question-images.yml
          git commit -m 'Remove temporary image fix workflow' || exit 0
          git push
