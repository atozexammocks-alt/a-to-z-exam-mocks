name: Page-wise questions and keep controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI uploader UI only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- A2Z_PAGEWISE_KEEP_CONTROLS -->'
          if marker not in s:
              patch=r'''\n<style id="a2z-pagewise-style">
.a2z-page-nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;padding:9px;background:#07111f;border:1px solid #164e63;border-radius:9px;align-items:center}
.a2z-page-nav b{color:#67e8f9;font-size:11px;margin-right:3px}
.a2z-page-tab{background:#0f172a!important;border:1px solid #334155!important;padding:6px 10px!important}
.a2z-page-tab.active{background:#0284c7!important;border-color:#38bdf8!important}
.a2z-keepbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-4px 0 8px;padding:6px 8px;background:#07111f;border:1px solid #164e63;border-radius:7px}
.a2z-keepbar .a2z-page-label{font-weight:900;color:#67e8f9;margin-right:auto}
.a2z-keepbar button{padding:6px 9px!important}
.a2z-keepbar .a2z-kept{background:#166534!important;border-color:#22c55e!important}
.a2z-page-hidden{display:none!important}
</style>
<script>
/* A2Z_PAGEWISE_KEEP_CONTROLS */
(function(){
  window.__a2zSelectedPage='all';
  function qCards(){return Array.from(document.querySelectorAll('#list .q'));}
  function decorate(){
    const cards=qCards(), pages=[];
    cards.forEach((card,i)=>{
      const x=window.items?.[i];
      if(!x)return;
      const pg=Number(x.sourcePage||x.pageNumber||x.page||x.source_page||1);
      card.dataset.a2zPage=String(pg);
      if(!pages.includes(pg))pages.push(pg);
      let bar=card.querySelector('.a2z-keepbar');
      if(!bar){
        bar=document.createElement('div'); bar.className='a2z-keepbar';
        bar.innerHTML='<span class="a2z-page-label"></span><button type="button" class="a2z-keep-btn"></button><button type="button" class="a2z-unkeep-btn">↩ Unkeep Question</button>';
        card.insertBefore(bar,card.firstChild);
        bar.querySelector('.a2z-keep-btn').onclick=function(){
          x.keepQuestion=true; decorate();
        };
        bar.querySelector('.a2z-unkeep-btn').onclick=function(){
          x.keepQuestion=false; decorate();
        };
      }
      bar.querySelector('.a2z-page-label').textContent='Page '+pg+' · Q'+(i+1);
      const kb=bar.querySelector('.a2z-keep-btn');
      const ub=bar.querySelector('.a2z-unkeep-btn');
      kb.textContent=x.keepQuestion===false?'☑ Keep Question':'✓ Kept';
      kb.classList.toggle('a2z-kept',x.keepQuestion!==false);
      ub.style.display=x.keepQuestion===false?'none':'inline-block';
      card.classList.toggle('a2z-question-unkept',x.keepQuestion===false);
      card.style.opacity=x.keepQuestion===false?'0.55':'';
    });
    pages.sort((a,b)=>a-b);
    let nav=document.getElementById('a2zPageNav');
    if(!nav){
      nav=document.createElement('div');nav.id='a2zPageNav';nav.className='a2z-page-nav';
      const box=list.parentElement; box.insertBefore(nav,list);
    }
    nav.innerHTML='<b>PDF Pages:</b><button type="button" class="a2z-page-tab" data-p="all">All</button>'+pages.map(p=>'<button type="button" class="a2z-page-tab" data-p="'+p+'">Page '+p+'</button>').join('');
    nav.querySelectorAll('.a2z-page-tab').forEach(btn=>{
      btn.classList.toggle('active',String(window.__a2zSelectedPage)===btn.dataset.p);
      btn.onclick=function(){window.__a2zSelectedPage=btn.dataset.p;applyFilter();decorate();};
    });
    applyFilter();
  }
  function applyFilter(){
    qCards().forEach(card=>{
      const show=window.__a2zSelectedPage==='all'||card.dataset.a2zPage===String(window.__a2zSelectedPage);
      card.classList.toggle('a2z-page-hidden',!show);
    });
  }
  const originalRender=window.render;
  if(typeof originalRender==='function'){
    window.render=function(){originalRender();decorate();};
  }
  window.addEventListener('load',()=>setTimeout(decorate,250));
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>') if '</body>' in s else s.replace('</html>',patch+'</html>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html
          git diff --cached --quiet || git commit -m 'Add page-wise question navigation and external keep controls'
          git rm -f .github/workflows/pagewise-keep-controls.yml
          git commit -m 'Remove temporary page-wise UI patch workflow'
          git push
