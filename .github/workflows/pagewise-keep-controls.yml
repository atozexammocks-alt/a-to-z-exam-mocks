name: Page-wise questions and keep controls
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text()
          marker='A2Z_PAGEWISE_KEEP_V1'
          if marker not in s:
              js='''<script>/* A2Z_PAGEWISE_KEEP_V1 */\n(function(){window.__a2zPage="all";function d(){var cs=[...document.querySelectorAll("#list .q")],ps=[];cs.forEach((c,i)=>{var x=window.items&&window.items[i];if(!x)return;var p=Number(x.sourcePage||x.pageNumber||x.page||x.source_page||1);c.dataset.pg=p;if(!ps.includes(p))ps.push(p);var b=c.querySelector(".a2zkeep");if(!b){b=document.createElement("div");b.className="a2zkeep";b.innerHTML="<span>Page "+p+" · Q"+(i+1)+"</span><button>✓ Keep</button><button>↩ Unkeep</button>";c.prepend(b);b.children[1].onclick=()=>{x.keepQuestion=true;d()};b.children[2].onclick=()=>{x.keepQuestion=false;d()}};b.children[0].textContent="Page "+p+" · Q"+(i+1);b.children[1].textContent=x.keepQuestion===false?"☑ Keep":"✓ Kept";b.children[2].style.display=x.keepQuestion===false?"none":"inline-block"});ps.sort((a,b)=>a-b);var n=document.getElementById("a2zpages");if(!n){n=document.createElement("div");n.id="a2zpages";list.parentElement.insertBefore(n,list)}n.innerHTML="<b>PDF Pages:</b> <button data-p=all>All</button> "+ps.map(p=>"<button data-p="+p+">Page "+p+"</button>").join(" ");n.querySelectorAll("button").forEach(b=>b.onclick=()=>{window.__a2zPage=b.dataset.p;d()});cs.forEach(c=>c.style.display=window.__a2zPage==="all"||c.dataset.pg===window.__a2zPage?"":"none")};var r=window.render;if(typeof r==="function")window.render=function(){r();d()};addEventListener("load",()=>setTimeout(d,300))})();</script>'''
              s=s.replace('</body>',js+'</body>')
              p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_uploader.html
          git commit -m 'Add page-wise question navigation and external keep controls'
          git rm .github/workflows/pagewise-keep-controls.yml
          git commit -m 'Remove temporary page-wise UI workflow'
          git push
