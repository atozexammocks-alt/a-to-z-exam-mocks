name: Fix inline editor source page and vector tools
on:
  push:
    paths: ['.github/workflows/fix-inline-editor-source-vectors.yml']
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch inline editor
        run: |
          python - <<'PY'
          p='ai_uploader.html'
          s=open(p,encoding='utf-8').read()
          old="sourcePage=Number(cur.sourcePage||1);M.classList.add('open');loadPdf().then(()=>{PAGE.value=sourcePage;loadPage(sourcePage)})"
          new="sourcePage=Number(cur.sourcePage||cur.pageNumber||cur.page||cur.source_page||1);M.classList.add('open');loadPdf().then(()=>{PAGE.value=sourcePage;loadPage(sourcePage)})"
          if old in s: s=s.replace(old,new)
          old2="function getPageImage(n){try{if(typeof pageCache!=='undefined'&&pageCache[n]?.image)return pageCache[n].image}catch(e){}const p=await loadPdf();if(!p)return '';"
          new2="async function getPageImage(n){try{if(typeof pageCache!=='undefined'&&pageCache[n]?.image)return pageCache[n].image}catch(e){}const p=await loadPdf();if(!p)return '';"
          if old2 in s: s=s.replace(old2,new2)
          old3="<button onclick=\"document.execCommand('insertText',false,'∫')\">∫</button><button onclick=\"document.execCommand('insertText',false,'∑')\">∑</button><button onclick=\"document.execCommand('insertText',false,'√')\">√</button><button onclick=\"document.execCommand('insertText',false,'∇')\">∇</button>"
          new3="<button onclick=\"document.execCommand('insertText',false,'∫')\">∫</button><button onclick=\"document.execCommand('insertText',false,'∑')\">∑</button><button onclick=\"document.execCommand('insertText',false,'√')\">√</button><button onclick=\"document.execCommand('insertText',false,'∇')\">∇</button><button onclick=\"document.execCommand('insertText',false,'î')\">î</button><button onclick=\"document.execCommand('insertText',false,'ĵ')\">ĵ</button><button onclick=\"document.execCommand('insertText',false,'k̂')\">k̂</button><button onclick=\"document.execCommand('insertText',false,'A⃗')\">A⃗</button><button onclick=\"document.execCommand('insertText',false,'B⃗')\">B⃗</button><button onclick=\"document.execCommand('insertText',false,'C⃗')\">C⃗</button>"
          if old3 in s: s=s.replace(old3,new3)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_uploader.html
          git diff --cached --quiet || git commit -m 'Fix inline editor source page and restore vector notation tools'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-inline-editor-source-vectors.yml
          git add .github/workflows/fix-inline-editor-source-vectors.yml
          git commit -m 'Remove temporary inline editor fix workflow' || true
          git push || true
