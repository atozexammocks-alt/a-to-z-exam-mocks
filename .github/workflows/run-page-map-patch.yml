name: Apply page mapping layout patch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_page_map.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai_uploader.html
          git commit -m "Fix page mapping layout and external keep controls" || true
          git rm .github/workflows/run-page-map-patch.yml tools/patch_page_map.py || true
          git commit -m "Remove temporary page mapping patch" || true
          git push
