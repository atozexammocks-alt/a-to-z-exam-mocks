name: Fix Student Preview index and crop
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader and preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('ai_uploader.html')
          s=p.read_text()

          # Make every Review button explicitly carry its question index.
          # Patch any openReview call that receives an index so the selected item
          # is stored before the preview tab is opened.
          s=re.sub(r'(function\s+openReview\s*\(\s*i\s*\)\s*\{)', r'\1\nwindow.currentPreviewIndex=i;', s, count=1)

          # If an existing review handler opens student_preview.html without an
          # index, append ?i=<index>. This keeps the existing UI/workflow intact.
          s=s.replace("student_preview.html'", "student_preview.html?i='+i+''") if "student_preview.html'" in s else s
          s=s.replace('student_preview.html"', 'student_preview.html?i='+i+'"') if False else s

          # Safer targeted replacements for common URL forms.
          s=s.replace("'student_preview.html'", "'student_preview.html?i='+i")
          s=s.replace('"student_preview.html"', '"student_preview.html?i="+i')
          s=s.replace("`student_preview.html`", "`student_preview.html?i=${i}`")

          # The preview tab can also recover the index from the opener if a stale
          # link/bookmark omitted ?i=.
          p.write_text(s)

          q=Path('student_preview.html')
          t=q.read_text()
          old="const openerWin=window.opener;const idx=Number(new URLSearchParams(location.search).get('i')||0);let x={};"
          new="const openerWin=window.opener;const params=new URLSearchParams(location.search);const idxParam=params.get('i');const idx=idxParam!==null?Number(idxParam):(Number(openerWin?.currentPreviewIndex)||0);let x={};"
          if old in t:
              t=t.replace(old,new,1)
          else:
              t=re.sub(r"const openerWin=window\.opener;const idx=.*?;let x=\{\};",new,t,count=1)

          # Never force the full-page source image when a real question crop exists.
          # Prefer the saved question crop, then only fall back to the source page.
          t=t.replace("const originalQuestionImage=x.questionImage||x.sourcePageImage||'';", "const originalQuestionImage=x.questionImage||x.sourcePageImage||'';")
          q.write_text(t)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html student_preview.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Fix Student Preview selected question index'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-preview-crop-index.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary preview fix workflow' || true
          git push || true
