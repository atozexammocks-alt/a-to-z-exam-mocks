name: Finalize AI Smart PDF Uploader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text()
          old="""function rebuildFolders(){folders=[];for(const[m,ss]of Object.entries(folderMap)){for(const s of(ss||[]))folders.push(m+' / '+s)}if(!folders.length)folders=['General / General']}"""
          new="""function rebuildFolders(){folders=[];for(const[m,ss]of Object.entries(folderMap)){for(const s of(ss||[]))folders.push(m+' / '+s)}if(!folders.length){folderMap={General:['General']};folders=['General / General']}}\nfunction ensureFolderPath(path){const p=String(path||'').split(' / ').map(v=>v.trim()).filter(Boolean);const main=p[0]||'General',sub=p.slice(1).join(' / ')||'General';folderMap[main]=folderMap[main]||[];if(!folderMap[main].includes(sub))folderMap[main].push(sub);const full=main+' / '+sub;if(!folders.includes(full))folders.push(full);return full}"""
          s=s.replace(old,new)
          old="""x.targetPath=x.targetPath&&folders.includes(x.targetPath)?x.targetPath:folders[0];x.languageMode=x.languageMode||'both';x.contentMode=x.contentMode||'both';"""
          new="""x.targetPath=ensureFolderPath(x.targetPath||'General / General');x.languageMode=x.languageMode||'both';x.contentMode=x.contentMode||'both';x.keepText=x.keepText!==false;x.keepQuestionImage=x.keepQuestionImage!==false;x.keepOptionImages=x.keepOptionImages!==false;x.keepFigureImage=x.keepFigureImage!==false;x.keepSolutionImage=x.keepSolutionImage!==false;"""
          s=s.replace(old,new)
          s=s.replace("""async function persistFolders(){await setDoc(doc(db,'folder_configs','shared_registry_v4'),{subFolders:folderMap,updatedAt:new Date().toISOString()},{merge:true});rebuildFolders();render()}""","""async function persistFolders(){rebuildFolders();await setDoc(doc(db,'folder_configs','shared_registry_v4'),{subFolders:folderMap,updatedAt:new Date().toISOString()},{merge:true});render()}""")
          s=s.replace("""<div class=\"qright\"><div class=\"protected\">🔒 ORIGINAL PDF PAGE — READ ONLY. This panel is never overwritten by AI text or crop output.</div><div class=\"sourceImage\"><img src=\"${x.sourcePageImage||''}\" alt=\"Original PDF page\"></div><div class=\"actions\"><button class=\"mini primary\" onclick=\"openCropModal(${i},'question')\">✂️ Edit from full page</button><button class=\"mini\" onclick=\"openReview(${i})\">👁 Review</button></div><div class=\"assign\"><div class=\"assignTitle\">Current Question Crop</div>${x.questionImage?`<img class=\"cropPreview\" src=\"${x.questionImage}\">`:'<div class=\"muted\">No crop available.</div>'}</div></div>""","""<div class=\"qright\"><div class=\"protected\">🖼️ QUESTION IMAGE — current extracted crop</div><div class=\"sourceImage\">${x.questionImage?`<img src=\"${x.questionImage}\" alt=\"Question image\">`:'<div class=\"muted\">No question image selected.</div>'}</div><div class=\"actions\"><button class=\"mini primary\" onclick=\"openCropModal(${i},'question')\">✂️ Edit from full page</button><button class=\"mini\" onclick=\"openReview(${i})\">👁 Student Preview</button></div></div>""")
          s=s.replace("""function openCropModal(i,type){reviewIndex=i;const x=items[i],src=x.sourcePageImage||pageCache[x.sourcePage]?.image;if(!src)return alert('Original PDF page is not available.');modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||i+1)+' — Drag Crop: '+type;$('modalBody').innerHTML=`<div class=\"small\" style=\"margin-bottom:7px\">Drag directly on the original PDF page. Select the complete question, A/B/C/D option, figure, or solution. The original page on the right remains untouched.</div><div id=\"cropStage\" class=\"cropStage\"><img id=\"stageImg\" src=\"${src}\"><div id=\"cropRect\" class=\"cropRect\"></div></div><div class=\"actions\"><button class=\"primary\" onclick=\"applyCrop('${type}')\">✅ Use This Crop</button><button onclick=\"openReview(${i})\">↩ Preview</button></div>`;installCrop()}""","""let cropPage=0;\nfunction openCropModal(i,type){reviewIndex=i;cropPage=items[i].sourcePage||1;showCropPage(type)}\nfunction showCropPage(type){const x=items[reviewIndex],src=pageCache[cropPage]?.image||x.sourcePageImage;if(!src)return alert('Original PDF page is not available.');modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||reviewIndex+1)+' — Drag Crop: '+type+' | PDF page '+cropPage;$('modalBody').innerHTML=`<div class=\"small\" style=\"margin-bottom:7px\">Select any area from the original PDF. Use Previous/Next Page when the question continues onto another page.</div><div class=\"actions\"><button onclick=\"setCropPage(-1,'${type}')\">◀ Previous Page</button><button onclick=\"setCropPage(1,'${type}')\">Next Page ▶</button></div><div id=\"cropStage\" class=\"cropStage\"><img id=\"stageImg\" src=\"${src}\"><div id=\"cropRect\" class=\"cropRect\"></div></div><div class=\"actions\"><button class=\"primary\" onclick=\"applyCrop('${type}')\">✅ Use This Crop</button><button onclick=\"openReview(${reviewIndex})\">↩ Preview</button></div>`;installCrop()}\nfunction setCropPage(delta,type){const n=cropPage+delta;if(n<1||!pageCache[n])return;cropPage=n;showCropPage(type)}""")
          s=s.replace("""async function applyCrop(type){const i=reviewIndex,b=items[i]?._manualCrop;if(!b)return alert('पहले PDF page पर crop rectangle drag करो.');const out=await crop(items[i].sourcePageImage,b,10,.8,1500);if(type==='figure')items[i].figureImage=out;else if(type==='solution')items[i].solutionImage=out;else if(type.startsWith('option')){const k=type.slice(-1);items[i].optionImages=items[i].optionImages||{};items[i].optionImages[k]=out}else{items[i].questionImage=out;items[i].cropVerified=true}items[i]._manualCrop=null;render();openReview(i)}""","""async function applyCrop(type){const i=reviewIndex,b=items[i]?._manualCrop;if(!b)return alert('पहले PDF page पर crop rectangle drag करो.');const src=pageCache[cropPage]?.image||items[i].sourcePageImage,out=await crop(src,b,10,.8,1500);if(type==='figure')items[i].figureImage=out;else if(type==='solution')items[i].solutionImage=out;else if(type.startsWith('option')){const k=type.slice(-1);items[i].optionImages=items[i].optionImages||{};items[i].optionImages[k]=out}else if(cropPage!==items[i].sourcePage&&items[i].questionImage){items[i].questionImage=await stitch(items[i].questionImage,out);items[i].continuesToNextPage=true}else{items[i].questionImage=out;items[i].cropVerified=true}items[i]._manualCrop=null;render();openReview(i)}""")
          old="""function openReview(i){reviewIndex=i;const x=items[i];modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||i+1)+' — Scientific / Student Preview';$('modalBody').innerHTML=`<div class=\"editor\"><div><b>Q${esc(x.qNo||i+1)}.</b> ${textMath(x.qText)}</div><div class=\"opts\">${['A','B','C','D'].map(k=>`<div class=\"op\"><b>(${k})</b> ${textMath(optText(x,k))}${x.optionImages?.[k]?`<img src=\"${x.optionImages[k]}\">`:''}</div>`).join('')}</div>${x.figureImage?`<div class=\"figure\"><img src=\"${x.figureImage}\">${x.figureCaption?`<div>${esc(x.figureCaption)}</div>`:''}</div>`:''}${x.questionImage?`<img src=\"${x.questionImage}\" style=\"max-width:${x.imageWidth||100}%\">`:''}</div><div class=\"actions\"><button class=\"yes\" onclick=\"acceptCrop()\">✅ Accept</button><button class=\"primary\" onclick=\"openCropModal(${i},'question')\">↔️ Fix Question Crop</button><button onclick=\"openCropModal(${i},'figure')\">📈 Fix Figure</button></div>`;typeset()}"""
          new="""function openReview(i){reviewIndex=i;const x=items[i];modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||i+1)+' — FULL Student Preview / Editor';$('modalBody').innerHTML=`<div class=\"actions\"><label class=\"btn\">☑ Keep Text<input type=\"checkbox\" ${x.keepText?'checked':''} onchange=\"items[${i}].keepText=this.checked\" hidden></label><label class=\"btn\">☑ Keep Question Image<input type=\"checkbox\" ${x.keepQuestionImage?'checked':''} onchange=\"items[${i}].keepQuestionImage=this.checked\" hidden></label><label class=\"btn\">☑ Keep Option Images<input type=\"checkbox\" ${x.keepOptionImages?'checked':''} onchange=\"items[${i}].keepOptionImages=this.checked\" hidden></label><label class=\"btn\">☑ Keep Figure<input type=\"checkbox\" ${x.keepFigureImage?'checked':''} onchange=\"items[${i}].keepFigureImage=this.checked\" hidden></label><label class=\"btn\">☑ Keep Solution<input type=\"checkbox\" ${x.keepSolutionImage?'checked':''} onchange=\"items[${i}].keepSolutionImage=this.checked\" hidden></label></div><div class=\"small\">Every text block is editable. Drag blocks to reorder; use Cut / Copy / Delete on any block.</div><div id=\"studentCanvas\" class=\"editor\" ondragover=\"event.preventDefault()\" ondrop=\"dropStudent(event,${i})\"><div class=\"previewBlock\" draggable=\"true\" ondragstart=\"dragStudent(event,0)\"><div contenteditable=\"true\" data-field=\"qText\"><b>Q${esc(x.qNo||i+1)}.</b> ${textMath(x.qText)}</div><div class=\"actions\"><button onclick=\"copyStudent(0,${i})\">Copy</button><button onclick=\"cutStudent(0,${i})\">Cut</button><button onclick=\"deleteStudent(0,${i})\">Delete</button></div></div>${['A','B','C','D'].map((k,n)=>`<div class=\"previewBlock\" draggable=\"true\" ondragstart=\"dragStudent(event,${n+1})\"><div contenteditable=\"true\" data-field=\"opt${k}\"><b>(${k})</b> ${textMath(optText(x,k))}</div>${x.keepOptionImages&&x.optionImages?.[k]?`<img src=\"${x.optionImages[k]}\">`:''}<div class=\"actions\"><button onclick=\"copyStudent(${n+1},${i})\">Copy</button><button onclick=\"cutStudent(${n+1},${i})\">Cut</button><button onclick=\"deleteStudent(${n+1},${i})\">Delete</button></div></div>`).join('')}${x.keepFigureImage&&x.figureImage?`<div class=\"previewBlock\" draggable=\"true\" ondragstart=\"dragStudent(event,5)\"><img src=\"${x.figureImage}\"><div contenteditable=\"true\">${esc(x.figureCaption||'')}</div><div class=\"actions\"><button onclick=\"deleteStudent(5,${i})\">Delete</button></div></div>`:''}${x.keepQuestionImage&&x.questionImage?`<div class=\"previewBlock\" draggable=\"true\" ondragstart=\"dragStudent(event,6)\"><img src=\"${x.questionImage}\"><div class=\"actions\"><button onclick=\"openCropModal(${i},'question')\">Edit Image</button><button onclick=\"deleteStudent(6,${i})\">Delete</button></div></div>`:''}</div><div class=\"actions\"><button class=\"save\" onclick=\"syncStudent(${i})\">💾 Apply Preview Changes</button><button class=\"primary\" onclick=\"openCropModal(${i},'question')\">✂️ Full Page / Add Next Page</button><button onclick=\"closeModal()\">Done</button></div>`;typeset()}\nlet dragStudentIndex=-1;function dragStudent(e,n){dragStudentIndex=n;e.dataTransfer.effectAllowed='move'}function dropStudent(e,i){e.preventDefault();const a=[...$('studentCanvas').children],target=e.target.closest('.previewBlock');if(!target||dragStudentIndex<0)return;const node=a[dragStudentIndex];if(node&&node!==target){target.before(node)}dragStudentIndex=-1}function syncStudent(i){const x=items[i],c=$('studentCanvas');if(!c)return;const blocks=[...c.querySelectorAll('.previewBlock')];blocks.forEach(b=>{const q=b.querySelector('[data-field=\\\"qText\\\"]');if(q)x.qText=q.innerText.replace(/^Q\\d+\\.\\s*/,'').trim();['A','B','C','D'].forEach(k=>{const el=b.querySelector('[data-field=\\\"opt'+k+'\\\"]');if(el)x['opt'+k]=el.innerText.replace(/^\\([A-D]\\)\\s*/,'').trim()})});render();openReview(i)}function copyStudent(n,i){const c=$('studentCanvas').children[n];if(c)navigator.clipboard?.writeText(c.innerText||'')}function cutStudent(n,i){copyStudent(n,i);deleteStudent(n,i)}function deleteStudent(n,i){const c=$('studentCanvas');if(c?.children[n]){c.children[n].remove();syncStudent(i)}}"""
          s=s.replace(old,new)
          s=s.replace("""async function payload(i){const x=current(i);return{qNo:+x.qNo||i+1,subject:x.targetPath||folders[0],topic:x.topic||'General',qText:x.qText||'',qTextEnglish:x.qTextEnglish||x.qText||'',qTextHindi:x.qTextHindi||x.qText||'',optText:`(A) ${optText(x,'A')} | (B) ${optText(x,'B')} | (C) ${optText(x,'C')} | (D) ${optText(x,'D')}`,key:x.key||'',question:x.qText||'',solution:'',questionImage:x.questionImage||'',optionImages:x.optionImages||{},solutionImage:x.solutionImage||'',figureImage:x.figureImage||'',figureCaption:x.figureCaption||'',extraText:x.extraText||'',contentMode:x.contentMode||'both',languageMode:x.languageMode||'both',imagePosition:x.imagePosition||'above',layoutMargin:x.margin||16,fontSize:x.fontSize||16,imageWidth:x.imageWidth||100,imageOffsetX:x.imageOffsetX||0,imageOffsetY:x.imageOffsetY||0,flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail,sourcePage:x.sourcePage||null,createdAt:new Date().toISOString(),cropVerified:!!x.cropVerified,continuesToNextPage:!!x.continuesToNextPage,targetPath:x.targetPath||folders[0]}}""","""async function payload(i){const x=current(i);return{qNo:+x.qNo||i+1,subject:x.targetPath||folders[0],topic:x.topic||'General',qText:x.keepText!==false?(x.qText||''):'',qTextEnglish:x.qTextEnglish||x.qText||'',qTextHindi:x.qTextHindi||x.qText||'',optText:x.keepText!==false?`(A) ${optText(x,'A')} | (B) ${optText(x,'B')} | (C) ${optText(x,'C')} | (D) ${optText(x,'D')}`:'',key:x.key||'',question:x.keepText!==false?(x.qText||''):'',solution:'',questionImage:x.keepQuestionImage!==false?(x.questionImage||''):'',optionImages:x.keepOptionImages!==false?(x.optionImages||{}):{},solutionImage:x.keepSolutionImage!==false?(x.solutionImage||''):'',figureImage:x.keepFigureImage!==false?(x.figureImage||''):'',figureCaption:x.keepFigureImage!==false?(x.figureCaption||''):'',extraText:x.extraText||'',contentMode:x.contentMode||'both',languageMode:x.languageMode||'both',imagePosition:x.imagePosition||'above',layoutMargin:x.margin||16,fontSize:x.fontSize||16,imageWidth:x.imageWidth||100,imageOffsetX:x.imageOffsetX||0,imageOffsetY:x.imageOffsetY||0,flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail,sourcePage:x.sourcePage||null,createdAt:new Date().toISOString(),cropVerified:!!x.cropVerified,continuesToNextPage:!!x.continuesToNextPage,targetPath:x.targetPath||folders[0]}}""")
          # make image click/edit experience smoother
          s=s.replace(".cropStage img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}",".cropStage img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.previewBlock{border:1px solid #cbd5e1;padding:8px;margin:7px 0;background:#fff;color:#111;border-radius:6px;cursor:grab}.previewBlock:active{cursor:grabbing}.previewBlock img{max-width:100%;display:block;margin:5px auto}.previewBlock [contenteditable=true]{outline:1px dashed #94a3b8;padding:5px;min-height:24px}")
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html
          git commit -m 'Finalize AI uploader library, media controls and student editor' || exit 0
          git push
      - name: Remove patch workflow
        run: |
          git rm .github/workflows/finalize-ai-uploader.yml
          git commit -m 'Remove one-time uploader patch workflow'
          git push