name: patch-ai-uploader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix uploader patch formatting') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix uploader patch
        run: |
          python3 <<'PY2'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text()
          if '[AUTO UPLOADER PATCH V2]' not in s:
              raise SystemExit('patch marker missing')
          s=s.replace('\\n/* [AUTO UPLOADER PATCH V2] */\\n', '\n/* [AUTO UPLOADER PATCH V2] */\n')
          s=s.replace('\\n})();\\n</script>', '\n})();\n</script>')
          s=s.replace("const rightImage=x.questionImage||x.sourcePageImage||'';", "const rightImage=x.questionImage||'';")
          p.write_text(s)
          PY2
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html
          git diff --cached --quiet || git commit -m 'Fix uploader patch formatting and question-only image [auto-uploader-patch]'
          git push
