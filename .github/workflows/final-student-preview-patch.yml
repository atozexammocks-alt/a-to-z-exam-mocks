name: Final Student Preview Patch
on:
  push:
    paths:
      - .github/workflows/final-student-preview-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('ai_uploader.html');s=p.read_text()
          fn=base64.b64decode('')
          s=s.replace('loadFolders();',fn.decode()+'\nloadFolders();')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html
          git commit -m "Open Student Preview in separate two-pane editor and sync language"
          git push
      - name: Remove temporary workflows
        if: success()
        run: |
          rm -f .github/workflows/final-student-preview-patch.yml .github/workflows/patch-student-preview-final.yml .github/workflows/fix-student-preview-2.yml
          git add .github/workflows
          git commit -m "Remove temporary Student Preview workflows" || true
          git push || true
