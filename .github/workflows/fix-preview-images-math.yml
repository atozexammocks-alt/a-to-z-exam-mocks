name: Fix Student Preview source page image and math
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader and preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('ai_uploader.html'); s=p.read_text()
          s=s.replace("for(const x of got){x.sourcePage=n;x.qNo=x.qNo||items.length+1;", "for(const x of got){x.sourcePage=n;x.sourcePageImage=cur.image;x.qNo=x.qNo||items.length+1;", 1)
          s=s.replace("await makeCrops(x);items.push(x);", "await makeCrops(x);x.sourcePageImage=cur.image;if(!x.questionImage)x.questionImage=cur.image;items.push(x);", 1)
          s=re.sub(r"window\.openReview=function\(i\)\{.*?\};", "window.openReview=function(i){const x=items[i]||{};window.currentPreviewIndex=i;sessionStorage.setItem('A2Z_STUDENT_PREVIEW',JSON.stringify({i,data:x}));const w=window.open('student_preview.html?i='+encodeURIComponent(i),'_blank');if(!w)alert('Please allow pop-ups for this site.');};", s, count=1, flags=re.S)
          p.write_text(s)

          p=Path('student_preview.html'); s=p.read_text()
          s=s.replace("const idxParam=params.get('i');const idx=idxParam!==null?Number(idxParam):(Number(openerWin?.currentPreviewIndex)||0);let x={};", "const idxParam=params.get('i');let storedPreview=null;try{storedPreview=JSON.parse(sessionStorage.getItem('A2Z_STUDENT_PREVIEW')||'null')}catch(e){}const idx=idxParam!==null?Number(idxParam):(Number(storedPreview?.i)||Number(openerWin?.currentPreviewIndex)||0);let x={};", 1)
          s=s.replace("const originalQuestionImage=x.questionImage||x.sourcePageImage||'';let originalOptionImages=", "const originalQuestionImage=x.questionImage||'';const sourcePageImage=x.sourcePageImage||'';let originalOptionImages=", 1)
          s=s.replace("pageCache[cropPage]?.image||x.sourcePageImage", "pageCache[cropPage]?.image||(cropPage===x.sourcePage?x.sourcePageImage:'')", 1)
          p.write_text(s)
          PY
      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_uploader.html student_preview.html
          if ! git diff --cached --quiet; then git commit -m "Fix Student Preview question image source and index"; git push; fi
          git rm .github/workflows/fix-preview-images-math.yml
          git commit -m "Remove temporary preview fix workflow"
          git push
