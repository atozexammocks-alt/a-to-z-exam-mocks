name: Integrate Case 3 Student Preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'student_preview.html'
      - '.github/workflows/integrate-case3-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate Case 3 launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text(encoding='utf-8')
          old="window.openReview=function(i){const x=items[i]||{};window.currentPreviewIndex=i;sessionStorage.setItem('A2Z_STUDENT_PREVIEW',JSON.stringify({i,data:x}));const w=window.open('student_preview.html?i='+encodeURIComponent(i),'_blank');if(!w)alert('Please allow pop-ups for this site.');};"
          new="window.openReview=function(i){const x=items[i]||{};window.currentPreviewIndex=i;sessionStorage.setItem('A2Z_STUDENT_PREVIEW',JSON.stringify({i,data:x}));const u='student_preview.html?mode=case3&i='+encodeURIComponent(i)+'&v=27d2845117a11519895b9825d4911ad362cac971';const w=window.open(u,'_blank','noopener,noreferrer');if(!w)alert('Please allow pop-ups for this site.');};"
          if old not in s:
              raise SystemExit('launcher pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html .github/workflows/integrate-case3-preview.yml
          git commit -m 'Integrate Case 3 Student Preview launcher with cache-busting' || exit 0
          git push
          git rm .github/workflows/integrate-case3-preview.yml
          git commit -m 'Remove temporary Case 3 integration workflow'
          git push
