name: Patch Student Preview Final
on:
  push:
    paths:
      - .github/workflows/patch-student-preview-final.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html')
          s=p.read_text()
          start=s.index('function openReview(i){')
          end=s.index('let cropPage=0;', start)
          new=r'''function openReview(i){
            const x=items[i]||{};
            const w=window.open('', '_blank');
            if(!w){alert('Please allow pop-ups for this site.');return}
            const data={i,qNo:x.qNo||i+1,qText:x.qText||'',qTextEnglish:x.qTextEnglish||x.qText||'',qTextHindi:x.qTextHindi||x.qText||'',languageMode:x.languageMode||'both',opts:{A:optText(x,'A'),B:optText(x,'B'),C:optText(x,'C'),D:optText(x,'D')},optionImages:x.optionImages||{},questionImage:x.questionImage||x.sourcePageImage||'',figureImage:x.figureImage||'',solutionImage:x.solutionImage||'',figureCaption:x.figureCaption||'',keepText:x.keepText!==false,keepQuestionImage:x.keepQuestionImage!==false,keepOptionImages:x.keepOptionImages!==false,keepFigureImage:x.keepFigureImage!==false,keepSolutionImage:x.keepSolutionImage!==false};
            const js=JSON.stringify(data).replace(/</g,'\\u003c');
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Preview — Q${esc(x.qNo||i+1)}</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e5e7eb;font:14px system-ui;height:100vh;overflow:hidden}.top{height:54px;background:#111827;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.title{font-weight:900;color:#38bdf8}.bar,.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{background:#1e293b;color:#fff;border:1px solid #475569;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:800}.primary{background:#0284c7;border-color:#38bdf8}.danger{background:#7f1d1d;border-color:#ef4444}.layout{height:calc(100vh - 54px);display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,1fr);min-width:900px}.left,.right{overflow:auto;padding:14px}.left{border-right:1px solid #334155;background:#0b1120}.right{background:#111827}.section{background:#f8fafc;color:#111827;border:1px solid #cbd5e1;border-radius:9px;padding:10px;margin-bottom:10px}.section h3,.imgbox h3{margin:0 0 7px;font-size:12px;color:#0369a1}.textbox{border:1px dashed #94a3b8;border-radius:7px;padding:9px;min-height:42px;white-space:pre-wrap;outline:none}.imgbox{background:#fff;border-radius:9px;padding:9px;margin-bottom:10px;border:1px solid #334155}.imgbox h3{color:#0f172a}.imgbox img{max-width:100%;height:auto;display:block;margin:auto}.keep{font-size:11px;font-weight:800;color:#cbd5e1}.empty{padding:20px;text-align:center;color:#64748b;background:#f8fafc;border-radius:8px}.hint{font-size:11px;color:#94a3b8;margin:6px 0 12px}.lang{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:6px;padding:6px}@media(max-width:900px){body{overflow:auto}.layout{height:auto;min-width:0;grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid #334155}.right{min-height:70vh}}</style></head><body><div class="top"><div class="title">👁 Student Preview — Q${esc(x.qNo||i+1)}</div><div class="bar"><select id="lang" class="lang"><option value="both">Hindi + English</option><option value="hi">Hindi</option><option value="en">English</option></select><button class="btn primary" id="apply">💾 Apply to Uploader</button><button class="btn" onclick="window.close()">✕ Close</button></div></div><div class="layout"><section class="left"><div class="hint">LEFT = final student text. Each block is independent: edit, cut, copy, delete, or keep/remove.</div><div id="textArea"></div></section><section class="right"><div class="hint">RIGHT = complete question/options images. Keep/remove each image separately; crop from full page or next page.</div><div id="imageArea"></div></section></div><script>const D=${js};let blocks=[];function esc2(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m))}function textFor(){const m=document.getElementById('lang').value;return m==='hi'?(D.qTextHindi||D.qText||''):m==='en'?(D.qTextEnglish||D.qText||''):(D.qText||'')}function makeText(){blocks=[{label:'Question',text:textFor(),keep:D.keepText,type:'q'}];for(const k of ['A','B','C','D'])blocks.push({label:'Option '+k,text:D.opts[k]||'',keep:D.keepText,type:'opt',key:k});renderText()}function renderText(){const root=document.getElementById('textArea');root.innerHTML='';blocks.forEach(b=>{const s=document.createElement('div');s.className='section';s.innerHTML='<h3>'+esc2(b.label)+'</h3><label class="keep"><input type="checkbox" '+(b.keep?'checked':'')+'> Keep text</label><div class="textbox" contenteditable="true">'+esc2(b.text)+'</div><div class="controls"><button class="btn">Copy</button><button class="btn">Cut</button><button class="btn danger">Delete</button></div>';const cb=s.querySelector('input');cb.onchange=()=>b.keep=cb.checked;const ed=s.querySelector('.textbox');ed.oninput=()=>b.text=ed.innerText;const bs=s.querySelectorAll('button');bs[0].onclick=()=>navigator.clipboard?.writeText(ed.innerText||'');bs[1].onclick=()=>{navigator.clipboard?.writeText(ed.innerText||'');b.text='';ed.innerText=''};bs[2].onclick=()=>{b.keep=false;cb.checked=false;s.style.opacity='.45'};root.appendChild(s)})}function imgBlock(label,src,keep,kind){const s=document.createElement('div');s.className='imgbox';s.innerHTML='<h3>'+esc2(label)+'</h3>'+(src?'<img src="'+src+'">':'<div class="empty">No image available</div>')+'<div class="controls"><label class="keep"><input type="checkbox" '+(keep?'checked':'')+'> Keep image</label><button class="btn primary">✂️ Full Page Crop</button><button class="btn">✚ Next Page</button></div>';const cb=s.querySelector('input');cb.onchange=()=>{if(kind==='question')D.keepQuestionImage=cb.checked;if(kind==='option')D.keepOptionImages=cb.checked;if(kind==='figure')D.keepFigureImage=cb.checked;if(kind==='solution')D.keepSolutionImage=cb.checked};const bs=s.querySelectorAll('button');bs[0].onclick=()=>window.opener?.openCropModal(D.i,kind==='option'?'option'+label.slice(-1):kind);bs[1].onclick=()=>window.opener?.openCropModal(D.i,kind==='question'?'question':kind);document.getElementById('imageArea').appendChild(s)}function renderImages(){const root=document.getElementById('imageArea');root.innerHTML='';imgBlock('Complete Question Image',D.questionImage,D.keepQuestionImage,'question');for(const k of ['A','B','C','D'])imgBlock('Option '+k+' Image',D.optionImages[k],D.keepOptionImages,'option');if(D.figureImage)imgBlock('Figure / Diagram',D.figureImage,D.keepFigureImage,'figure');if(D.solutionImage)imgBlock('Solution Image',D.solutionImage,D.keepSolutionImage,'solution')}document.getElementById('lang').value=D.languageMode;document.getElementById('lang').onchange=()=>{D.languageMode=document.getElementById('lang').value;blocks[0].text=textFor();renderText()};document.getElementById('apply').onclick=()=>{if(!window.opener||window.opener.closed){alert('Uploader tab is not available.');return}const q=blocks.find(b=>b.type==='q');window.opener.items[D.i].qText=q?.text||'';window.opener.items[D.i].keepText=!!q?.keep;for(const b of blocks.filter(b=>b.type==='opt'))window.opener.items[D.i]['opt'+b.key]=b.text;window.opener.items[D.i].languageMode=D.languageMode;window.opener.items[D.i].keepQuestionImage=!!D.keepQuestionImage;window.opener.items[D.i].keepOptionImages=!!D.keepOptionImages;window.opener.items[D.i].keepFigureImage=!!D.keepFigureImage;window.opener.items[D.i].keepSolutionImage=!!D.keepSolutionImage;window.opener.render();alert('Applied to uploader.')};makeText();renderImages();<\/script></body></html>`);w.document.close()}
          let cropPage=0;
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html
          git commit -m "Fix full-screen two-pane student preview editor"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/patch-student-preview-final.yml
          git add .github/workflows/patch-student-preview-final.yml
          git commit -m "Remove temporary student preview patch workflow" || true
          git push || true
