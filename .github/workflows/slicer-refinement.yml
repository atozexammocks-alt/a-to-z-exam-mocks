name: Slicer refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Slicer UI and OCR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai_uploader.html'); s=p.read_text()
          old="window.MathJax={tex:{inlineMath:[['\\\\(','\\\\)']],displayMath:[['\\\\[','\\\\]']]},svg:{fontCache:'global'}}"
          new="window.MathJax={tex:{inlineMath:[['\\\\(','\\\\)'],['$','$']],displayMath:[['\\\\[','\\\\]'],['$$','$$']]},svg:{fontCache:'global'}}"
          if old not in s: raise SystemExit('MathJax config not found')
          s=s.replace(old,new,1)
          old="function typeset(){if(window.MathJax?.typesetPromise)requestAnimationFrame(()=>MathJax.typesetPromise().catch(()=>{}))}"
          new="function typeset(){if(window.MathJax?.typesetPromise)requestAnimationFrame(()=>MathJax.typesetPromise().catch(()=>{}))}function bindEditorInputs(){items.forEach((x,i)=>{[['q'+i,'qText'],['a'+i,'optA'],['b'+i,'optB'],['c'+i,'optC'],['d'+i,'optD']].forEach(([id,key])=>{const el=document.getElementById(id);if(el&&!el._bound){el._bound=true;el.addEventListener('input',()=>{x[key]=el.value;});}});});}"
          if old not in s: raise SystemExit('typeset function not found')
          s=s.replace(old,new,1)
          marker="<div class=\\\"qright\\\"><div class=\\\"assign\\\"><div class=\\\"assignTitle\\\">🔒 ORIGINAL PDF IMAGE — untouched</div>"
          a=s.find(marker)
          if a<0: raise SystemExit('qright start not found')
          b=s.find('<div style=\\\"display:none\\\">',a)
          if b<0: raise SystemExit('qright end not found')
          newright="<div class=\\\"qright\\\"><div class=\\\"assign\\\"><div class=\\\"assignTitle\\\">🖼️ QUESTION IMAGE — editable crop</div><div class=\\\"small\\\">Right side shows this question's crop only. The PDF source stays untouched.</div></div><div class=\\\"preview\\\" style=\\\"font-size:${x.fontSize||16}px\\\">${x.questionImage?`<img src=\\\"${x.questionImage}\\\" style=\\\"width:100%;height:auto;display:block\\\">`:`<div class=\\\"reviewText\\\">No question crop yet. Use Edit from full page.</div>`}<div class=\\\"actions\\\"><button class=\\\"miniBtn primary\\\" onclick=\\\"openQuestionCrop(${i})\\\">✏️ Edit from full page</button><button class=\\\"miniBtn\\\" onclick=\\\"openSolutionCrop(${i})\\\">✂️ Solution</button><button class=\\\"miniBtn\\\" onclick=\\\"openOptionCrop(${i},'A')\\\">A image</button><button class=\\\"miniBtn\\\" onclick=\\\"openOptionCrop(${i},'B')\\\">B image</button><button class=\\\"miniBtn\\\" onclick=\\\"openOptionCrop(${i},'C')\\\">C image</button><button class=\\\"miniBtn\\\" onclick=\\\"openOptionCrop(${i},'D')\\\">D image</button></div></div></div>"
          s=s[:a]+newright+s[b:]
          old="${mathFieldButton(i,'q'+i)}</div><div class=\\\"mathHint\\\">Detected LaTeX"
          new="${mathFieldButton(i,'q'+i)}<button class=\\\"miniBtn\\\" type=\\\"button\\\" onclick=\\\"openQuestionCrop(${i})\\\">🖼️ Image</button></div><div class=\\\"mathHint\\\">Detected LaTeX"
          if old not in s: raise SystemExit('question image button anchor not found')
          s=s.replace(old,new,1)
          old="${mathFieldButton(i,k.toLowerCase()+i)}</div>`).join('')}"
          new="${mathFieldButton(i,k.toLowerCase()+i)}<button class=\\\"miniBtn\\\" type=\\\"button\\\" onclick=\\\"openOptionCrop(${i},'${k}')\\\">🖼️</button></div>`).join('')}"
          if old not in s: raise SystemExit('option image button anchor not found')
          s=s.replace(old,new,1)
          old="}).join('');typeset()}function clearFigure"
          if old not in s: raise SystemExit('render ending not found')
          s=s.replace(old,"}).join('');bindEditorInputs();typeset()}function clearFigure",1)
          p.write_text(s)

          p=Path('api/gemini-extract.js'); s=p.read_text()
          old="Return qText, qTextEnglish and qTextHindi with LaTeX preserved. qText should prefer the source's original language/bilingual form. Also return normalized questionBox and solutionBox 0-1000."
          new="Return qText, qTextEnglish and qTextHindi with LaTeX preserved. qText should prefer the source's original language/bilingual form. NEVER output Python, JavaScript, Markdown code fences, OCR program text, or extraction explanations; output only question content. If a mathematical symbol is visible, transcribe it as LaTeX rather than a programming expression or English word. Preserve line breaks between separate printed lines. Also return normalized questionBox and solutionBox 0-1000."
          if old not in s: raise SystemExit('backend prompt marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: |
          node --check api/gemini-extract.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ai_uploader.html').read_text()
          for x in ['QUESTION IMAGE — editable crop','Edit from full page','bindEditorInputs','🖼️ Image','openOptionCrop']:
              if x not in s: raise SystemExit('Missing check: '+x)
          print('Slicer refinement validation OK')
          PY
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/slicer-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html api/gemini-extract.js .github/workflows/slicer-refinement.yml
          git commit -m 'fix: question crop panel, inline images, line breaks and math OCR'
          git push
