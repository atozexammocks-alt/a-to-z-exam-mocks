name: Apply AI uploader v3 patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-uploader-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader without changing Gemini prompt/payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('ai_uploader.html')
          s=p.read_text(encoding='utf-8')

          # Strong page/source alignment. This replaces only the frontend processPage function.
          align = r'''function normWords(s){
            return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').split(/\s+/).filter(w=>w.length>1)
          }
          function pageScore(qtext,pagetext){
            const q=normWords(qtext).slice(0,32), p=new Set(normWords(pagetext));
            if(q.length<4)return 0;
            let hit=0; for(const w of q)if(p.has(w))hit++;
            return hit/q.length
          }
          async function processPage(pdf,n,total){
            if(stopRequested)return;
            try{
              const cur=await renderPage(pdf,n), next=n<total?await renderPage(pdf,n+1):null;
              const got=await extractWithRetry({pageNumber:n,nextPageNumber:n<total?n+1:null,pageText:cur.text,imageDataUrl:cur.image,nextPageText:next?.text||'',nextImageDataUrl:next?.image||'',folders:folders.join(', ')});
              for(const x of got){
                let source=n;
                const cs=pageScore(x.qText,cur.text), ns=next?pageScore(x.qText,next.text):0;
                if(n<total && ns>Math.max(.32,cs+.10))source=n+1;
                x.sourcePage=source;
                x.targetPath=ensureFolderPath(x.targetPath||'');
                x.contentMode=x.contentMode||'both';
                x.imagePosition=x.imagePosition||'above';
                x.margin=Number.isFinite(+x.margin)?+x.margin:16;
                x.extraText=x.extraText||''; x.figureImage=x.figureImage||''; x.figureCaption=x.figureCaption||'';
                x.keepText=x.keepText!==false; x.keepQuestionImage=x.keepQuestionImage!==false;
                x.keepOptionImages=x.keepOptionImages!==false; x.keepFigureImage=x.keepFigureImage!==false; x.keepSolutionImage=x.keepSolutionImage!==false;
                x.saved=false;
                await makeCrops(x);
                if(source!==n){
                  const matched=pageCache[source]?.image;
                  if(matched && x.questionBox?.w>0 && x.questionBox?.h>0){
                    x.sourcePageImage=matched;
                    x.questionImage=await crop(matched,x.questionBox,10,.76,1500);
                    if(x.continuesToNextPage&&x.nextPageBox&&pageCache[source+1]?.image)
                      x.questionImage=await stitch(x.questionImage,await crop(pageCache[source+1].image,x.nextPageBox,10,.76,1500));
                  }
                }
                if(!(x.questionImage||x.qText||optText(x,'A')||optText(x,'B')||optText(x,'C')||optText(x,'D')))continue;
                items.push(x); render(); saveProgress();
              }
              await persistFolders();
            }catch(err){console.error('page',n,err);status.textContent=`⚠️ Page ${n}: ${err.message}`}
            finally{window._pagesDone=(window._pagesDone||0)+1;setProgress(window._pagesDone,total)}
          }'''
          # Replace the original function, whichever of the previous two versions is present.
          s2=re.sub(r'async function processPage\(pdf,n,total\)\{.*?\n?\}\n?async function runParallel', align+'\nasync function runParallel', s, count=1, flags=re.S)
          if s2==s:
              s2=re.sub(r'async function processPage\(pdf,n,total\)\{.*?\}\}async function runParallel', align+'}\nasync function runParallel', s, count=1, flags=re.S)
          s=s2

          # Remove whole-page fallback after crop failure.
          s=s.replace("if(!x.questionImage)x.questionImage=cur;", "if(!x.questionImage && !(x.questionBox&&Number(x.questionBox.w)>0&&Number(x.questionBox.h)>0))x.questionImage='';")

          # Replace the old V2 patch with a harmless marker; V3 below owns the UI.
          s=re.sub(r'<script>\s*/\* \[AUTO UPLOADER PATCH V2\] \*/.*?</script>\s*</body>', '</body>', s, count=1, flags=re.S)

          v3=r'''<style id="A2Z_UPLOADER_V3">
          .a2zKeepBar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px;border:1px solid #164e63;border-radius:8px;background:#07111f}
          .a2zKeepBar .leftKeep{margin-right:auto}.a2zKeepBar button{min-width:118px}
          .a2zKeepText{background:#166534!important;border-color:#22c55e!important}.a2zKeepOff{background:#7f1d1d!important;border-color:#ef4444!important}
          .a2zCropInsert{background:#7c3aed!important;border-color:#a78bfa!important}
          .a2zFolderTools{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
          .a2zFolderTools button{font-size:10px;padding:6px 8px}
          .a2zFolderManager{border:1px solid #334155;border-radius:8px;padding:9px;background:#07111f;margin-top:8px;display:none}
          .a2zFolderManager.open{display:block}.a2zFolderRow{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding:5px 0}.a2zFolderRow:last-child{border-bottom:0}
          .a2zFolderName{font-size:11px}.a2zDeleteFolder{background:#7f1d1d!important;border-color:#ef4444!important}
          .qleft .a2zCropInsert{margin-left:4px}
          </style>
          <script>
          (function(){
            const DEFAULT={keepText:true,keepQuestionImage:true,keepOptionImages:true,keepFigureImage:true,keepSolutionImage:true};
            function initKeep(x){Object.keys(DEFAULT).forEach(k=>{if(x[k]===undefined)x[k]=DEFAULT[k]});return x}
            function safePath(x){
              const p=String(x||'').split(' / ').map(v=>v.trim()).filter(Boolean);
              const main=p[0]||'General', sub=p.slice(1).join(' / ')||'General';
              folderMap[main]=folderMap[main]||[]; if(!folderMap[main].includes(sub))folderMap[main].push(sub);
              return main+' / '+sub;
            }
            window.a2zKeep=function(i,kind){
              const x=items[i]; if(!x)return; initKeep(x);
              if(kind==='text')x.keepText=!x.keepText;
              if(kind==='image')x.keepQuestionImage=!x.keepQuestionImage;
              if(!x.keepText&&!x.keepQuestionImage){if(confirm('Keep Text और Keep Image दोनों OFF हैं. इस question को discard करें?')){items.splice(i,1);render();saveProgress();return} x.keepText=true}
              render();
            };
            window.a2zEditFull=function(i){
              if(typeof window.openReview==='function')window.openReview(i);
            };
            window.a2zCropInsert=function(i){
              if(typeof window.openReview!=='function')return;
              window.openReview(i);
              setTimeout(function(){
                const b=document.getElementById('a2zCase3'); if(b)b.click();
                setTimeout(function(){const ed=document.getElementById('a2zIEEditor'); if(ed){ed.focus(); const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}},80);
              },100);
            };
            window.a2zManageFolders=function(){
              let box=document.getElementById('a2zFolderManager');
              if(!box){box=document.createElement('div');box.id='a2zFolderManager';box.className='a2zFolderManager';const host=document.querySelector('.box');(host||document.body).appendChild(box)}
              box.classList.toggle('open'); if(box.classList.contains('open'))a2zRenderFolders(box);
            };
            function a2zRenderFolders(box){
              box.innerHTML='<b>📚 Library folders — full uploader access</b><div class="small" style="margin-top:4px">AI may create a new path when no matching folder exists. You can rename placement by selecting another folder, add folders, or delete folders here.</div>'+
                Object.entries(folderMap).map(([m,ss])=>'<div class="a2zFolderRow"><span class="a2zFolderName"><b>'+esc(m)+'</b></span><button class="a2zDeleteFolder mini" onclick="a2zDeleteMain('+JSON.stringify(m)+')">Delete Main</button></div>'+
                (ss||[]).map(sub=>'<div class="a2zFolderRow" style="padding-left:20px"><span class="a2zFolderName">↳ '+esc(sub)+'</span><button class="a2zDeleteFolder mini" onclick="a2zDeleteSub('+JSON.stringify(m)+','+JSON.stringify(sub)+')">Delete</button></div>').join('')).join('')+
                '<div class="a2zFolderTools"><button onclick="addMainPrompt()">➕ Main Folder</button><button onclick="addSubPrompt()">➕ Sub-Folder</button></div>';
            }
            window.a2zDeleteMain=async function(m){if(m==='General')return alert('General cannot be deleted.');if(!confirm('Delete main folder '+m+' and its sub-folders?'))return;delete folderMap[m];await persistFolders();const box=document.getElementById('a2zFolderManager');if(box)a2zRenderFolders(box)};
            window.a2zDeleteSub=async function(m,s){if(!confirm('Delete '+m+' / '+s+' ?'))return;folderMap[m]=(folderMap[m]||[]).filter(v=>v!==s);if(!folderMap[m].length)folderMap[m]=['General'];await persistFolders();const box=document.getElementById('a2zFolderManager');if(box)a2zRenderFolders(box)};
            window.addMainPrompt=function(){const n=prompt('Main folder name:');if(!n?.trim())return;folderMap[n.trim()]=folderMap[n.trim()]||['General'];persistFolders()};
            window.addSubPrompt=function(){const m=prompt('Main folder name:');if(!m?.trim())return;const s=prompt('Sub-folder name:');if(!s?.trim())return;folderMap[m.trim()]=folderMap[m.trim()]||[];if(!folderMap[m.trim()].includes(s.trim()))folderMap[m.trim()].push(s.trim());persistFolders()};

            const originalRender=render;
            render=function(){
              items.forEach(initKeep);
              originalRender();
              document.querySelectorAll('#list .q').forEach((card,i)=>{
                const x=items[i]; if(!x)return;
                const left=card.querySelector('.qleft'), right=card.querySelector('.qright');
                if(left && !left.querySelector('.a2zKeepBar')){
                  const textBar=document.createElement('div');textBar.className='a2zKeepBar';textBar.innerHTML='<span class="small leftKeep">TEXT</span><button class="mini a2zKeepText '+(x.keepText?'':'a2zKeepOff')+'" onclick="a2zKeep('+i+',\'text\')">'+(x.keepText?'✅ Keep Text':'❌ Keep Text')+'</button><button class="mini a2zCropInsert" onclick="a2zCropInsert('+i+')">✂️ Crop & Insert</button>';
                  const qbox=left.querySelector('.assignTitle')?.parentElement?.parentElement||left.lastElementChild;textBar.style.marginBottom='8px';left.insertBefore(textBar,qbox||left.firstChild);
                }
                if(right && !right.querySelector('.a2zKeepBar')){
                  const bar=document.createElement('div');bar.className='a2zKeepBar';bar.innerHTML='<span class="small leftKeep">IMAGE</span><button class="mini a2zKeepText '+(x.keepQuestionImage?'':'a2zKeepOff')+'" onclick="a2zKeep('+i+',\'image\')">'+(x.keepQuestionImage?'✅ Keep Image':'❌ Keep Image')+'</button><button class="mini" onclick="a2zEditFull('+i+')">✏️ Edit from Full Page</button>';right.appendChild(bar);
                }
                const title=left?.querySelector('.assignTitle');
                if(title && !left.querySelector('.a2zFolderTools')){
                  const tools=document.createElement('div');tools.className='a2zFolderTools';tools.innerHTML='<button onclick="a2zManageFolders()">📚 Manage Library Folders</button><button onclick="addMainPrompt()">➕ New Main</button><button onclick="addSubPrompt()">➕ New Sub</button>';title.parentElement.appendChild(tools);
                }
              });
              if(window.MathJax?.typesetPromise)setTimeout(()=>MathJax.typesetPromise().catch(()=>{}),40);
            };
            const oldOpen=window.openReview;
            window.openReview=function(i){if(oldOpen)oldOpen(i);setTimeout(()=>{const e=document.getElementById('a2zCase3');if(e&&items[i]?.previewCase===3)e.click()},30)};
          })();
          </script>
          </body>'''
          # Insert V3 just before closing body.
          s=s.replace('</body>',v3,1)
          p.write_text(s,encoding='utf-8')

          # Backend: preserve vector notation in cleanText ONLY; Gemini prompt and request payload are untouched.
          bp=Path('api/gemini-extract.js')
          b=bp.read_text(encoding='utf-8')
          old="function latex(s){let x=String(s||'');x=x.replace(/\\\\(?:left|right)\\b/g,'')"
          new="function latex(s){let x=String(s||'');x=x.replace(/\\\\overrightarrow\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'⃗').replace(/\\\\vec\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'⃗').replace(/\\\\hat\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'̂').replace(/\\\\bar\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'̄').replace(/\\\\mathbf\\s*\\{([^{}]*)\\}/g,'$1').replace(/\\\\(?:left|right)\\b/g,'')"
          if old not in b: raise SystemExit('backend anchor not found; refusing to modify backend')
          b=b.replace(old,new,1)
          bp.write_text(b,encoding='utf-8')
          print('patched')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html api/gemini-extract.js
          git commit -m 'fix: uploader keep controls folders crop insertion and math vectors' || true
          git push
          git rm .github/workflows/apply-uploader-v3.yml
          git commit -m 'chore: remove one-time uploader patch workflow' || true
          git push