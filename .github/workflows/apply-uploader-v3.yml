name: Apply AI uploader v3 patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-uploader-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch uploader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('ai_uploader.html')
          s=p.read_text(encoding='utf-8')

          # Frontend page/source synchronization; Gemini prompt/payload is untouched.
          start=s.index('async function processPage')
          end=s.index('async function runParallel', start)
          align=r'''function normWords(s){return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').split(/\s+/).filter(w=>w.length>1)}
          function pageScore(qtext,pagetext){const q=normWords(qtext).slice(0,32),p=new Set(normWords(pagetext));if(q.length<4)return 0;let hit=0;for(const w of q)if(p.has(w))hit++;return hit/q.length}
          async function processPage(pdf,n,total){
            if(stopRequested)return;
            try{
              const cur=await renderPage(pdf,n),next=n<total?await renderPage(pdf,n+1):null;
              const got=await extractWithRetry({pageNumber:n,nextPageNumber:n<total?n+1:null,pageText:cur.text,imageDataUrl:cur.image,nextPageText:next?.text||'',nextImageDataUrl:next?.image||'',folders:folders.join(', ')});
              for(const x of got){
                let source=n,cs=pageScore(x.qText,cur.text),ns=next?pageScore(x.qText,next.text):0;
                if(n<total&&ns>Math.max(.32,cs+.10))source=n+1;
                x.sourcePage=source;
                x.targetPath=ensureFolderPath(x.targetPath||'');
                x.contentMode=x.contentMode||'both';x.imagePosition=x.imagePosition||'above';x.margin=Number.isFinite(+x.margin)?+x.margin:16;
                x.extraText=x.extraText||'';x.figureImage=x.figureImage||'';x.figureCaption=x.figureCaption||'';
                x.keepText=x.keepText!==false;x.keepQuestionImage=x.keepQuestionImage!==false;x.keepOptionImages=x.keepOptionImages!==false;x.keepFigureImage=x.keepFigureImage!==false;x.keepSolutionImage=x.keepSolutionImage!==false;x.saved=false;
                await makeCrops(x);
                if(source!==n){const matched=pageCache[source]?.image;if(matched&&x.questionBox?.w>0&&x.questionBox?.h>0){x.sourcePageImage=matched;x.questionImage=await crop(matched,x.questionBox,10,.76,1500);if(x.continuesToNextPage&&x.nextPageBox&&pageCache[source+1]?.image)x.questionImage=await stitch(x.questionImage,await crop(pageCache[source+1].image,x.nextPageBox,10,.76,1500))}}
                if(!(x.questionImage||x.qText||optText(x,'A')||optText(x,'B')||optText(x,'C')||optText(x,'D')))continue;
                items.push(x);render();saveProgress();
              }
              await persistFolders();
            }catch(err){console.error('page',n,err);status.textContent=`⚠️ Page ${n}: ${err.message}`}
            finally{window._pagesDone=(window._pagesDone||0)+1;setProgress(window._pagesDone,total)}
          }
          '''
          s=s[:start]+align+s[end:]
          s=s.replace("if(!x.questionImage)x.questionImage=cur;", "if(!x.questionImage && !(x.questionBox&&Number(x.questionBox.w)>0&&Number(x.questionBox.h)>0))x.questionImage='';")

          # Remove previous V2 patch block if present.
          marker='/* [AUTO UPLOADER PATCH V2] */'
          if marker in s:
              a=s.rfind('<script>',0,s.index(marker));b=s.index('</script>',s.index(marker))+len('</script>');s=s[:a]+s[b:]

          v3=r'''<style id="A2Z_UPLOADER_V3">
          .a2zKeepBar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px;border:1px solid #164e63;border-radius:8px;background:#07111f}.a2zKeepBar .leftKeep{margin-right:auto}.a2zKeepBar button{min-width:118px}.a2zKeepText{background:#166534!important;border-color:#22c55e!important}.a2zKeepOff{background:#7f1d1d!important;border-color:#ef4444!important}.a2zCropInsert{background:#7c3aed!important;border-color:#a78bfa!important}.a2zFolderTools{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.a2zFolderTools button{font-size:10px;padding:6px 8px}.a2zFolderManager{border:1px solid #334155;border-radius:8px;padding:9px;background:#07111f;margin-top:8px;display:none}.a2zFolderManager.open{display:block}.a2zFolderRow{display:flex;gap:6px;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding:5px 0}.a2zFolderName{font-size:11px}.a2zDeleteFolder{background:#7f1d1d!important;border-color:#ef4444!important}.a2zIEInserted{max-width:68%!important;float:left!important;clear:none!important;margin:5px 14px 8px 0!important}.a2zIEEditor{overflow:auto;line-height:1.75}.a2zIEEditor img{vertical-align:middle}.a2zIEOptGrid .a2zIEInserted{max-width:55%!important}
          </style>
          <script>
          (function(){
            const DEF={keepText:true,keepQuestionImage:true,keepOptionImages:true,keepFigureImage:true,keepSolutionImage:true};
            const init=x=>{for(const k in DEF)if(x[k]===undefined)x[k]=DEF[k];return x};
            window.a2zKeep=function(i,k){const x=items[i];if(!x)return;init(x);if(k==='text')x.keepText=!x.keepText;if(k==='image')x.keepQuestionImage=!x.keepQuestionImage;if(!x.keepText&&!x.keepQuestionImage){if(confirm('Keep Text और Keep Image दोनों OFF हैं. Question discard करें?')){items.splice(i,1);render();saveProgress();return}x.keepText=true}render()};
            window.a2zEditFull=i=>window.openReview&&window.openReview(i);
            function caretAt(el,n){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let left=n,node;while(node=w.nextNode()){if(left<=node.nodeValue.length){const r=document.createRange();r.setStart(node,left);r.collapse(true);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);return}left-=node.nodeValue.length}el.focus()}
            window.a2zCropInsert=function(i){const q=document.getElementById('q'+i);window.__a2zCursor=i;window.__a2zCursorPos=q?Math.max(0,q.selectionStart||0):null;window.openReview&&window.openReview(i);setTimeout(()=>{document.getElementById('a2zCase3')?.click();setTimeout(()=>{const ed=document.getElementById('a2zIEEditor');if(ed){ed.focus();caretAt(ed,window.__a2zCursorPos==null?ed.innerText.length:window.__a2zCursorPos)}},80)},120)};
            window.a2zManageFolders=function(){let b=document.getElementById('a2zFolderManager');if(!b){b=document.createElement('div');b.id='a2zFolderManager';b.className='a2zFolderManager';(document.querySelector('.box')||document.body).appendChild(b)}b.classList.toggle('open');if(b.classList.contains('open'))a2zFolders(b)};
            function a2zFolders(b){b.innerHTML='<b>📚 Library folders</b><div class="small">AI uses an existing matching path when possible; otherwise it creates the path. You can add or delete folders here.</div>'+Object.entries(folderMap).map(([m,ss])=>'<div class="a2zFolderRow"><span><b>'+esc(m)+'</b></span><button class="a2zDeleteFolder mini" onclick="a2zDeleteMain('+JSON.stringify(m)+')">Delete Main</button></div>'+(ss||[]).map(s=>'<div class="a2zFolderRow" style="padding-left:20px"><span>↳ '+esc(s)+'</span><button class="a2zDeleteFolder mini" onclick="a2zDeleteSub('+JSON.stringify(m)+','+JSON.stringify(s)+')">Delete</button></div>').join('')).join('')+'<div class="a2zFolderTools"><button onclick="a2zNewMain()">➕ Main Folder</button><button onclick="a2zNewSub()">➕ Sub-Folder</button></div>'}
            window.a2zDeleteMain=async m=>{if(m==='General')return alert('General cannot be deleted.');if(!confirm('Delete '+m+' and all sub-folders?'))return;delete folderMap[m];await persistFolders();const b=document.getElementById('a2zFolderManager');if(b)a2zFolders(b)};
            window.a2zDeleteSub=async(m,s)=>{if(!confirm('Delete '+m+' / '+s+' ?'))return;folderMap[m]=(folderMap[m]||[]).filter(v=>v!==s);if(!folderMap[m].length)folderMap[m]=['General'];await persistFolders();const b=document.getElementById('a2zFolderManager');if(b)a2zFolders(b)};
            window.a2zNewMain=()=>{const n=prompt('Main folder name:');if(n?.trim()){folderMap[n.trim()]=folderMap[n.trim()]||['General'];persistFolders()}};
            window.a2zNewSub=()=>{const m=prompt('Main folder name:');if(!m?.trim())return;const s=prompt('Sub-folder name:');if(s?.trim()){folderMap[m.trim()]=folderMap[m.trim()]||[];if(!folderMap[m.trim()].includes(s.trim()))folderMap[m.trim()].push(s.trim());persistFolders()}};
            const R=render;render=function(){items.forEach(init);R();document.querySelectorAll('#list .q').forEach((card,i)=>{const x=items[i],l=card.querySelector('.qleft'),r=card.querySelector('.qright');if(!x)return;if(l&&!l.querySelector('.a2zKeepBar')){const b=document.createElement('div');b.className='a2zKeepBar';b.innerHTML='<span class="small leftKeep">TEXT</span><button class="mini a2zKeepText '+(x.keepText?'':'a2zKeepOff')+'" onclick="a2zKeep('+i+',\'text\')">'+(x.keepText?'✅ Keep Text':'❌ Keep Text')+'</button><button class="mini a2zCropInsert" onclick="a2zCropInsert('+i+')">✂️ Crop & Insert</button>';l.insertBefore(b,l.firstChild)}if(r&&!r.querySelector('.a2zKeepBar')){const b=document.createElement('div');b.className='a2zKeepBar';b.innerHTML='<span class="small leftKeep">IMAGE</span><button class="mini a2zKeepText '+(x.keepQuestionImage?'':'a2zKeepOff')+'" onclick="a2zKeep('+i+',\'image\')">'+(x.keepQuestionImage?'✅ Keep Image':'❌ Keep Image')+'</button><button class="mini" onclick="a2zEditFull('+i+')">✏️ Edit from Full Page</button>';r.appendChild(b)}if(l&&!l.querySelector('.a2zFolderTools')){const t=document.createElement('div');t.className='a2zFolderTools';t.innerHTML='<button onclick="a2zManageFolders()">📚 Manage Library Folders</button><button onclick="a2zNewMain()">➕ New Main</button><button onclick="a2zNewSub()">➕ New Sub</button>';l.appendChild(t)}});if(window.MathJax?.typesetPromise)setTimeout(()=>MathJax.typesetPromise().catch(()=>{}),40)};
          })();
          </script>
          </body>'''
          s=s.replace('</body>',v3,1)
          p.write_text(s,encoding='utf-8')

          # Preserve vector/hat/bar LaTeX in backend post-processing only. Prompt/payload are not changed.
          bp=Path('api/gemini-extract.js');b=bp.read_text(encoding='utf-8')
          anchor="function latex(s){let x=String(s||'');"
          if anchor not in b: raise SystemExit('backend anchor missing; refusing prompt/payload change')
          ins="function latex(s){let x=String(s||'');x=x.replace(/\\\\overrightarrow\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'⃗').replace(/\\\\vec\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'⃗').replace(/\\\\hat\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'̂').replace(/\\\\bar\\s*\\{([^{}]*)\\}/g,(_,v)=>v+'̄');"
          b=b.replace(anchor,ins,1);bp.write_text(b,encoding='utf-8')
          print('uploader v3 patched')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_uploader.html api/gemini-extract.js
          git commit -m 'fix: uploader keep controls folder access crop insertion and math vectors'
          git push
          git rm .github/workflows/apply-uploader-v3.yml
          git commit -m 'chore: remove one-time uploader patch workflow'
          git push