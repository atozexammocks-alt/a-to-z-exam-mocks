<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",authDomain:"physicsvault-80a10.firebaseapp.com",projectId:"physicsvault-80a10",storageBucket:"physicsvault-80a10.firebasestorage.app",messagingSenderId:"1043166507399",appId:"1:1043166507399:web:634efdac6f109273d42322"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app),auth=getAuth(app);
window.builderAuthReady=null;
window.ensureBuilderAuth=async function(){
  if(auth.currentUser) return auth.currentUser;
  if(!window.builderAuthReady){
    window.builderAuthReady=signInAnonymously(auth);
  }
  try{
    const cred=await window.builderAuthReady;
    if(cred?.user) return cred.user;
    return auth.currentUser||null;
  }catch(e){
    window.builderAuthReady=null;
    throw e;
  }
};
window.builderDB=db;

window.builderData=[];
window.builderMode="private";
window.folderFilter="";
window.selected=new Set();
window.textEdits=window.textEdits||{};
window.activeTextEditId=null;
window.paperSettings=window.paperSettings||{fontSize:14,weight:400};
window.sections=[{name:"Section A",type:"MCQ",marks:1}];

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function imageOf(q){
 const keys=["question","questionImage","image","img","imageData","croppedImage","questionImageData","imageUrl","imageURL","diagram","imageSrc","src","base64Image"];
 for(const k of keys){const v=q?.[k];if(typeof v==="string"&&v.trim()&&!/^(https?:\/\/|data:image\/|blob:)/i.test(v.trim())===false)return v.trim();}
 for(const k of keys){const v=q?.[k];if(typeof v==="string"&&/^((https?:\/\/)|(data:image\/)|(blob:))/i.test(v.trim()))return v.trim();}
 return "";
}
function textOf(q){
 const keys=["qText","text","questionText","question_text","content","questionTextHtml","prompt","question"];
 for(const k of keys){const v=q?.[k];if(typeof v==="string"&&v.trim()&&!/^(data:image\/|https?:\/\/|blob:)/i.test(v.trim()))return v.trim();}
 return "";
}
function displayTextOf(q){
 const e=window.textEdits[String(q?.id)];
 return e && typeof e.text==="string" ? e.text : textOf(q);
}
function displayOptionsOf(q){
 const e=window.textEdits[String(q?.id)];
 return e && Array.isArray(e.options) ? e.options : optionsOf(q);
}
function textStyleOf(q){
 const e=window.textEdits[String(q?.id)]||{};
 return 'font-size:'+Number(e.fontSize||window.paperSettings.fontSize||14)+'px;font-weight:'+Number(e.weight||window.paperSettings.weight||400)+';text-align:'+String(e.align||'left')+';line-height:'+Number(e.lineHeight||1.65)+';';
}
function optionsOf(q){
 const v=q?.options??q?.choices??q?.answers;
 if(Array.isArray(v))return v.map(x=>typeof x==="object"?(x.text??x.value??x.label??""):x).filter(x=>String(x).trim());
 if(v&&typeof v==="object")return Object.values(v).map(x=>typeof x==="object"?(x.text??x.value??""):x).filter(x=>String(x).trim());
 return ["A","B","C","D"].map(k=>q?.["option"+k]??q?.["opt"+k]??q?.[k]).filter(x=>String(x??"").trim());
}
function folderOf(q){
 return String(q?.folderPath||q?.path||q?.libraryPath||q?.folder||q?.subject||q?.folderName||"").trim().replace(/\\/g,"/").split("/").map(x=>x.trim()).filter(Boolean).join(" / ");
}
function isCentral(q){const x=String(q?.libraryMode??q?.targetLibrary??q?.libraryType??"").trim().toLowerCase();return q?.central===true||q?.isCentral===true||x==="central"||x.includes("central")}
function isGroup(q){const x=String(q?.libraryMode??q?.targetLibrary??q?.libraryType??"").trim().toLowerCase();return q?.group===true||x==="group"||x.includes("group")}
function belongs(q,mode){if(mode==="central")return isCentral(q);if(mode==="group")return isGroup(q);return !isCentral(q)&&!isGroup(q)}
function renderMath(html){
 const x=String(html??"");
 if(!x)return "";
 if(/\\\\\(|\\\\\[/.test(x)) return x;
 if(/\\\\(?:frac|dfrac|tfrac|sqrt|int|iint|iiint|oint|sum|prod|partial|nabla|Delta|delta|alpha|beta|gamma|theta|lambda|mu|pi|sigma|omega|left|right|begin|end|mathbf|mathrm|text)\\b/.test(x)
   || /(?:[A-Za-z0-9\\}])\\^\\{[^}]+\\}|(?:[A-Za-z0-9\\}])_\\{[^}]+\\}/.test(x)){
   return "\\("+x+"\\)";
 }
 return x.replace(/\\n/g,"<br>");
}
function typeset(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{});}

window.setGlobalQuestionFont=function(v){window.paperSettings.fontSize=Math.max(10,Math.min(30,Number(v)||14));renderQuestions();};
window.setGlobalQuestionWeight=function(v){window.paperSettings.weight=Number(v)||400;renderQuestions();};

window.loadQuestions=async function(){
 const status=document.getElementById("status");
 const box=document.getElementById("questions");
 status.textContent="Connecting to Library…";
 let lastError=null;
 for(let attempt=1;attempt<=5;attempt++){
  try{
   status.textContent=attempt===1?"Connecting to Library…":"Reconnecting to Library… ("+attempt+"/5)";
   await window.ensureBuilderAuth();
   const snap=await getDocs(collection(db,"questions"));
   window.builderData=snap.docs.map(d=>({id:d.id,...d.data()}));
   status.textContent="Library connected • "+window.builderData.length+" total questions";
   renderTree();renderQuestions();renderSelected();
   return;
  }catch(e){
   lastError=e;
   console.warn("Library load attempt "+attempt,e);
   window.builderAuthReady=null;
   if(attempt<5) await new Promise(r=>setTimeout(r,700*attempt));
  }
 }
 console.error("Library load failed after retries:",lastError);
 status.textContent="Library connection failed — tap Reload to retry";
 if(window.builderData.length){
   renderTree();renderQuestions();renderSelected();
 }else{
   box.innerHTML='<div class="empty">Library connection failed.<br><small>'+esc(lastError?.code||lastError?.message||"Firebase error")+'</small><br><button class="btn blue" style="margin-top:10px" onclick="loadQuestions()">↻ Retry</button></div>';
 }
};

window.setMode=function(mode){
 window.builderMode=mode;window.folderFilter="";
 document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
 renderTree();renderQuestions();
};
window.selectAllVisible=function(){getVisible().forEach(q=>window.selected.add(String(q.id)));localStorage.setItem("AZ_BUILDER_SELECTED_IDS",JSON.stringify([...window.selected]));renderQuestions();renderSelected()};
window.clearSelection=function(){window.selected.clear();localStorage.setItem("AZ_BUILDER_SELECTED_IDS","[]");renderQuestions();renderSelected()};
function getModeQuestions(){return window.builderData.filter(q=>belongs(q,window.builderMode))}
function getVisible(){
 const term=(document.getElementById("search")?.value||"").trim().toLowerCase(),type=document.getElementById("typeFilter")?.value||"ALL";
 return getModeQuestions().filter(q=>{
  if(window.folderFilter&&folderOf(q)!==window.folderFilter)return false;
  const qt=String(q.type??q.questionType??q.qType??"MCQ").toUpperCase();
  if(type!=="ALL"&&qt!==type)return false;
  if(!term)return true;
  return (displayTextOf(q)+" "+displayOptionsOf(q).join(" ")+" "+folderOf(q)+" "+String(q.topic??q.chapter??q.unit??"")).toLowerCase().includes(term);
 });
}
function renderQuestions(){
 const box=document.getElementById("questions"),rows=getVisible(),dups=duplicateCounts();
 document.getElementById("status").textContent="Library connected • "+window.builderData.length+" total • "+getModeQuestions().length+" in "+window.builderMode+" • duplicates tagged";
 if(!rows.length){box.innerHTML='<div class="empty">No questions found in this Library view.</div>';return}
 box.innerHTML=rows.map((q,i)=>{
  const id=String(q.id),sel=window.selected.has(id),img=imageOf(q),txt=cleanQuestionText(displayTextOf(q)),opts=displayOptionsOf(q).map(cleanOptionText).filter(Boolean),type=q.type||q.questionType||q.qType||"MCQ",marks=q.marks??q.mark??1,edit=window.textEdits[id]||{},dupCount=questionKey(q)?(dups[questionKey(q)]||0):0;
  return '<article class="card '+(sel?'selected':'')+'">'+
   '<div class="qhead"><input type="checkbox" '+(sel?'checked':'')+' onchange="toggleQuestion(\''+esc(id)+'\')"><div class="qtitle">Q'+(i+1)+' · '+esc(type)+' · '+esc(marks)+' mark'+(Number(marks)==1?'':'s')+'</div>'+(dupCount>1?'<span class="dup-tag">⚠ DUPLICATE ×'+dupCount+'</span>':'<span class="clean-tag">✓ CLEAN</span>')+(txt?'<button class="btn blue" onclick="openTextEditor(\''+encodeURIComponent(id)+'\')">✏️ Edit Text</button>':'')+'<button class="btn" onclick="removeSelection(\''+esc(id)+'\')">✕</button></div>'+
   (img?'<div class="qimg" onclick="previewImage(\''+encodeURIComponent(img)+'\')"><img src="'+esc(img)+'" alt="Question"></div>':'')+
   (txt?'<div class="qbody" style="'+textStyleOf(q)+'">'+renderMath(esc(txt))+'</div>':'')+
   (opts.length && !((window.textEdits[id]||{}).hideOptions)?'<div class="opts" style="'+textStyleOf(q)+'">'+opts.map((o,j)=>'<div><b>'+String.fromCharCode(65+j)+'.</b> '+renderMath(esc(o))+'</div>').join("")+'</div>':'')+
  '</article>';
 }).join("");
 typeset();

function renderTree(){

  root.count++;
  let n=root,cur="";

  Object.values(n.children).sort((a,b)=>a.name.localeCompare(b.name)).forEach(node=>{
   const hasChildren=Object.keys(node.children).length>0;
   const open=window.expandedFolders.has(node.path);

      '<span class="count">'+node.count+'</span>'+
    '</div>'
   );
   if(hasChildren && open) walk(node,depth+1);
  });
 }
 walk(root,0);
 document.getElementById("tree").innerHTML=html.join("");
 document.getElementById("folderCount").textContent=root.count;
}

function printMath(html){
 let s=String(html??"");
 const saved=[];
 s=s.replace(/\\\(([\\s\\S]*?)\\\)|\\\[([\\s\\S]*?)\\\]|\\$\\$([\\s\\S]*?)\\$\\$|\\$([^$]+)\\$/g,m=>{saved.push(m);return "@@MATH"+(saved.length-1)+"@@";});
 s=s.replace(/\n/g,"<br>");
 s=s.split("<br>").map(line=>{
   if(!line.trim()) return line;
   if(line.includes("@@MATH")) return line;
   const hasLatex=/\\(?:frac|dfrac|tfrac|sqrt|vec|hat|bar|dot|ddot|mathrm|mathbf|left|right|sin|cos|tan|cot|sec|csc|log|ln|exp|sum|int|partial|nabla|Delta|alpha|beta|gamma|theta|lambda|mu|pi|omega|hbar|pm|times|cdot|le|ge|ne|infty|Omega)\b/.test(line);
   const hasPower=/[A-Za-z0-9)\]]\s*[_^]\s*(?:\{[^}]+\}|[A-Za-z0-9+\-()]+)/.test(line);
   const hasEquation=/[A-Za-z0-9)\]]\s*=\s*[A-Za-z0-9(\\]/.test(line);
   return (hasLatex||hasPower||hasEquation) ? "\\("+line+"\\)" : line;
 }).join("<br>");
 s=s.replace(/@@MATH(\d+)@@/g,(_,i)=>saved[Number(i)]);
 return s;
}

 let html=paperMarkup(layout);
 const wm=document.getElementById("cWatermark").value==="yes"?'<div class="custom-wm">'+esc(document.getElementById("cWatermarkText").value||"A TO Z EXAM MOCKS")+"</div>":"";
 const brand=document.getElementById("cBrand").value==="yes"?'<div class="custom-brand">A to Z Exam Mocks</div>':"";
 html=html.replace("</head>","<style>body{font-size:"+Number(font)+"px;font-weight:"+Number(weight)+"}.custom-wm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:#000;opacity:.07;transform:rotate(-32deg);pointer-events:none;z-index:0}.custom-brand{text-align:center;border-top:1px solid #888;margin-top:24px;padding-top:5px;font-size:10px}</style></head>");
 html=html.replace("</body>",wm+brand+"</body>");
 return html;
}
window.previewCustomized=function(){const w=window.open("","_blank");if(!w)return alert("Allow popups for preview.");w.document.open();w.document.write(customHtml());w.document.close()};
window.printCustomized=function(){const w=window.open("","_blank");if(!w)return alert("Allow popups for printing.");w.document.open();w.document.write(customHtml());w.document.close();setTimeout(()=>w.print(),900)};
window.publishNow=async function(){if(!window.selected.size)return alert("Select questions first.");try{const ref=await addDoc(collection(db,"published_tests"),{title:document.getElementById("paperTitle").value||"Physics Test",questionIds:[...window.selected],createdBy:(localStorage.getItem("ExamVault_Teacher_Email")||"").trim().toLowerCase(),createdAt:new Date().toISOString(),price:0});const link=location.origin+"/test_player.html?id="+ref.id;try{await navigator.clipboard.writeText(link)}catch(e){}alert("✔ Test Published!\n\nStudent link:\n"+link)}catch(e){alert("Publish failed: "+(e?.message||e))}};

window.saveBlueprint=function(){const data={title:document.getElementById("paperTitle").value,school:document.getElementById("schoolName").value,logo:document.getElementById("logoUrl").value,selected:[...window.selected],date:new Date().toISOString()};localStorage.setItem("AZ_TEST_BUILDER_BLUEPRINT",JSON.stringify(data));alert("Blueprint saved on this device.")};

document.addEventListener("DOMContentLoaded",()=>{
 const email=(localStorage.getItem("ExamVault_Teacher_Email")||"").trim();document.getElementById("userPill").textContent=email||"Teacher";
 const gf=document.getElementById("globalQuestionFont"),gw=document.getElementById("globalQuestionWeight"); if(gf)gf.value=window.paperSettings.fontSize; if(gw)gw.value=String(window.paperSettings.weight);
 loadQuestions();
});
</script>
<!-- Local, non-Firebase Text Editor: changes live only in this Builder window -->
<div id="textEditorBackdrop" class="text-editor-backdrop" onclick="if(event.target===this)closeTextEditor()">
  <div class="text-editor">
    <h3>✏️ Edit Question Text — Paper Only</h3>
    <div class="print-note">Changes made here are temporary. They are NOT saved to the Library or Firebase and affect only this Test Builder window/paper.</div>
    <textarea id="textEditorMain" placeholder="Question text…"></textarea>
    <div class="editor-grid">
      <label>Font Size<select id="textEditorFontSize"><option value="12">12 px</option><option value="13">13 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="18">18 px</option><option value="20">20 px</option></select></label>
      <label>Weight<select id="textEditorWeight"><option value="400">Normal</option><option value="500">Medium</option><option value="600">Semi Bold</option><option value="700">Bold</option><option value="800">Extra Bold</option></select></label>
      <label>Alignment<select id="textEditorAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option><option value="justify">Justify</option></select></label>
      <label>Line Spacing<select id="textEditorLine"><option value="1.35">Compact</option><option value="1.55">Normal</option><option value="1.8">Open</option><option value="2">Very Open</option></select></label>
    </div>
    <div class="editor-options">
      <label class="editor-check"><input id="textEditorHideOptions" type="checkbox"> Hide options for this paper</label>
      <div id="textEditorOptions"></div>
    </div>
    <div class="editor-actions">
      <button class="btn" onclick="closeTextEditor()">Cancel</button>
      <button class="btn red" onclick="resetTextEdit()">Reset This Question</button>
      <button class="btn primary" onclick="saveTextEdit()">✓ Apply to This Paper</button>
    </div>
  </div>
</div>
