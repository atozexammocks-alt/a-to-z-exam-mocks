<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - Test Builder Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z'/></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, setDoc, getDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.signInAnonymously = signInAnonymously;
    window.builderAuthReady = signInAnonymously(window.auth).catch(e => { console.warn("Builder auth unavailable:", e); return null; });
    window.addDoc = addDoc; window.collection = collection; window.getDocs = getDocs; 
    window.setDoc = setDoc; window.getDoc = getDoc; window.doc = doc; window.deleteDoc = deleteDoc; window.updateDoc = updateDoc;

    let activeBuilderLibraryMode = 'private'; // 'private', 'central', 'group'
    let libraryTree = [];
    let mainFolders = [];
    let subFolders = {};
    let cloudVault = [], selectedIds = [];
    let activeBuilderMain = 'ALL', activeBuilderSub = 'ALL';
    let adminPlatformSharePercent = 10;
    let cachedFilteredList = [];
    let currentPrintType = 'qp';
    let previewQuestionId = null;

    const teacherEmailKey = () => (window.currentTeacherEmail || localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
    const teacherDocId = email => (email || '').replace(/[^a-zA-Z0-9]/g, '_');

    window.switchBuilderLibraryMode = async function(mode) {
      activeBuilderLibraryMode = mode;
      activeBuilderMain = 'ALL';
      activeBuilderSub = 'ALL';

      document.querySelectorAll('.nav-inline-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`nav-lib-tab-${mode}`)?.classList.add('active');

      await loadLibraryState();
      await initBuilderStudio();
    };

    window.loadLibraryState = async function() {
      try {
        const email = teacherEmailKey();
        let docRefPath = "", docId = "";

        if (activeBuilderLibraryMode === 'private') {
          docRefPath = "folder_configs_private";
          docId = teacherDocId(email);
        } else if (activeBuilderLibraryMode === 'central') {
          docRefPath = "folder_configs_central";
          docId = "global_central_tree";
        } else if (activeBuilderLibraryMode === 'group') {
          docRefPath = "folder_configs_group";
          docId = teacherDocId(email) + "_group";
        }

        const ref = window.doc(window.db, docRefPath, docId);
        const snap = await window.getDoc(ref);
        const data = snap.exists() ? snap.data() : {};
        libraryTree = legacyTreeFromConfig(data);
        mainFolders = libraryTree.map(n => String(n.name || '').trim()).filter(Boolean);
        subFolders = {};

        const collect = (nodes, root, rel = []) => {
          (nodes || []).forEach(n => {
            const name = String(n.name || '').trim(); if(!name) return;
            const next = rel.concat(name);
            subFolders[root] = subFolders[root] || [];
            subFolders[root].push(next.join(' / '));
            collect(n.children || [], root, next);
          });
        };
        libraryTree.forEach(root => collect(root.children || [], String(root.name || '').trim(), []));
        if(data.platformSharePercent) adminPlatformSharePercent = data.platformSharePercent;
      } catch(e) { console.error('Library load failed:', e); }
    };

    function normalizeFolderPath(v){return String(v||'').replace(/\\/g,'/').split('/').map(x=>x.trim()).filter(Boolean).join(' / ');}
    function getQuestionFolderPath(q){
      if(!q) return '';
      const explicit=normalizeFolderPath(q.folderPath||q.path||q.libraryPath||'');
      if(explicit) return explicit;
      const root=normalizeFolderPath(q.folder||q.subject||q.folderName||'');
      const sub=normalizeFolderPath(q.subfolder||q.subFolder||q.topicPath||'');
      return sub ? (root ? root+' / '+sub : sub) : root;
    }
    function legacyTreeFromConfig(data){
      if(Array.isArray(data?.libraryTree) && data.libraryTree.length) return data.libraryTree;
      const mains=Array.isArray(data?.mainFolders)?data.mainFolders:[];
      const subs=data?.subFolders && typeof data.subFolders==='object'?data.subFolders:{};
      return mains.map(name=>({name:String(name).trim(),children:(Array.isArray(subs[name])?subs[name]:[]).map(s=>({name:String(s).trim(),children:[]}))})).filter(n=>n.name);
    }
    function questionImage(q){const vals=[q.questionImage,q.image,q.img,q.imageData,q.croppedImage,q.questionImageData,q.imageUrl,q.imageURL,q.diagram,q.imageSrc,q.src,q.base64Image,q.question];return vals.map(v=>String(v||'').trim()).find(v=>/^data:image\//i.test(v)||/^https?:\/\//i.test(v))||'';}
    
    // Improved Math & LaTeX Normalization for proper visualization
    function normalizeMathSource(v){
      let s = String(v ?? '');
      s = s.replace(/\\b(?:SQRT|sqrt)\s*\(\s*([^()]+)\s*\)/g, '\\\\sqrt{$1}');
      s = s.replace(/\\b(?:SQRT|sqrt)\s+([A-Za-z0-9.+-]+)/g, '\\\\sqrt{$1}');
      return s;
    }
    function builderMathHtml(v){
      let processed = normalizeMathSource(v);
      // Ensure LaTeX/math delimiters are wrapped nicely for MathJax rendering
      return processed.replace(/\\n/g, '<br>');
    }

    function folderMatchesQuestion(q,target){const a=normalizeFolderPath(getQuestionFolderPath(q)),b=normalizeFolderPath(target);if(!a||!b)return false;if(a===b||a.startsWith(b+' / '))return true;const parts=b.split(' / ');const leaf=parts[parts.length-1];return parts.length>1 && a===leaf;}

    window.initBuilderStudio = async function() {
      const status=document.getElementById('builder-load-status');
      if(status) status.textContent='Connecting to Firestore questions collection...';
      const tabsCont = document.getElementById('navbar-inline-tabs');
      if (tabsCont && !tabsCont.innerHTML) {
        tabsCont.innerHTML = `
          <button class="nav-inline-tab active" id="nav-lib-tab-private" onclick="window.switchBuilderLibraryMode('private')"><i class="fa-solid fa-lock"></i> Private</button>
          <button class="nav-inline-tab" id="nav-lib-tab-central" onclick="window.switchBuilderLibraryMode('central')"><i class="fa-solid fa-landmark"></i> Central</button>
          <button class="nav-inline-tab" id="nav-lib-tab-group" onclick="window.switchBuilderLibraryMode('group')"><i class="fa-solid fa-users"></i> Group</button>
        `;
      }

      try {
        if(window.builderAuthReady) await window.builderAuthReady;
        if(!window.auth?.currentUser){
          try { await window.signInAnonymously?.(window.auth); } catch(_){}
        }
        const snap=await window.getDocs(window.collection(window.db,'questions'));
        const allQuestions=snap.docs.map(d=>({id:d.id,...d.data()}));
        
        const isCentralQuestion = q =>
          q?.central === true || q?.isCentral === true ||
          String(q?.libraryMode || '').trim().toLowerCase() === 'central' ||
          String(q?.targetLibrary || '').trim().toLowerCase() === 'central';
        
        const isGroupQuestion = q =>
          q?.group === true ||
          String(q?.libraryMode || '').trim().toLowerCase() === 'group' ||
          String(q?.targetLibrary || '').trim().toLowerCase() === 'group';

        if(activeBuilderLibraryMode === 'central') {
          cloudVault = allQuestions.filter(q => isCentralQuestion(q));
        } else if(activeBuilderLibraryMode === 'group') {
          cloudVault = allQuestions.filter(q => isGroupQuestion(q));
        } else {
          cloudVault = allQuestions.filter(q => !isCentralQuestion(q) && !isGroupQuestion(q));
          if(allQuestions.length && !cloudVault.length) cloudVault = allQuestions.slice();
        }

        if(status) {
          status.textContent = `Firebase connected • ${allQuestions.length} total • ${cloudVault.length} visible • ${activeBuilderLibraryMode}`;
          status.dataset.loaded = '1';
        }
        selectedIds = selectedIds.filter(id => cloudVault.some(q => q.id === id));
        localStorage.setItem('AZ_BUILDER_SELECTED_IDS', JSON.stringify(selectedIds));
        
        cloudVault.forEach(q => {
          const path = normalizeFolderPath(getQuestionFolderPath(q));
          if(!path) return;
          const parts = path.split(' / ');
          const root = parts[0];
          if(!mainFolders.includes(root)) mainFolders.push(root);
          if(parts.length > 1){
            subFolders[root] = subFolders[root] || [];
            const rel = parts.slice(1).join(' / ');
            if(!subFolders[root].includes(rel)) subFolders[root].push(rel);
          }
        });
      } catch(e){
        console.error('Question vault load failed:', e);
        cloudVault = [];
        if(status) status.textContent='Firebase load error: ' + (e?.message || e);
      }

      try {
        renderFilteredQuestions();
      } catch(renderError) {
        console.error('[Builder] question grid render error:', renderError);
      }
      try {
        renderMainFoldersRow();
        renderBuilderSidebarTopics();
      } catch(renderError) {
        console.error('[Builder] sidebar render error:', renderError);
      }
      try {
        updateRevenueSplit();
      } catch(renderError) {
        console.error('[Builder] controls render error:', renderError);
      }
    };

    function renderMainFoldersRow() {
      const rowEl = document.getElementById('main-folders-row');
      if (!rowEl) return;
      rowEl.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `main-folder-chip ${activeBuilderMain === 'ALL' ? 'active' : ''}`;
      allBtn.innerHTML = `<i class="fa-solid fa-folder-open"></i> All Folders`;
      allBtn.onclick = () => { activeBuilderMain = 'ALL'; activeBuilderSub = 'ALL'; renderMainFoldersRow(); renderBuilderSidebarTopics(); renderFilteredQuestions(); };
      rowEl.appendChild(allBtn);

      mainFolders.forEach(main => {
        const btn = document.createElement('button');
        btn.className = `main-folder-chip ${activeBuilderMain === main ? 'active' : ''}`;
        btn.innerHTML = `<i class="fa-solid fa-folder"></i> ${main}`;
        btn.onclick = () => { activeBuilderMain = main; activeBuilderSub = 'ALL'; renderMainFoldersRow(); renderBuilderSidebarTopics(); renderFilteredQuestions(); };
        rowEl.appendChild(btn);
      });
    }

    function renderBuilderSidebarTopics() {
      const listEl = document.getElementById('builder-topics-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      let availableSubs = [];
      if (activeBuilderMain === 'ALL') {
        Object.values(subFolders).forEach(arr => availableSubs.push(...arr));
      } else {
        availableSubs = subFolders[activeBuilderMain] || [];
      }

      const allSubBtn = document.createElement('button');
      allSubBtn.className = `nav-item-btn ${activeBuilderSub === 'ALL' ? 'active' : ''}`;
      allSubBtn.innerHTML = `<span><i class="fa-solid fa-layer-group"></i> All Sections</span><span>${cloudVault.length}</span>`;
      allSubBtn.onclick = () => { activeBuilderSub = 'ALL'; renderBuilderSidebarTopics(); renderFilteredQuestions(); };
      listEl.appendChild(allSubBtn);

      availableSubs.forEach(fullSub => {
        const subName = fullSub.split(" / ").pop();
        const count = cloudVault.filter(q => folderMatchesQuestion(q, fullSub)).length;
        const subBtn = document.createElement('button');
        subBtn.className = `nav-item-btn ${activeBuilderSub === fullSub ? 'active' : ''}`;
        subBtn.innerHTML = `<span>↳ ${subName}</span><span>${count}</span>`;
        subBtn.onclick = () => { activeBuilderSub = fullSub; renderBuilderSidebarTopics(); renderFilteredQuestions(); };
        listEl.appendChild(subBtn);
      });

      document.getElementById('total-vault-count-badge').textContent = cloudVault.length + " Qs";
      
      // Trigger MathJax typeset after rendering sidebar/questions
      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        window.MathJax.typesetPromise().catch(() => {});
      }
    }

    function builderEscape(v){ return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    
    function renderFilteredQuestions() {
      const grid = document.getElementById('question-card-grid');
      if (!grid) return;
      grid.innerHTML = '';

      let list = Array.isArray(cloudVault) ? cloudVault.slice() : [];
      if(activeBuilderMain !== 'ALL'){ const root = normalizeFolderPath(activeBuilderMain); list = list.filter(q => folderMatchesQuestion(q, root)); }
      if(activeBuilderSub !== 'ALL'){ const target = normalizeFolderPath(activeBuilderSub); list = list.filter(q => folderMatchesQuestion(q, target)); }
      cachedFilteredList = list;

      const crumb = document.getElementById('crumb-bank-name');
      const badge = document.getElementById('filtered-count-badge');
      if(crumb) crumb.textContent = activeBuilderSub === 'ALL' ? (activeBuilderMain === 'ALL' ? 'All Books & Sections' : activeBuilderMain) : activeBuilderSub;
      if(badge) badge.textContent = list.length;

      if (!list.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; padding:40px; text-align:center; color:#64748b;">No questions available in this section.</div>`;
        return;
      }

      list.forEach((q, idx) => {
        const isSel = selectedIds.includes(q.id);
        const card = document.createElement('div');
        card.className = `q-visual-card ${isSel ? 'selected' : ''}`;
        
        let textContent = q.qText || q.questionText || q.text || '';
        
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:800; color:#94a3b8;">
            <span>Q${idx+1}${q.qNo && String(q.qNo)!==String(idx+1) ? ' <small style="font-weight:700;color:#64748b;">(Source '+builderEscape(q.qNo)+')</small>' : ''}</span>
            <div class="q-card-actions">
              ${textContent || questionImage(q) ? `<button type="button" class="q-eye-btn" title="Full view" onclick="event.stopPropagation(); window.previewQuestion('${q.id}')"><i class="fa-solid fa-eye"></i></button>` : ''}
              <input type="checkbox" ${isSel ? 'checked' : ''} onchange="event.stopPropagation(); window.toggleSelectQ('${q.id}')" style="width:16px; height:16px; accent-color:#10b981; cursor:pointer;">
            </div>
          </div>
          ${questionImage(q) ? `<div class="q-img-holder"><img src="${builderEscape(questionImage(q))}" alt="Question image"></div>` : ''}
          ${textContent ? `<div class="q-builder-text" style="font-size:12px; color:#f8fafc; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;">${builderMathHtml(textContent)}</div>` : ''}
        `;
        card.onclick = (e) => { if(e.target.tagName !== 'INPUT') window.toggleSelectQ(q.id); };
        grid.appendChild(card);
      });

      // Typeset math equations using MathJax
      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        window.MathJax.typesetPromise([grid]).catch(() => {});
      }
    }

    window.toggleSelectQ = function(id) {
      if (selectedIds.includes(id)) {
        selectedIds = selectedIds.filter(i => i !== id);
      } else {
        selectedIds.push(id);
      }
      localStorage.setItem('AZ_BUILDER_SELECTED_IDS', JSON.stringify(selectedIds));
      renderFilteredQuestions();
      document.getElementById('assembler-count-right').textContent = selectedIds.length + " Selected";
    };

    window.toggleSelectAllVisible = function() {
      const allIds = cachedFilteredList.map(q => q.id);
      const allSelected = allIds.every(id => selectedIds.includes(id));
      if (allSelected) {
        selectedIds = selectedIds.filter(id => !allIds.includes(id));
      } else {
        allIds.forEach(id => { if (!selectedIds.includes(id)) selectedIds.push(id); });
      }
      localStorage.setItem('AZ_BUILDER_SELECTED_IDS', JSON.stringify(selectedIds));
      renderFilteredQuestions();
      document.getElementById('assembler-count-right').textContent = selectedIds.length + " Selected";
    };

    window.updateRevenueSplit = function() {
      const price = parseFloat(document.getElementById('test-price')?.value || 0);
      const adminShare = (price * adminPlatformSharePercent) / 100;
      const teacherShare = price - adminShare;
      document.getElementById('split-price').textContent = '₹' + price;
      document.getElementById('admin-share-label').textContent = adminPlatformSharePercent;
      document.getElementById('split-panel').textContent = '₹' + adminShare.toFixed(1);
      document.getElementById('split-teacher').textContent = '₹' + teacherShare.toFixed(1);
    };

    window.publishOnlineMockTest = async function() {
      if (selectedIds.length === 0) return alert("कृपया टेस्ट पब्लिश करने के लिए कम से कम एक प्रश्न चुनें!");
      const title = document.getElementById('test-title').value.trim() || "Mock Test";
      document.getElementById('loading-overlay').style.display = 'flex';

      try {
        const testObj = {
          title: title,
          timeMinutes: parseInt(document.getElementById('test-time').value) || 60,
          totalMarks: parseInt(document.getElementById('test-marks').value) || 100,
          price: parseFloat(document.getElementById('test-price').value) || 0,
          questionIds: selectedIds,
          creatorEmail: teacherEmailKey(),
          libraryMode: activeBuilderLibraryMode,
          folderPath: activeBuilderSub !== 'ALL' ? activeBuilderSub : (activeBuilderMain !== 'ALL' ? activeBuilderMain : ''),
          rules: { noReturn: !!document.getElementById('rule-no-return')?.checked, minTimerLock: !!document.getElementById('rule-min-timer')?.checked },
          createdAt: new Date().toISOString()
        };
        await window.addDoc(window.collection(window.db, "published_tests"), testObj);
        document.getElementById('loading-overlay').style.display = 'none';
        showToast("🚀 Test Published Successfully!");
        setTimeout(() => { window.location.href = 'public_tests.html'; }, 1500);
      } catch (err) {
        document.getElementById('loading-overlay').style.display = 'none';
        alert("पब्लिश करने में विफल: " + err.message);
      }
    };

    window.openPrintModal = function(type) {
      if (selectedIds.length === 0) return alert("कृपया प्रिंट के लिए प्रश्न चुनें!");
      currentPrintType = type;
      document.getElementById('print-modal-overlay').style.display = 'flex';
    };

    window.previewQuestion = function(id) {
      const q = cloudVault.find(x => x.id === id);
      if (!q) return;
      previewQuestionId = id;
      const body = document.getElementById('question-preview-body');
      const title = document.ge
