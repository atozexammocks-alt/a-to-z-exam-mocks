lex;flex-direction:column;min-width:0;border-right:1px solid #1e293b}.toolbar{display:flex;gap:6px;align-items:center;padding:7px;background:#0b1120;border-bottom:1px solid #1e293b;flex-wrap:wrap}.viewer{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;position:relative}.page{position:relative;background:#fff;box-shadow:0 15px 40px #000;line-height:0}.page canvas{display:block}.crop{position:absolute;border:3px solid #dc2626;background:#dc262633;display:none;pointer-events:none}.aiBox{position:absolute;border:3px solid #22c55e;background:#22c55e22;display:none;cursor:move;z-index:5}.aiBox.solution{border-color:#f59e0b;background:#f59e0b22}.handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid currentColor;right:-7px;bottom:-7px;border-radius:50%;cursor:nwse-resize}.right{padding:10px;background:#0b1120;overflow:auto}.card{background:#060911;border:1px solid #1e293b;border-radius:8px;padding:9px;margin-bottom:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card input,.card textarea,.card select{width:100%;background:#0f172a;color:white;border:1px solid #334155;border-radius:5px;padding:6px;font-size:11px}.preview{background:#fff;min-height:80px;padding:4px;border-radius:5px}.preview img{max-width:100%;max-height:180px;display:block;margin:auto}.status{color:#10b981;font-weight:800;font-size:11px}.muted{color:#94a3b8;font-size:10px}.ai{display:flex;gap:5px;flex-wrap:wrap}.ai button{background:#065f46;border-color:#10b981}.danger{background:#7f1d1d;border-color:#ef4444}</style></head><body><header><div class="brand">✂️ A to Z Exam Mocks — Slicer Studio</div><div class="bar"><label class="btn primary">📂 PDF<input id="pdfFile" type="file" accept="application/pdf" hidden></label><button onclick="location.href='teacher.html'">🏠 Dashboard</button></div></header><div class="workspace"><section class="left"><div class="toolbar"><button onclick="prevPage()">◀</button><span>Page <input id="pageNo" type="number" min="1" value="1" style="width:45px;background:#060911;color:white;border:1px solid #334155"> / <b id="total">0</b></span><button onclick="nextPage()">▶</button><button onclick="zoom(-.25)">−</button><span id="zoomLabel">150%</span><button onclick="zoom(.25)">+</button><button class="primary" onclick="setTarget('question')">✂ Question</button><button onclick="setTarget('solution')">💡 Solution</button><button class="primary" onclick="aiDetectPage()">🤖 AI Select Q+Solution</button><span id="status" class="status"></span></div><div id="viewer" class="viewer"><div id="page" class="page"><canvas id="canvas"></canvas><div id="crop" class="crop"></div><div id="qBox" class="aiBox"><span class="handle"></span></div><div id="sBox" class="aiBox solution"><span class="handle"></span></div></div></div></section><aside class="right"><div class="card"><b>📚 Library</b><div class="grid2"><select id="mainCat" onchange="fillSubs()"></select><select id="subCat"></select></div></div><div class="card"><div class="grid2"><label>Q.No<input id="qno" type="number" value="1"></label><label>Answer<select id="key"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></label></div><label>Question Text<textarea id="qtext" rows="4"></textarea></label><div class="grid2"><input id="a" placeholder="Option A"><input id="b" placeholder="Option B"><input id="c" placeholder="Option C"><input id="d" placeholder="Option D"></div><div class="ai"><button onclick="applyBoxCrop('question')">✂ Use Q Box</button><button onclick="applyBoxCrop('solution')">💡 Use Solution Box</button><button onclick="ocrCrop()">🔍 OCR last crop</button><button onclick="aiExtractLastCrop()">🤖 Gemini last crop</button><button onclick="aiExtractPage()">🤖 Gemini page</button><button class="danger" onclick="clearQuestionFields()">Clear</button></div></div><div class="card"><b>Question image</b><div id="qPreview" class="preview"></div></div><div class="card"><b>Solution image</b><div id="sPreview" class="preview"></div></div><button class="primary" style="width:100%;padding:11px" onclick="saveQuestion()">☁️ Save Question</button><p class="muted">AI Select reads the full page and draws editable question/solution boxes. Drag a box or its corner handle to correct the AI before saving. Spark-only image compression; no Firebase Storage.</p></aside></div><script>let mainFolders=['Classical Mechanics','Quantum Mechanics','Mathematical Physics','Electronics','EMT','Solid State Mechanics','Thermo & Statical','Atomic','Nuclear','PYP'],subFolders={},pdf=null,pageNum=1,scale=1.5,target='question',parts={question:[],solution:[]},lastCrop='',foldersFlat=[];const c=document.getElementById('canvas'),ctx=c.getContext('2d'),page=document.getElementById('page'),crop=document.getElementById('crop'),viewer=document.getElementById('viewer'),qBox=document.getElementById('qBox'),sBox=document.getElementById('sBox');const $=id=>document.getElementById(id);function fillFolders(){$('mainCat').innerHTML=mainFolders.map(x=>`<option>${esc(x)}</option>`).join('');fillSubs()}function fillSubs(){const m=$('mainCat').value;$('subCat').innerHTML=(subFolders[m]||['General']).map(x=>`<option>${esc(m+' / '+x)}</option>`).join('');foldersFlat=mainFolders.flatMap(m=>(subFolders[m]||['General']).map(s=>m+' / '+s))}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setStatus(x){$('status').textContent=String(x||'')}function setTarget(x){target=x;setStatus('Target: '+x)}async function init(){try{const s=await getDoc(doc(db,'folder_configs','shared_registry_v4'));if(s.exists()){const d=s.data();mainFolders=d.mainFolders||mainFolders;subFolders=d.subFolders||{}}}catch(e){}fillFolders()}setTimeout(init,400);$('pdfFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;$('total').textContent=pdf.numPages;pageNum=1;await render();setStatus('✔ PDF loaded — '+pdf.numPages+' pages')}catch(e){setStatus('PDF error: '+e.message);alert('PDF error: '+e.message)}};async function render(){if(!pdf)return;const p=await pdf.getPage(pageNum),v=p.getViewport({scale});c.width=v.width;c.height=v.height;page.style.width=v.width+'px';page.style.height=v.height+'px';await p.render({canvasContext:ctx,viewport:v}).promise;$('pageNo').value=pageNum;$('zoomLabel').textContent=Math.round(scale*100)+'%';hideBoxes();crop.style.display='none'}function hideBoxes(){qBox.style.display='none';sBox.style.display='none'}function prevPage(){if(pdf&&pageNum>1){pageNum--;render()}}function nextPage(){if(pdf&&pageNum<pdf.numPages){pageNum++;render()}}function zoom(d){if(pdf){scale=Math.min(3,Math.max(.75,scale+d));render()}}function drawBox(el,b){if(!b||!Number.isFinite(+b.x)||!Number.isFinite(+b.y)||!Number.isFinite(+b.w)||!Number.isFinite(+b.h))throw new Error('AI returned an invalid box.');el.style.display='block';el.style.left=(Math.max(0,+b.x)/1000*c.width)+'px';el.style.top=(Math.max(0,+b.y)/1000*c.height)+'px';el.style.width=(Math.max(1,+b.w)/1000*c.width)+'px';el.style.height=(Math.max(1,+b.h)/1000*c.height)+'px';el.dataset.box=JSON.stringify(b)}function errorText(d,status){const g=d&&d.google||{};const reasons=Array.isArray(g.reasons)?g.reasons.filter(Boolean):[];const reason=reasons.length?reasons.join(', '):(g.status||g.code||'');const msg=(g.message||d?.error||`Server error ${status||''}`).trim();return reason?`Gemini ${status||g.httpStatus||403} — ${reason}: ${msg}`:msg}async function readApiResponse(r){let d=null;const raw=await r.text();try{d=raw?JSON.parse(raw):{}}catch(_){d={}}if(!r.ok){throw new Error(errorText(d,r.status))}return d||{}}async function aiDetectPage(){if(!pdf)return alert('Open a PDF first.');setStatus('🤖 AI is selecting question + solution...');try{const p=await pdf.getPage(pageNum),v=p.getViewport({scale:1.5}),cc=document.createElement('canvas');cc.width=v.width;cc.height=v.height;await p.render({canvasContext:cc.getContext('2d'),viewport:v}).promise;const imageDataUrl=cc.toDataURL('image/jpeg',.72),r=await fetch('/api/gemini-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'detect_boxes',imageDataUrl})}),d=await readApiResponse(r);if(!d.boxes?.question)throw new Error('AI did not return a question box.');drawBox(qBox,d.boxes.question);if(d.boxes.solution)drawBox(sBox,d.boxes.solution);setStatus(`✔ AI selected boxes (${Math.round((d.boxes.confidence||0)*100)}% confidence). Drag/resize if needed.`)}catch(e){const msg=e&&e.message?e.message:'Unknown AI Select error';console.error('[Slicer] AI Select failed:',e);setStatus('❌ AI Select: '+msg);alert('AI Select failed:\n\n'+msg)}}let boxAction=null;function startBoxAction(el,e,resize){e.preventDefault();e.stopPropagation();const r=page.getBoundingClientRect();const start={x:e.clientX,y:e.clientY,w:el.offsetWidth,h:el.offsetHeight,l:el.offsetLeft,t:el.offsetTop};boxAction={el,resize,start,r};window.addEventListener('mousemove',moveBox);window.addEventListener('mouseup',endBox)}function moveBox(e){if(!boxAction)return;const{el,resize,start}=boxAction;let dx=e.clientX-start.x,dy=e.clientY-start.y;if(resize){el.style.width=Math.max(30,start.w+dx)+'px';el.style.height=Math.max(30,start.h+dy)+'px'}else{el.style.left=Math.max(0,Math.min(c.width-start.w,start.l+dx))+'px';el.style.top=Math.max(0,Math.min(c.height-start.h,start.t+dy))+'px'}}function endBox(){if(!boxAction)return;boxAction=null;window.removeEventListener('mousemove',moveBox);window.removeEventListener('mouseup',endBox)}qBox.addEventListener('mousedown',e=>startBoxAction(qBox,e,e.target.classList.contains('handle')));sBox.addEventListener('mousedown',e=>startBoxAction(sBox,e,e.target.classList.contains('handle')));let down=null;viewer.onmousedown=e=>{if(!pdf||e.target===qBox||e.target===sBox||qBox.contains(e.target)||sBox.contains(e.target))return;const r=c.getBoundingClientRect();down={x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top)),r};crop.style.display='block';crop.style.left=down.x+'px';crop.style.top=down.y+'px'};window.onmousemove=e=>{if(!down)return;const x=Math.max(0,Math.min(down.r.width,e.clientX-down.r.left)),y=Math.max(0,Math.min(down.r.height,e.clientY-down.r.top));crop.style.left=Math.min(down.x,x)+'px';crop.style.top=Math.min(down.y,y)+'px';crop.style.width=Math.abs(x-down.x)+'px';crop.style.height=Math.abs(y-down.y)+'px'};window.onmouseup=()=>{if(!down)return;const r=down.r,box={x:+crop.style.left,y:+crop.style.top,w:+crop.style.width,h:+crop.style.height};down=null;if(box.w<8||box.h<8)return;const sx=c.width/r.width,sy=c.height/r.height,cc=document.createElement('canvas');cc.width=Math.round(box.w*sx);cc.height=Math.round(box.h*sy);cc.getContext('2d').drawImage(c,box.x*sx,box.y*sy,cc.width,cc.height,0,0,cc.width,cc.height);lastCrop=cc.toDataURL('image/jpeg',.72);parts[target].push(lastCrop);renderPreviews();setStatus(target+' crop added')};function boxToCanvas(el){const x=el.offsetLeft,y=el.offsetTop,w=el.offsetWidth,h=el.offsetHeight,cc=document.createElement('canvas');cc.width=Math.max(1,Math.round(w));cc.height=Math.max(1,Math.round(h));cc.getContext('2d').drawImage(c,x,y,w,h,0,0,cc.width,cc.height);return cc.toDataURL('image/jpeg',.74)}async function applyBoxCrop(kind){const el=kind==='question'?qBox:sBox;if(el.style.display==='none')return alert('Run AI Select first or draw a manual crop.');parts[kind].push(boxToCanvas(el));lastCrop=parts[kind][parts[kind].length-1];renderPreviews();setStatus(kind+' AI box applied')};async function stitch(arr){if(!arr.length)return '';if(arr.length===1)return arr[0];const imgs=await Promise.all(arr.map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u})));const w=Math.max(...imgs.map(i=>i.width)),h=imgs.reduce((s,i)=>s+i.height,0),cc=document.createElement('canvas');cc.width=w;cc.height=h;const x=cc.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);let y=0;imgs.forEach(i=>{x.drawImage(i,0,y);y+=i.height});return cc.toDataURL('image/jpeg',.78)}async function renderPreviews(){const q=await stitch(parts.question),s=await stitch(parts.solution);$('qPreview').innerHTML=q?`<img src="${q}">`:'';$('sPreview').innerHTML=s?`<img src="${s}">`:''}async function ocrCrop(){if(!lastCrop)return alert('Crop something first.');setStatus('OCR running...');try{const t=(await Tesseract.recognize(lastCrop,'eng+hin')).data.text.trim();$('qtext').value=t;smartParse(t);setStatus('✔ OCR complete')}catch(e){setStatus('OCR failed: '+e.message)}}function smartParse(t){const z=t.replace(/\n+/g,' ').trim(),a1=z.search(/(?:\(A\)|A\))/i),b1=z.search(/(?:\(B\)|B\))/i),c1=z.search(/(?:\(C\)|C\))/i),d1=z.search(/(?:\(D\)|D\))/i);if(a1>=0){$('qtext').value=z.slice(0,a1).trim();if(b1>=0)$('a').value=z.slice(a1,b1).replace(/(?:\(A\)|A\))/i,'').trim();if(c1>=0)$('b').value=z.slice(b1,c1).replace(/(?:\(B\)|B\))/i,'').trim();if(d1>=0)$('c').value=z.slice(c1,d1).replace(/(?:\(C\)|C\))/i,'').trim();$('d').value=(d1>=0?z.slice(d1):'').replace(/(?:\(D\)|D\))/i,'').trim()}}function clearQuestionFields(){$('qtext').value='';$('a').value='';$('b').value='';$('c').value='';$('d').value='';hideBoxes();setStatus('Fields cleared')}async function aiExtractLastCrop(){if(!lastCrop)return alert('Crop something first.');return aiExtract({imageDataUrl:lastCrop})}async function aiExtractPage(){if(!pdf)return alert('Open a PDF first.');setStatus('Reading page...');try{const p=await pdf.getPage(pageNum),v=p.getViewport({scale:1.5}),cc=document.createElement('canvas');cc.width=v.width;cc.height=v.height;await p.render({canvasContext:cc.getContext('2d'),viewport:v}).promise;const imageDataUrl=cc.toDataURL('image/jpeg',.68),tc=await p.getTextContent(),text=tc.items.map(x=>x.str).join(' ').trim();await aiExtract({pageText:text,imageDataUrl})}catch(e){setStatus('AI page error: '+e.message);alert('AI page error:\n\n'+(e?.message||e))}}async function aiExtract(body){setStatus('🤖 Gemini extracting...');try{const r=await fetch('/api/gemini-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,folders:foldersFlat.join(', ')})}),x=await readApiResponse(r),item=x.items?.[0];if(!item)throw new Error('Gemini returned no question.');$('qno').value=item.qNo||$('qno').value;$('key').value=item.key||$('key').value;$('qtext').value=item.qText||'';$('a').value=item.optA||'';$('b').value=item.optB||'';$('c').value=item.optC||'';$('d').value=item.optD||'';if(item.targetPath){const pp=item.targetPath.split(' / ');if(mainFolders.includes(pp[0])){$('mainCat').value=pp[0];fillSubs();if([...$('subCat').options].some(o=>o.value===item.targetPath))$('subCat').value=item.targetPath}}setStatus('✔ Gemini extraction complete')}catch(e){const msg=e&&e.message?e.message:'Unknown Gemini extraction error';console.error('[Slicer] Gemini extraction failed:',e);setStatus('❌ AI: '+msg);alert('Gemini failed:\n\n'+msg)}}async function saveQuestion(){try{if(!parts.question.length&&!$('qtext').value.trim())return alert('Add a question crop or text.');if(!window.AtoZCore||typeof AtoZCore.externalize!=='function')throw new Error('AtoZCore is not ready. Reload the Slicer page and try again.');setStatus('Compressing images...');const clean=await AtoZCore.externalize({qNo:+$('qno').value||1,subject:$('subCat').value||'General',topic:$('subCat').value||'General',qText:$('qtext').value.trim(),optText:`(A) ${$('a').value.trim()} | (B) ${$('b').value.trim()} | (C) ${$('c').value.trim()} | (D) ${$('d').value.trim()}`,key:$('key').value,question:await stitch(parts.question),solution:await stitch(parts.solution),flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail||'atozexammocks@gmail.com',createdAt:new Date().toISOString()});setStatus('Saving to Firestore...');if(!window.db||!window.collection||!window.addDoc)throw new Error('Firebase is not ready. Reload the Slicer page and try again.');await addDoc(collection(db,'questions'),clean);parts={question:[],solution:[]};lastCrop='';hideBoxes();renderPreviews();setStatus('✔ Saved on Firebase Spark')}catch(e){console.error('[Slicer] Save failed:',e);const msg=e&&e.message?e.message:'Unknown save error';alert('Save failed:\n\n'+msg);setStatus('❌ Save failed: '+msg)}} </script></body></html>
