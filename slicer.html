<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - Slicer Studio</title>
  <script>
    (async function () {
      const SOURCE = 'https://raw.githubusercontent.com/atozexammocks-alt/a-to-z-exam-mocks/c716cf6dacc3c8002170e9ca3d0a3cb181289d4d/slicer.html';
      try {
        const response = await fetch(SOURCE, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Source HTTP ${response.status}`);
        let html = await response.text();

        // Critical hotfix: JavaScript does not support the /x regex flag.
        // The bad /ix flags prevented the entire main script from parsing,
        // so the PDF file-input change listener was never registered.
        html = html.replace(/\/ix/g, '/i');

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div style="font-family:system-ui;padding:24px;background:#060911;color:#fff"><h3 style="color:#f87171">Slicer Studio failed to load</h3><p>Please refresh once. If the problem persists, check the network connection.</p><pre style="white-space:pre-wrap;color:#fca5a5">' + String(error && error.message || error) + '</pre></div>';
        console.error('Slicer bootstrap failed:', error);
      }
    })();
  </script>
</head>
<body style="margin:0;background:#060911;color:#fff;font-family:system-ui">Loading Slicer Studio…</body>
</html>
