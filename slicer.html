  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, setDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.addDoc = addDoc; window.collection = collection; window.getDocs = getDocs; 
    window.setDoc = setDoc; window.getDoc = getDoc; window.doc = doc;

    let libraryTree = [];
    let folderPdfs = {};
    let mainFolders = [];
    let subFolders = {};

    const teacherEmailKey = () => (window.currentTeacherEmail || localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
    const teacherDocId = email => (email || '').replace(/[^a-zA-Z0-9]/g, '_');

    function rebuildFlatFoldersFromTree() {
      mainFolders = libraryTree.map(n => String(n.name || '').trim()).filter(Boolean);
      subFolders = {};
      const collect = (nodes, root, rel = []) => {
        (nodes || []).forEach(n => {
          const name = String(n.name || '').trim();
          if (!name) return;
          const next = rel.concat(name);
          subFolders[root] = subFolders[root] || [];
          subFolders[root].push(next.join(' / '));
          collect(n.children || [], root, next);
        });
      };
      libraryTree.forEach(root => collect(root.children || [], String(root.name || '').trim(), []));
    }

    async function loadLibraryState() {
      try {
        const privateSnap = await window.getDoc(window.doc(window.db, "folder_configs_private", teacherDocId(teacherEmailKey())));
        const privateData = privateSnap.exists() ? privateSnap.data() : {};

        libraryTree = Array.isArray(privateData.libraryTree) ? privateData.libraryTree : [];
        folderPdfs = (privateData.folderPdfs && typeof privateData.folderPdfs === "object") ? { ...privateData.folderPdfs } : {};

        if (!libraryTree.length && Array.isArray(privateData.mainFolders)) {
          libraryTree = privateData.mainFolders.map(name => ({
            id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9),
            name: String(name).trim(),
            type: "folder",
            children: (Array.isArray(privateData.subFolders?.[name]) ? privateData.subFolders[name] : []).map(s => ({
              id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9),
              name: String(s).trim(),
              type: "folder",
              children: []
            }))
          }));
        }

        rebuildFlatFoldersFromTree();
      } catch (e) { console.error("Slicer library registry load failed:", e); }
    }

    window.populateSlicerSubDropdown = function(mainName) {
      renderSlicerFolderPathSelectors(mainName || '');
    };

    let slicerSelectedFolderPath = '';
let slicerLibraryMode = 'private';
window.__a2zSelectedLibrary='private';
function slicerFolderConfig(mode){
  if(mode==='central') return {collection:'folder_configs_central',id:'global_central_tree'};
  if(mode==='group') return {collection:'folder_configs_group',id:teacherDocId(teacherEmailKey())+'_group'};
  return {collection:'folder_configs_private',id:teacherDocId(teacherEmailKey())};
}
async function loadSlicerLibraryMode(mode){
  slicerLibraryMode=mode||'private'; window.__a2zSelectedLibrary=slicerLibraryMode; window.updateSlicerLibraryPickerLabel?.(); slicerSelectedFolderPath='';
  try{
    const conf=slicerFolderConfig(slicerLibraryMode);
    const snap=await window.getDoc(window.doc(window.db,conf.collection,conf.id));
    const data=snap.exists()?snap.data():{};
    libraryTree=Array.isArray(data.libraryTree)?data.libraryTree:[];
    folderPdfs=(data.folderPdfs&&typeof data.folderPdfs==='object')?{...data.folderPdfs}:{};
    if(!libraryTree.length && Array.isArray(data.mainFolders)){
      libraryTree=data.mainFolders.map(name=>({id:'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),name:String(name).trim(),type:'folder',children:(Array.isArray(data.subFolders?.[name])?data.subFolders[name]:[]).map(s=>({id:'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),name:String(s).trim(),type:'folder',children:[]}))})).filter(n=>n.name);
    }
    rebuildFlatFoldersFromTree();
  }catch(e){libraryTree=[];folderPdfs={};console.error(e)}
  window.getSlicerLibraryTree=()=>libraryTree;
  window.setSlicerSelectedFolderPath=(p)=>{slicerSelectedFolderPath=String(p||'');renderSlicerFolderPathSelectors();updateSlicerFolderPathLabel();};
  window.updateSlicerLibraryPickerLabel?.();
  renderSlicerFolderPathSelectors(); updateSlicerFolderPathLabel();
}
function wireSlicerLibraryTabs(){ /* Library selection is handled by the popup picker. */ }
function wireSlicerFolderButtons(){
  const a=document.getElementById('slicerAddMainFolder'),b=document.getElementById('slicerAddSubFolder'),r=document.getElementById('slicerRefreshFolders');
  if(a)a.onclick=()=>addFolderForCurrentLibrary('main');
  if(b)b.onclick=()=>addFolderForCurrentLibrary('sub');
  if(r)r.onclick=()=>loadSlicerLibraryMode(slicerLibraryMode);
}
window.addFolderForCurrentLibrary=async function(kind){
  const name=(prompt(kind==='sub'?'Sub folder name:':'Main folder name:')||'').trim(); if(!name)return;
  if(kind==='main'){
    if(libraryTree.some(n=>String(n.name||'').trim().toLowerCase()===name.toLowerCase()))return alert('Folder already exists here.');
    libraryTree.push({id:'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),name,type:'folder',children:[]});
    slicerSelectedFolderPath=name;
  }else{
    const parent=findNodeByPath(slicerSelectedFolderPath);
    if(!parent)return alert('Select the parent folder first.');
    parent.children=Array.isArray(parent.children)?parent.children:[];
    if(parent.children.some(n=>String(n.name||'').trim().toLowerCase()===name.toLowerCase()))return alert('Sub folder already exists here.');
    parent.children.push({id:'f_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),name,type:'folder',children:[]});
    slicerSelectedFolderPath=slicerSelectedFolderPath+' / '+name;
  }
  rebuildFlatFoldersFromTree(); renderSlicerFolderPathSelectors(); updateSlicerFolderPathLabel();
  if(!await window.saveFolderRegistryToCloud())alert('Failed to save folder to cloud.');
  return true;
}

    function findNodeByPath(path) {
      const parts = String(path || '').split(' / ').filter(Boolean);
      let nodes = libraryTree;
      let node = null;
      for (const part of parts) {
        node = (nodes || []).find(n => String(n.name || '').trim().toLowerCase() === part.trim().toLowerCase());
        if (!node) return null;
        nodes = Array.isArray(node.children) ? node.children : [];
      }
      return node;
    }

    function getChildrenForPath(path) {
      const node = findNodeByPath(path);
      return node && Array.isArray(node.children) ? node.children : [];
    }

    function renderSlicerFolderPathSelectors(mainValue = '') {
      const wrap = document.getElementById('slicer-folder-path-selectors');
      if (!wrap) return;
      wrap.innerHTML = '';

      const savedParts = String(slicerSelectedFolderPath || mainValue || '').split(' / ').filter(Boolean);
      let parentPath = '';
      let nodes = libraryTree;
      let level = 0;

      while (Array.isArray(nodes) && nodes.length) {
        const selectedName = savedParts[level] || '';
        const options = nodes.map(n => String(n.name || '').trim()).filter(Boolean);
        const row = document.createElement('div');
        row.className = 'folder-level';

        const label = document.createElement('span');
        label.className = 'folder-level-label';
        label.textContent = level === 0 ? 'Main Folder' : (level === 1 ? 'Sub Folder' : 'Sub Folder ' + (level + 1));

        const select = document.createElement('select');
        select.className = 'folder-level-select';
        select.innerHTML = '<option value="">— Select —</option>' +
          options.map(n => '<option value="' + n.replace(/"/g, '&quot;') + '">' + n.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</option>').join('');
        if (selectedName && options.includes(selectedName)) select.value = selectedName;

        select.onchange = function() {
          const chosen = this.value;
          const parts = String(slicerSelectedFolderPath || '').split(' / ').filter(Boolean).slice(0, level);
          if (chosen) parts.push(chosen);
          slicerSelectedFolderPath = parts.join(' / ');
          renderSlicerFolderPathSelectors();
          updateSlicerFolderPathLabel();
        };

        row.appendChild(label);
        row.appendChild(select);
        wrap.appendChild(row);

        if (!selectedName || !options.includes(selectedName)) break;
        parentPath = parentPath ? parentPath + ' / ' + selectedName : selectedName;
        const node = (nodes || []).find(n => String(n.name || '').trim().toLowerCase() === selectedName.trim().toLowerCase());
        nodes = node && Array.isArray(node.children) ? node.children : [];
        level++;
      }

      updateSlicerFolderPathLabel();
    }

    function updateSlicerFolderPathLabel() {
      const label = document.getElementById('slicer-selected-folder-path');
      if (label) label.textContent = slicerSelectedFolderPath ? 'Saving to: ' + slicerSelectedFolderPath : 'No folder selected';
    }

    function getSelectedSlicerFolderPath() {
      return String(slicerSelectedFolderPath || '').trim();
    }

    function applySlicerFolderSelections(targetPath) {
      slicerSelectedFolderPath = String(targetPath || '').trim();
      renderSlicerFolderPathSelectors();
      updateSlicerFolderPathLabel();
    }

    window.initSlicerStudio = async function() { wireSlicerLibraryTabs(); wireSlicerFolderButtons(); await loadSlicerLibraryMode(slicerLibraryMode);
      slicerSelectedFolderPath = '';
      renderSlicerFolderPathSelectors();
      updateSlicerFolderPathLabel();
    };

    window.onSlicerMainFolderChange = function() {
      renderSlicerFolderPathSelectors();
      updateSlicerFolderPathLabel();
    };

    function findTreeNodeByName(name) {
      return libraryTree.find(n => String(n.name || '').trim().toLowerCase() === String(name).trim().toLowerCase());
    }

    window.addNewFolderDynamic = async function() {
      const type = prompt("1 = Main Folder\n2 = Sub Folder");
      const name = (prompt(type === "2" ? "Sub Folder name:" : "Main Folder name:") || "").trim();
      if (!name) return;
      if (type === "1") {
        if (libraryTree.some(n => String(n.name||"").trim().toLowerCase() === name.toLowerCase())) return alert("Folder already exists.");
        libraryTree.push({id:"f_"+Date.now(),name,type:"folder",children:[]});
        slicerSelectedFolderPath=name;
      } else {
        const parent=findNodeByPath(slicerSelectedFolderPath);
        if(!parent) return alert("Select the parent folder first.");
        parent.children=Array.isArray(parent.children)?parent.children:[];
        if(parent.children.some(n=>String(n.name||"").trim().toLowerCase()===name.toLowerCase())) return alert("Sub Folder already exists.");
        parent.children.push({id:"f_"+Date.now(),name,type:"folder",children:[]});
        slicerSelectedFolderPath=slicerSelectedFolderPath+" / "+name;
      }
      rebuildFlatFoldersFromTree(); renderSlicerFolderPathSelectors(); updateSlicerFolderPathLabel();
      await window.saveFolderRegistryToCloud();
    };

    window.saveFolderRegistryToCloud = async function() {
      try {
        await window.setDoc(window.doc(window.db, slicerFolderConfig(slicerLibraryMode).collection, slicerFolderConfig(slicerLibraryMode).id), {
          ownerEmail: teacherEmailKey(),
          libraryTree: Array.isArray(libraryTree) ? libraryTree : [],
          folderPdfs: (folderPdfs && typeof folderPdfs === "object") ? folderPdfs : {},
          updatedAt: new Date().toISOString()
        });
        return true;
      } catch(e) { console.error(e); return false; }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const savedEmail = (localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
      if (!savedEmail) { window.location.href = 'teacher.html'; return; }
      window.currentTeacherEmail = savedEmail;
      const userTag = document.getElementById('current-user-tag');
      if (userTag) userTag.textContent = savedEmail;
      await loadLibraryState(); await window.initSlicerStudio();
    });
  </script>

<body>

  <div id="toast-msg">✔ Action Successful!</div>

  <div id="studio-modal-overlay">
    <iframe id="studio-iframe" src=""></iframe>
  </div>

  <div id="prev-q-overlay">
    <div class="prev-q-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:8px;">
        <h3 id="preview-modal-title" style="color:#38bdf8; font-size:16px;">👁️ Live Student Preview (Current Sliced Data)</h3>
        <button class="tool-btn" style="background:#7f1d1d;" onclick="document.getElementById('prev-q-overlay').style.display='none'">✕ Close</button>
      </div>
      <div id="prev-q-body" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <div id="navbar">
    <div class="nav-brand">✂️ A to Z Exam Mocks - Slicer Studio</div>
    <div class="nav-tabs">
      <button class="tool-btn" id="ocr-only-btn" style="background:#065f46; border-color:#10b981;" onclick="window.toggleOcrOnlyMode()">✨ OCR Only Mode: OFF</button>
      <button class="tool-btn" style="background:#0284c7;" onclick="window.openFullscreenEditor()">🖥️ Open Fullscreen Editor Studio</button>
      <button class="tool-btn" style="background:#1d4ed8;" onclick="window.openStudentPreviewModal()">👁️ Student Preview</button>
      <a href="teacher.html" class="nav-btn">🏠 Dashboard</a>
      <span class="user-pill" id="current-user-tag">Educator</span>
    </div>
  </div>

  <div class="slicer-workspace">
    <div id="slicer-left" style="width: 68%; height: 100%; display: flex; flex-direction: column; border-right: 1px solid #1e293b; background: #060911;">
      <div id="slicer-toolbar">
        <label class="tool-btn" style="background:#0284c7; cursor:pointer;">📂 Open PDF<input type="file" id="file-input" accept="application/pdf" style="display:none;"></label>
        
        <span id="chunk-info" style="font-size:10px; color:#38bdf8; font-weight:bold;">Pages: Not Loaded</span>

        <button class="tool-btn" id="btn-prev-page" style="background:#2563eb;">◀ Prev</button>
        <span style="font-size:11px; font-weight:700; color:#cbd5e1;">Page <input type="number" id="page-num-input" class="page-jump-input" min="1" value="1" onchange="window.jumpToSpecificPage(this.value)"> of <span id="page-total-label">0</span></span>
        <button class="tool-btn" id="btn-next-page" style="background:#2563eb;">Next ▶</button>

        <button class="tool-btn" id="zoom-out" style="margin-left:auto;">🔍 -</button>
        <span id="zoom-val" style="font-size:10px;">150%</span>
        <button class="tool-btn" id="zoom-in">🔍 +</button>
        
        <span id="ocr-status-label" style="font-size:9px; color:#10b981; font-weight:bold; margin-left:8px;">✨ HD Crop Ready</span>
      </div>

      <div id="viewport">
        <div id="pdf-single-page-wrap">
          <canvas id="pdf-canvas"></canvas>
          <div id="crop-box"></div>
        </div>
      </div>
    </div>

    <div id="slicer-right">
      <div class="meta-box">
        <label style="display:flex; justify-content:space-between; align-items:center;">
          <span>Book & Section:</span>
          <button class="tool-btn" style="padding:2px 6px; font-size:9px; background:#0284c7;" onclick="window.addNewFolderDynamic()">➕ Add Folder</button>
        </label>
        <div id="a2z-library-picker" class="a2z-library-picker"><span class="a2z-library-picker-label">Library</span><select id="a2z-library-select"><option value="private">🔒 Private Library</option><option value="central">📁 Central Library</option><option value="group">🤝 Group Library</option></select></div>
<div id="slicer-folder-path-selectors" class="slicer-folder-path-selectors"></div>
                <div id="slicer-selected-folder-path" class="slicer-selected-folder-path">No folder selected</div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1.2fr; gap:4px; margin-top:4px;">
          <div><label>Q.No & Ans:</label>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2px;">
              <input type="number" id="vault-qno" value="1" min="1">
              <div id="vault-answer-wrap"></div>
            </div>
          </div>
          <div><label>Question Type:</label>
            <select id="vault-q-type" style="width:100%; background:#0f172a; border:1px solid #334155; color:white; padding:4px; border-radius:4px; font-size:11px;">
              <option value="mcq">MCQ (Single)</option>
              <option value="mcq_multi">MCQ (Multi)</option>
              <option value="very_short">Very Short</option>
              <option value="short">Short Answer</option>
              <option value="long">Long Answer</option>
              <option value="numerical">Numerical</option>
              <option value="fill_blank">Fill in the Blank</option>
              <option value="assertion">Assertion</option>
              <option value="passage">Passage</option>
            </select>
          </div>
          <div><label>Flags / Tags:</label>
            <div class="flag-group">
              <button class="flag-btn" id="flag-red" onclick="window.toggleFlag('red')">🚩</button>
              <button class="flag-btn" id="flag-blue" onclick="window.toggleFlag('blue')">🔵</button>
              <button class="flag-btn" id="flag-green" onclick="window.toggleFlag('green')">🟢</button>
              <button class="flag-btn" id="flag-yellow" onclick="window.toggleFlag('yellow')">🟡</button>
            </div>
          </div>
        </div>

        <label style="margin-top:2px; display:flex; align-items:center; justify-content:space-between;"><span>Question Text Note:</span><button type="button" class="inline-slicer-btn" title="Slice into Question Text" onclick="window.setCropTarget('qtext')">✂️</button></label>
        <textarea id="vault-q-text" rows="2" placeholder="Question statement text..."></textarea>
        
        <label style="color:#38bdf8; margin-top:2px; display:flex; justify-content:space-between;">
          <span>Free OCR Scratchpad:</span>
          <button onclick="document.getElementById('vault-free-ocr').value=''" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">Clear OCR</button>
        </label>
        <textarea id="vault-free-ocr" rows="2" placeholder="Crop text here first, then send to Q.Text or Options..."></textarea>
        
        <div class="ocr-action-bar">
          <button class="ocr-send-btn" onclick="window.sendOcrTo('qtext')">➡️ Q.Text</button>
          <button class="ocr-send-btn" onclick="window.sendOcrTo('opta')">➡️ Opt A</button>
          <button class="ocr-send-btn" onclick="window.sendOcrTo('optb')">➡️ Opt B</button>
          <button class="ocr-send-btn" onclick="window.sendOcrTo('optc')">➡️ Opt C</button>
          <button class="ocr-send-btn" onclick="window.sendOcrTo('optd')">➡️ Opt D</button>
        </div>

        <label id="options-label" style="margin-top:4px; display:flex; justify-content:space-between; align-items:center;">
          <span>Options (A, B, C, D) [2x2 Grid Layout]:</span>
          <button onclick="window.clearMainOptions()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:9px; font-weight:bold;">🗑️ Clear Options</button>
        </label>
        <div class="opt-grid-2x2">
          <div class="opt-row"><span>(A) <button type="button" class="inline-slicer-btn" title="Slice into Option A" onclick="window.setCropTarget('opta')">✂️</button></span><input type="text" id="opt-a" placeholder="Option A"></div>
          <div class="opt-row"><span>(B) <button type="button" class="inline-slicer-btn" title="Slice into Option B" onclick="window.setCropTarget('optb')">✂️</button></span><input type="text" id="opt-b" placeholder="Option B"></div>
          <div class="opt-row"><span>(C) <button type="button" class="inline-slicer-btn" title="Slice into Option C" onclick="window.setCropTarget('optc')">✂️</button></span><input type="text" id="opt-c" placeholder="Option C"></div>
          <div class="opt-row"><span>(D) <button type="button" class="inline-slicer-btn" title="Slice into Option D" onclick="window.setCropTarget('optd')">✂️</button></span><input type="text" id="opt-d" placeholder="Option D"></div>
        </div>
      </div>

      <div class="crop-target-status" style="display:flex;align-items:center;justify-content:flex-end;margin-top:3px;">
        <span id="crop-target-label" style="font-size:9px;color:#64748b;">✂️ Crop target: Question</span>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:4px;">
        <div class="preview-card">
          <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:bold;"><span style="color:#38bdf8;">Q.Img:</span><button onclick="window.clearTarget('question')" style="background:none;border:none;color:#94a3b8;cursor:pointer;">Clear</button></div>
          <div class="preview-thumb-box" id="box-prev-q"><span style="font-size:9px; color:#64748b;">Empty</span></div>
        </div>
        <div class="preview-card">
          <div style="display:flex; justify-content:space-between; font-size:10px; font-weight:bold;"><span style="color:#10b981;">Sol.Img:</span><button onclick="window.clearTarget('solution')" style="background:none;border:none;color:#94a3b8;cursor:pointer;">Clear</button></div>
          <div class="preview-thumb-box" id="box-prev-sol"><span style="font-size:9px; color:#64748b;">Empty</span></div>
        </div>
      </div>

      <button class="tool-btn" id="btn-save-cloud" style="background:#10b981; padding:8px; font-size:12px; font-weight:800; justify-content:center; margin-top:auto;">☁️ Save Question to Cloud</button>
    </div>
  </div>

  <script>
    function showToast(text) {
      const el = document.getElementById('toast-msg');
      if (!el) return;
      el.textContent = text; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    let activeFlags = { red: false, blue: false, green: false, yellow: false };
    let ocrOnlyMode = false;
    let libraryTree = [];
    let folderPdfs = {};
    let mainFolders = [];
    let subFolders = {};

    const teacherEmailKey = () => (window.currentTeacherEmail || localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
    const teacherDocId = email => (email || '').replace(/[^a-zA-Z0-9]/g, '_');

    function rebuildFlatFoldersFromTree() {
      mainFolders = libraryTree.map(n => String(n.name || '').trim()).filter(Boolean);
      subFolders = {};
      const collect = (nodes, root, rel = []) => {
        (nodes || []).forEach(n => {
          const name = String(n.name || '').trim();
          if (!name) return;
          const next = rel.concat(name);
          subFolders[root] = subFolders[root] || [];
          subFolders[root].push(next.join(' / '));
          collect(n.children || [], root, next);
        });
      };
      libraryTree.forEach(root => collect(root.children || [], String(root.name || '').trim(), []));
    }

    async function loadLibraryState() {
      try {
        const privateSnap = await window.getDoc(window.doc(window.db, "folder_configs_private", teacherDocId(teacherEmailKey())));
        const privateData = privateSnap.exists() ? privateSnap.data() : {};

        libraryTree = Array.isArray(privateData.libraryTree) ? privateData.libraryTree : [];
        folderPdfs = (privateData.folderPdfs && typeof privateData.folderPdfs === "object") ? { ...privateData.folderPdfs } : {};

        if (!libraryTree.length && Array.isArray(privateData.mainFolders)) {
          libraryTree = privateData.mainFolders.map(name => ({
            id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9),
            name: String(name).trim(),
            type: "folder",
            children: (Array.isArray(privateData.subFolders?.[name]) ? privateData.subFolders[name] : []).map(s => ({
              id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9),
              name: String(s).trim(),
              type: "folder",
              children: []
            }))
          }));
        }

        rebuildFlatFoldersFromTree();
      } catch (e) { console.error("Slicer library registry load failed:", e); }
    }

    function findNodeByPath(path) {
      const parts = String(path || '').split(' / ').map(s => s.trim()).filter(Boolean);
      if (!parts.length) return null;
      let nodes = libraryTree;
      let node = null;
      for (const part of parts) {
        node = (nodes || []).find(n => String(n.name || '').trim().toLowerCase() === part.toLowerCase());
        if (!node) return null;
        nodes = Array.isArray(node.children) ? node.children : [];
      }
      return node;
    }

    let slicerSelectedFolderPath = '';

    function getSlicerFolderPathFromSelectors() {
      return slicerSelectedFolderPath || '';
    }

    function getChildrenForPath(path) {
      if (!path) return libraryTree;
      const node = findNodeByPath(path);
      return node && Array.isArray(node.children) ? node.children : [];
    }

    window.renderSlicerFolderPathSelectors = function() {
      const box = document.getElementById('slicer-folder-path-selectors');
      if (!box) return;
      box.innerHTML = '';
      const selectedParts = slicerSelectedFolderPath ? slicerSelectedFolderPath.split(' / ').filter(Boolean) : [];
      let nodes = libraryTree;
      let built = [];

      while (Array.isArray(nodes) && nodes.length) {
        const level = built.length;
        const row = document.createElement('div');
        row.className = 'folder-level';
        const label = document.createElement('span');
        label.className = 'folder-level-label';
        label.textContent = level === 0 ? 'Main Folder' : (level === 1 ? 'Sub Folder' : 'Nested Folder ' + level);

        const sel = document.createElement('select');
        sel.className = 'folder-level-select';

        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = level === 0 ? 'Select Main Folder' : '— Save in ' + built[built.length - 1] + ' —';
        sel.appendChild(placeholder);

        nodes.forEach(n => {
          const name = String(n.name || '').trim();
          if (!name) return;
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          sel.appendChild(opt);
        });

        if (selectedParts[level] && nodes.some(n => String(n.name || '').trim() === selectedParts[level])) {
          sel.value = selectedParts[level];
        } else {
          sel.value = '';
        }

        sel.onchange = () => {
          const chosen = sel.value;
          const nextParts = built.slice(0, level);
          if (chosen) nextParts.push(chosen);
          slicerSelectedFolderPath = nextParts.join(' / ');
          window.renderSlicerFolderPathSelectors();
          window.updateSlicerFolderPathLabel();
        };

        row.appendChild(label);
        row.appendChild(sel);
        box.appendChild(row);

        if (!sel.value) break;
        built.push(sel.value);
        const node = findNodeByPath(built.join(' / '));
        nodes = node && Array.isArray(node.children) ? node.children : [];
      }

      window.updateSlicerFolderPathLabel();
    };

    window.applySlicerFolderSelections = function(targetPath) {
      slicerSelectedFolderPath = String(targetPath || '').trim();
      window.renderSlicerFolderPathSelectors();
    };

    window.updateSlicerFolderPathLabel = function() {
      const label = document.getElementById('slicer-selected-folder-path');
      const path = getSlicerFolderPathFromSelectors();
      if (label) label.textContent = path ? 'Saving to: ' + path : 'No folder selected';
    };

    window.initSlicerStudio = function() {
      const box = document.getElementById('slicer-folder-path-selectors');
      if (!box) return;
      if (!slicerSelectedFolderPath && mainFolders.length) slicerSelectedFolderPath = mainFolders[0];
      if (slicerSelectedFolderPath && !findNodeByPath(slicerSelectedFolderPath)) slicerSelectedFolderPath = mainFolders[0] || '';
      window.renderSlicerFolderPathSelectors();
    };

    window.populateSlicerSubDropdown = function() { window.renderSlicerFolderPathSelectors(); };
    window.onSlicerMainFolderChange = function() { window.renderSlicerFolderPathSelectors(); };

    function findTreeNodeByName(name) {
      return libraryTree.find(n => String(n.name || '').trim().toLowerCase() === String(name).trim().toLowerCase());
    }

    window.addNewFolderDynamic = async function() {
      const type = prompt("क्या जोड़ना चाहते हैं? टाइप करें:\n1 -> Main Folder\n2 -> Sub Folder");
      if (type === "1") {
        const newMain = (prompt("नया Main Folder नाम डालें:") || "").trim();
        if (newMain && !findTreeNodeByName(newMain)) {
          libraryTree.push({ id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9), name: newMain, type: "folder", children: [] });
          rebuildFlatFoldersFromTree();
          window.initSlicerStudio();
          const saved = await window.saveFolderRegistryToCloud();
          if (saved) showToast("✔ Main Folder Successfully Added!"); else alert("Failed to save folder to cloud.");
        }
      } else if (type === "2") {
        const currentMain = document.getElementById('vault-main-cat').value;
        if (!currentMain) return alert("Please select a main folder first!");
        const newSub = (prompt(`"${currentMain}" के लिए नया Sub Folder नाम डालें:`) || "").trim();
        const parent = findTreeNodeByName(currentMain);
        if (newSub && parent) {
          parent.children = Array.isArray(parent.children) ? parent.children : [];
          if (!parent.children.some(n => String(n.name || '').trim().toLowerCase() === newSub.toLowerCase())) {
            parent.children.push({ id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 9), name: newSub, type: "folder", children: [] });
            rebuildFlatFoldersFromTree();
            window.populateSlicerSubDropdown(currentMain);
            const saved = await window.saveFolderRegistryToCloud();
            if (saved) showToast("✔ Sub Folder Successfully Added!"); else alert("Failed to save folder to cloud.");
          }
        }
      }
    };

    window.saveFolderRegistryToCloud = async function() {
      try {
        await window.setDoc(window.doc(window.db, "folder_configs_private", teacherDocId(teacherEmailKey())), {
          ownerEmail: teacherEmailKey(),
          libraryTree: Array.isArray(libraryTree) ? libraryTree : [],
          folderPdfs: (folderPdfs && typeof folderPdfs === "object") ? folderPdfs : {},
          updatedAt: new Date().toISOString()
        });
        return true;
      } catch(e) { console.error(e); return false; }
    };

    window.toggleOcrOnlyMode = function() {
      ocrOnlyMode = !ocrOnlyMode;
      const btn = document.getElementById('ocr-only-btn');
      if (btn) {
        if (ocrOnlyMode) {
          btn.style.background = '#d97706'; btn.style.borderColor = '#f59e0b';
          btn.textContent = "✨ OCR Only Mode: ON";
          showToast("✨ OCR Only Mode Enabled (Text Extraction Only)");
        } else {
          btn.style.background = '#065f46'; btn.style.borderColor = '#10b981';
          btn.textContent = "✨ OCR Only Mode: OFF";
          showToast("✂️ Standard HD Crop Mode Enabled");
        }
      }
    };

    window.toggleFlag = function(color) {
      activeFlags[color] = !activeFlags[color];
      const btn = document.getElementById(`flag-${color}`);
      if (btn) btn.className = activeFlags[color] ? `flag-btn active-flag-${color}` : `flag-btn`;
    };

    window.clearMainOptions = function() {
      ['opt-a', 'opt-b', 'opt-c', 'opt-d'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      showToast("🗑️ All Options Cleared!");
    };

    window.sendOcrTo = function(target) {
      const ocrText = document.getElementById('vault-free-ocr').value.trim();
      if (!ocrText) return alert("Free OCR box is empty!");

      if (target === 'qtext') {
        const existing = document.getElementById('vault-q-text').value;
        document.getElementById('vault-q-text').value = existing ? existing + " " + ocrText : ocrText;
      } else if (target === 'opta') {
        document.getElementById('opt-a').value = ocrText;
      } else if (target === 'optb') {
        document.getElementById('opt-b').value = ocrText;
      } else if (target === 'optc') {
        document.getElementById('opt-c').value = ocrText;
      } else if (target === 'optd') {
        document.getElementById('opt-d').value = ocrText;
      }
      
      document.getElementById('vault-free-ocr').value = '';
      showToast(`✔ Sent to ${target.toUpperCase()}!`);
    };

    function renderAnswerControl() {
      const type = document.getElementById('vault-q-type')?.value || 'mcq';
      const wrap = document.getElementById('vault-answer-wrap');
      if (!wrap) return;
      if (type === 'mcq') {

    window.loadPdfChunk = async function(start, end) {
      currentChunkStart = start;
      document.getElementById('chunk-info').textContent = `Pages: ${start}-${end} (Total: ${totalPdfPages})`;
      
      const srcDoc = await PDFLib.PDFDocument.load(originalPdfBytes);
      const newDoc = await PDFLib.PDFDocument.create();
      
      const pageIndices = [];
      for (let i = start - 1; i < end && i < srcDoc.getPageCount(); i++) {
        pageIndices.push(i);
      }
      
      const copiedPages = await newDoc.copyPages(srcDoc, pageIndices);
      copiedPages.forEach(p => newDoc.addPage(p));
      
      const chunkBytes = await newDoc.save();
      pdfDoc = await pdfjsLib.getDocument({ data: chunkBytes }).promise;
      
      pageNum = 1;
      document.getElementById('page-total-label').textContent = totalPdfPages;
      window.renderCurrentPage();
      showToast(`✔ Loaded Range (${start} to ${end})`);
    };

    window.renderCurrentPage = async function() {
      if (!pdfDoc) return;

      const viewportObj = page.getViewport({ scale: pageScale });

      pdfCanvas.width = viewportObj.width;

      const pageWrap = document.getElementById('pdf-single-page-wrap');
      pageWrap.style.width = `${viewportObj.width}px`;
      pageWrap.style.height = `${viewportObj.height}px`;

      const ctx = pdfCanvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: viewportObj }).promise;

      document.getElementById('page-num-input').value = currentChunkStart + pageNum - 1;
      document.getElementById('zoom-val').textContent = `${Math.round(pageScale * 100)}%`;
      viewport.scrollTop = 0;

    window.jumpToSpecificPage = async function(pNum) {

        const targetChunkEnd = Math.min(targetChunkStart + 99, totalPdfPages);
        
        if (targetChunkStart !== currentChunkStart) {
          await window.loadPdfChunk(targetChunkStart, targetChunkEnd);
        }
        pageNum = target - targetChunkStart + 1;
        window.renderCurrentPage();
        showToast(`📄 Jumped to Page ${target}`);
      } else {
        alert(`Enter valid page between 1 and ${totalPdfPages}`);
      }
    };

          const cropLeft = (parseFloat(cropBox.style.left) - (activeCanvas.getBoundingClientRect().left - document.getElementById('pdf-single-page-wrap').getBoundingClientRect().left)) * scaleX;

    // Firebase Firestore documents have a ~1 MiB field limit. Cropped PNG data URLs can easily exceed it.
    // Keep the visual quality high while guaranteeing a safe payload for the question/solution image fields.
    async function compressImageForFirestore(dataUrl, maxBytes = 850000) {
      if (!dataUrl || !/^data:image\//i.test(dataUrl)) return dataUrl || '';
      const estimatedBytes = Math.ceil((dataUrl.length - (dataUrl.indexOf(',') + 1)) * 0.75);
      if (estimatedBytes <= maxBytes) return dataUrl;

      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = dataUrl;
      });

      const maxDimension = 2600;
      const scale = Math.min(1, maxDimension / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
      canvas.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));

      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Start high and step down only until the payload is safely below Firestore's limit.
      for (const quality of [0.9, 0.82, 0.74, 0.66, 0.58, 0.5]) {
        const out = canvas.toDataURL('image/jpeg', quality);
        const bytes = Math.ceil((out.length - (out.indexOf(',') + 1)) * 0.75);
        if (bytes <= maxBytes) return out;
      }

      // Last-resort resize for exceptionally large scans.
      const tighter = document.createElement('canvas');
      const tighterScale = Math.min(1, 1800 / Math.max(canvas.width, canvas.height));
      tighter.width = Math.max(1, Math.round(canvas.width * tighterScale));
      tighter.height = Math.max(1, Math.round(canvas.height * tighterScale));
      const tctx = tighter.getContext('2d', { alpha: false });
      tctx.fillStyle = '#ffffff';
      tctx.fillRect(0, 0, tighter.width, tighter.height);
      tctx.imageSmoothingEnabled = true;
      tctx.imageSmoothingQuality = 'high';
      tctx.drawImage(canvas, 0, 0, tighter.width, tighter.height);
      return tighter.toDataURL('image/jpeg', 0.68);
    }

    async function stitchImages(dataUrls) {
      if (dataUrls.length === 1) return dataUrls[0];
      const loaded = await Promise.all(dataUrls.map(url => new Promise(res => { const img = new Image(); img.onload = () => res(img); img.src = url; })));
      const maxW = Math.max(...loaded.map(i => i.width)), totalH = loaded.reduce((acc, i) => acc + i.height, 0);
      const mCanvas = document.createElement('canvas'); mCanvas.width = maxW; mCanvas.height = totalH;
      const mCtx = mCanvas.getContext('2d'); 
      mCtx.imageSmoothingEnabled = true; 
      mCtx.imageSmoothingQuality = 'high';
      mCtx.fillStyle = '#fff'; mCtx.fillRect(0, 0, maxW, totalH);
      let y = 0; loaded.forEach(img => { mCtx.drawImage(img, 0, y); y += img.height; });
      return mCanvas.toDataURL('image/png', 1.0);
    }

          };

          await window.addDoc(window.collection(window.db, "questions"), newQ);
          window.lastSavedQuestionObject = newQ;

          localStorage.removeItem('Temp_Editor_Synced_Image');
          localStorage.removeItem('Temp_Editor_Image');
          localStorage.removeItem('Temp_Fallback_QText');
          localStorage.removeItem('Temp_Fallback_OptA');
          localStorage.removeItem('Temp_Fallback_OptB');
          localStorage.removeItem('Temp_Fallback_OptC');
          localStorage.removeItem('Temp_Fallback_OptD');

          questionParts = []; solutionParts = []; window.renderLivePreviews();
          if (qTextEl) qTextEl.value = '';
          ['opt-a', 'opt-b', 'opt-c', 'opt-d', 'vault-free-ocr'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
          });
          if (qNoInput) qNoInput.value = qNo + 1;
          
          saveCloudBtn.style.background = '#10b981';
          saveCloudBtn.innerHTML = "✔ Saved Instantly!";
          setTimeout(() => {
            saveCloudBtn.innerHTML = originalText;
          }, 2000);

          showToast(`✔ Q${qNo} Saved HD to Cloud Successfully!`);
        } catch (err) {
          alert("Failed to save question: " + err.message);
          saveCloudBtn.style.background = '#b91c1c';
          saveCloudBtn.innerHTML = "❌ Failed - Try Again";
          setTimeout(() => {
            saveCloudBtn.style.background = '#10b981';
            saveCloudBtn.innerHTML = originalText;
          }, 3000);
        } finally {
          saveCloudBtn.disabled = false;
        }
      };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const savedEmail = (localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
      if (!savedEmail) { window.location.href = 'teacher.html'; return; }
      window.currentTeacherEmail = savedEmail;
      const userTag = document.getElementById('current-user-tag');
      if (userTag) userTag.textContent = savedEmail;
      await loadLibraryState();
      window.initSlicerStudio();
    });
  </script>
