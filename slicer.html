<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks — Slicer Studio</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,addDoc,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyAE7T5cToJKcoUQcj_-GZrQFbbF7Q_KMX0',authDomain:'physicsvault-80a10.firebaseapp.com',projectId:'physicsvault-80a10',storageBucket:'physicsvault-80a10.firebasestorage.app',messagingSenderId:'1043166507399',appId:'1:1043166507399:web:634efdac6f109273d42322'};initializeApp(firebaseConfig);window.db=getFirestore();window.collection=collection;window.addDoc=addDoc;window.doc=doc;window.getDoc=getDoc;window.setDoc=setDoc;window.currentTeacherEmail=localStorage.getItem('ExamVault_Teacher_Email')||'atozexammocks@gmail.com';</script><script type="module" src="./exam-core.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{height:52px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{color:#38bdf8;font-weight:900}.bar{display:flex;gap:6px;align-items:center}button,label.btn{border:1px solid #334155;background:#1e293b;color:white;border-radius:6px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:11px}.primary{background:#0284c7;border-color:#38bdf8}.workspace{display:grid;grid-template-columns:68% 32%;flex:1;min-height:0}.left{display:flex;flex-direction:column;min-width:0;border-right:1px solid #1e293b}.toolbar{display:flex;gap:6px;align-items:center;padding:7px;background:#0b1120;border-bottom:1px solid #1e293b;flex-wrap:wrap}.viewer{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px;position:relative}.page{position:relative;background:#fff;box-shadow:0 15px 40px #000;line-height:0}.page canvas{display:block}.crop{position:absolute;border:2px solid #ef4444;background:#ef444433;display:none;pointer-events:none}.right{padding:10px;background:#0b1120;overflow:auto}.card{background:#060911;border:1px solid #1e293b;border-radius:8px;padding:9px;margin-bottom:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.card input,.card textarea,.card select{width:100%;background:#0f172a;color:white;border:1px solid #334155;border-radius:5px;padding:6px;font-size:11px}.preview{background:#fff;min-height:80px;padding:4px;border-radius:5px}.preview img{max-width:100%;max-height:180px;display:block;margin:auto}.status{color:#10b981;font-weight:800;font-size:11px}.muted{color:#94a3b8;font-size:10px}</style></head><body><header><div class="brand">✂️ A to Z Exam Mocks — Slicer Studio</div><div class="bar"><label class="btn primary">📂 PDF<input id="pdfFile" type="file" accept="application/pdf" hidden></label><button onclick="location.href='teacher.html'">🏠 Dashboard</button></div></header><div class="workspace"><section class="left"><div class="toolbar"><button onclick="prevPage()">◀</button><span>Page <input id="pageNo" type="number" min="1" value="1" style="width:45px;background:#060911;color:white;border:1px solid #334155"> / <b id="total">0</b></span><button onclick="nextPage()">▶</button><button onclick="zoom(-.25)">−</button><span id="zoomLabel">150%</span><button onclick="zoom(.25)">+</button><button class="primary" onclick="setTarget('question')">✂ Question</button><button onclick="setTarget('solution')">💡 Solution</button><span id="status" class="status"></span></div><div id="viewer" class="viewer"><div id="page" class="page"><canvas id="canvas"></canvas><div id="crop" class="crop"></div></div></div></section><aside class="right"><div class="card"><b>📚 Library</b><div class="grid2"><select id="mainCat" onchange="fillSubs()"></select><select id="subCat"></select></div></div><div class="card"><div class="grid2"><label>Q.No<input id="qno" type="number" value="1"></label><label>Answer<select id="key"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div><label>Question Text<textarea id="qtext" rows="4"></textarea></label><div class="grid2"><input id="a" placeholder="Option A"><input id="b" placeholder="Option B"><input id="c" placeholder="Option C"><input id="d" placeholder="Option D"></div><button onclick="ocrCrop()">🔍 OCR last crop</button></div><div class="card"><b>Question image</b><div id="qPreview" class="preview"></div></div><div class="card"><b>Solution image</b><div id="sPreview" class="preview"></div></div><button class="primary" style="width:100%;padding:11px" onclick="saveQuestion()">☁️ Save Question</button><p class="muted">Images are compressed locally and stored directly in Firestore. No Firebase Storage or paid billing is required.</p></aside></div><script>let mainFolders=['Classical Mechanics','Quantum Mechanics','Mathematical Physics','Electronics','EMT','Solid State Mechanics','Thermo & Statical','Atomic','Nuclear','PYP'],subFolders={},pdf=null,pageNum=1,scale=1.5,target='question',parts={question:[],solution:[]},lastCrop='';const c=document.getElementById('canvas'),ctx=c.getContext('2d'),page=document.getElementById('page'),crop=document.getElementById('crop'),viewer=document.getElementById('viewer');function fillFolders(){mainCat.innerHTML=mainFolders.map(x=>`<option>${esc(x)}</option>`).join('');fillSubs()}function fillSubs(){const m=mainCat.value;subCat.innerHTML=(subFolders[m]||['General']).map(x=>`<option>${esc(m+' / '+x)}</option>`).join('')}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setStatus(x){status.textContent=x}function setTarget(x){target=x;setStatus('Target: '+x)}async function init(){try{const s=await getDoc(doc(db,'folder_configs','shared_registry_v4'));if(s.exists()){const d=s.data();mainFolders=d.mainFolders||mainFolders;subFolders=d.subFolders||{}}}catch(e){}fillFolders()}init();pdfFile.onchange=async e=>{const f=e.target.files[0];if(!f)return;pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;total.textContent=pdf.numPages;pageNum=1;render()};async function render(){if(!pdf)return;const p=await pdf.getPage(pageNum),v=p.getViewport({scale});c.width=v.width;c.height=v.height;page.style.width=v.width+'px';page.style.height=v.height+'px';await p.render({canvasContext:ctx,viewport:v}).promise;pageNo.value=pageNum;zoomLabel.textContent=Math.round(scale*100)+'%';crop.style.display='none'}function prevPage(){if(pdf&&pageNum>1){pageNum--;render()}}function nextPage(){if(pdf&&pageNum<pdf.numPages){pageNum++;render()}}function zoom(d){if(pdf){scale=Math.min(3,Math.max(.75,scale+d));render()}}let down=null;viewer.onmousedown=e=>{if(!pdf)return;const r=c.getBoundingClientRect();down={x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top)),r};crop.style.display='block';crop.style.left=down.x+'px';crop.style.top=down.y+'px'};window.onmousemove=e=>{if(!down)return;const x=Math.max(0,Math.min(down.r.width,e.clientX-down.r.left)),y=Math.max(0,Math.min(down.r.height,e.clientY-down.r.top));crop.style.left=Math.min(down.x,x)+'px';crop.style.top=Math.min(down.y,y)+'px';crop.style.width=Math.abs(x-down.x)+'px';crop.style.height=Math.abs(y-down.y)+'px'};window.onmouseup=()=>{if(!down)return;const r=down.r,box={x:+crop.style.left,y:+crop.style.top,w:+crop.style.width,h:+crop.style.height};down=null;if(box.w<8||box.h<8)return;const sx=c.width/r.width,sy=c.height/r.height,cc=document.createElement('canvas');cc.width=Math.round(box.w*sx);cc.height=Math.round(box.h*sy);cc.getContext('2d').drawImage(c,box.x*sx,box.y*sy,cc.width,cc.height,0,0,cc.width,cc.height);lastCrop=cc.toDataURL('image/jpeg',.82);parts[target].push(lastCrop);renderPreviews();setStatus(target+' crop added')};async function stitch(arr){if(!arr.length)return '';if(arr.length===1)return arr[0];const imgs=await Promise.all(arr.map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u})));const w=Math.max(...imgs.map(i=>i.width)),h=imgs.reduce((s,i)=>s+i.height,0),cc=document.createElement('canvas');cc.width=w;cc.height=h;const x=cc.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);let y=0;imgs.forEach(i=>{x.drawImage(i,0,y);y+=i.height});return cc.toDataURL('image/jpeg',.84)}async function renderPreviews(){qPreview.innerHTML=parts.question.length?`<img src="${await stitch(parts.question)}">`:'';sPreview.innerHTML=parts.solution.length?`<img src="${await stitch(parts.solution)}">`:''}async function ocrCrop(){if(!lastCrop)return alert('Crop something first.');setStatus('OCR running...');try{qtext.value=(await Tesseract.recognize(lastCrop,'eng+hin')).data.text.trim();setStatus('OCR complete')}catch(e){setStatus('OCR failed')}}async function saveQuestion(){try{if(!parts.question.length&&!qtext.value.trim())return alert('Add a question crop or text.');setStatus('Compressing images...');const clean=await AtoZCore.externalize({qNo:+qno.value||1,subject:subCat.value||'General',topic:subCat.value||'General',qText:qtext.value.trim(),optText:`(A) ${a.value.trim()} | (B) ${b.value.trim()} | (C) ${c.value.trim()} | (D) ${d.value.trim()}`,key:key.value,question:await stitch(parts.question),solution:await stitch(parts.solution),flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail||'atozexammocks@gmail.com',createdAt:new Date().toISOString()});setStatus('Saving to Firestore...');await addDoc(collection(db,'questions'),clean);parts={question:[],solution:[]};lastCrop='';renderPreviews();setStatus('✔ Saved on free Firebase Spark plan')}catch(e){console.error(e);alert('Save failed: '+e.message);setStatus('Save failed')}} </script></body></html>
