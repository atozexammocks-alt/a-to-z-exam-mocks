<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - My Performance & Solutions</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.collection = collection; window.getDocs = getDocs; 
    window.doc = doc; window.getDoc = getDoc;

    window.onload = () => {
      const studentEmail = localStorage.getItem('ExamVault_Student_Email');
      if (!studentEmail) {
        alert("Please login first from the Student Portal!");
        window.location.href = 'student.html';
      } else {
        document.getElementById('student-user-tag').textContent = studentEmail;
        loadStudentPerformanceHistory();
      }
    };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #060911; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #navbar { height: 56px; background: #0b1120; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
    .nav-brand { font-size: 16px; font-weight: 800; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .nav-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-btn:hover { border-color: #38bdf8; color: white; }
    .student-pill { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 24px; max-width: 1000px; width: 100%; margin: 0 auto; }
    .section-title { font-size: 18px; font-weight: 800; color: #f8fafc; border-bottom: 2px solid #1e293b; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .history-card { background: #0b1120; border: 1px solid #1e293b; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .rank-pill { background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.35); color:#fbbf24; padding:4px 9px; border-radius:12px; font-size:11px; font-weight:800; }
    
    /* CHART & MODAL STYLES */
    .chart-container { background: #0b1120; border: 1.5px solid #1e293b; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .chart-bars-wrapper { display: flex; align-items: flex-end; gap: 20px; height: 180px; padding: 10px 20px 0 20px; border-bottom: 2px solid #334155; border-left: 2px solid #334155; position: relative; margin-top: 10px; }
    .chart-bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
    .chart-bar { width: 40px; background: linear-gradient(180deg, #38bdf8 0%, #2563eb 100%); border-radius: 6px 6px 0 0; }
    .chart-bar-val { font-size: 11px; font-weight: 800; color: #10b981; margin-bottom: 2px; }
    .chart-bar-label { font-size: 11px; color: #94a3b8; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }

    #solution-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 60000; padding: 20px; }
    .sol-modal-card { background: #0b1120; border: 2px solid #38bdf8; border-radius: 14px; width: 850px; max-height: 90vh; padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; color: #f8fafc; }
    .sol-q-box { background: #060911; border: 1px solid #334155; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>

  <!-- SOLUTION REVIEW MODAL -->
  <div id="solution-modal-overlay">
    <div class="sol-modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:10px;">
        <h3 id="sol-modal-title" style="color:#38bdf8; font-size:16px;">🔍 Test Detailed Solutions</h3>
        <button class="nav-btn" style="background:#7f1d1d; color:#fecaca;" onclick="document.getElementById('solution-modal-overlay').style.display='none'">✕ Close</button>
      </div>
      <div id="sol-modal-body" style="display:flex; flex-direction:column; gap:16px; overflow-y:auto; max-height:70vh;">
        <p style="text-align:center; color:#64748b;">Loading solutions...</p>
      </div>
    </div>
  </div>

  <div id="navbar">
    <a href="student.html" class="nav-brand">📚 A to Z Exam Mocks</a>
    <div class="nav-actions">
      <span class="student-pill" id="student-user-tag">Student</span>
      <a href="student.html" class="nav-btn">🎯 Back to Portal</a>
    </div>
  </div>

  <div class="main-content">
    <div class="section-title">
      <span>📈 My Performance Analytics & Test History</span>
      <span style="font-size:12px; color:#38bdf8;" id="history-count-tag">0 Tests Attempted</span>
    </div>
    
    <!-- Graphical Bar Chart Section -->
    <div class="chart-container" id="performance-chart-box" style="display:none;">
      <h3 style="color:#38bdf8; font-size:14px;">📊 Score Progression Chart (% Wise)</h3>
      <div class="chart-bars-wrapper" id="chart-bars-container"></div>
    </div>

    <div id="student-history-container" style="display:flex; flex-direction:column; gap:12px;">
      <p style="color:#64748b; font-size:13px;">Loading your performance records...</p>
    </div>
  </div>

  <script>
    let allTestResultsCache = [];

    async function loadStudentPerformanceHistory() {
      const studentEmail = localStorage.getItem('ExamVault_Student_Email');
      const historyContainer = document.getElementById('student-history-container');
      const chartBox = document.getElementById('performance-chart-box');
      const chartBarsContainer = document.getElementById('chart-bars-container');
      
      historyContainer.innerHTML = `<p style="color:#64748b; font-size:13px;">Loading scorecard & chart...</p>`;
      chartBox.style.display = 'none';

      try {
        const snap = await window.getDocs(window.collection(window.db, "student_results"));
        historyContainer.innerHTML = '';
        chartBarsContainer.innerHTML = '';
        allTestResultsCache = [];
        let myAttempts = 0;
        const allByTest = {};
        snap.forEach(d => {
          const x = { id:d.id, ...d.data() };
          if (x.testId) {
            if (!allByTest[x.testId]) allByTest[x.testId] = [];
            allByTest[x.testId].push(x);
          }
        });
        let chartHtml = '';

        snap.forEach(d => {
          const res = { id: d.id, ...d.data() };
          if (res.studentEmail && res.studentEmail.toLowerCase() === studentEmail) {
            allTestResultsCache.push(res);
            myAttempts++;
            const total = res.totalMarks || 100;
            const score = res.score || 0;
            const percentage = Math.round((score / total) * 100);
            const shortTitle = (res.testTitle || 'Test').length > 12 ? (res.testTitle || 'Test').slice(0, 10) + '..' : (res.testTitle || 'Test');
            const ranked = (allByTest[res.testId] || []).slice().sort((a,b) => {
              const sa = Number(a.score || 0), sb = Number(b.score || 0);
              if (sb !== sa) return sb - sa;
              const ta = Number.isFinite(Number(a.timeTaken)) ? Number(a.timeTaken) : Number.MAX_SAFE_INTEGER;
              const tb = Number.isFinite(Number(b.timeTaken)) ? Number(b.timeTaken) : Number.MAX_SAFE_INTEGER;
              return ta - tb;
            });
            const rank = ranked.findIndex(x => x.id === res.id) + 1;
            const participantCount = ranked.length;

            chartHtml += `
              <div class="chart-bar-item">
                <span class="chart-bar-val">${percentage}%</span>
                <div class="chart-bar" style="height: ${percentage}%;" title="${res.testTitle}: ${score}/${total} (${percentage}%)"></div>
                <span class="chart-bar-label" title="${res.testTitle}">${shortTitle}</span>
              </div>
            `;

            const card = document.createElement('div');
            card.className = 'history-card';
            card.innerHTML = `
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="color:#38bdf8; font-size:15px;">🎯 ${res.testTitle || 'Mock Test'}</h3>
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;"><span class="rank-pill">🏆 Rank: ${rank}/${participantCount}</span><span style="font-weight:800; color:#10b981; font-size:14px;">Score: ${score} / ${total} (${percentage}%)</span></div>
              </div>
              <div style="font-size:12px; color:#94a3b8; display:flex; justify-content:space-between; align-items:center;">
                <span>Attempt Date: ${new Date(res.submittedAt || Date.now()).toLocaleDateString()}</span>
                <a href="leaderboard.html?id=${encodeURIComponent(res.testId || "")}" class="nav-btn" style="background:#f59e0b; color:#fff; padding:4px 10px; font-size:11px; text-decoration:none;">🏆 Leaderboard</a>
                <button class="nav-btn" style="background:#2563eb; color:white; padding:4px 10px; font-size:11px;" onclick="openSolutionReview('${res.id}')">🔍 View Detailed Solution</button>
              </div>
            `;
            historyContainer.appendChild(card);
          }
        });

        document.getElementById('history-count-tag').textContent = `${myAttempts} Tests Attempted`;
        
        if (myAttempts > 0) {
          chartBarsContainer.innerHTML = chartHtml;
          chartBox.style.display = 'flex';
        } else {
          historyContainer.innerHTML = `<p style="color:#64748b; font-size:13px;">You haven't attempted any mock tests yet. Go back to the portal and start a test!</p>`;
        }
      } catch (e) {
        historyContainer.innerHTML = `<p style="color:#ef4444; font-size:13px;">Failed to load test history.</p>`;
      }
    }

    window.openSolutionReview = async function(resultId) {
      const res = allTestResultsCache.find(r => r.id === resultId);
      if (!res) return;

      const modalBody = document.getElementById('sol-modal-body');
      document.getElementById('sol-modal-title').textContent = `🔍 Solutions: ${res.testTitle}`;
      modalBody.innerHTML = `<p style="text-align:center; color:#64748b;">Fetching test questions from cloud...</p>`;
      document.getElementById('solution-modal-overlay').style.display = 'flex';

      try {
        const docRef = window.doc(window.db, "published_tests", res.testId);
        const docSnap = await window.getDoc(docRef);

        if (!docSnap.exists()) {
          modalBody.innerHTML = `<p style="color:#ef4444; font-size:13px;">Test questions data not found.</p>`;
          return;
        }

        const testData = docSnap.data();
        let questions = testData.questions || [];

        if (questions.length === 0) {
          const totalParts = testData.totalParts || 25;
          for (let i = 1; i <= totalParts; i++) {
            try {
              const partRef = window.doc(window.db, "published_tests", `${res.testId}_part${i}`);
              const partSnap = await window.getDoc(partRef);
              if (partSnap.exists() && partSnap.data().questions) {
                questions = questions.concat(partSnap.data().questions);
              }
            } catch (err) {}
          }
        }

        modalBody.innerHTML = '';
        if (questions.length === 0) {
          modalBody.innerHTML = `<p style="color:#64748b; font-size:13px;">No questions available for this test.</p>`;
          return;
        }

        questions.forEach((q, idx) => {
          const correctKey = (q.key || 'A').trim().toUpperCase();
          const userAns = res.userResponses && res.userResponses[idx] ? res.userResponses[idx] : 'Not Answered';
          const isCorrect = userAns === correctKey;

          const box = document.createElement('div');
          box.className = 'sol-q-box';
          box.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:800; color:#38bdf8;">
              <span>Question ${idx + 1}</span>
              <span style="padding:2px 8px; border-radius:4px; font-size:11px; background:${isCorrect ? 'rgba(16,185,129,0.2); color:#10b981;' : 'rgba(239,68,68,0.2); color:#ef4444;'}">
                ${isCorrect ? '✔ Correct' : '✖ Incorrect / Skipped'}
              </span>
            </div>
            ${q.question ? `<div style="background:white; padding:10px; border-radius:6px; display:flex; justify-content:center;"><img src="${q.question}" style="max-width:100%; height:auto;"></div>` : ''}
            <div style="font-size:12px; color:#cbd5e1; display:flex; gap:16px; margin-top:4px;">
              <span>Your Answer: <strong style="color:${isCorrect ? '#10b981' : '#ef4444'}">${userAns}</strong></span>
              <span>Correct Answer Key: <strong style="color:#10b981">${correctKey}</strong></span>
            </div>
          `;
          modalBody.appendChild(box);
        });

      } catch (e) {
        modalBody.innerHTML = `<p style="color:#ef4444; font-size:13px;">Error loading questions solutions.</p>`;
      }
    };
  </script>
</body>
</html>
