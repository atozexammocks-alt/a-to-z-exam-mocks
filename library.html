  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, setDoc, getDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.teacherAuthReady = signInAnonymously(window.auth).catch(e => { console.warn("Anonymous Firebase session unavailable:", e); return null; });
    window.addDoc = addDoc; window.collection = collection; window.getDocs = getDocs; 
    window.setDoc = setDoc; window.getDoc = getDoc; window.doc = doc; window.deleteDoc = deleteDoc;
    window.updateDoc = updateDoc;
    window.firebaseSignOut = signOut;

    const SUPER_ADMINS = ["atozexammocks@gmail.com", "vikasattri3003@gmail.com"];
    window.SUPER_ADMINS = SUPER_ADMINS;
    const teacherEmailDocId = email => (email || "").replace(/[^a-zA-Z0-9]/g, "_");

    window.checkSuperAdminStatus = function(email) {
      const adminBtn = document.getElementById("super-admin-nav-btn");
      if (adminBtn) adminBtn.style.display = email && SUPER_ADMINS.includes(email.toLowerCase()) ? "inline-flex" : "none";
    };

    window.handleTeacherLogin = async function() {
      const email=(document.getElementById('teacher-auth-email')?.value||'').trim().toLowerCase();
      const pin=(document.getElementById('teacher-auth-password')?.value||'').trim();
      const status=document.getElementById('teacher-auth-status');
      if(!email || !email.includes('@')) { if(status) status.textContent='Please enter a valid teacher email.'; return; }
      if(!pin) { if(status) status.textContent='Please enter your PIN.'; return; }
      try {
        await window.teacherAuthReady;
        const ref=doc(window.db,'registered_teachers',teacherEmailDocId(email));
        const snap=await getDoc(ref);
        if(!snap.exists() || snap.data().active===false) { if(status) status.textContent='Login failed.'; return; }
        const data=snap.data();
        const correctPin=String(data.pin ?? data.PIN ?? data.password ?? '').trim();
        if(!correctPin || pin!==correctPin) { if(status) status.textContent='Login failed.'; return; }
        window.currentTeacherEmail=email;
        window.currentTeacherUid='pin:'+teacherEmailDocId(email);
        localStorage.setItem('ExamVault_Teacher_Email',email);
        localStorage.setItem('ExamVault_Teacher_UID',window.currentTeacherUid);
        if(status) status.textContent='✔ Login successful.';
        const overlay=document.getElementById('auth-overlay'); if(overlay) overlay.style.display='none';
        const tag=document.getElementById('current-user-tag'); if(tag) tag.textContent=email;
        window.checkSuperAdminStatus(email);
        await Promise.all([loadLibraryStateFromCloud(),initStudio()]);
      } catch(e) { console.error('Teacher PIN login failed:',e); if(status) status.textContent='Login failed.'; }
    };
  </script>

    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; overflow-y: auto; padding-bottom: 20px; }

    <!-- हेडर सेक्शन: ब्रेडक्रैम्ब, बैक बटन और क्रिएट फोल्डर एक सीध में -->

  <script>
    (async function restoreTeacherSession() {
      const savedEmail = (localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
      if (!savedEmail) return;
      window.currentTeacherEmail = savedEmail;
      window.currentTeacherUID = localStorage.getItem('ExamVault_Teacher_UID') || ('pin:' + savedEmail.replace(/[^a-zA-Z0-9]/g, '_'));
      const overlay = document.getElementById('auth-overlay');
      if (overlay) overlay.style.display = 'none';
      const tag = document.getElementById('current-user-tag');
      if (tag) tag.textContent = savedEmail;
      if (window.checkSuperAdminStatus) window.checkSuperAdminStatus(savedEmail);
      try {
        if (window.teacherAuthReady) await window.teacherAuthReady;
        await loadLibraryStateFromCloud();
        await initStudio();
      } catch (e) {}
    })();

    function showToast(text) {
      const el = document.getElementById('toast-msg');
      if(!el) return;
      el.textContent = text; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    async function logoutTeacher() {
      try {
        if (window.firebaseSignOut && window.auth) await window.firebaseSignOut(window.auth);
      } catch (e) {}
      localStorage.removeItem("ExamVault_Teacher_Email");
      localStorage.removeItem("ExamVault_Teacher_UID");
      window.location.replace("index.html");
    }

    const teacherEmailKey = () => (window.currentTeacherEmail || localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
    const teacherDocId = email => (email || '').replace(/[^a-zA-Z0-9]/g, '_');

    let libraryTree = [];
    let folderPdfs = {};
    let cloudVault = [];
    let currentFolderPath = "";

    async function loadLibraryStateFromCloud() {
      try {
        if (!window.db) return;
        const ref = window.doc(window.db, "folder_configs_private", teacherDocId(teacherEmailKey()));
        const snap = await window.getDoc(ref);
        const data = snap.exists() ? snap.data() : {};
        libraryTree = Array.isArray(data.libraryTree) ? data.libraryTree : [];
        folderPdfs = (data.folderPdfs && typeof data.folderPdfs === "object") ? {...data.folderPdfs} : {};
      } catch (e) {}
    }

    async function saveLibraryState() {
      try {
        if (!window.db) return false;
        const email = teacherEmailKey();
        if (!email) return false;
        if (window.teacherAuthReady) await window.teacherAuthReady;
        await window.setDoc(window.doc(window.db, "folder_configs_private", teacherDocId(email)), {
          ownerEmail: email,
          libraryTree: Array.isArray(libraryTree) ? libraryTree : [],
          folderPdfs: (folderPdfs && typeof folderPdfs === "object") ? folderPdfs : {},
          updatedAt: new Date().toISOString()
        });
        return true;
      } catch (e) {
        return false;
      }
    }

    function makeFolder(name) {
      return {
        id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2,9),
        name: String(name).trim(),
        type: "folder",
        children: []
      };
    }

    function findFolderByPath(path) {
      const parts = String(path || "").split(" / ").map(x => x.trim()).filter(Boolean);
      let level = libraryTree, node = null;
      for (const part of parts) {
        node = level.find(x => x.name === part);
        if (!node) return null;
        level = Array.isArray(node.children) ? node.children : [];
      }
      return node;
    }

    function getChildrenForPath(path) {
      if (!path) return libraryTree;
      const node = findFolderByPath(path);
      return node && Array.isArray(node.children) ? node.children : [];
    }

    window.promptNewFolder = async function() {
      const promptTitle = currentFolderPath 
        ? `Create Subfolder inside "${currentFolderPath}"` 
        : "Create Library Folder\n\nExample: 11-12th, Physics, JEE";
      
      const name = (prompt(promptTitle) || "").trim();
      if(!name) return;

      if (!currentFolderPath) {
        if(!Array.isArray(libraryTree)) libraryTree=[];
        if(libraryTree.some(n => String(n.name||"").trim().toLowerCase() === name.toLowerCase())) {
          return alert("Folder with this name already exists!");
        }
        libraryTree.push(makeFolder(name));
      } else {
        const parent = findFolderByPath(currentFolderPath);
        if(!parent) return;
        parent.children = Array.isArray(parent.children) ? parent.children : [];
        if(parent.children.some(n => n.name.toLowerCase() === name.toLowerCase())) {
          return alert("Folder with this name already exists here!");
        }
        parent.children.push(makeFolder(name));
      }

      const saved = await saveLibraryState();
      if(!saved) {
        if (!currentFolderPath) libraryTree.pop();
        else findFolderByPath(currentFolderPath).children.pop();
        return alert("Failed to save folder to cloud.");
      }

      renderLibraryBrowser();
      showToast("✔ Folder Created Successfully!");
    };

    window.openMainFolder = function(path) {
      currentFolderPath = path;
      renderLibraryBrowser();
    };

    window.backToFolderCards = function() {
      currentFolderPath = "";
      renderLibraryBrowser();
    };

    window.goBackFolder = function() {
      if (!currentFolderPath) return;
      const parts = currentFolderPath.split(" / ");
      if (parts.length > 1) {
        currentFolderPath = parts.slice(0, -1).join(" / ");
      } else {
        currentFolderPath = "";
      }
      renderLibraryBrowser();
    };

    function renderBreadcrumb() {
      const el = document.getElementById('library-main-title');
      const backBtn = document.getElementById('back-nav-btn');
      const parts = currentFolderPath ? currentFolderPath.split(" / ") : [];
      
      if (parts.length > 0) {
        if(backBtn) backBtn.style.display = 'inline-block';
      } else {
        if(backBtn) backBtn.style.display = 'none';
      }

      el.innerHTML = parts.length
        ? '<span style="color:#94a3b8;cursor:pointer;" onclick="backToFolderCards()">📚 My Library</span> <span style="color:#64748b;">›</span> ' + parts.map((p,i)=>{
            const path = parts.slice(0,i+1).join(" / ");
            return '<span style="color:' + (i === parts.length-1 ? '#38bdf8' : '#cbd5e1') + ';cursor:pointer;" onclick="openMainFolder(\'' + path.replace(/'/g,"\\'") + '\')">' + p + '</span>';
          }).join(' <span style="color:#64748b;">›</span> ')
        : '📚 My Library';
    }

    function renderLibraryBrowser() {
      const cards = document.getElementById('folder-cards-container');
      if(!cards) return;

      renderBreadcrumb();
      const children = getChildrenForPath(currentFolderPath);
      cards.innerHTML = '';

      if(children.length){
        children.forEach(node => {
          const path = currentFolderPath ? currentFolderPath + ' / ' + node.name : node.name;
          const card = document.createElement('div'); 
          card.className = 'folder-card'; 
          card.onclick = () => openMainFolder(path);
          card.innerHTML = '<div style="font-size:32px;">📁</div><h3 style="color:#f8fafc;font-size:15px;">' + escapeHtml(node.name) + '</h3><p style="font-size:11px;color:#94a3b8;">Subfolders: ' + (node.children||[]).length + '</p><div class="folder-actions"><button class="tool-btn" onclick="event.stopPropagation();moveFolder(\'' + path.replace(/'/g,'\\\'') + '\')">🔄 Move</button><button class="tool-btn" style="background:#059669;" onclick="event.stopPropagation();publishFolderToCentral(\'' + path.replace(/'/g,'\\\'') + '\')">🌐 Central</button><button class="tool-btn" style="background:#7f1d1d;" onclick="event.stopPropagation();deleteFolderByPath(\'' + path.replace(/'/g,'\\\'') + '\')">🗑 Delete</button></div>';
          cards.appendChild(card);
        });
      } else {
        const empty = document.createElement('div'); 
        empty.style = 'padding:30px;text-align:center;color:#64748b;border:1px dashed #334155;border-radius:10px;grid-column:1/-1;';
        empty.innerHTML = '📂 This folder is empty.<br><span style="font-size:11px;">Click "Create Folder" above to add subfolders.</span>';
        cards.appendChild(empty);
      }
    }

    window.openCentralLibraryModal = function() {
      alert("Central Library feature is ready for public and shared questions.");
    };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    
    window.moveFolder = async function(path){
      const target = prompt("Move folder to path (leave blank for Library Root):", "");
      if(target===null) return;
      alert("Move action placeholder ready. Connect this to your Firebase move logic.");
    };

    window.publishFolderToCentral = async function(path){
      alert("Publish to Central Library: " + path);
    };

    window.deleteFolderByPath = async function(path){
      if(!confirm("Delete this folder and all subfolders?")) return;
      alert("Delete action placeholder ready. Connect this to your delete logic.");
    };


    async function initStudio() {
      renderLibraryBrowser();
      try {
        const snap = await window.getDocs(window.collection(window.db, "questions"));
        cloudVault = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch (e) {}
    }
  </script>
