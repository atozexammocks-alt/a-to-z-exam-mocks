<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A to Z Exam Mocks - Library Manager</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 3L1 9l11 6 9-4.91V17h2V9M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z'/></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, setDoc, getDoc, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0",
      authDomain: "physicsvault-80a10.firebaseapp.com",
      projectId: "physicsvault-80a10",
      storageBucket: "physicsvault-80a10.firebasestorage.app",
      messagingSenderId: "1043166507399",
      appId: "1:1043166507399:web:634efdac6f109273d42322"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.teacherAuthReady = signInAnonymously(window.auth).catch(e => { console.warn("Anonymous session unavailable:", e); return null; });
    window.addDoc = addDoc; window.collection = collection; window.getDocs = getDocs; 
    window.setDoc = setDoc; window.getDoc = getDoc; window.doc = doc; window.deleteDoc = deleteDoc;
    window.updateDoc = updateDoc;
    window.firebaseSignOut = signOut;

    const SUPER_ADMINS = ["atozexammocks@gmail.com", "vikasattri3003@gmail.com"];
    window.SUPER_ADMINS = SUPER_ADMINS;

    window.checkSuperAdminStatus = function(email) {
      const adminBtn = document.getElementById("super-admin-nav-btn");
      if (adminBtn) adminBtn.style.display = email && SUPER_ADMINS.includes(email.toLowerCase()) ? "inline-flex" : "none";
    };
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #060911; color: #f8fafc; overflow: hidden; }

    #toast-msg {
      position: fixed; bottom: 24px; right: 24px; background: #10b981; color: #ffffff;
      padding: 12px 20px; border-radius: 8px; font-weight: 800; font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; z-index: 100000;
    }

    #navbar { height: 56px; background: #0b1120; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; flex-shrink: 0; }
    .nav-brand { font-size: 16px; font-weight: 900; color: #38bdf8; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-tabs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .nav-btn:hover { border-color: #38bdf8; color: white; }
    .user-pill { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    /* Library Mode Switcher Bar */
    .library-mode-bar { background: #090d16; border-bottom: 1px solid #1e293b; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
    .lib-mode-tab { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 7px 16px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .lib-mode-tab:hover { border-color: #38bdf8; color: white; background: #1e293b; }
    .lib-mode-tab.active { background: #2563eb; border-color: #38bdf8; color: white; }

    .view-screen { flex: 1; display: flex !important; flex-direction: column; height: calc(100vh - 105px); width: 100%; overflow: hidden; padding: 20px; gap: 12px; }
    
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; overflow-y: auto; padding-bottom: 20px; }
    .folder-card { background: #0b1120; border: 1.5px solid #1e293b; border-radius: 12px; padding: 16px; cursor: pointer; position: relative; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .folder-card:hover { border-color: #38bdf8; transform: translateY(-2px); }

    .breadcrumb-bar { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; color: #38bdf8; width: 100%; }
    .tool-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; }
    .folder-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .folder-actions .tool-btn { font-size: 10px; padding: 4px 8px; }
  </style>

<style>
.profile-container{position:relative;display:inline-block}.profile-dropdown{position:absolute;right:0;top:40px;background:#0b1120;border:1px solid #334155;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.8);width:220px;display:none;flex-direction:column;z-index:1000;overflow:hidden}.profile-dropdown.show{display:flex}.dropdown-header{padding:12px 16px;border-bottom:1px solid #1e293b;font-size:12px;color:#38bdf8;font-weight:700;word-break:break-all}.dropdown-item{padding:10px 16px;font-size:12px;color:#fecaca;background:#7f1d1d;border:0;cursor:pointer;text-align:left;font-weight:700;width:100%}.dropdown-item:hover{background:#991b1b}
</style>
</head>
<body>
  <script>
    (function(){
      try {
        if ((localStorage.getItem('ExamVault_Teacher_Email') || '').trim()) {
          document.addEventListener('DOMContentLoaded', function(){
            const overlay = document.getElementById('auth-overlay');
            if(overlay) overlay.style.display = 'none';
          });
        }
      } catch(e) {}
    })();
  </script>

  <div id="toast-msg">✔ Action Successful!</div>

  <!-- AUTH OVERLAY -->
  <div id="auth-overlay" style="position:fixed; inset:0; background:#060911; display:flex; align-items:center; justify-content:center; z-index:99999;">
    <div style="background:#0b1120; border:1.5px solid #38bdf8; width:400px; border-radius:16px; padding:24px; text-align:center; display:flex; flex-direction:column; gap:14px;">
      <h3 style="color:#38bdf8;">Educator Login</h3>
      <input type="email" id="teacher-auth-email" placeholder="educator@gmail.com" style="padding:10px; background:#060911; border:1px solid #334155; color:#fff; border-radius:6px;">
      <input type="password" id="teacher-auth-password" placeholder="PIN" style="padding:10px; background:#060911; border:1px solid #334155; color:#fff; border-radius:6px;">
      <button class="tool-btn" style="background:#2563eb; padding:10px;" onclick="handleTeacherLogin()">Login</button>
      <a href="index.html" style="color:#94a3b8; font-size:12px; text-decoration:none;">Back to Home</a>
    </div>
  </div>

  <div id="navbar">
    <a href="teacher.html" class="nav-brand">
      🏠 <span>A to Z Exam Mocks</span>
    </a>
    <div class="nav-tabs">
      <a class="nav-btn" href="teacher.html">🏠 Dashboard</a>
      <a href="admin.html" class="nav-btn" id="super-admin-nav-btn" style="display:none; background:#2563eb; color:white; border-color:#38bdf8;">👑 Super Admin Panel</a>
      <div class="profile-container">
        <div class="user-pill" onclick="toggleProfileDropdown()">
          👤 <span id="current-user-tag">Educator</span> ▼
        </div>
        <div class="profile-dropdown" id="profile-dropdown-menu">
          <div class="dropdown-header" id="dropdown-user-email">Not Logged In</div>
          <button class="dropdown-item" onclick="logoutTeacher()">🔒 Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- INDEPENDENT LIBRARY MODE SWITCHER -->
  <div class="library-mode-bar">
    <span style="font-size: 11px; font-weight: bold; color: #94a3b8;"><i class="fa-solid fa-layer-group"></i> Library Views:</span>
    <button class="lib-mode-tab active" id="mode-tab-private" onclick="switchLibraryMode('private')">🔒 Private / My Library</button>
    <button class="lib-mode-tab" id="mode-tab-central" onclick="switchLibraryMode('central')">📁 Central Library</button>
    <button class="lib-mode-tab" id="mode-tab-group" onclick="switchLibraryMode('group')">🤝 Group Library</button>
  </div>

  <!-- LIBRARY VIEW SCREEN WITH FOLDER CREATION ENABLED FOR ALL MODES -->
  <div class="view-screen" id="screen-library">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0; background:#0b1120; border:1px solid #1e293b; padding:10px 16px; border-radius:10px; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px; flex:1;">
        <button id="back-nav-btn" class="tool-btn" style="background:#334155; display:none;" onclick="goBackFolder()">⬅ Back</button>
        <div class="breadcrumb-bar" id="library-main-title">📚 Private Library</div>
      </div>
      <button id="create-folder-btn" class="tool-btn" style="background:#2563eb; white-space:nowrap;" onclick="promptNewFolder()">＋ Create Folder</button>
    </div>

    <div id="folder-cards-view" style="display:flex; flex-direction:column; gap:10px; overflow:hidden; flex:1;">
      <div class="folder-grid" id="folder-cards-container"></div>
    </div>
  </div>

  <script>
    function showToast(text) {
      const el = document.getElementById('toast-msg');
      if(!el) return;
      el.textContent = text; el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2000);
    }

    const teacherEmailKey = () => (window.currentTeacherEmail || localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
    const teacherDocId = email => (email || '').replace(/[^a-zA-Z0-9]/g, '_');

    let activeLibraryMode = "private"; // "private", "central", or "group"
    let privateLibraryTree = [];
    let centralLibraryTree = [];
    let groupLibraryTree = [];
    let currentFolderPath = "";

    window.switchLibraryMode = async function(mode) {
      activeLibraryMode = mode;
      currentFolderPath = "";

      document.querySelectorAll('.lib-mode-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`mode-tab-${mode}`)?.classList.add('active');

      // सभी मोड्स (Private, Central, Group) में अब फोल्डर क्रिएट करने का ऑप्शन उपलब्ध है
      const createBtn = document.getElementById('create-folder-btn');
      if (createBtn) {
        createBtn.style.display = 'inline-block';
      }

      await loadLibraryStateForCurrentMode();
      renderLibraryBrowser();
    };

    async function loadLibraryStateForCurrentMode() {
      try {
        if (!window.db) return;
        const email = teacherEmailKey();
        if (!email) return;

        if (activeLibraryMode === 'private') {
          const ref = window.doc(window.db, "folder_configs_private", teacherDocId(email));
          const snap = await window.getDoc(ref);
          const data = snap.exists() ? snap.data() : {};
          privateLibraryTree = Array.isArray(data.libraryTree) ? data.libraryTree : [];
        } else if (activeLibraryMode === 'central') {
          const ref = window.doc(window.db, "folder_configs_central", "global_central_tree");
          const snap = await window.getDoc(ref);
          const data = snap.exists() ? snap.data() : {};
          centralLibraryTree = Array.isArray(data.libraryTree) ? data.libraryTree : [];
        } else if (activeLibraryMode === 'group') {
          const ref = window.doc(window.db, "folder_configs_group", teacherDocId(email) + "_group");
          const snap = await window.getDoc(ref);
          const data = snap.exists() ? snap.data() : {};
          groupLibraryTree = Array.isArray(data.libraryTree) ? data.libraryTree : [];
        }
      } catch (e) {
        console.error("Failed to load library state for mode:", activeLibraryMode, e);
      }
    }

    async function saveLibraryStateForCurrentMode() {
      try {
        if (!window.db) return false;
        const email = teacherEmailKey();
        if (!email) return false;
        if (window.teacherAuthReady) await window.teacherAuthReady;

        if (activeLibraryMode === 'private') {
          await window.setDoc(window.doc(window.db, "folder_configs_private", teacherDocId(email)), {
            ownerEmail: email,
            libraryTree: privateLibraryTree,
            updatedAt: new Date().toISOString()
          });
        } else if (activeLibraryMode === 'central') {
          await window.setDoc(window.doc(window.db, "folder_configs_central", "global_central_tree"), {
            libraryTree: centralLibraryTree,
            updatedAt: new Date().toISOString()
          });
        } else if (activeLibraryMode === 'group') {
          await window.setDoc(window.doc(window.db, "folder_configs_group", teacherDocId(email) + "_group"), {
            ownerEmail: email,
            libraryTree: groupLibraryTree,
            updatedAt: new Date().toISOString()
          });
        }
        return true;
      } catch (e) {
        console.error("Failed to save library state:", e);
        return false;
      }
    }

    function getCurrentActiveTree() {
      if (activeLibraryMode === 'central') return centralLibraryTree;
      if (activeLibraryMode === 'group') return groupLibraryTree;
      return privateLibraryTree;
    }

    function makeFolder(name) {
      return {
        id: "f_" + Date.now() + "_" + Math.random().toString(36).slice(2,9),
        name: String(name).trim(),
        type: "folder",
        children: []
      };
    }

    function findFolderByPath(path) {
      const parts = String(path || "").split(" / ").map(x => x.trim()).filter(Boolean);
      let level = getCurrentActiveTree(), node = null;
      for (const part of parts) {
        node = level.find(x => x.name === part);
        if (!node) return null;
        level = Array.isArray(node.children) ? node.children : [];
      }
      return node;
    }

    function getChildrenForPath(path) {
      if (!path) return getCurrentActiveTree();
      const node = findFolderByPath(path);
      return node && Array.isArray(node.children) ? node.children : [];
    }

    window.promptNewFolder = async function() {
      let modeName = "Private Library";
      if (activeLibraryMode === 'central') modeName = "Central Library";
      if (activeLibraryMode === 'group') modeName = "Group Library";

      const promptTitle = currentFolderPath 
        ? `Create Subfolder inside "${currentFolderPath}" (${modeName})` 
        : `Create Library Folder (${modeName})\n\nExample: Physics, Mathematics`;
      
      const name = (prompt(promptTitle) || "").trim();
      if(!name) return;

      const tree = getCurrentActiveTree();
      if (!currentFolderPath) {
        if(!Array.isArray(tree)) tree = [];
        if(tree.some(n => String(n.name||"").trim().toLowerCase() === name.toLowerCase())) {
          return alert("Folder with this name already exists in this library!");
        }
        tree.push(makeFolder(name));
      } else {
        const parent = findFolderByPath(currentFolderPath);
        if(!parent) return;
        parent.children = Array.isArray(parent.children) ? parent.children : [];
        if(parent.children.some(n => n.name.toLowerCase() === name.toLowerCase())) {
          return alert("Folder with this name already exists here!");
        }
        parent.children.push(makeFolder(name));
      }

      const saved = await saveLibraryStateForCurrentMode();
      if(!saved) {
        if (!currentFolderPath) tree.pop();
        else findFolderByPath(currentFolderPath).children.pop();
        return alert("Failed to save folder to cloud.");
      }

      renderLibraryBrowser();
      showToast(`✔ Folder Created Successfully in ${modeName}!`);
    };

    window.openMainFolder = function(path) {
      currentFolderPath = path;
      renderLibraryBrowser();
    };

    window.backToFolderCards = function() {
      currentFolderPath = "";
      renderLibraryBrowser();
    };

    window.goBackFolder = function() {
      if (!currentFolderPath) return;
      const parts = currentFolderPath.split(" / ");
      if (parts.length > 1) {
        currentFolderPath = parts.slice(0, -1).join(" / ");
      } else {
        currentFolderPath = "";
      }
      renderLibraryBrowser();
    };

    function renderBreadcrumb() {
      const el = document.getElementById('library-main-title');
      const backBtn = document.getElementById('back-nav-btn');
      const parts = currentFolderPath ? currentFolderPath.split(" / ") : [];
      
      if(backBtn) backBtn.style.display = parts.length > 0 ? 'inline-block' : 'none';

      let modeTitle = "📚 Private Library";
      if (activeLibraryMode === 'central') modeTitle = "📁 Central Library";
      if (activeLibraryMode === 'group') modeTitle = "🤝 Group Library";

      el.innerHTML = parts.length
        ? `<span style="color:#94a3b8;cursor:pointer;" onclick="backToFolderCards()">${modeTitle}</span> <span style="color:#64748b;">›</span> ` + parts.map((p,i)=>{
            const path = parts.slice(0,i+1).join(" / ");
            return `<span style="color:` + (i === parts.length-1 ? '#38bdf8' : '#cbd5e1') + `;cursor:pointer;" onclick="openMainFolder(\`` + path + `\`)">` + p + `</span>`;
          }).join(' <span style="color:#64748b;">›</span> ')
        : modeTitle;
    }

    function renderLibraryBrowser() {
      const cards = document.getElementById('folder-cards-container');
      if(!cards) return;

      renderBreadcrumb();
      const children = getChildrenForPath(currentFolderPath);
      cards.innerHTML = '';

      if(children.length){
        children.forEach(node => {
          const path = currentFolderPath ? currentFolderPath + ' / ' + node.name : node.name;
          const card = document.createElement('div'); 
          card.className = 'folder-card'; 
          card.onclick = () => openMainFolder(path);
          card.innerHTML = `
            <div style="font-size:32px;">📁</div>
            <h3 style="color:#f8fafc;font-size:15px;">` + escapeHtml(node.name) + `</h3>
            <p style="font-size:11px;color:#94a3b8;">Subfolders: ` + (node.children||[]).length + `</p>
          `;
          cards.appendChild(card);
        });
      } else {
        const empty = document.createElement('div'); 
        empty.style = 'padding:30px;text-align:center;color:#64748b;border:1px dashed #334155;border-radius:10px;grid-column:1/-1;';
        empty.innerHTML = '📂 This folder is empty.<br><span style="font-size:11px;">Click "Create Folder" above to add folders.</span>';
        cards.appendChild(empty);
      }
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    window.handleTeacherLogin = async function() {
      const email = document.getElementById('teacher-auth-email').value.trim().toLowerCase();
      if (!email) return alert("Enter email");
      localStorage.setItem('ExamVault_Teacher_Email', email);
      window.currentTeacherEmail = email;
      document.getElementById('auth-overlay').style.display = 'none';
      document.getElementById('current-user-tag').textContent = email;
      await loadLibraryStateForCurrentMode();
      renderLibraryBrowser();
    };

    window.logoutTeacher = function() {
      localStorage.removeItem('ExamVault_Teacher_Email');
      localStorage.removeItem('ExamVault_Teacher_UID');
      window.location.replace('index.html');
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const savedEmail = (localStorage.getItem('ExamVault_Teacher_Email') || '').trim().toLowerCase();
      if (savedEmail) {
        window.currentTeacherEmail = savedEmail;
        const tag = document.getElementById('current-user-tag');
        if (tag) tag.textContent = savedEmail;
        const overlay = document.getElementById('auth-overlay');
        if (overlay) overlay.style.display = 'none';
      }
      await loadLibraryStateForCurrentMode();
      renderLibraryBrowser();
    });
  </script>
</body>
</html>
