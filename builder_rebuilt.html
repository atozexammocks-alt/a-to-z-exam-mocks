<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A to Z Exam Mocks — Test Builder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Segoe UI,sans-serif;background:#060911;color:#f8fafc}
body{overflow:hidden}.top{height:58px;background:#0b1120;border-bottom:1px solid #243044;display:flex;align-items:center;gap:14px;padding:0 16px}
.brand{color:#38bdf8;font-weight:900;text-decoration:none;display:flex;align-items:center;gap:8px}.brand img{width:32px;height:32px;object-fit:contain}
.tabs{display:flex;gap:5px;flex:1;justify-content:center}.tab,.btn{border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:7px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer}.tab.active{background:#2563eb;color:#fff;border-color:#38bdf8}
.user{font-size:11px;color:#38bdf8;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{position:absolute;top:62px;left:14px;z-index:20;font-size:10px;color:#94a3b8}.folders{height:48px;background:#090d16;border-bottom:1px solid #243044;display:flex;align-items:center;gap:7px;padding:7px 12px;overflow-x:auto}.chip{white-space:nowrap}
.layout{height:calc(100vh - 106px);display:grid;grid-template-columns:250px minmax(0,1fr) 300px;min-height:0}
.left,.right{background:#090d16;overflow:auto}.left{border-right:1px solid #243044}.right{border-left:1px solid #243044;padding:12px}
.left h4{font-size:11px;color:#94a3b8;margin:12px}.tree{padding:0 8px}.tree button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12px}.tree button:hover,.tree button.active{background:#1d4ed8;color:#fff}.sub{padding-left:18px}
.center{min-width:0;display:flex;flex-direction:column;overflow:hidden}.bar{height:46px;flex-shrink:0;background:#0b1120;border-bottom:1px solid #243044;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px}.grid{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.card{background:#0b1120;border:1px solid #263449;border-radius:8px;padding:9px;cursor:pointer}.card.sel{border-color:#10b981;box-shadow:0 0 0 1px #10b981}.qhead{display:flex;justify-content:space-between;color:#94a3b8;font-size:10px;font-weight:800}.qbody{margin-top:7px;font-size:12px;line-height:1.5}.qimg{margin-top:7px;background:#fff;border-radius:5px;padding:4px;text-align:center;max-height:180px;overflow:hidden}.qimg img{max-width:100%;max-height:170px;object-fit:contain}.field{margin-bottom:10px}.field label{display:block;color:#94a3b8;font-size:10px;font-weight:800;margin-bottom:4px}.field input,.field select{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:8px;font-size:12px}.publish{width:100%;background:#10b981;color:#fff;border:0;border-radius:7px;padding:12px;font-weight:900;cursor:pointer;font-size:13px}.publish:hover{background:#059669}.outline{width:100%;margin-top:7px}.count{color:#10b981;font-weight:900}.empty{grid-column:1/-1;text-align:center;padding:55px 15px;color:#64748b}
@media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.right{display:none}.grid{grid-template-columns:1fr}.tabs{justify-content:flex-start;overflow:auto}.user{display:none}}
</style>
</head>
<body>
<header class="top">
<a class="brand" href="teacher.html"><img src="./icon.png" onerror="this.style.display='none'"><span>A to Z Exam Mocks</span></a>
<div class="tabs">
<button class="tab active" data-mode="private">🔒 Private</button>
<button class="tab" data-mode="central">🏛 Central</button>
<button class="tab" data-mode="group">👥 Group</button>
</div>
<div id="user" class="user">Loading...</div>
</header>
<div id="status" class="status">Connecting to Firebase...</div>
<div id="folders" class="folders"></div>
<div class="layout">
<aside class="left"><h4>BOOKS & SECTIONS <span id="total" class="count">0</span></h4><div id="tree" class="tree"></div></aside>
<main class="center">
<div class="bar"><span>Active: <b id="crumb">All Folders</b> — <span id="shown" class="count">0</span> Questions</span><button id="selectAll" class="btn">Select / Deselect Visible</button></div>
<div id="grid" class="grid"><div class="empty">Loading questions...</div></div>
</main>
<aside class="right">
<h3 style="margin:2px 0 14px;color:#38bdf8;font-size:15px">Publish Mock Test <span id="selectedCount" class="count">0 Selected</span></h3>
<div class="field"><label>TEST TITLE</label><input id="title" value="Practice Test 1"></div>
<div class="field"><label>TIME (MINUTES)</label><input id="time" type="number" value="60"></div>
<div class="field"><label>TOTAL MARKS</label><input id="marks" type="number" value="100"></div>
<div class="field"><label>PRICE (₹) — 0 FOR FREE</label><input id="price" type="number" value="0" min="0"></div>
<div class="field"><label>TEST RULE</label><select id="rule"><option value="normal">Normal — Allow Return</option><option value="noReturn">No Return</option></select></div>
<button id="publish" class="publish">🚀 PUBLISH NOW</button>
<button id="print" class="btn outline">🖨 Print Selected Questions</button>
<button id="paper" class="btn outline">📋 Paper Pattern / Blueprint</button>
</aside>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyAE7T5cToJKcoUQcj_-GZrQFBBF7Q_KMX0",authDomain:"physicsvault-80a10.firebaseapp.com",projectId:"physicsvault-80a10",storageBucket:"physicsvault-80a10.firebasestorage.app",messagingSenderId:"1043166507399",appId:"1:1043166507399:web:634efdac6f109273d42322"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const email=(localStorage.getItem("ExamVault_Teacher_Email")||"").trim().toLowerCase();
document.getElementById("user").textContent=email||"Educator";
let all=[],visible=[],selected=new Set(),mode="private",root="ALL",section="ALL",paths={};

const norm=v=>String(v||"").replace(/\\/g,"/").split("/").map(x=>x.trim()).filter(Boolean).join(" / ");
function pathOf(q){return norm(q.folderPath||q.path||q.libraryPath||(q.folder?norm(q.folder)+(q.subfolder?" / "+norm(q.subfolder):""):"")||q.subject||"")}
function central(q){return q?.central===true||q?.isCentral===true||String(q?.libraryMode||"").toLowerCase()==="central"||String(q?.targetLibrary||"").toLowerCase()==="central"}
function group(q){return q?.group===true||String(q?.libraryMode||"").toLowerCase()==="group"||String(q?.targetLibrary||"").toLowerCase()==="group"}
function img(q){const a=[q.questionImage,q.image,q.img,q.imageData,q.croppedImage,q.questionImageData,q.imageUrl,q.imageURL,q.diagram,q.imageSrc,q.src,q.base64Image,q.question];return a.map(x=>String(x||"").trim()).find(x=>/^data:image\\//i.test(x)||/^https?:\\/\\//i.test(x))||""}
function textOf(q){return q.qText||q.questionText||q.text||""}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function match(q,t){const a=pathOf(q),b=norm(t);return !b||a===b||a.startsWith(b+" / ")}

function classify(){
 if(mode==="central")visible=all.filter(central);
 else if(mode==="group")visible=all.filter(group);
 else {visible=all.filter(q=>!central(q)&&!group(q));if(all.length&&!visible.length)visible=all.slice();}
}
function rebuildPaths(){
 paths={};
 visible.forEach(q=>{const p=pathOf(q);if(!p)return;const a=p.split(" / ");paths[a[0]]=paths[a[0]]||new Set();if(a.length>1)paths[a[0]].add(a.slice(1).join(" / "))});
}
function renderFolders(){
 const el=document.getElementById("folders");el.innerHTML="";
 const add=(name,active,fn)=>{const b=document.createElement("button");b.className="btn chip"+(active?" active":"");b.textContent=name;b.onclick=fn;el.appendChild(b)};
 add("📁 All Folders",root==="ALL",()=>{root="ALL";section="ALL";renderAll()});
 Object.keys(paths).sort().forEach(p=>add("📂 "+p,root===p,()=>{root=p;section="ALL";renderAll()}));
}
function renderTree(){
 const el=document.getElementById("tree");el.innerHTML="";
 const allBtn=document.createElement("button");allBtn.className=root==="ALL"&&section==="ALL"?"active":"";allBtn.innerHTML="▾ <b>All Sections</b> <span style='float:right'>"+visible.length+"</span>";allBtn.onclick=()=>{root="ALL";section="ALL";renderAll()};el.appendChild(allBtn);
 Object.keys(paths).sort().forEach(r=>{
   const b=document.createElement("button");b.innerHTML=(root===r?"▾ ":"▸ ")+"📂 "+r;b.className=root===r&&section==="ALL"?"active":"";b.onclick=()=>{root=r;section="ALL";renderAll()};el.appendChild(b);
   if(root===r) [...paths[r]].sort().forEach(s=>{const x=document.createElement("button");x.className="sub "+(section===s?"active":"");x.textContent="↳ "+s;x.onclick=()=>{root=r;section=s;renderAll()};el.appendChild(x)})
 })
 document.getElementById("total").textContent=visible.length+" Qs";
}
function renderGrid(){
 let list=visible.filter(q=>root==="ALL"||(match(q,root)&& (section==="ALL"||match(q,root+" / "+section))));
 const g=document.getElementById("grid");g.innerHTML="";
 document.getElementById("shown").textContent=list.length;document.getElementById("crumb").textContent=section==="ALL"?(root==="ALL"?"All Folders":root):root+" / "+section;
 if(!list.length){g.innerHTML='<div class="empty">No questions available here.</div>';return}
 list.forEach((q,i)=>{
  const c=document.createElement("div");c.className="card"+(selected.has(q.id)?" sel":"");
  const im=img(q),tx=textOf(q);
  c.innerHTML="<div class='qhead'><span>Q"+(i+1)+(q.qNo?" · Source "+esc(q.qNo):"")+"</span><span>"+(selected.has(q.id)?"✓ Selected":"")+"</span></div>"+(im?"<div class='qimg'><img src='"+esc(im)+"'></div>":"")+(tx?"<div class='qbody'>"+esc(tx).replace(/\n/g,"<br>")+"</div>":"");
  c.onclick=()=>{selected.has(q.id)?selected.delete(q.id):selected.add(q.id);renderGrid();updateCount()};g.appendChild(c);
 })
}
function renderAll(){renderFolders();renderTree();renderGrid();updateCount()}
function updateCount(){document.getElementById("selectedCount").textContent=selected.size+" Selected";localStorage.setItem("AZ_BUILDER_SELECTED_IDS",JSON.stringify([...selected]))}

async function load(){
 try{
  document.getElementById("status").textContent="Signing in and reading questions collection...";
  await signInAnonymously(auth);
  const snap=await getDocs(collection(db,"questions"));
  all=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById("status").textContent="Firebase connected • "+all.length+" questions found";
  classify();rebuildPaths();renderAll();
 }catch(e){console.error(e);document.getElementById("status").textContent="Firebase error: "+(e.code||e.message||e);document.getElementById("grid").innerHTML='<div class="empty">Unable to load Firebase questions.<br><br>'+esc(e.message||e)+'</div>'}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;root="ALL";section="ALL";classify();rebuildPaths();renderAll()});
document.getElementById("selectAll").onclick=()=>{const ids=visible.filter(q=>root==="ALL"||(match(q,root)&&(section==="ALL"||match(q,root+" / "+section)))).map(q=>q.id);const yes=ids.every(id=>selected.has(id));ids.forEach(id=>yes?selected.delete(id):selected.add(id));renderGrid();updateCount()};
document.getElementById("publish").onclick=async()=>{
 if(!selected.size)return alert("कृपया कम से कम एक question select करें।");
 const btn=document.getElementById("publish");btn.disabled=true;btn.textContent="Publishing...";
 try{await addDoc(collection(db,"published_tests"),{title:document.getElementById("title").value.trim()||"Mock Test",timeMinutes:+document.getElementById("time").value||60,totalMarks:+document.getElementById("marks").value||100,price:+document.getElementById("price").value||0,questionIds:[...selected],creatorEmail:email,libraryMode:mode,folderPath:section!=="ALL"?root+" / "+section:(root==="ALL"?"":root),rules:{noReturn:document.getElementById("rule").value==="noReturn"},createdAt:new Date().toISOString()});alert("🚀 Test Published Successfully!");}catch(e){alert("Publish failed: "+(e.message||e))}finally{btn.disabled=false;btn.textContent="🚀 PUBLISH NOW"}
};
document.getElementById("print").onclick=()=>{if(!selected.size)return alert("Select questions first.");const qs=all.filter(q=>selected.has(q.id));const w=window.open("","_blank");w.document.write("<html><head><title>Question Paper</title><style>body{font-family:Arial;padding:30px}img{max-width:100%;max-height:250px} .q{margin-bottom:24px;page-break-inside:avoid}</style></head><body><h2>"+esc(document.getElementById("title").value)+"</h2>"+qs.map((q,i)=>"<div class='q'><b>Q"+(i+1)+".</b> "+esc(textOf(q)).replace(/\n/g,"<br>")+(img(q)?"<br><img src='"+esc(img(q))+"'>":"")+"</div>").join("")+"</body></html>");w.document.close();w.focus();setTimeout(()=>w.print(),500)};
document.getElementById("paper").onclick=()=>{localStorage.setItem("AZ_BUILDER_SELECTED_IDS",JSON.stringify([...selected]));window.location.href="paper_designer.html"};
load();
</script>
</body></html>
