<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks - Mock Tests</title><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const a=initializeApp({apiKey:'AIzaSyAE7T5cToJKcoUQcj_-GZrQFBBF7Q_KMX0',authDomain:'physicsvault-80a10.firebaseapp.com',projectId:'physicsvault-80a10',storageBucket:'physicsvault-80a10.firebasestorage.app',messagingSenderId:'1043166507399',appId:'1:1043166507399:web:634efdac6f109273d42322'});window.db=getFirestore(a);window.collection=collection;window.getDocs=getDocs;</script><style>body{margin:0;background:#060911;color:#f8fafc;font-family:system-ui}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#0b1120;border:1px solid #1e293b;border-radius:12px;padding:16px;margin:10px 0}.btn{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:9px 14px;border-radius:7px;font-weight:800;font-size:12px;margin-top:8px}.muted{color:#94a3b8;font-size:12px}</style></head><body><div class="wrap"><a class="btn" href="student.html">← Student Portal</a><h1>📝 Mock Tests</h1><p class="muted">Live tests published by the teacher are listed here.</p><div id="list">Loading tests...</div></div><script>async function load(){const el=document.getElementById('list');try{const s=await getDocs(collection(db,'published_tests'));if(s.empty){el.innerHTML='<div class="card">No published mock tests available yet.</div>';return}el.innerHTML='';s.forEach(d=>{const t=d.data(),n=t.questionIds?.length||t.questions?.length||0;const c=document.createElement('div');c.className='card';c.innerHTML=`<h3>${String(t.title||'Mock Test').replace(/</g,'&lt;')}</h3><div class="muted">⏱ ${t.time||60} mins · 🎯 ${t.marks||100} marks · ❓ ${n} questions</div><a class="btn" href="test_player.html?id=${encodeURIComponent(d.id)}">▶ Start Mock Test</a>`;el.appendChild(c)})}catch(e){el.innerHTML='<div class="card">Unable to load mock tests: '+String(e.message||e)+'</div>'}}load();</script></body></html>
