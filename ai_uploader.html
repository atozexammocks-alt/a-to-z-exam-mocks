<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks — Smart PDF Uploader</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,addDoc,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyAE7T5cToJKcoUQcj_-GZrQFbbF7Q_KMX0',authDomain:'physicsvault-80a10.firebaseapp.com',projectId:'physicsvault-80a10',storageBucket:'physicsvault-80a10.firebasestorage.app',messagingSenderId:'1043166507399',appId:'1:1043166507399:web:634efdac6f109273d42322'};initializeApp(cfg);window.db=getFirestore();window.collection=collection;window.addDoc=addDoc;window.doc=doc;window.getDoc=getDoc;window.currentTeacherEmail=localStorage.getItem('ExamVault_Teacher_Email')||'atozexammocks@gmail.com';</script><style>*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{height:52px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{font-weight:900;color:#38bdf8}.wrap{padding:18px;overflow:auto;flex:1}.box,.q{background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:12px}.q{display:grid;grid-template-columns:minmax(250px,1fr) minmax(310px,1.2fr);gap:14px}.qright{border-left:1px solid #1e293b;padding-left:14px}.q textarea,.q input,.q select{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:5px;padding:7px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,label.btn{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:11px}.primary{background:#0284c7!important;border-color:#38bdf8!important}.stop{background:#7f1d1d!important;border-color:#ef4444!important}.status{color:#10b981;font-weight:800}.progress{height:8px;background:#0f172a;border:1px solid #334155;border-radius:99px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:#38bdf8;transition:width .2s}.preview{background:#fff;color:#111;border-radius:8px;padding:16px;min-height:180px;max-height:520px;overflow:auto;line-height:1.55}.preview .opts{margin-top:12px}.preview .op{padding:7px 9px;border-bottom:1px solid #ddd}.preview img{max-width:100%;display:block;margin:5px 0;border-radius:4px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#172033;color:#93c5fd;font-size:10px;font-weight:800;margin-right:4px}.figure{border:1px dashed #94a3b8;padding:4px;margin-top:4px}.muted{color:#94a3b8;font-size:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalcard{background:#0b1120;border:1px solid #334155;border-radius:12px;max-width:900px;max-height:92vh;overflow:auto;padding:16px;width:100%}.modalcard img{width:100%;background:#fff}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}@media(max-width:850px){.q{grid-template-columns:1fr}.qright{border-left:0;border-top:1px solid #1e293b;padding:14px 0 0}}</style></head><body><header><div class="brand">📄 A to Z Exam Mocks — Smart PDF Uploader</div><button onclick="location.href='teacher.html'">🏠 Dashboard</button></header><main class="wrap"><div class="box"><p style="color:#94a3b8">Upload a PDF. AI reads each rendered page, extracts questions and A/B/C/D options, detects figure regions, and prepares a live mock-test-style review.</p><label class="btn primary">📂 Choose PDF<input id="file" type="file" accept="application/pdf" hidden></label> <button id="stop" class="stop" onclick="stopRequested=true" disabled>⛔ Stop</button> <span id="status" class="status"></span><div class="progress"><div id="progressBar"></div></div></div><div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b>Review extracted questions</b><button class="primary" onclick="saveAll()">🚀 Save All to Library</button></div><div id="list"></div></div></main><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalcard"><div class="modalhead"><b id="modalTitle">Question Preview</b><button onclick="closeModal()">✕ Close</button></div><div id="modalBody"></div></div></div><script>let items=[],pageImages={},folders=['General / General'],stopRequested=false;const status=document.getElementById('status'),list=document.getElementById('list'),progressBar=document.getElementById('progressBar'),stopBtn=document.getElementById('stop'),modal=document.getElementById('modal');async function loadFolders(){try{const s=await getDoc(doc(db,'folder_configs','shared_registry_v4'));if(s.exists()){const d=s.data();folders=[];for(const[m,ss]of Object.entries(d.subFolders||{}))ss.forEach(x=>folders.push(m+' / '+x));if(!folders.length)folders=['General / General']}}catch(e){}}setTimeout(loadFolders,400);function setProgress(n,total){progressBar.style.width=`${total?Math.round(n*100/total):0}%`}async function renderPageImage(p){const maxChars=3500000;let scale=1.25,q=.65,last='';for(let i=0;i<5;i++){const v=p.getViewport({scale}),c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);await p.render({canvasContext:c.getContext('2d',{alpha:false}),viewport:v}).promise;last=c.toDataURL('image/jpeg',q);if(last.length<=maxChars)return last;if(q>.5)q-=.07;else scale-=.12}return last}function cropFromDataUrl(src,b,pad=5,quality=.62,maxW=1000){if(!src||!b)return'';const im=new Image();return new Promise(resolve=>{im.onload=()=>{let x=Number(b.x)||0,y=Number(b.y)||0,w=Number(b.w)||0,h=Number(b.h)||0;x=Math.max(0,Math.min(1000,x));y=Math.max(0,Math.min(1000,y));w=Math.max(1,Math.min(1000-x,w));h=Math.max(1,Math.min(1000-y,h));const sx=Math.max(0,Math.round(x/1000*im.width-pad)),sy=Math.max(0,Math.round(y/1000*im.height-pad)),ex=Math.min(im.width,Math.round((x+w)/1000*im.width+pad)),ey=Math.min(im.height,Math.round((y+h)/1000*im.height+pad));let cw=ex-sx,ch=ey-sy;if(cw>maxW){const r=maxW/cw;cw=Math.round(cw*r);ch=Math.round(ch*r)}const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(im,sx,sy,ex-sx,ey-sy,0,0,cw,ch);resolve(c.toDataURL('image/jpeg',quality))};im.onerror=()=>resolve('');im.src=src})}async function makeCrops(x){const src=pageImages[x.sourcePage];if(!src)return x;x.questionImage=await cropFromDataUrl(src,x.questionBox);x.optionImages={A:await cropFromDataUrl(src,x.optA?.box||x.optABox,4,.55,700),B:await cropFromDataUrl(src,x.optB?.box||x.optBBox,4,.55,700),C:await cropFromDataUrl(src,x.optC?.box||x.optCBox,4,.55,700),D:await cropFromDataUrl(src,x.optD?.box||x.optDBox,4,.55,700)};x.solutionImage=await cropFromDataUrl(src,x.solutionBox,6,.55,900);return x}file.onchange=async e=>{const f=e.target.files[0];if(!f)return;items=[];pageImages={};list.innerHTML='';stopRequested=false;stopBtn.disabled=false;setProgress(0,1);try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer(),useWorkerFetch:true,isEvalSupported:true}).promise;for(let n=1;n<=pdf.numPages;n++){if(stopRequested)break;status.textContent=`⚡ AI: page ${n}/${pdf.numPages}`;setProgress(n-1,pdf.numPages);try{const p=await pdf.getPage(n),tc=await p.getTextContent(),text=tc.items.map(x=>x.str).join(' ').trim().slice(0,12000),imageDataUrl=await renderPageImage(p);pageImages[n]=imageDataUrl;const got=await extractWithRetry({pageText:text,imageDataUrl,folders:folders.join(', ')});for(const x of got){x.sourcePage=n;await makeCrops(x);items.push(x)}render()}catch(err){console.error('page',n,err);status.textContent=`⚠️ Page ${n} skipped: ${err.message}`}setProgress(n,pdf.numPages)}status.textContent=stopRequested?`⏹ Stopped — ${items.length} questions extracted`:`✔ Extracted ${items.length} questions from ${pdf.numPages} pages`;stopBtn.disabled=true}catch(e){console.error(e);status.textContent='❌ '+e.message;alert(e.message);stopBtn.disabled=true}};async function extractWithRetry(body){let last='';for(let attempt=0;attempt<2;attempt++){try{const r=await fetch('/api/gemini-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||`Server error ${r.status}`);return Array.isArray(d.items)?d.items:[]}catch(e){last=e.message;if(/403|400|404|413|not configured|GEMINI_API_KEY/i.test(last))throw e;if(attempt===0)await new Promise(r=>setTimeout(r,1200))}}throw new Error(last)}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function optionText(x,k){const v=x['opt'+k];return typeof v==='object'?(v.text||''):String(v||'')}function previewOption(x,k){const t=optionText(x,k),img=x.optionImages?.[k]||'';return `<div class="op"><b>(${k})</b> ${esc(t||(!img?'[Option not detected]':''))}${img?`<div class="figure"><span class="muted">Original option/figure crop</span><img src="${img}"></div>`:''}</div>`}function render(){list.innerHTML=items.map((x,i)=>`<div class="q"><div><div><span class="badge">#${i+1}</span><span class="badge">PDF page ${esc(x.sourcePage||'')}</span></div><div class="grid"><label>Q.No<input id="n${i}" value="${esc(x.qNo||i+1)}"></label><label>Answer<input id="k${i}" value="${esc(x.key||'')}"></label></div><label>Topic<input id="t${i}" value="${esc(x.topic||'General')}"></label><label>Library<select id="p${i}">${folders.map(f=>`<option ${f===x.targetPath?'selected':''}>${esc(f)}</option>`).join('')}</select></label><label>Question<textarea id="q${i}" rows="4">${esc(x.qText||'')}</textarea></label><div class="grid"><input id="a${i}" placeholder="Option A" value="${esc(optionText(x,'A'))}"><input id="b${i}" placeholder="Option B" value="${esc(optionText(x,'B'))}"><input id="c${i}" placeholder="Option C" value="${esc(optionText(x,'C'))}"><input id="d${i}" placeholder="Option D" value="${esc(optionText(x,'D'))}"></div></div><div class="qright"><button class="primary" onclick="openPreview(${i})" style="width:100%;margin-bottom:8px">👁 Open Full Visualization</button><div class="preview" onclick="openPreview(${i})"><b>Q${esc(x.qNo||i+1)}.</b> ${esc(x.qText||'')}<div class="opts">${previewOption(x,'A')}${previewOption(x,'B')}${previewOption(x,'C')}${previewOption(x,'D')}</div></div></div></div>`).join('')}function currentData(i){const x=items[i],v=id=>document.getElementById(id)?.value.trim()||'';return{...x,qNo:+v('n'+i)||i+1,key:v('k'+i),topic:v('t'+i)||'General',targetPath:v('p'+i)||folders[0],qText:v('q'+i),optA:v('a'+i),optB:v('b'+i),optC:v('c'+i),optD:v('d'+i)}}function openPreview(i){const x=currentData(i);document.getElementById('modalTitle').textContent=`Question ${x.qNo} — Student View`;document.getElementById('modalBody').innerHTML=`<div class="preview"><b>Q${esc(x.qNo)}.</b> ${esc(x.qText)}<div class="opts">${previewOption(x,'A')}${previewOption(x,'B')}${previewOption(x,'C')}${previewOption(x,'D')}</div></div>${x.questionImage?`<p class="muted">Original detected question crop</p><img src="${x.questionImage}">`:''}`;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function saveAll(){if(!items.length)return alert('Nothing to save.');status.textContent='⏳ Saving...';try{for(let i=0;i<items.length;i++){const x=currentData(i),o=[x.optA,x.optB,x.optC,x.optD];await addDoc(collection(db,'questions'),{qNo:x.qNo,subject:x.targetPath,topic:x.topic,qText:x.qText,optText:`(A) ${o[0]} | (B) ${o[1]} | (C) ${o[2]} | (D) ${o[3]}`,key:x.key,question:'',solution:'',questionImage:x.questionImage||'',optionImages:x.optionImages||{},solutionImage:x.solutionImage||'',flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail,sourcePage:x.sourcePage||null,createdAt:new Date().toISOString()})}status.textContent=`✔ Saved ${items.length} questions`;items=[];render()}catch(e){alert('Save failed: '+e.message);status.textContent=''}}</script></body></html>
