<style>
*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{height:52px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}.brand{font-weight:900;color:#38bdf8}.wrap{padding:16px;overflow:auto;flex:1}.box,.q{background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:13px;margin-bottom:12px}.q{display:grid;grid-template-columns:minmax(300px,1fr) minmax(330px,1.05fr);gap:14px}.qright{border-left:1px solid #1e293b;padding-left:14px}.q textarea,.q input,.q select{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px;padding:7px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}button,label.btn{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:8px 11px;cursor:pointer;font-weight:800;font-size:11px}.primary{background:#0284c7!important;border-color:#38bdf8!important}.stop{background:#7f1d1d!important;border-color:#ef4444!important}.save{background:#166534!important;border-color:#22c55e!important}.status{color:#10b981;font-weight:800}.small,.muted{font-size:11px;color:#94a3b8}.progress{height:8px;background:#0f172a;border:1px solid #334155;border-radius:99px;overflow:hidden;margin-top:6px}.progress>div{height:100%;width:0;background:#38bdf8;transition:width .2s}.savebar>div{background:#22c55e}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.assign{background:#07111f;border:1px solid #164e63;border-radius:8px;padding:9px;margin-top:8px}.assignTitle{font-size:11px;font-weight:900;color:#67e8f9;margin-bottom:7px}.mathRow{display:flex;gap:5px;align-items:flex-start}.mathRow textarea,.mathRow input{flex:1}.mini{padding:6px 8px;font-size:10px}.preview{background:#fff;color:#111;border-radius:8px;padding:14px;min-height:220px;max-height:560px;overflow:auto;line-height:1.55}.preview img{max-width:100%;display:block;margin:6px auto;border-radius:4px}.op{padding:7px 8px;border-bottom:1px solid #ddd}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#172033;color:#93c5fd;font-size:10px;font-weight:800;margin-right:4px}.done{background:#064e3b;color:#6ee7b7}.continued{background:#78350f;color:#fde68a}.figure{border:1px dashed #94a3b8;padding:5px;margin-top:6px}.figure img{max-height:240px;object-fit:contain}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:8px;z-index:100}.modal.open{display:flex}.modalcard{background:#0b1120;border:1px solid #334155;border-radius:12px;max-width:1250px;max-height:97vh;overflow:auto;padding:12px;width:100%}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.cropStage{position:relative;overflow:auto;background:#111;max-height:78vh;touch-action:none}.cropStage img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.previewBlock{border:1px solid #cbd5e1;padding:8px;margin:7px 0;background:#fff;color:#111;border-radius:6px;cursor:grab}.previewBlock:active{cursor:grabbing}.previewBlock img{max-width:100%;display:block;margin:5px auto}.previewBlock [contenteditable=true]{outline:1px dashed #94a3b8;padding:5px;min-height:24px}.cropRect{position:absolute;border:3px solid #ef4444;background:rgba(239,68,68,.12);display:none;pointer-events:none}.folderGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.folderTree{background:#07111f;border:1px solid #164e63;border-radius:8px;padding:8px;max-height:220px;overflow:auto}.folderMain{font-weight:900;color:#67e8f9}.folderSub{padding-left:18px;color:#cbd5e1;font-size:11px;margin-top:3px}.sourceImage{background:#fff;border-radius:8px;padding:8px}.sourceImage img{width:100%;height:auto;display:block}.protected{border:1px solid #14532d;background:#052e16;color:# <script>
let items=[];Object.defineProperty(window,"items",{configurable:true,get:()=>items});pageCache={},folderMap={General:['General']},folders=['General / General'],stopRequested=false,reviewIndex=-1,dragging=false,dragStart=null;
const $=id=>document.getElementById(id),status=$('status'),list=$('list'),progressBar=$('progressBar'),saveBar=$('saveBar'),pageStat=$('pageStat'),saveStat=$('saveStat'),stopBtn=$('stop'),modal=$('modal');
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m));
function optText(x,k){const v=x['opt'+k];return typeof v==='object'?(v.text||''):String(v||'')}
function loadFolders(){setTimeout(async()=>{try{const s=await getDoc(doc(db,'folder_configs','shared_registry_v4'));if(s.exists()){const d=s.data();folderMap=d.subFolders||folderMap}}catch(e){}rebuildFolders();render();},300)}
function rebuildFolders(){folders=[];for(const[m,ss]of Object.entries(folderMap)){for(const s of(ss||[]))folders.push(m+' / '+s)}if(!folders.length){folderMap={General:['General']};folders=['General / General']}}
function ensureFolderPath(path){const p=String(path||'').split(' / ').map(v=>v.trim()).filter(Boolean);const main=p[0]||'General',sub=p.slice(1).join(' / ')||'General';folderMap[main]=folderMap[main]||[];if(!folderMap[main].includes(sub))folderMap[main].push(sub);const full=main+' / '+sub;if(!folders.includes(full))folders.push(full);return full}
function placementParts(path){const p=String(path||folders[0]).split(' / ');return{main:p[0]||'General',sub:p.slice(1).join(' / ')||'General'}}
function mainOptions(sel){return Object.keys(folderMap).map(m=>`<option ${m===sel?'selected':''}>${esc(m)}</option>`).join('')}
function subOptions(main,sel){return (folderMap[main]||[]).map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')}
async function persistFolders(){rebuildFolders();await setDoc(doc(db,'folder_configs','shared_registry_v4'),{subFolders:folderMap,updatedAt:new Date().toISOString()},{merge:true});render()}
function addMain(i){const n=prompt('Main folder name:');if(!n?.trim())return;const name=n.trim();if(!folderMap[name])folderMap[name]=[];if(!folderMap[name].length)folderMap[name]=['General'];persistFolders().then(()=>setPlacement(i,name,folderMap[name][0]));}
function addSub(i){const main=$('main'+i)?.value||'General',n=prompt('Sub-folder name:');if(!n?.trim())return;folderMap[main]=folderMap[main]||[];if(!folderMap[main].includes(n.trim()))folderMap[main].push(n.trim());persistFolders().then(()=>setPlacement(i,main,n.trim()));}
function setPlacement(i,main,sub){items[i].targetPath=main+' / '+sub;render()}
function placementUI(x,i){const p=placementParts(x.targetPath);return `<div class="assign"><div class="assignTitle">📚 LIBRARY PLACEMENT — THIS QUESTION</div><div class="three"><label>Library / Main Folder<select id="main${i}" onchange="setPlacement(${i},this.value,(folderMap[this.value]||['General'])[0])">${mainOptions(p.main)}</select></label><label>Sub-Folder<select id="sub${i}" onchange="setPlacement(${i},$('main${i}').value,this.value)">${subOptions(p.main,p.sub)}</select></label><label>Topic<input id="topic${i}" value="${esc(x.topic||'General')}"></label></div><div class="actions"><button class="mini" onclick="addMain(${i})">➕ Main Folder</button><button class="mini" onclick="addSub(${i})">➕ Sub-Folder</button></div></div>`}
function setProgress(n,t){progressBar.style.width=(t?Math.round(n*100/t):0)+'%';pageStat.textContent=n+'/'+t}
function saveProgress(){const d=items.filter(x=>x.saved).length,t=items.length;saveBar.style.width=(t?Math.round(d*100/t):0)+'%';saveStat.textContent=d+'/'+t}
async function renderPage(pdf,n){if(pageCache[n])return pageCache[n];const p=await pdf.getPage(n);let scale=1.28,q=.58,last='';for(let i=0;i<6;i++){const v=p.getViewport({scale}),c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await p.render({canvasContext:ctx,viewport:v,background:'white'}).promise;last=c.toDataURL('image/jpeg',q);if(last.length<1550000)break;if(q>.44)q-=.04;else scale-=.08}const tc=await p.getTextContent();pageCache[n]={image:last,text:tc.items.map(x=>x.str).join(' ').trim().slice(0,14000)};return pageCache[n]}
function crop(src,b,pad=8,quality=.78,maxW=1400){if(!src||!b||!(b.w>0&&b.h>0))return Promise.resolve('');const im=new Image();return new Promise(ok=>{im.onload=()=>{let x=Math.max(0,Math.min(1000,+b.x||0)),y=Math.max(0,Math.min(1000,+b.y||0)),w=Math.max(1,Math.min(1000-x,+b.w||1)),h=Math.max(1,Math.min(1000-y,+b.h||1));let sx=Math.max(0,Math.round(x/1000*im.width-pad)),sy=Math.max(0,Math.round(y/1000*im.height-pad)),ex=Math.min(im.width,Math.round((x+w)/1000*im.width+pad)),ey=Math.min(im.height,Math.round((y+h)/1000*im.height+pad));let cw=ex-sx,ch=ey-sy;if(cw>maxW){const r=maxW/cw;cw=Math.round(cw*r);ch=Math.round(ch*r)}const c=document.createElement('canvas');c.width=cw;c.height=ch;const z=c.getContext('2d');z.fillStyle='#fff';z.fillRect(0,0,cw,ch);z.drawImage(im,sx,sy,ex-sx,ey-sy,0,0,cw,ch);ok(c.toDataURL('image/jpeg',quality))};im.onerror=()=>ok('');im.src=src})}
async function stitch(a,b){if(!a)return b||'';if(!b)return a;const A=new Image(),B=new Image();return new Promise(ok=>{let n=0,g=()=>{if(++n<2)return;const c=document.createElement('canvas'),w=Math.max(A.width,B.width);c.width=w;c.height=A.height+B.height;const z=c.getContext('2d');z.fillStyle='#fff';z.fillRect(0,0,w,c.height);z.drawImage(A,0,0);z.drawImage(B,0,A.height);ok(c.toDataURL('image/jpeg',.76))};A.onload=g;B.onload=g;A.src=a;B.src=b})}
async function makeCrops(x){const cur=pageCache[x.sourcePage]?.image;if(!cur)return x;x.sourcePageImage=cur;x.questionImage=await crop(cur,x.questionBox,10,.76,1500);x.solutionImage=await crop(cur,x.solutionBox,8,.72,1100);x.optionImages={};for(const k of ['A','B','C','D'])x.optionImages[k]=await crop(cur,x['opt'+k]?.box,5,.76,1000);x.figureImage='';if(Array.isArray(x.figures)&&x.figures[0]?.box)x.figureImage=await crop(cur,x.figures[0].box,8,.78,1400);if(x.continuesToNextPage&&x.nextPageBox&&pageCache[x.sourcePage+1]?.image){const n=await crop(pageCache[x.sourcePage+1].image,x.nextPageBox,10,.76,1500);x.questionImage=await stitch(x.questionImage,n)}return x}
async function extract(body){let last='';for(let a=0;a<2;a++){try{const r=await fetch('/api/gemini-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.error||('Server '+r.status));return Array.isArray(d.items)?d.items:[]}catch(e){last=e.message;if(/400|403|404|413|configured|GEMINI_API_KEY/i.test(last))throw e;if(a===0)await new Promise(r=>setTimeout(r,800))}}throw new Error(last)}
async function processPage(pdf,n,total){if(stopRequested)return;try{const cur=await renderPage(pdf,n),next=n<total?await renderPage(pdf,n+1):null;const got=await extract({pageNumber:n,nextPageNumber:n<total?n+1:null,pageText:cur.text,imageDataUrl:cur.image,nextPageText:next?.text||'',nextImageDataUrl:next?.image||'',folders:folders.join(', ')});for(const x of got){x.sourcePage=n;x.sourcePageImage=cur.image;x.qNo=x.qNo||items.length+1;x.topic=x.topic||'General';x.targetPath=ensureFolderPath(x.targetPath||'General / General');x.languageMode=x.languageMode||'both';x.contentMode=x.contentMode||'both';x.keepText=x.keepText!==false;x.keepQuestionImage=x.keepQuestionImage!==false;x.keepOptionImages=x.keepOptionImages!==false;x.keepFigureImage=x.keepFigureImage!==false;x.keepSolutionImage=x.keepSolutionImage!==false;x.imagePosition=x.imagePosition||'above';x.fontSize=+x.fontSize||16;x.imageWidth=+x.imageWidth||100;x.margin=+x.margin||16;x.saved=false;await makeCrops(x);x.sourcePageImage=cur.image;if(!x.questionImage)x.questionImage=cur.image;items.push(x);render();saveProgress()}}catch(e){console.error(e);status.textContent='⚠️ Page '+n+': '+e.message}finally{window.done=(window.done||0)+1;setProgress(window.done,total)}}
async function run(pdf,total){window.done=0;let cursor=1;const worker=async()=>{while(!stopRequested){const n=cursor++;if(n>total)break;await processPage(pdf,n,total)}};await Promise.all([worker(),worker(),worker()])}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;items=[];pageCache={};list.innerHTML='';saveProgress();stopRequested=false;stopBtn.disabled=false;status.textContent='📖 Opening PDF...';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer(),useWorkerFetch:true,isEvalSupported:true}).promise;setProgress(0,pdf.numPages);status.textContent='⚡ AI analyzing '+pdf.numPages+' pages...';await run(pdf,pdf.numPages);status.textContent=stopRequested?'⏹ Stopped — '+items.length+' questions detected':'✔ Finished — '+items.length+' questions detected';saveProgress()}catch(e){console.error(e);status.textContent='❌ '+e.message;alert(e.message)}finally{stopBtn.disabled=true}};
function textMath(s){let t=esc(s||'');t=t.replace(/\\\((.*?)\\\)/gs,'\\($1\\)').replace(/\\\[(.*?)\\\]/gs,'<div>\\[$1\\]</div>');return t.replace(/\n/g,'<br>')}
function typeset(){if(window.MathJax?.typesetPromise)setTimeout(()=>MathJax.typesetPromise().catch(()=>{}),20)}
function val(id){return $(id)?.value?.trim()||''}
function bind(){items.forEach((x,i)=>{[['q'+i,'qText'],['a'+i,'optA'],['b'+i,'optB'],['c'+i,'optC'],['d'+i,'optD'],['topic'+i,'topic']].forEach(([id,k])=>{const el=$(id);if(el&&!el._b){el._b=1;el.oninput=()=>x[k]=el.value}})})}
function render(){list.innerHTML=items.map((x,i)=>{const p=placementParts(x.targetPath);return `<div class="q"><div><div><span class="badge">#${i+1}</span><span class="badge">PDF page ${esc(x.sourcePage)}</span>${x.continuesToNextPage?'<span class="badge continued">↪ continuation</span>':''}${x.saved?'<span class="badge done">✓ Saved</span>':''}</div>${placementUI(x,i)}<div class="assign"><div class="assignTitle">🧮 QUESTION TEXT — CLEAN SCIENTIFIC EDITING</div><div class="mathRow"><textarea id="q${i}" rows="6">${esc(x.qText||'')}</textarea><button class="mini" onclick="openCropModal(${i},'question')">🖼️ Crop</button></div><div class="mathHint">AI output is normalized for human reading: ∫, ∑, √, α, β, μ, σ, ℏ, x², 10⁻³ etc. No Python/code output.</div><div class="grid" style="margin-top:7px"><label>Correct Answer<input id="key${i}" value="${esc(x.key||'')}"></label><label>Language<select id="lang${i}"><option value="both" ${x.languageMode==='both'?'selected':''}>Hindi + English</option><option value="hi" ${x.languageMode==='hi'?'selected':''}>Hindi</option><option value="en" ${x.languageMode==='en'?'selected':''}>English</option></select></label></div><div class="grid" style="margin-top:7px">${['A','B','C','D'].map(k=>`<div class="mathRow"><input id="${k.toLowerCase()}${i}" placeholder="Option ${k}" value="${esc(optText(x,k))}"><button class="mini" onclick="openCropModal(${i},'option${k}')">🖼️</button></div>`).join('')}</div><div class="actions"><button class="mini primary" onclick="openCropModal(${i},'question')">✂️ Full Question</button><button class="mini" onclick="openCropModal(${i},'solution')">✂️ Solution</button><button class="mini" onclick="openCropModal(${i},'figure')">📈 Figure / Diagram</button><button class="mini" onclick="openCropModal(${i},'optionA')">A image</button><button class="mini" onclick="openCropModal(${i},'optionB')">B image</button><button class="mini" onclick="openCropModal(${i},'optionC')">C image</button><button class="mini" onclick="openCropModal(${i},'optionD')">D image</button></div>${x.figureImage?`<div class="figure"><span class="muted">Attached figure</span><img src="${x.figureImage}"></div>`:''}<label>Figure caption<input id="cap${i}" value="${esc(x.figureCaption||'')}" placeholder="Optional figure caption"></label></div><div class="actions"><button class="primary" onclick="openReview(${i})">👁 Student Preview</button>${x.saved?'<button disabled>✓ Saved to Library</button>':'<button class="save" onclick="saveOne('+i+')">✅ Complete & Save</button>'}</div></div><div class="qright"><div class="protected">🖼️ QUESTION IMAGE — current extracted crop</div><div class="sourceImage">${x.questionImage?`<img src="${x.questionImage}" alt="Question image">`:'<div class="muted">No question image selected.</div>'}</div><div class="actions"><button class="mini primary" onclick="openCropModal(${i},'question')">✂️ Edit from full page</button><button class="mini" onclick="openReview(${i})">👁 Student Preview</button></div></div></div>`}).join('');bind();typeset()}
function openReview(i){
window.currentPreviewIndex=i;reviewIndex=i;const x=items[i];modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||i+1)+' — FULL Student Preview / Editor';$('modalBody').innerHTML=`<div class="actions"><label class="btn">☑ Keep Text<input type="checkbox" ${x.keepText?'checked':''} onchange="items[${i}].keepText=this.checked" hidden></label><label class="btn">☑ Keep Question Image<input type="checkbox" ${x.keepQuestionImage?'checked':''} onchange="items[${i}].keepQuestionImage=this.checked" hidden></label><label class="btn">☑ Keep Option Images<input type="checkbox" ${x.keepOptionImages?'checked':''} onchange="items[${i}].keepOptionImages=this.checked" hidden></label><label class="btn">☑ Keep Figure<input type="checkbox" ${x.keepFigureImage?'checked':''} onchange="items[${i}].keepFigureImage=this.checked" hidden></label><label class="btn">☑ Keep Solution<input type="checkbox" ${x.keepSolutionImage?'checked':''} onchange="items[${i}].keepSolutionImage=this.checked" hidden></label></div><div class="small">Every text block is editable. Drag blocks to reorder; use Cut / Copy / Delete on any block.</div><div id="studentCanvas" class="editor" ondragover="event.preventDefault()" ondrop="dropStudent(event,${i})"><div class="previewBlock" draggable="true" ondragstart="dragStudent(event,0)"><div contenteditable="true" data-field="qText"><b>Q${esc(x.qNo||i+1)}.</b> ${textMath(x.qText)}</div><div class="actions"><button onclick="copyStudent(0,${i})">Copy</button><button onclick="cutStudent(0,${i})">Cut</button><button onclick="deleteStudent(0,${i})">Delete</button></div></div>${['A','B','C','D'].map((k,n)=>`<div class="previewBlock" draggable="true" ondragstart="dragStudent(event,${n+1})"><div contenteditable="true" data-field="opt${k}"><b>(${k})</b> ${textMath(optText(x,k))}</div>${x.keepOptionImages&&x.optionImages?.[k]?`<img src="${x.optionImages[k]}">`:''}<div class="actions"><button onclick="copyStudent(${n+1},${i})">Copy</button><button onclick="cutStudent(${n+1},${i})">Cut</button><button onclick="deleteStudent(${n+1},${i})">Delete</button></div></div>`).join('')}${x.keepFigureImage&&x.figureImage?`<div class="previewBlock" draggable="true" ondragstart="dragStudent(event,5)"><img src="${x.figureImage}"><div contenteditable="true">${esc(x.figureCaption||'')}</div><div class="actions"><button onclick="deleteStudent(5,${i})">Delete</button></div></div>`:''}${x.keepQuestionImage&&x.questionImage?`<div class="previewBlock" draggable="true" ondragstart="dragStudent(event,6)"><img src="${x.questionImage}"><div class="actions"><button onclick="openCropModal(${i},'question')">Edit Image</button><button onclick="deleteStudent(6,${i})">Delete</button></div></div>`:''}</div><div class="actions"><button class="save" onclick="syncStudent(${i})">💾 Apply Preview Changes</button><button class="primary" onclick="openCropModal(${i},'question')">✂️ Full Page / Add Next Page</button><button onclick="closeModal()">Done</button></div>`;typeset()}
let dragStudentIndex=-1;function dragStudent(e,n){dragStudentIndex=n;e.dataTransfer.effectAllowed='move'}function dropStudent(e,i){e.preventDefault();const a=[...$('studentCanvas').children],target=e.target.closest('.previewBlock');if(!target||dragStudentIndex<0)return;const node=a[dragStudentIndex];if(node&&node!==target){target.before(node)}dragStudentIndex=-1}function syncStudent(i){const x=items[i],c=$('studentCanvas');if(!c)return;const blocks=[...c.querySelectorAll('.previewBlock')];blocks.forEach(b=>{const q=b.querySelector('[data-field=\"qText\"]');if(q)x.qText=q.innerText.replace(/^Q\d+\.\s*/,'').trim();['A','B','C','D'].forEach(k=>{const el=b.querySelector('[data-field=\"opt'+k+'\"]');if(el)x['opt'+k]=el.innerText.replace(/^\([A-D]\)\s*/,'').trim()})});render();openReview(i)}function copyStudent(n,i){const c=$('studentCanvas').children[n];if(c)navigator.clipboard?.writeText(c.innerText||'')}function cutStudent(n,i){copyStudent(n,i);deleteStudent(n,i)}function deleteStudent(n,i){const c=$('studentCanvas');if(c?.children[n]){c.children[n].remove();syncStudent(i)}}
let cropPage=0;
function openCropModal(i,type){reviewIndex=i;cropPage=items[i].sourcePage||1;showCropPage(type)}
function showCropPage(type){const x=items[reviewIndex],src=pageCache[cropPage]?.image||x.sourcePageImage;if(!src)return alert('Original PDF page is not available.');modal.classList.add('open');$('modalTitle').textContent='Q'+(x.qNo||reviewIndex+1)+' — Drag Crop: '+type+' | PDF page '+cropPage;$('modalBody').innerHTML=`<div class="small" style="margin-bottom:7px">Select any area from the original PDF. Use Previous/Next Page when the question continues onto another page.</div><div class="actions"><button onclick="setCropPage(-1,'${type}')">◀ Previous Page</button><button onclick="setCropPage(1,'${type}')">Next Page ▶</button></div><div id="cropStage" class="cropStage"><img id="stageImg" src="${src}"><div id="cropRect" class="cropRect"></div></div><div class="actions"><button class="primary" onclick="applyCrop('${type}')">✅ Use This Crop</button><button onclick="openReview(${reviewIndex})">↩ Preview</button></div>`;installCrop()}
function setCropPage(delta,type){const n=cropPage+delta;if(n<1||!pageCache[n])return;cropPage=n;showCropPage(type)}
function pt(e,s){const r=s.getBoundingClientRect();return{x:Math.max(0,Math.min(s.scrollWidth,e.clientX-r.left+s.scrollLeft)),y:Math.max(0,Math.min(s.scrollHeight,e.clientY-r.top+s.scrollTop))}}
function installCrop(){const s=$('cropStage');if(!s)return;s.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;dragStart=pt(e,s);s.setPointerCapture?.(e.pointerId);const r=$('cropRect');r.style.display='block';r.style.left=dragStart.x+'px';r.style.top=dragStart.y+'px';r.style.width='0';r.style.height='0'};s.onpointermove=e=>{if(!dragging)return;const p=pt(e,s),x=Math.min(dragStart.x,p.x),y=Math.min(dragStart.y,p.y),w=Math.abs(p.x-dragStart.x),h=Math.abs(p.y-dragStart.y),r=$('cropRect');r.style.left=x+'px';r.style.top=y+'px';r.style.width=w+'px';r.style.height=h+'px'};s.onpointerup=s.onpointercancel=e=>{if(!dragging)return;dragging=false;const p=pt(e,s),x=Math.min(dragStart.x,p.x),y=Math.min(dragStart.y,p.y),w=Math.abs(p.x-dragStart.x),h=Math.abs(p.y-dragStart.y);if(w>20&&h>20)items[reviewIndex]._manualCrop={x:x/s.scrollWidth*1000,y:y/s.scrollHeight*1000,w:w/s.scrollWidth*1000,h:h/s.scrollHeight*1000}}
}
async function applyCrop(type){const i=reviewIndex,b=items[i]?._manualCrop;if(!b)return alert('पहले PDF page पर crop rectangle drag करो.');const src=pageCache[cropPage]?.image||items[i].sourcePageImage,out=await crop(src,b,10,.8,1500);if(type==='figure')items[i].figureImage=out;else if(type==='solution')items[i].solutionImage=out;else if(type.startsWith('option')){const k=type.slice(-1);items[i].optionImages=items[i].optionImages||{};items[i].optionImages[k]=out}else if(cropPage!==items[i].sourcePage&&items[i].questionImage){items[i].questionImage=await stitch(items[i].questionImage,out);items[i].continuesToNextPage=true}else{items[i].questionImage=out;items[i].cropVerified=true}items[i]._manualCrop=null;render();openReview(i)}
function acceptCrop(){if(reviewIndex>=0){items[reviewIndex].cropVerified=true;render();openReview(reviewIndex)}}
function closeModal(){modal.classList.remove('open');reviewIndex=-1}
function current(i){const x=items[i];x.qText=val('q'+i);for(const k of ['A','B','C','D'])x['opt'+k]=val(k.toLowerCase()+i);x.key=val('key'+i).toUpperCase().slice(0,1);x.topic=val('topic'+i)||'General';x.languageMode=$('lang'+i)?.value||x.languageMode;x.figureCaption=val('cap'+i);return x}
async function payload(i){const x=current(i);return{qNo:+x.qNo||i+1,subject:x.targetPath||folders[0],topic:x.topic||'General',qText:x.keepText!==false?(x.qText||''):'',qTextEnglish:x.qTextEnglish||x.qText||'',qTextHindi:x.qTextHindi||x.qText||'',optText:x.keepText!==false?`(A) ${optText(x,'A')} | (B) ${optText(x,'B')} | (C) ${optText(x,'C')} | (D) ${optText(x,'D')}`:'',key:x.key||'',question:x.keepText!==false?(x.qText||''):'',solution:'',questionImage:x.keepQuestionImage!==false?(x.questionImage||''):'',optionImages:x.keepOptionImages!==false?(x.optionImages||{}):{},solutionImage:x.keepSolutionImage!==false?(x.solutionImage||''):'',figureImage:x.keepFigureImage!==false?(x.figureImage||''):'',figureCaption:x.keepFigureImage!==false?(x.figureCaption||''):'',extraText:x.extraText||'',contentMode:x.contentMode||'both',languageMode:x.languageMode||'both',imagePosition:x.imagePosition||'above',layoutMargin:x.margin||16,fontSize:x.fontSize||16,imageWidth:x.imageWidth||100,imageOffsetX:x.imageOffsetX||0,imageOffsetY:x.imageOffsetY||0,flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:window.currentTeacherEmail,sourcePage:x.sourcePage||null,createdAt:new Date().toISOString(),cropVerified:!!x.cropVerified,continuesToNextPage:!!x.continuesToNextPage,targetPath:x.targetPath||folders[0]}}
async function saveOne(i){if(items[i]?.saved)return;try{status.textContent='⏳ Saving Q'+(items[i].qNo||i+1)+'...';const d=await payload(i),ref=await addDoc(collection(db,'questions'),d);items[i].saved=true;items[i].savedDocId=ref.id;render();saveProgress();status.textContent='✔ Q'+d.qNo+' saved to '+d.subject}catch(e){console.error(e);alert('Save failed: '+e.message);status.textContent='❌ Save failed'}}
async function saveAll(){const p=items.map((x,i)=>x.saved?null:i).filter(i=>i!==null);if(!p.length)return alert('All detected questions are already saved.');for(const i of p){if(stopRequested)break;await saveOne(i)}saveProgress();status.textContent=items.some(x=>!x.saved)?'⚠️ Some questions remain unsaved':'✔ All questions saved to Library'}
window.openReview=function(i){const x=items[i]||{};window.currentPreviewIndex=i;sessionStorage.setItem('A2Z_STUDENT_PREVIEW',JSON.stringify({i,data:x}));const w=window.open('student_preview.html?i='+encodeURIComponent(i),'_blank');if(!w)alert('Please allow pop-ups for this site.');};sessionStorage.setItem('A2Z_STUDENT_PREVIEW',JSON.stringify({i,data:x}));const w=window.open('student_preview.html?i='+i+'','_blank');if(!w)alert('Please allow pop-ups for this site.');};
const _a2zRender=render;render=function(){_a2zRender();items.forEach((x,i)=>{const l=$('lang'+i);if(l&&!l._a2zLang){l._a2zLang=1;l.onchange=()=>{x.languageMode=l.value;if(l.value==='hi'&&x.qTextHindi)x.qText=x.qTextHindi;else if(l.value==='en'&&x.qTextEnglish)x.qText=x.qTextEnglish;else if(l.value==='both'&&x.qTextBoth)x.qText=x.qTextBoth;const q=$('q'+i);if(q)q.value=x.qText;};}})};

loadFolders();
</script>
