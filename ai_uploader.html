<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A to Z Exam Mocks — Gemini AI Uploader</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getFirestore,collection,addDoc,doc,getDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyAE7T5cToJKcoUQcj_-GZrQfBBF7Q_KMX0',authDomain:'physicsvault-80a10.firebaseapp.com',projectId:'physicsvault-80a10',storageBucket:'physicsvault-80a10.firebasestorage.app',messagingSenderId:'1043166507399',appId:'1:1043166507399:web:634efdac6f109273d42322'};initializeApp(cfg);window.db=getFirestore();window.collection=collection;window.addDoc=addDoc;window.doc=doc;window.getDoc=getDoc;window.currentTeacherEmail=localStorage.getItem('ExamVault_Teacher_Email')||'atozexammocks@gmail.com';</script><style>*{box-sizing:border-box}body{margin:0;background:#060911;color:#f8fafc;font:13px system-ui;height:100vh;display:flex;flex-direction:column}header{height:52px;background:#0b1120;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.brand{font-weight:900;color:#38bdf8}.wrap{padding:18px;overflow:auto;flex:1}.box,.q{background:#0b1120;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:12px}.q textarea,.q input,.q select{width:100%;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:5px;padding:6px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,label.btn{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:800;font-size:11px}.primary{background:#0284c7!important;border-color:#38bdf8!important}.status{color:#10b981;font-weight:800}</style></head><body><header><div class="brand">🤖 Gemini AI Exam PDF Uploader</div><button onclick="location.href='teacher.html'">🏠 Dashboard</button></header><main class="wrap"><div class="box"><p style="color:#94a3b8">Processes every page in the selected PDF. No client-side page cap. Each page is sent to the secure server-side Gemini endpoint; scanned pages use vision and text PDFs use native text.</p><label class="btn primary">📂 Choose PDF<input id="file" type="file" accept="application/pdf" hidden></label> <span id="status" class="status"></span></div><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>Review extracted questions</b><button class="primary" onclick="saveAll()">🚀 Save All to Library</button></div><div id="list"></div></div></main><script>let items=[],folders=['General / General'];async function loadFolders(){try{const s=await getDoc(doc(db,'folder_configs','shared_registry_v4'));if(s.exists()){const d=s.data();folders=[];for(const[m,ss]of Object.entries(d.subFolders||{}))ss.forEach(x=>folders.push(m+' / '+x));if(!folders.length)folders=['General / General']}}catch(e){}}loadFolders();const status=document.getElementById('status');file.onchange=async e=>{const f=e.target.files[0];if(!f)return;items=[];list.innerHTML='';try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let n=1;n<=pdf.numPages;n++){status.textContent=`⚡ Gemini: page ${n}/${pdf.numPages}`;const p=await pdf.getPage(n),tc=await p.getTextContent(),text=tc.items.map(x=>x.str).join(' ').trim();let imageDataUrl='';if(text.length<50){const v=p.getViewport({scale:1.35}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;imageDataUrl=c.toDataURL('image/jpeg',.78)}const got=await extractWithRetry({pageText:text,imageDataUrl,folders:folders.join(', ')});items.push(...got)}status.textContent=`✔ Extracted ${items.length} questions from ${pdf.numPages} pages`;render()}catch(e){console.error(e);status.textContent='❌ '+e.message;alert(e.message)}};async function extractWithRetry(body){let last='';for(let attempt=0;attempt<4;attempt++){try{const r=await fetch('/api/gemini-extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||`Server error ${r.status}`);return Array.isArray(d.items)?d.items:[]}catch(e){last=e.message;await new Promise(r=>setTimeout(r,1000*2**attempt))}}throw new Error(last)}function render(){list.innerHTML=items.map((x,i)=>`<div class="q"><b>#${i+1}</b><div class="grid"><label>Q.No<input id="n${i}" value="${esc(x.qNo||i+1)}"></label><label>Answer<input id="k${i}" value="${esc(x.key||'')}"></label></div><label>Topic<input id="t${i}" value="${esc(x.topic||'General')}"></label><label>Library<select id="p${i}">${folders.map(f=>`<option ${f===x.targetPath?'selected':''}>${esc(f)}</option>`).join('')}</select></label><label>Question<textarea id="q${i}" rows="3">${esc(x.qText||'')}</textarea></label><div class="grid"><input id="a${i}" placeholder="Option A" value="${esc(x.optA||'')}"><input id="b${i}" placeholder="Option B" value="${esc(x.optB||'')}"><input id="c${i}" placeholder="Option C" value="${esc(x.optC||'')}"><input id="d${i}" placeholder="Option D" value="${esc(x.optD||'')}"></div></div>`).join('')}async function saveAll(){if(!items.length)return alert('Nothing to save.');status.textContent='⏳ Saving...';try{for(let i=0;i<items.length;i++){const o=[a(i),b(i),c(i),d(i)];await addDoc(collection(db,'questions'),{qNo:+document.getElementById('n'+i).value||i+1,subject:document.getElementById('p'+i).value,topic:document.getElementById('t'+i).value||'General',qText:document.getElementById('q'+i).value.trim(),optText:`(A) ${o[0]} | (B) ${o[1]} | (C) ${o[2]} | (D) ${o[3]}`,key:document.getElementById('k'+i).value.trim(),question:'',solution:'',flags:{red:false,blue:false,green:false,yellow:false},creatorEmail:currentTeacherEmail,createdAt:new Date().toISOString()})}status.textContent=`✔ Saved ${items.length} questions`;items=[];render()}catch(e){alert('Save failed: '+e.message);status.textContent=''}}function a(i){return document.getElementById('a'+i).value.trim()}function b(i){return document.getElementById('b'+i).value.trim()}function c(i){return document.getElementById('c'+i).value.trim()}function d(i){return document.getElementById('d'+i).value.trim()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
